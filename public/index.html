                          {/* Sigue pulsable cuando ya está confirmada: sirve para reenviarla
                              a Contenido si algo quedó desincronizado. Repetirla no duplica
                              nada —la tarea se reconoce por itemId— y el aviso no se repite
                              dentro de las 12 h si no cambió el contenido. */}
                          <button disabled={vacia||trabajando} onClick={()=>confirmarItem(it)}
                            title={lista?"Volver a mandarla a Contenido":undefined}
                            style={{flexShrink:0,padding:"9px 18px",borderRadius:999,background:lista?"transparent":D.cian,border:"1px solid "+(lista?D.line2:D.cian),color:lista?D.tx4:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:vacia||trabajando?"default":"pointer",opacity:vacia?.45:1}}>
                            {trabajando?"Confirmando…":lista?"Confirmada ✓":yaEsta?"Confirmar cambios":"Confirmar pieza"}
                          </button>
                        </div>);
                    })()}
                  </div>
                </div>);
            })}

            {/* Día de grabación */}
            {grabs.map(g=>(
              <div key={g.id}>
                <div style={{borderRadius:14,background:D.panel,border:"1px solid rgba(255,139,139,.28)",padding:"10px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                  <Ic n="camera" s={16} c={D.rojo}/>
                  <span style={{flex:"1 1 180px",minWidth:140,fontSize:13.5,fontWeight:600,color:D.tx}}>{g.guion?g.guion.title:"Día de Grabación"}</span>
                  <span style={{padding:"7px 10px",borderRadius:9,background:D.bg,border:"1px solid "+D.line2,color:D.rojo,fontFamily:"var(--font-mono)",fontSize:12}}>{g.time||"—"}</span>
                  <button onClick={()=>sGuionOpen(o=>({...o,[g.id]:!o[g.id]}))} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 15px",borderRadius:999,background:"rgba(201,191,255,.08)",border:"1px solid rgba(201,191,255,.4)",color:D.lav,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                    <Ic n="edit" s={12} c={D.lav}/>Guión
                  </button>
                  <button onClick={()=>{unlinkGrab(wd.ds,g.id);}} style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",color:D.tx4,cursor:"pointer"}}>✕</button>
                </div>
                {guionOpen[g.id]&&<div className="d-in" style={{marginTop:10,borderRadius:14,background:"linear-gradient(170deg, rgba(13,17,27,.95), rgba(6,8,14,.98))",border:"1px solid "+D.line3,padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,letterSpacing:".14em",textTransform:"uppercase",color:D.lav,fontWeight:700}}>{g.guion?g.guion.title:"Sin guión anclado"}</span>
                  {(g.guion?.subs||[]).map(sb=>(<React.Fragment key={sb.id}>
                    {(g.guion.subs.length>1)&&<span style={{fontSize:11.5,fontWeight:700,color:D.cian}}>{sb.nombre}</span>}
                    {sb.lineas.map((b,i)=>(
                    <div key={b.id} style={{borderRadius:10,background:D.panel,border:"1px solid "+D.line3,borderLeft:"3px solid "+D.lav,padding:"11px 13px",display:"flex",flexDirection:"column",gap:6}}>
                      <span style={{fontSize:12,fontWeight:700,color:D.lav}}>Línea {i+1}{b.header?" · "+b.header:""}</span>
                      {b.voz&&<div style={{display:"flex",gap:10,alignItems:"baseline"}}>
                        <span style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".1em",textTransform:"uppercase",color:D.peri,width:46,flexShrink:0}}>Voz off</span>
                        <span style={{fontSize:12.5,color:D.tx2,lineHeight:1.5}}>{b.voz}</span>
                      </div>}
                      {b.escena&&<div style={{display:"flex",gap:10,alignItems:"baseline"}}>
                        <span style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".1em",textTransform:"uppercase",color:D.rojo,width:46,flexShrink:0}}>Escena</span>
                        <span style={{fontSize:12,color:D.tx3,lineHeight:1.5}}>{b.escena}</span>
                      </div>}
                      {(b.movs||[]).length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        {b.movs.map((mv,mi)=><span key={mi} style={{padding:"3px 9px",borderRadius:6,background:"rgba(255,139,139,.09)",border:"1px solid rgba(255,139,139,.3)",color:D.rojo,fontSize:10.5,fontWeight:600}}>{mv}</span>)}
                      </div>}
                    </div>))}
                  </React.Fragment>))}
                  {!(g.guion?.subs||[]).some(sb=>sb.lineas.length)&&<span style={{fontSize:12.5,color:D.tx4,padding:"4px 2px"}}>Todavía no hay guión anclado a este día — puedes crearlo en la sección Guionado y asociarlo aquí.</span>}
                </div>}
              </div>))}

            {/* Acciones del día */}
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <button onClick={()=>addItem(wd.ds)} style={{flex:"1 1 auto",padding:"11px 16px",borderRadius:12,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",textAlign:"left"}}>+ Agregar contenido</button>
              {grabs.length===0&&<button onClick={()=>sShowGrabPicker(wd.ds)} style={{padding:"11px 16px",borderRadius:12,background:"transparent",border:"1px dashed rgba(255,139,139,.35)",color:D.rojo,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",flexShrink:0}}>+ Día grabación</button>}
            </div>
          </div>
        </div>
      </div>);
    })}
    </div>}

    <div style={{textAlign:"center",padding:"12px 0",fontSize:9,color:"var(--tx3)",marginTop:8}}>
      Contenido planificado por {co?.name} · Inmersia SPA · Marketing Digital · {weekDays[0]?.date?.getFullYear()}
    </div>

    {/* SELECTOR DE DÍA DE GRABACIÓN
        Al reescribir el bloque de días este panel se había perdido, así que el botón
        "+ Día grabación" fijaba el estado pero no mostraba nada. */}
    {showGrabPicker&&(<Portal><div onClick={()=>{sShowGrabPicker(null);sGrabTime("");}} style={{position:"fixed",inset:0,zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"rgba(2,3,8,.72)",backdropFilter:"blur(8px)"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"min(460px,100%)",...D_MARCO,borderRadius:28,boxShadow:"0 30px 80px rgba(2,3,8,.7)"}}>
        <div style={{...D_CARD,borderRadius:22,padding:"22px 24px 24px",display:"flex",flexDirection:"column",gap:16,maxHeight:"84vh",overflow:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Ic n="camera" s={18} c={D.rojo}/>
            <div style={{display:"flex",flexDirection:"column",gap:2,minWidth:0}}>
              <span style={{fontSize:17,fontWeight:700,color:D.tx}}>Día de grabación</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.tx4}}>
                {(()=>{const d=weekDays.find(w=>w.ds===showGrabPicker);return d?`${d.dayName} ${d.day} · ${d.month}`:showGrabPicker;})()}
              </span>
            </div>
            <button onClick={()=>{sShowGrabPicker(null);sGrabTime("");}} style={{marginLeft:"auto",width:30,height:30,borderRadius:"50%",background:"transparent",border:"1px solid "+D.line2,color:D.tx3,cursor:"pointer",fontFamily:"inherit",fontSize:13,flexShrink:0}}>✕</button>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>Hora</span>
            <input type="time" value={grabTime} onChange={e=>sGrabTime(e.target.value)} style={{padding:"9px 12px",borderRadius:999,background:D.bg,border:"1px solid "+D.line2,color:D.tx2,fontFamily:"var(--font-mono)",fontSize:12.5,outline:"none",colorScheme:"dark",width:"fit-content"}}/>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>Guión (opcional)</span>
            <button onClick={()=>{linkGrab(showGrabPicker,null,grabTime);}} style={{display:"flex",alignItems:"center",gap:9,padding:"11px 14px",borderRadius:12,background:"transparent",border:"1px dashed "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
              Sin guión — solo marcar el día
            </button>
            {guiones.filter(g=>!selCo||String(g.companyId)===String(selCo)).map(g=>(
              <button key={g.id} onClick={()=>{linkGrab(showGrabPicker,g.id,grabTime);}} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",borderRadius:12,background:D.panel,border:"1px solid "+D.line3,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                <span style={{width:28,height:28,borderRadius:8,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"rgba(201,191,255,.12)",flexShrink:0}}><Ic n="edit" s={13} c={D.lav}/></span>
                <span style={{display:"flex",flexDirection:"column",gap:2,minWidth:0,flex:1}}>
                  <span style={{fontSize:12.5,fontWeight:600,color:D.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{g.title||"Guión sin título"}</span>
                  <span style={{fontSize:10.5,color:D.tx4}}>{(g.subs||[]).reduce((a,sb)=>a+sb.lineas.length,0)} líneas</span>
                </span>
              </button>))}
            {guiones.filter(g=>!selCo||String(g.companyId)===String(selCo)).length===0&&
              <span style={{fontSize:11.5,color:D.tx4,lineHeight:1.5}}>No hay guiones de {co?.name} todavía. Puedes marcar el día igual y asociar el guión después desde Guionado.</span>}
          </div>
        </div>
      </div>
    </div></Portal>)}

    {/* LIGHTBOX */}
    {lightbox&&(<Portal><div onClick={()=>sLightbox(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-out",backdropFilter:"blur(8px)"}}>
      <button onClick={()=>sLightbox(null)} style={{position:"absolute",top:"calc(20px + env(safe-area-inset-top, 0px))",right:20,background:"rgba(255,255,255,.15)",border:"none",color:"#fff",width:36,height:36,borderRadius:18,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      <img src={lightbox} onClick={e=>e.stopPropagation()} style={{maxWidth:"92vw",maxHeight:"90vh",objectFit:"contain",borderRadius:8,cursor:"default"}}/>
    </div></Portal>)}
  </div>);
}

function TskForm({cos,users,onSave}){const[f,sF]=useState({title:"",type:"post",company:"",companyId:0,responsable:[],date:"",description:""});const teamUsers=users.filter(u=>u.role!=="cliente");return(<div>
  <Fd label="Título"><input value={f.title} onChange={e=>sF({...f,title:e.target.value})} placeholder="Nombre de la tarea"/></Fd>
  <Fd label="Tipo de contenido"><select value={f.type} onChange={e=>sF({...f,type:e.target.value})}>{Object.entries(TT).map(([k,v])=><option key={k} value={k}>{v.i} {v.l}</option>)}</select></Fd>
  <Fd label="Empresa"><select value={f.companyId} onChange={e=>{const co=cos.find(c=>c.id===parseInt(e.target.value));sF({...f,companyId:parseInt(e.target.value),company:co?.name||""});}}><option value={0}>Seleccionar...</option>{cos.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fd>
  <Fd label="Responsables"><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{teamUsers.map(u=>{const sel=f.responsable.includes(u.id);return(<button key={u.id} onClick={()=>sF({...f,responsable:sel?f.responsable.filter(id=>id!==u.id):[...f.responsable,u.id]})} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",borderRadius:8,fontSize:12,fontWeight:sel?600:500,background:sel?"color-mix(in oklch,"+u.color+" 14%,transparent)":"var(--bg4)",border:"1px solid "+(sel?"color-mix(in oklch,"+u.color+" 35%,transparent)":"var(--border)"),color:sel?u.color:"var(--tx2)",cursor:"pointer",fontFamily:"inherit"}}><Av u={u} sz={18}/>{u.name}</button>);})}</div></Fd>
  <Fd label="Fecha"><input type="date" value={f.date} onChange={e=>sF({...f,date:e.target.value})}/></Fd>
  <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}><Bt v="p" disabled={!f.title||!f.companyId} onClick={()=>onSave(f)} icon="plus">Crear tarea</Bt></div></div>);}
function CoForm({onSave}){

  const[planName,sPlanName]=useState("");const[price,sPrice]=useState("");
  const[ct,sCt]=useState({post:0,historia:0,reel:0,video_pro:0,visita:0,repost:0,custom:0});

  <div style={{height:1,background:"var(--border)",margin:"12px 0"}}/>

  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
    {Object.entries(TT).map(([k,v])=>(<div key={k} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",background:"var(--bg3)",borderRadius:7,border:"1px solid var(--border)"}}>
      <span style={{fontSize:12}}>{v.i}</span>
      <span style={{fontSize:11,flex:1,color:"var(--tx2)"}}>{v.l}</span>
      <input type="number" min="0" value={ct[k]||0} onChange={e=>upCt(k,e.target.value)} style={{width:44,fontSize:13,fontWeight:700,padding:"3px 4px",textAlign:"center"}}/>
    </div>))}
  </div>
  <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:14}}>
    <Bt v="p" disabled={!n.trim()||!price} onClick={()=>onSave({name:n.trim(),planName:planName||"Custom",price:parseInt(price)||0,tasks:ct,color:c})} icon="plus">Crear empresa</Bt>
  </div></div>);}
function TskDet({t,cu,users,onUp,onVote,onDel,onUns,onSync,hasGcal,onFile,onSave}){
  const[desc,sD]=useState(t.description||"");const[com,sC]=useState("");const fR=useRef(null);
  const sts=["no_realizado","en_proceso","en_aprobacion","aprobado","publicado"];
  const teamUsers=users.filter(u=>u.role!=="cliente");
  const tCo=t.company;
  return(<div style={{display:"flex",flexDirection:"column",gap:14}}>
    {/* Header badges */}
    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
      <Bg color={TT[t.type]?.c}>{TT[t.type]?.i} {TT[t.type]?.l||t.type}</Bg>
      <Bg color={SS[t.state]?.c}>{SS[t.state]?.l}</Bg>
      <Bg>{tCo}</Bg>
      {/* Cuando el cliente aprueba, la fecha se limpia para que la pieza caiga en su banco de
          «Listo para agendar». Sin esto el equipo perdía de vista para cuándo estaba pensada. */}
      {!t.date&&t.plannedDay&&<Bg>📌 Planificada {fechaDia(t.plannedDay)}</Bg>}
      <div style={{marginLeft:"auto",display:"flex",gap:4}}>
        {t.date&&<Bt v="g" onClick={onUns} style={{fontSize:11,color:"var(--warn)"}} icon="calendar">Desagendar</Bt>}
        {t.date&&hasGcal&&<Bt v="g" onClick={onSync} style={{fontSize:11,color:"var(--info)"}} icon="calendar">GCal</Bt>}
        <Bt v="d" onClick={onDel} style={{fontSize:11}} icon="trash">Reset</Bt>
      </div>
    </div>
    {/* Estado */}
    <Fd label="Estado"><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{sts.map(s=><button key={s} onClick={()=>onUp(
      // "Aprobado" desde aquí = igual que el flujo real: sin fecha (va al banco «Listo para
      // agendar») y el día del equipo guardado como recomendación en plannedDay. Al salir de un
      // aprobado-sin-fecha hacia otro estado, se recupera ese día para no dejar la pieza sin fecha.
      s==="aprobado"
        ? {state:s,date:null,publishTime:null,plannedDay:t.plannedDay||t.date||null}
        : (["aprobado","publicado"].includes(t.state)&&!t.date?{state:s,date:t.plannedDay||null}:{state:s})
    )} style={{padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:600,background:t.state===s?"color-mix(in oklch,"+SS[s].c+" 20%,var(--bg3))":"var(--bg4)",border:"1px solid "+(t.state===s?SS[s].c:"var(--border)"),color:t.state===s?SS[s].c:"var(--tx2)",fontFamily:"inherit",cursor:"pointer"}}>{SS[s].l}</button>)}</div></Fd>
    {/* Responsables */}
    <Fd label="Responsables"><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{teamUsers.map(u=>{const sel=Array.isArray(t.responsable)?t.responsable.includes(u.id):t.responsable===u.id;return(<button key={u.id} onClick={()=>{const cur=Array.isArray(t.responsable)?[...t.responsable]:(t.responsable?[t.responsable]:[]);const nw=sel?cur.filter(id=>id!==u.id):[...cur,u.id];onUp({responsable:nw});}} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",borderRadius:8,fontSize:12,fontWeight:sel?600:500,background:sel?"color-mix(in oklch,"+u.color+" 14%,transparent)":"var(--bg4)",border:"1px solid "+(sel?"color-mix(in oklch,"+u.color+" 35%,transparent)":"var(--border)"),color:sel?u.color:"var(--tx2)",cursor:"pointer",fontFamily:"inherit"}}><Av u={u} sz={18}/>{u.name}</button>);})}</div></Fd>
    {/* Fecha */}
    <Fd label="Fecha"><input type="date" value={t.date||""} onChange={e=>onUp({date:e.target.value||null})}/></Fd>
    {t.state==="publicado"&&(<Fd label="Hora de publicación"><input type="time" value={t.publishTime||""} onChange={e=>onUp({publishTime:e.target.value||null})}/></Fd>)}
    {/* Descripcion */}
    <Fd label="Descripción"><textarea value={desc} onChange={e=>sD(e.target.value)} onBlur={()=>onUp({description:desc})} rows={3} placeholder="Describe el contenido..." style={{resize:"none",lineHeight:1.5}}/></Fd>
    {/* Files */}
    {(t.state==="en_aprobacion"||t.state==="en_proceso")&&(<div className="card" style={{padding:14}}>
      <div style={{fontSize:12,fontWeight:600,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><Ic n="paperclip" s={14}/>Archivos ({t.files?.length||0})</div>
      {t.files?.map((f,i)=>(<div key={i} style={{marginBottom:4}}>{f.type?.startsWith("image")?<img src={f.data} style={{maxWidth:"100%",maxHeight:100,borderRadius:8}}/>:<a href={f.data} download={f.name} style={{fontSize:12,color:"var(--accent)"}}>{f.name}</a>}</div>))}
      <input ref={fR} type="file" style={{display:"none"}} onChange={e=>{if(e.target.files[0])onFile(e.target.files[0]);}}/><Bt v="s" onClick={()=>fR.current?.click()} icon="paperclip" style={{fontSize:12}}>Subir archivo</Bt>
    </div>)}
    {/* Voting */}
    {t.state==="en_aprobacion"&&(<div className="card" style={{padding:14}}>
      <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>Votación Equipo</div>
      {teamUsers.map(u=>{const v=t.votes?.[u.id];return(<div key={u.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <Av u={u} sz={22}/><span style={{fontSize:12,flex:1}}>{u.name}</span>
        {v===undefined?((u.id===cu.id||cu.role==="admin")?<div style={{display:"flex",gap:4}}><Bt v="s" onClick={()=>onVote(u.id,true)} style={{padding:"4px 10px",fontSize:11,background:"color-mix(in oklch,var(--success) 15%,var(--bg3))",color:"var(--success)"}}>✓ Sí</Bt><Bt v="s" onClick={()=>onVote(u.id,false)} style={{padding:"4px 10px",fontSize:11,background:"color-mix(in oklch,var(--danger) 15%,var(--bg3))",color:"var(--danger)"}}>✗ No</Bt></div>:<span style={{fontSize:11,color:"var(--tx3)"}}>Pendiente</span>)
        :<Bg color={v?"var(--success)":"var(--danger)"}>{v?"✓ Aprobó":"✗ Rechazó"}</Bg>}
      </div>);})}
    </div>)}
    {/* Client approval */}
    {t.state==="en_aprobacion"&&(<div className="card" style={{padding:14,borderLeft:"3px solid var(--gold)"}}>
      <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:"var(--gold)"}}>Aprobación Cliente — {tCo}</div>
      {t.clientApproval?(<div>
        <Bg color={t.clientApproval.status==="aprobado"?"var(--success)":"var(--danger)"}>{t.clientApproval.status==="aprobado"?"✅ Aprobado":"✗ Rechazado"} por {t.clientApproval.by}</Bg>
        {t.clientApproval.comment&&<div style={{marginTop:6,fontSize:12,color:"var(--tx2)",background:"var(--bg3)",padding:8,borderRadius:8}}>"{t.clientApproval.comment}"</div>}
      </div>):(<div style={{fontSize:12,color:"var(--tx3)"}}>⏳ Esperando aprobación del cliente</div>)}
    </div>)}
    {/* Comments */}
    <div>
      <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>Comentarios ({t.comments?.length||0})</div>
      {(t.comments||[]).map((c,i)=><div key={i} style={{background:"var(--bg3)",padding:"6px 10px",borderRadius:8,marginBottom:4,fontSize:12}}><b style={{color:"var(--accent)"}}>{c.user}:</b> {c.text}</div>)}
      <div style={{display:"flex",gap:6,marginTop:6}}>
        <input value={com} onChange={e=>sC(e.target.value)} placeholder="Escribe un comentario..." style={{flex:1,fontSize:13,padding:"8px 12px"}} onKeyDown={e=>{if(e.key==="Enter"&&com.trim()){onUp({comments:[...(t.comments||[]),{user:cu.name,text:com.trim()}]});sC("");}}}/>
        <Bt v="s" onClick={()=>{if(com.trim()){onUp({comments:[...(t.comments||[]),{user:cu.name,text:com.trim()}]});sC("");}}} icon="check" style={{fontSize:12}}>Enviar</Bt>
      </div>
    </div>
    {/* Linked guión */}
    {t.guionId&&(<div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"rgba(255,155,61,.06)",border:"1px solid rgba(255,155,61,.2)",borderRadius:8}}>
      <Ic n="paperclip" s={14} c="var(--gold)"/>
      <div style={{flex:1}}><span style={{fontSize:12,fontWeight:600,color:"var(--gold)"}}>Guión: </span><span style={{fontSize:12}}>{t.guionTitle||"Vinculado"}</span></div>
    </div>)}
    <Bt v="p" onClick={onSave} icon="save" style={{width:"100%",justifyContent:"center"}}>Guardar cambios</Bt>
  </div>);
}

// Mismo lenguaje visual para la app interna. Se comparte con el portal del cliente a

const D=PC;
const D_CARD={borderRadius:20,padding:"20px 22px",background:"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)"};

const dGrupo={display:"flex",gap:3,padding:3,borderRadius:999,background:PC.panel,border:"1px solid "+PC.line3};
const dNav=dir=>({width:32,height:32,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,cursor:"pointer",fontFamily:"inherit",flexShrink:0});
// Truco del diseño: el "borde" es un degradado detrás de la tarjeta, no un border real.

const PC_CARD={borderRadius:20,background:"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)"};
const pcPill=(color,activo)=>({padding:"7px 18px",borderRadius:999,border:"none",background:activo?color:"transparent",color:activo?"#05060B":PC.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"});

// Modal de perfil: correo asignado, cambio de contraseña y accesos a los Drive.
function PerfilModal({open,onClose,user,co,onToast}){
  const[tab,sTab]=useState("cuenta");
  const[actual,sActual]=useState("");
  const[nueva,sNueva]=useState("");
  const[repite,sRepite]=useState("");
  const[msg,sMsg]=useState(null);          // {texto,ok}
  const[guardando,sGuardando]=useState(false);
  useEffect(()=>{if(open){sTab("cuenta");sActual("");sNueva("");sRepite("");sMsg(null);}},[open]);
  if(!open)return null;

  const drives=(co&&co.links)||[];
  const iniciales=(user.companyName||user.name||"?").slice(0,2).toUpperCase();

  const guardar=async()=>{
    sMsg(null);
    if(!actual||!nueva)return sMsg({texto:"Completa la contraseña actual y la nueva",ok:false});
    if(nueva!==repite)return sMsg({texto:"La nueva contraseña y su repetición no coinciden",ok:false});
    if(nueva.length<6)return sMsg({texto:"La nueva contraseña debe tener al menos 6 caracteres",ok:false});
    sGuardando(true);
    try{
      await API.changePassword(user.email,actual,nueva);
      sMsg({texto:"Contraseña actualizada",ok:true});
      sActual("");sNueva("");sRepite("");
      if(onToast)onToast("Contraseña actualizada ✓");
    }catch(e){sMsg({texto:e.message,ok:false});}
    finally{sGuardando(false);}
  };

  const colorDrive=i=>[PC.cian,PC.peri,PC.lav][i%3];

  return(<Portal><div onClick={onClose} style={{position:"fixed",inset:0,zIndex:70,display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"rgba(2,3,8,.72)",backdropFilter:"blur(8px)"}}>
    <div onClick={ev=>ev.stopPropagation()} style={{width:"min(440px,100%)",...PC_MARCO,borderRadius:28,boxShadow:"0 30px 80px rgba(2,3,8,.7)"}}>
      <div style={{...PC_CARD,borderRadius:22,padding:"22px 24px 24px",display:"flex",flexDirection:"column",gap:18,maxHeight:"84vh",overflow:"auto",boxSizing:"border-box"}}>

        <div style={{display:"flex",alignItems:"center",gap:13}}>
          <div style={{width:44,height:44,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(140deg,"+PC.lav+",#8E7BE0)",color:"#14101F",fontSize:15,fontWeight:700}}>{iniciales}</div>
          <div style={{display:"flex",flexDirection:"column",gap:2}}>
            <span style={{fontSize:17,fontWeight:600}}>{user.companyName||user.name}</span>
            <span style={{fontSize:12,color:PC.tx4}}>Tu perfil</span>
          </div>
          <button onClick={onClose} style={{marginLeft:"auto",width:30,height:30,borderRadius:"50%",background:"transparent",border:"1px solid "+PC.line2,color:PC.tx3,fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>✕</button>
        </div>

        <div style={{display:"flex",gap:3,padding:3,borderRadius:999,background:PC.panel,border:"1px solid #1E2536",alignSelf:"flex-start"}}>
          <button onClick={()=>sTab("cuenta")} style={pcPill(PC.cian,tab==="cuenta")}>Cuenta</button>
          <button onClick={()=>sTab("drives")} style={pcPill(PC.cian,tab==="drives")}>Drives</button>
        </div>

        {tab==="cuenta"&&<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <label style={{fontSize:12.5,fontWeight:600,color:PC.tx2}}>Correo asignado a esta cuenta</label>
            <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",borderRadius:12,background:PC.panel,border:"1px solid "+PC.line2}}>
              <Ic n="inbox" s={15} c={PC.peri}/>
              <span style={{fontFamily:"var(--font-mono)",fontSize:13.5,color:PC.tx2,wordBreak:"break-all"}}>{user.email}</span>
            </div>
            <span style={{fontSize:11.5,color:PC.tx4}}>Para cambiarlo, escríbenos a INMERSIA.</span>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <label style={{fontSize:12.5,fontWeight:600,color:PC.tx2}}>Cambiar contraseña</label>
            <input type="password" value={actual} onChange={ev=>sActual(ev.target.value)} placeholder="Contraseña actual" autoComplete="current-password" style={pcInput}/>
            <input type="password" value={nueva} onChange={ev=>sNueva(ev.target.value)} placeholder="Nueva contraseña" autoComplete="new-password" style={pcInput}/>
            <input type="password" value={repite} onChange={ev=>sRepite(ev.target.value)} placeholder="Repite la nueva contraseña" autoComplete="new-password" style={pcInput}/>
            {msg&&<span style={{fontSize:12,color:msg.ok?PC.cian:PC.rojo,lineHeight:1.45}}>{msg.texto}</span>}
            <button onClick={guardar} disabled={guardando} style={{alignSelf:"flex-end",padding:"10px 22px",borderRadius:999,background:PC.cian,border:"1px solid "+PC.cian,color:"#05060B",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:guardando?"default":"pointer",opacity:guardando?.5:1}}>
              {guardando?"Guardando…":"Actualizar contraseña"}
            </button>
          </div>
        </>}

        {tab==="drives"&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          <span style={{fontSize:12.5,color:PC.tx3,lineHeight:1.5}}>Accesos directos a las carpetas con tu contenido.</span>
          {drives.length===0
            ? <div style={{padding:"22px 14px",borderRadius:14,border:"1px dashed "+PC.line2,textAlign:"center",fontSize:12.5,color:PC.tx4,lineHeight:1.5}}>Todavía no hay carpetas compartidas.<br/>Pídeselas al equipo de INMERSIA.</div>
            : drives.map((d,i)=>(
              <a key={d.id||i} href={d.url} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderRadius:14,background:PC.panel,border:"1px solid "+PC.line2,color:PC.tx,fontSize:13.5,fontWeight:600,textDecoration:"none"}}>
                <span style={{width:32,height:32,flexShrink:0,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:colorDrive(i)+"1f"}}>
                  <Ic n="companies" s={15} c={colorDrive(i)}/>
                </span>
                <span style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                <span style={{marginLeft:"auto",flexShrink:0,display:"flex"}}><Ic n="chev_r" s={14} c={PC.tx4}/></span>
              </a>))}
        </div>}

      </div>
    </div>
  </div></Portal>);
}

// Media del deck: el video se comporta como un reel (autoplay, loop, mudo) en vez de
// llevar <video controls>, porque la barra de controles se come el gesto de swipe.
/// fit="contain" para revisar (el cliente tiene que ver la pieza ENTERA antes de aprobar:
// un 4:5 recortado esconde justo el encabezado y el pie del arte). fit="cover" solo para
// miniaturas, donde recortar se ve más ordenado y el archivo ya fue revisado.
// lush = tratamiento de revisión: el arte se muestra completo sobre un fondo hecho con la
// propia imagen desenfocada, en vez de dejar franjas negras muertas cuando el formato del
// material no calza con el de la tarjeta.
function DeckMedia({f,h=300,fit="contain",lush}){
  const[muted,sMuted]=useState(true);
  const[playing,sPlaying]=useState(false);
  const vref=useRef(null);
  const src=f?fSrc(f):"";
  // El atributo autoplay por sí solo no basta: React aplica `muted` como propiedad después
  // de crear el elemento, y Chrome además pausa el video mudo sin pista de audio cuando
  // cree que la página no está visible ("paused to save power"). En ese caso el reel se
  // queda congelado en el primer cuadro. Reintentamos al volver a ser visible, y si aun
  // así está en pausa mostramos un botón de play — nunca dejamos al cliente sin salida.
  useEffect(()=>{
    const v=vref.current;if(!v)return;
    v.muted=true;
    const go=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{});};
    const onPlay=()=>sPlaying(true),onPause=()=>sPlaying(false);
    const onVis=()=>{if(!document.hidden)go();};
    v.addEventListener("play",onPlay);v.addEventListener("pause",onPause);v.addEventListener("canplay",go);
    document.addEventListener("visibilitychange",onVis);
    go();
    return()=>{v.removeEventListener("play",onPlay);v.removeEventListener("pause",onPause);v.removeEventListener("canplay",go);document.removeEventListener("visibilitychange",onVis);};
  },[src]);
  if(!f)return(<div style={{height:h,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--tx3)",fontSize:13,background:"var(--bg4)"}}>Sin vista previa</div>);
  const media={maxWidth:"100%",maxHeight:"100%",width:fit==="cover"?"100%":"auto",height:fit==="cover"?"100%":"auto",objectFit:fit,display:"block",borderRadius:lush?10:0,boxShadow:lush?"0 12px 38px rgba(0,0,0,.6)":"none"};
  const wrap=inner=>(<div style={{position:"relative",height:h,overflow:"hidden",background:"#07090c"}}>
    {lush&&isImg(f)&&<div aria-hidden="true" style={{position:"absolute",inset:-50,backgroundImage:"url("+src+")",backgroundSize:"cover",backgroundPosition:"center",filter:"blur(38px) saturate(1.7) brightness(.5)",transform:"scale(1.12)"}}/>}
    {lush&&!isImg(f)&&<div aria-hidden="true" style={{position:"absolute",inset:0,background:"radial-gradient(130% 90% at 50% 0%, rgba(255,255,255,.09), transparent 62%)"}}/>}
    <div style={{position:"relative",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",padding:lush?16:0}}>{inner}</div>
  </div>);
  if(isVid(f))return wrap(<>
    <video ref={vref} src={src} autoPlay loop muted={muted} playsInline style={media}/>
    {!playing&&<button onPointerDown={e=>e.stopPropagation()} onClick={()=>{const v=vref.current;if(v){const p=v.play();if(p&&p.catch)p.catch(()=>{});}}} title="Reproducir" style={{position:"absolute",inset:0,margin:"auto",width:64,height:64,borderRadius:"50%",background:"rgba(0,0,0,.6)",backdropFilter:"blur(8px)",border:"1px solid rgba(255,255,255,.22)",color:"#fff",fontSize:23,paddingLeft:4,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>▶</button>}
    <button onPointerDown={e=>e.stopPropagation()} onClick={()=>sMuted(m=>!m)} style={{position:"absolute",bottom:12,right:12,width:36,height:36,borderRadius:"50%",background:"rgba(0,0,0,.55)",backdropFilter:"blur(8px)",color:"#fff",border:"1px solid rgba(255,255,255,.16)",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>{muted?"🔇":"🔊"}</button>
  </>);
  if(isImg(f))return wrap(<img src={src} alt={f.name||""} draggable={false} style={media}/>);
  return wrap(<a href={src} download={f.name} style={{color:"var(--accent)",fontSize:13}}>{f.name||"Archivo"}</a>);
}

function DeckCard({t,children}){
  // Si la pieza ya pasó por un rechazo, `revisions` guarda la versión anterior junto con
  // el motivo. El cliente puede comparar antes/después sin salir de la tarjeta.
  const rev=(t.revisions&&t.revisions.length)?t.revisions[t.revisions.length-1]:null;
  const[verAntes,sVerAntes]=useState(false);
  const shown=(verAntes&&rev)?t.revisions[t.revisions.length-1].files:t.files;
  const f=shown&&shown[0];
  return(<div style={{...PC_MARCO,borderRadius:30,boxShadow:"0 24px 60px rgba(2,3,8,.55)"}}>
    <div style={{...PC_CARD,borderRadius:24,overflow:"hidden"}}>

      {/* Vista previa — proporción del diseño, se abre en grande al tocarla */}
      <div onClick={()=>f&&openZoom(shown,0)} style={{position:"relative",aspectRatio:"1 / 0.92",background:"#0F1320",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",cursor:f?"zoom-in":"default"}}>
        {f
          ? <DeckMedia f={f} h="100%" lush/>
          : <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:13,letterSpacing:".3em",textTransform:"uppercase",color:"rgba(244,242,237,.55)"}}>{TT[t.type]?.l}</span>
              <span style={{fontSize:"clamp(30px,6vw,46px)",fontWeight:600,letterSpacing:"-.02em",color:"rgba(244,242,237,.9)"}}>{t.title}</span>
            </div>}

        <span style={{position:"absolute",bottom:12,left:14,padding:"4px 10px",borderRadius:999,background:"rgba(5,6,11,.72)",border:"1px solid rgba(200,210,228,.18)",fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".08em",color:PC.tx2,pointerEvents:"none"}}>
          {rev?(verAntes?"Versión anterior":"Versión "+(t.revisions.length+1)):"Versión 1"}
        </span>

        {rev&&<div onClick={ev=>ev.stopPropagation()} style={{position:"absolute",top:14,left:14,display:"flex",gap:3,padding:3,borderRadius:999,background:"rgba(5,6,11,.75)",border:"1px solid "+PC.line2,backdropFilter:"blur(6px)"}}>
          {[["Antes",true],["Ahora",false]].map(([l,v])=>(
            <button key={l} onClick={()=>sVerAntes(v)} style={{padding:"6px 14px",borderRadius:999,border:"none",background:verAntes===v?PC.tx:"transparent",color:verAntes===v?"#14101F":"rgba(244,242,237,.72)",fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>{l}</button>))}
        </div>}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:14,padding:"18px 22px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 12px",borderRadius:999,background:(TT[t.type]?.c||"#999")+"1a",border:"1px solid "+(TT[t.type]?.c||"#999")+"59",color:TT[t.type]?.c,fontSize:12,fontWeight:600}}>{TT[t.type]?.i} {TT[t.type]?.l}</span>
          {rev&&<span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 12px",borderRadius:999,background:"rgba(155,180,255,.1)",border:"1px solid rgba(155,180,255,.35)",color:PC.peri,fontSize:12,fontWeight:600}}>✎ Corregido</span>}
        </div>

        {rev&&rev.comment&&<div style={{padding:"12px 16px",borderRadius:12,background:"rgba(155,180,255,.06)",border:"1px solid rgba(155,180,255,.18)",fontSize:13.5,lineHeight:1.55,color:PC.tx2}}>
          <span style={{color:PC.peri,fontWeight:600}}>Pediste este cambio: </span>{rev.comment}
        </div>}

        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <span style={{fontSize:17,fontWeight:600,color:PC.tx}}>{t.title}</span>
          {t.description
            ? <span style={{fontSize:13.5,lineHeight:1.55,color:PC.tx3}}>{t.description}</span>
            : <span style={{fontSize:13.5,lineHeight:1.55,color:PC.tx4,fontStyle:"italic"}}>El equipo no dejó notas para esta pieza.</span>}
        </div>

        {children}
      </div>
    </div>
  </div>);
}

// Revisión de contenido: una pieza a la vez, se decide con los botones.
// (El gesto de deslizar se quitó a pedido: en escritorio confundía y en móvil competía
// con el scroll de la página.)
function SwipeDeck({items,onApprove,onReject,isMob,busy,onGoPlan}){
  const[leaving,sLeaving]=useState(null);
  const[rejFor,sRejFor]=useState(null);
  const[rejMsg,sRejMsg]=useState("");
  // Sacamos la pieza del mazo apenas termina la animación, sin esperar a que el guardado
  // vuelva de Supabase: si no, la tarjeta siguiente hereda el nodo de la que salió.
  const[done,sDone]=useState([]);
  const[hechas,sHechas]=useState({ok:0,no:0});
  const list=useMemo(()=>items.filter(t=>done.indexOf(t.id)<0),[items,done]);
  const top=list[0];

  const salir=(t,dir,cb)=>{sLeaving({id:t.id,dir});setTimeout(()=>{sDone(d=>[...d,t.id]);sLeaving(null);cb();},240);};
  const aprobar=()=>{if(!top||leaving||busy)return;sHechas(h=>({...h,ok:h.ok+1}));salir(top,"ok",()=>onApprove(top));};
  const pedirRechazo=()=>{if(!top||leaving||busy)return;sRejMsg("");sRejFor(top);};
  const confirmarRechazo=()=>{
    const msg=rejMsg.trim();if(!msg||!rejFor)return;
    const t=rejFor;sRejFor(null);sRejMsg("");
    sHechas(h=>({...h,no:h.no+1}));
    salir(t,"no",()=>onReject(t,msg));
  };

  const total=list.length+done.length;

  if(!top)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14,padding:"70px 20px",borderRadius:24,border:"1px dashed "+PC.line2,textAlign:"center"}}>
    <div style={{width:52,height:52,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(111,231,242,.09)",border:"1px solid rgba(111,231,242,.4)"}}>
      <Ic n="check" s={22} c={PC.cian}/>
    </div>
    <span style={{fontSize:18,fontWeight:600,color:PC.tx}}>Todo revisado</span>
    <span style={{fontSize:13.5,color:PC.tx3,maxWidth:380,lineHeight:1.55}}>
      {done.length===0
        ? "No tienes contenido esperando revisión. Cuando INMERSIA suba material nuevo lo verás acá."
        : `Aprobaste ${hechas.ok} ${hechas.ok===1?"pieza":"piezas"}${hechas.no?` y devolviste ${hechas.no} con comentarios`:""}. Lo aprobado ya está listo para agendar.`}
    </span>
    {onGoPlan&&<button onClick={onGoPlan} style={{marginTop:6,padding:"11px 24px",borderRadius:999,background:"rgba(201,191,255,.09)",border:"1px solid rgba(201,191,255,.4)",color:PC.lav,fontFamily:"inherit",fontSize:13.5,fontWeight:600,cursor:"pointer"}}>Ir a Planificar</button>}
  </div>);

  const btn=(color,fondo)=>({display:"flex",alignItems:"center",justifyContent:"center",gap:9,flex:isMob?"1 1 auto":"0 0 auto",padding:"13px 30px",borderRadius:999,background:fondo,border:"1px solid "+color+"59",color,fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:busy?"default":"pointer",opacity:busy?.45:1});

  return(<div>
    <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:14}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:11.5,letterSpacing:".18em",textTransform:"uppercase",color:PC.tx4}}>Revisión de contenido</span>
      <span style={{fontFamily:"var(--font-mono)",fontSize:12.5,color:PC.tx2}}>{done.length+1} de {total}</span>
    </div>

    <div style={{opacity:leaving?0:1,transform:leaving?(leaving.dir==="ok"?"translateY(-14px) scale(.97)":"translateY(14px) scale(.97)"):"none",transition:"opacity .24s ease, transform .24s ease"}}>
      <DeckCard t={top}/>
    </div>

    <div style={{display:"flex",justifyContent:"center",gap:14,marginTop:22,flexWrap:"wrap"}}>
      <button onClick={pedirRechazo} disabled={busy} style={btn(PC.rojo,"rgba(255,107,107,.07)")}>
        <Ic n="x" s={13} c={PC.rojo}/>Rechazar
      </button>
      <button onClick={aprobar} disabled={busy} style={btn(PC.cian,"rgba(111,231,242,.09)")}>
        <Ic n="check" s={14} c={PC.cian}/>Aprobar
      </button>
    </div>
    <p style={{margin:"14px 0 0",textAlign:"center",fontSize:12,color:PC.tx4}}>Al aprobar, la pieza queda lista para agendar en Planificar</p>

    {/* Rechazar siempre pide motivo: es lo que le llega al equipo */}
    {rejFor&&(<Portal><div onClick={()=>sRejFor(null)} style={{position:"fixed",inset:0,zIndex:80,display:"flex",alignItems:"center",justifyContent:"center",padding:20,background:"rgba(2,3,8,.72)",backdropFilter:"blur(8px)"}}>
      <div onClick={ev=>ev.stopPropagation()} style={{width:"min(440px,100%)",...PC_MARCO,borderRadius:28,boxShadow:"0 30px 80px rgba(2,3,8,.7)"}}>
        <div style={{...PC_CARD,borderRadius:22,padding:"22px 24px 24px",display:"flex",flexDirection:"column",gap:14}}>
          <div style={{fontSize:17,fontWeight:600,color:PC.tx}}>¿Por qué lo rechazas?</div>
          <div style={{fontSize:13,color:PC.tx3,lineHeight:1.55}}>
            Cuéntanos qué hay que cambiar en <b style={{color:PC.tx}}>{rejFor.title}</b>. El equipo recibe tu motivo junto con la pieza.
          </div>
          <textarea value={rejMsg} onChange={e=>sRejMsg(e.target.value)} autoFocus placeholder="Ej: la foto sale muy oscura, prefiero otra toma…" style={{...pcInput,minHeight:110,lineHeight:1.55,resize:"vertical"}}/>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={()=>sRejFor(null)} style={{padding:"10px 18px",borderRadius:999,background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,fontFamily:"inherit",fontSize:13,cursor:"pointer"}}>Cancelar</button>
            <button onClick={confirmarRechazo} disabled={!rejMsg.trim()} style={{padding:"10px 22px",borderRadius:999,background:rejMsg.trim()?"rgba(255,107,107,.14)":"transparent",border:"1px solid "+PC.rojo+"59",color:PC.rojo,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:rejMsg.trim()?"pointer":"default",opacity:rejMsg.trim()?1:.4}}>Enviar rechazo</button>
          </div>
        </div>
      </div>
    </div></Portal>)}
  </div>);
}

// Vista previa de la publicación como se verá en Instagram. No copia el blanco de Instagram:
// va en nuestra paleta, porque es una maqueta dentro de nuestro producto y no un clon. Lo que
// sí respeta es lo que hace falta para juzgar una pieza antes de darle el sí: el encuadre real
// (1:1 en feed, vertical en reel e historia), el @ de la cuenta y el pie tal cual saldrá,
// cortado donde Instagram lo corta.
const IG_ICO={
  like:"M12 21s-7.5-4.7-9.5-9A5.2 5.2 0 0 1 12 6.3 5.2 5.2 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z",
  comment:"M21 11.5a8.4 8.4 0 0 1-9 8.3 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.9A8.3 8.3 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.3 8.4 8.4 0 0 1 8.4 8.3z",
  send:"M22 2 11 13 M22 2l-7 20-4-9-9-4 20-7z",
  save:"M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z",
};
const IgIco=({d,c})=>(<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>);
// Instagram corta el pie a un par de líneas y deja un "más". Se corta a 125 caracteres, que es
// donde lo parte en la práctica: así el cliente ve lo que de verdad se va a leer sin desplegar.
const IG_CORTE=125;
function IgPreview({file,files,type,caption,cuenta,color,fecha,hora}){
  const[abierto,sAbierto]=useState(false);
  // El "… más" se colapsa de nuevo al cambiar de pieza o de texto. Sin esto, una vez desplegado
  // se quedaba así toda la vida del modal (el drawer no se remonta entre piezas) y el cliente
  // veía el pie entero creyendo que Instagram también lo mostrará completo.
  useEffect(()=>{sAbierto(false);},[caption,file]);
  const vertical=["reel","historia","video_pro"].includes(type);
  const handle=String(cuenta||"").replace(/^@/,"")||"tu_cuenta";
  const txt=String(caption||"");
  const corta=txt.length>IG_CORTE&&!abierto;
  return(<div style={{borderRadius:16,overflow:"hidden",background:PC.panel,border:"1px solid "+PC.line2}}>
    <div style={{display:"flex",alignItems:"center",gap:9,padding:"10px 12px"}}>
      <span style={{width:28,height:28,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#05060B",background:color||PC.cian}}>{handle.slice(0,2).toUpperCase()}</span>
      <div style={{minWidth:0,flex:1}}>
        <div style={{fontSize:12.5,fontWeight:600,color:PC.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>@{handle}</div>
        <div style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".14em",textTransform:"uppercase",color:PC.tx4}}>{type==="historia"?"Historia":vertical?"Reel":"Publicación"}</div>
      </div>
      <span style={{color:PC.tx4,fontSize:15,letterSpacing:1,flexShrink:0}}>···</span>
    </div>
    {/* El marco lleva la proporción real de Instagram (1:1 en feed, 9:16 en reel/historia) vía
        aspectRatio, y el medio va SIEMPRE con `contain`: el cliente juzga el encuadre, así que
        recortar para llenar la caja —lo que hacía `cover` en feed— le enseñaría algo que no es.
        El zoom a pantalla completa se abre solo tocando una IMAGEN; en video no, para que pulsar
        ▶ o 🔇 dentro del preview no dispare también el visor (sus botones solo frenan el
        pointerdown, no el click, que llegaba hasta aquí). */}
    <div onClick={file&&isImg(file)?()=>openZoom(files&&files.length?files:[file],0):undefined}
      style={{aspectRatio:vertical?"9 / 16":"1 / 1",background:"#07090c",cursor:file&&isImg(file)?"zoom-in":"default",position:"relative"}}>
      {/* Envoltorio absoluto: da altura DEFINIDA al media. Sin esto, DeckMedia usa height:100%
          contra un padre con aspect-ratio (altura "indefinida" para %), el 100% no resolvía y el
          marco colapsaba al alto natural de la imagen — un reel horizontal en vez de 9:16. */}
      <div style={{position:"absolute",inset:0}}>
        <DeckMedia f={file} h={"100%"} fit="contain"/>
      </div>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"11px 12px 7px"}}>
      <IgIco d={IG_ICO.like} c={PC.tx2}/>
      <IgIco d={IG_ICO.comment} c={PC.tx2}/>
      <IgIco d={IG_ICO.send} c={PC.tx2}/>
      <span style={{marginLeft:"auto",display:"flex"}}><IgIco d={IG_ICO.save} c={PC.tx2}/></span>
    </div>
    <div style={{padding:"0 12px 6px",fontSize:12.5,lineHeight:1.5,color:PC.tx2,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
      <span style={{fontWeight:700,color:PC.tx}}>{handle}</span>{" "}
      {txt
        ? <React.Fragment>{corta?txt.slice(0,IG_CORTE):txt}{corta&&<span onClick={()=>sAbierto(true)} style={{color:PC.tx4,cursor:"pointer"}}>… más</span>}</React.Fragment>
        : <span style={{color:PC.tx5}}>El texto que escribas abajo aparecerá aquí.</span>}
    </div>
    <div style={{padding:"0 12px 12px",fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".1em",textTransform:"uppercase",color:PC.tx5}}>
      {fecha?fechaDia(fecha)+(hora?" · "+hora:""):"Sin fecha"}
    </div>
  </div>);
}

// Banco de aprobados + calendario. En PC se arrastra; en móvil el drag&drop HTML5 no
// dispara con el dedo, así que el mismo flujo funciona tocando la pieza y luego el día.
function PlanBoard({items,onSchedule,onUnschedule,isMob,coColor,cuenta,co}){
  const[view,sView]=useState("semana");
  const[wkOff,sWkOff]=useState(0);
  const[cM,sCM]=useState(new Date().getMonth());
  const[cY,sCY]=useState(new Date().getFullYear());
  const[sel,sSel]=useState(null);
  const[dragId,sDragId]=useState(null);
  const[overDay,sOverDay]=useState(null);
  const[overBank,sOverBank]=useState(false);
  const[modal,sModal]=useState(null);

  const bank=useMemo(()=>items.filter(t=>!t.date&&t.state!=="publicado"),[items]);
  const byDay=useMemo(()=>{
    const m={};
    items.forEach(t=>{if(t.date){(m[t.date]=m[t.date]||[]).push(t);}});
    Object.values(m).forEach(a=>a.sort((x,y)=>(x.publishTime||"99:99").localeCompare(y.publishTime||"99:99")));
    return m;
  },[items]);

  const wkDays=useMemo(()=>{
    const now=new Date();now.setDate(now.getDate()+wkOff*7);
    const dow=now.getDay(),mon=dow===0?6:dow-1;
    const start=new Date(now);start.setDate(start.getDate()-mon);
    const today=new Date(),out=[];
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);
      out.push({ds:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),day:d.getDate(),month:MO[d.getMonth()],name:["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"][i],short:["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"][i],isToday:d.toDateString()===today.toDateString()});}
    return out;
  },[wkOff]);

  const mCells=useMemo(()=>{
    const first=new Date(cY,cM,1).getDay(),off=first===0?6:first-1;
    const dim=new Date(cY,cM+1,0).getDate(),c=[];
    for(let i=0;i<off;i++)c.push(null);
    for(let i=1;i<=dim;i++)c.push({day:i,ds:cY+"-"+String(cM+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")});
    return c;
  },[cM,cY]);

  const openFor=(id,ds)=>{
    const t=items.find(x=>String(x.id)===String(id));
    if(!t)return; // publicadas ahora TAMBIÉN abren el drawer (para ver estadísticas + chat)
    sSel(null);
    sModal({id:t.id,title:t.title,type:t.type,file:t.files&&t.files[0],files:t.files||[],date:ds,caption:t.caption||"",time:t.publishTime||"",wasScheduled:!!t.date,plannedDay:t.plannedDay||null,autoComentario:!!t.autoComentario,autoEstado:t.autoEstado||null,state:t.state,socialPost:t.socialPost||null});
  };

  // El id viaja en el dataTransfer, no en el estado de React: entre dragstart y drop
  // puede no haber re-render, y entonces el handler del drop seguiría viendo dragId=null.
  const draggedId=e=>{
    let id="";try{id=e.dataTransfer.getData("text/plain")||"";}catch(_){}
    return id!==""?id:dragId;
  };

  const dayProps=ds=>({
    onDragOver:e=>{e.preventDefault();if(overDay!==ds)sOverDay(ds);},
    onDragLeave:()=>sOverDay(o=>o===ds?null:o),
    onDrop:e=>{e.preventDefault();sOverDay(null);const id=draggedId(e);if(id!=null&&id!=="")openFor(id,ds);sDragId(null);},
    onClick:()=>{if(sel!=null)openFor(sel,ds);},
  });

  const pieceProps=t=>({
    draggable:!isMob&&t.state!=="publicado",
    onDragStart:e=>{sDragId(t.id);try{e.dataTransfer.setData("text/plain",String(t.id));e.dataTransfer.effectAllowed="move";}catch(_){}},
    onDragEnd:()=>{sDragId(null);sOverDay(null);sOverBank(false);},
  });

  const confirmModal=()=>{
    if(!modal)return;
    onSchedule(modal.id,{date:modal.date,publishTime:modal.time||null,caption:(modal.caption||"").trim()});
    sModal(null);
  };

  const selTask=sel!=null?items.find(t=>String(t.id)===String(sel)):null;

  // Chip de una pieza ya agendada dentro de un día
  const chip=t=>(<span key={t.id} {...pieceProps(t)}
    onClick={ev=>{ev.stopPropagation();openFor(t.id,t.date);}}
    title={t.title+(t.publishTime?" · "+t.publishTime:"")}
    style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:10,background:(TT[t.type]?.c||"#999")+"14",border:"1px solid "+(TT[t.type]?.c||"#999")+"2e",borderLeft:"3px solid "+(TT[t.type]?.c||"#999"),cursor:"pointer",opacity:dragId===t.id?.4:1,overflow:"hidden"}}>
    <span style={{position:"relative",width:26,height:26,flexShrink:0,borderRadius:6,background:PC.panel,border:"1px solid rgba(255,255,255,.1)",overflow:"hidden",display:"inline-flex"}}>
      {t.files&&t.files[0]&&isImg(t.files[0])
        ? <img src={fSrc(t.files[0])} alt="" draggable={false} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        : <span style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>{TT[t.type]?.i}</span>}
    </span>
    <span style={{fontSize:12.5,fontWeight:600,color:TT[t.type]?.c,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",minWidth:0}}>{t.title}</span>
    {t.publishTime&&<span style={{fontFamily:"var(--font-mono)",fontSize:11,color:PC.tx4,flexShrink:0}}>{t.publishTime}</span>}
    {t.state==="publicado"&&<span style={{marginLeft:"auto",flexShrink:0,display:"flex"}}><Ic n="check" s={12} c={TT[t.type]?.c}/></span>}
  </span>);

  const rango=view==="semana"
    ? `${wkDays[0]?.day}–${wkDays[6]?.day} ${wkDays[0]?.month}`
    : `${MO[cM]} ${cY}`;

  return(<div>
    {/* BANCO — listo para agendar */}
    <div style={{...PC_MARCO,marginBottom:22}}>
      <div onDragOver={e=>{e.preventDefault();sOverBank(true);}} onDragLeave={()=>sOverBank(false)}
        onDrop={e=>{e.preventDefault();sOverBank(false);const id=draggedId(e);if(id!=null&&id!==""){const t=items.find(x=>String(x.id)===String(id));if(t&&t.date)onUnschedule(t.id);}sDragId(null);}}
        style={{...PC_CARD,padding:"18px 20px 20px",borderColor:overBank?"rgba(111,231,242,.45)":"rgba(200,210,228,.08)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:bank.length?14:0,flexWrap:"wrap"}}>
          <span style={{display:"flex",alignItems:"center",gap:8,fontSize:14,fontWeight:600}}>
            <Ic n="tasks" s={15} c={PC.cian}/>
            <span>Listo para agendar ({bank.length})</span>
          </span>
          <span style={{fontSize:11.5,color:PC.tx4}}>{isMob?"Toca una pieza y luego el día":"Arrastra al calendario"}</span>
        </div>
        {bank.length===0
          ? <span style={{fontSize:13,color:PC.tx4}}>No hay piezas aprobadas pendientes de agendar.</span>
          : <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {bank.map(t=>{const on=String(sel)===String(t.id);return(
                <button key={t.id} {...pieceProps(t)} onClick={()=>sSel(on?null:t.id)}
                  style={{display:"flex",flexDirection:"column",width:118,padding:0,borderRadius:14,overflow:"hidden",background:PC.panel,border:"1px solid "+(on?PC.cian:PC.line2),cursor:"pointer",textAlign:"left",fontFamily:"inherit",transform:on?"translateY(-2px)":"none",transition:"border-color .25s, transform .25s",opacity:dragId===t.id?.4:1,position:"relative"}}>
                  <div style={{position:"relative",height:86,background:"#0F1320",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
                    {t.files&&t.files[0]
                      ? <DeckMedia f={t.files[0]} h={86} fit="cover"/>
                      : <span style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".2em",textTransform:"uppercase",color:"rgba(244,242,237,.75)"}}>{TT[t.type]?.l}</span>}
                    {t.files&&t.files[0]&&<ZoomBtn files={t.files} style={{top:5,left:"auto",right:5,width:22,height:22}}/>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:3,padding:"9px 11px 11px"}}>
                    <span style={{fontSize:10.5,fontWeight:600,color:TT[t.type]?.c}}>{TT[t.type]?.l}</span>
                    <span style={{fontSize:11.5,color:PC.tx2,lineHeight:1.35,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span>
                    {t.plannedDay&&<span title={"El equipo la planificó para el "+fechaDia(t.plannedDay)} style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".04em",color:PC.tx4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Plan · {fechaDia(t.plannedDay)}</span>}
                  </div>
                </button>);})}
            </div>}
      </div>
    </div>

    {/* CONTROLES */}
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      <div style={{display:"flex",gap:3,padding:3,borderRadius:999,background:PC.panel,border:"1px solid #1E2536"}}>
        {[["semana","Semana"],["mes","Mes"]].map(([k,l])=>(
          <button key={k} onClick={()=>sView(k)} style={{padding:"6px 16px",borderRadius:999,border:"none",background:view===k?PC.cian:"transparent",color:view===k?PC.bg:PC.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>{l}</button>))}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>view==="semana"?sWkOff(w=>w-1):(cM===0?(sCM(11),sCY(cY-1)):sCM(cM-1))} style={{width:32,height:32,borderRadius:"50%",background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n="chev_l" s={15} c={PC.tx2}/></button>
        <span style={{fontFamily:"var(--font-mono)",fontSize:13,color:PC.tx2,minWidth:110,textAlign:"center"}}>{rango}</span>
        <button onClick={()=>view==="semana"?sWkOff(w=>w+1):(cM===11?(sCM(0),sCY(cY+1)):sCM(cM+1))} style={{width:32,height:32,borderRadius:"50%",background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n="chev_r" s={15} c={PC.tx2}/></button>
      </div>
    </div>

    {/* VISTA SEMANA — una fila por día, fecha en columna fija */}
    {view==="semana"&&(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {wkDays.map(wd=>{const list=byDay[wd.ds]||[];const hot=overDay===wd.ds;return(
          <div key={wd.ds} {...dayProps(wd.ds)}
            style={{display:"flex",alignItems:"stretch",borderRadius:16,overflow:"hidden",background:"linear-gradient(170deg, rgba(13,17,27,.92), rgba(6,8,14,.96))",border:"1px solid "+(hot?PC.cian:wd.isToday?"rgba(155,180,255,.45)":PC.line),cursor:sel!=null?"copy":"default",transition:"border-color .25s"}}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1,width:isMob?62:74,flexShrink:0,padding:"14px 0",borderRight:"1px solid #141928"}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".18em",color:PC.tx4}}>{wd.short}</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:21,fontWeight:600,color:wd.isToday?PC.cian:PC.tx}}>{wd.day}</span>
              <span style={{fontSize:10,color:PC.tx4}}>{wd.name}</span>
            </div>
            <div style={{flex:"1 1 auto",display:"flex",flexDirection:"column",justifyContent:"center",gap:6,padding:"12px 16px",minHeight:44,minWidth:0}}>
              {list.length===0
                ? <span style={{fontSize:12.5,color:"#4A5265"}}>{sel!=null?"Toca aquí para agendar":"Sin publicaciones"}</span>
                : list.map(t=>chip(t))}
            </div>
          </div>);})}
      </div>
    )}

    {/* VISTA MES — cada punto es una publicación */}
    {view==="mes"&&(<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}}>
        {WD.map(d=><span key={d} style={{textAlign:"center",padding:"4px 0 8px",fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",color:PC.tx4}}>{d}</span>)}
        {mCells.map((c,i)=>{
          if(!c)return <div key={"e"+i} style={{minHeight:58}}/>;
          const list=byDay[c.ds]||[];const hot=overDay===c.ds;
          const isT=new Date().getDate()===c.day&&new Date().getMonth()===cM&&new Date().getFullYear()===cY;
          return(<div key={c.ds} {...dayProps(c.ds)}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,minHeight:58,padding:"8px 2px 6px",borderRadius:12,background:"linear-gradient(170deg, rgba(13,17,27,.92), rgba(6,8,14,.96))",border:"1px solid "+(hot?PC.cian:isT?"rgba(155,180,255,.45)":PC.line),cursor:sel!=null?"copy":"default",transition:"border-color .25s"}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:13,fontWeight:600,color:isT?PC.cian:list.length?PC.tx:PC.tx4}}>{c.day}</span>
            <span style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"center"}}>
              {list.map(t=>(<span key={t.id} title={t.title+(t.publishTime?" · "+t.publishTime:"")}
                onClick={ev=>{ev.stopPropagation();openFor(t.id,t.date);}}
                style={{width:7,height:7,borderRadius:"50%",background:TT[t.type]?.c||"#999",boxShadow:"0 0 8px "+(TT[t.type]?.c||"#999")+"88",cursor:"pointer"}}/>))}
            </span>
          </div>);})}
      </div>
      <p style={{margin:"12px 0 0",fontSize:11.5,color:PC.tx4}}>Cada punto es una publicación agendada — toca Semana para ver el detalle.</p>
    </>)}

    {/* BARRA DE SELECCIÓN (flujo táctil) */}
    {selTask&&(<Portal><div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:120,padding:"11px 16px calc(11px + env(safe-area-inset-bottom, 0px))",background:"rgba(11,14,23,.96)",backdropFilter:"blur(12px)",borderTop:"1px solid "+PC.cian,display:"flex",alignItems:"center",gap:10,boxShadow:"0 -6px 24px rgba(0,0,0,.5)"}}>
      {selTask.files&&selTask.files[0]&&isImg(selTask.files[0])&&<img src={fSrc(selTask.files[0])} alt="" style={{width:34,height:34,borderRadius:8,objectFit:"cover",flexShrink:0}}/>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12.5,fontWeight:600,color:PC.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{selTask.title}</div>
        <div style={{fontSize:11,color:PC.cian}}>Ahora toca el día donde quieres publicarlo</div>
      </div>
      <button onClick={()=>sSel(null)} style={{padding:"8px 16px",borderRadius:999,background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,fontFamily:"inherit",fontSize:12.5,cursor:"pointer",flexShrink:0}}>Cancelar</button>
    </div></Portal>)}

    {/* MODAL AL SOLTAR */}
    {/* Panel lateral para armar la publicación. Se abre al soltar una pieza aprobada en un día
        del calendario (o al tocar una ya agendada), nunca por sí solo. En el teléfono no cabe
        una columna a la derecha, así que ahí sube desde abajo. */}
    {modal&&(()=>{
      const nCap=(modal.caption||"").length;
      const pasado=nCap>IG_CAPTION_MAX;
      const anclaje=isMob
        // `dvh` (viewport dinámico), NO `vh`: en iOS Safari `88vh` se mide sin la barra de
        // direcciones, así que el sheet se extendía por debajo del área visible y el final del
        // contenido + el botón quedaban cortados e inalcanzables (en el PC no pasa porque no hay
        // barra). `dvh` descuenta la barra → el sheet cabe en pantalla y el scroll llega hasta abajo.
        ? {left:0,right:0,bottom:0,maxHeight:"85dvh",borderRadius:"22px 22px 0 0",borderTop:"1px solid "+PC.line2,animation:"drawerInMob .24s ease-out backwards"}
        : {top:0,right:0,bottom:0,width:"min(430px,100%)",borderLeft:"1px solid "+PC.line2,animation:"drawerIn .24s ease-out backwards"};
      return(<Portal>
        <div onClick={()=>sModal(null)} style={{position:"fixed",inset:0,zIndex:60,background:"rgba(2,3,8,.66)",backdropFilter:"blur(6px)"}}/>
        <aside onClick={ev=>ev.stopPropagation()} style={{position:"fixed",zIndex:61,...anclaje,
          background:PC.bg,boxShadow:"0 0 60px rgba(2,3,8,.75)",display:"flex",flexDirection:"column",boxSizing:"border-box",
          paddingTop:isMob?0:"env(safe-area-inset-top, 0px)",paddingBottom:"env(safe-area-inset-bottom, 0px)"}}>

          <div style={{display:"flex",alignItems:"center",gap:12,padding:"17px 20px",borderBottom:"1px solid "+PC.line,flexShrink:0}}>
            {modal.file&&isImg(modal.file)
              ? <img src={fSrc(modal.file)} alt="" onClick={()=>openZoom(modal.file)} style={{width:44,height:44,borderRadius:11,objectFit:"cover",flexShrink:0,cursor:"zoom-in"}}/>
              : <div style={{width:44,height:44,borderRadius:11,background:PC.panel,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{TT[modal.type]?.i}</div>}
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontSize:11,fontFamily:"var(--font-mono)",letterSpacing:".14em",textTransform:"uppercase",color:PC.cian}}>{modal.state==="publicado"?"Publicación":"Armar publicación"}</div>

        </aside>
      </Portal>);
    })()}
  </div>);
}

// Estadísticas reales de Meta + comparativa + chat de IA, para ir DEBAJO del preview de Instagram
// en el drawer de la pieza (portal del cliente). Solo tiene sentido publicada; si aún no, avisa.
function PostStatsChat({co,task}){
  const [st,sSt]=useState(null);
  const [cargando,sCargando]=useState(true);
  const [abierto,sAbierto]=useState(false);
  const [msgs,sMsgs]=useState([]);
  const [preg,sPreg]=useState("");
  const [pensando,sPensando]=useState(false);
  const scroller=useRef(null);
  const igId=co?.igId;
  const cap=task.caption||task.title||"";
  const mediaId=task.socialPost?.mediaId;
  const publicado=task.state==="publicado";

  useEffect(()=>{
    if(!igId||!publicado){sCargando(false);return;}
    let vivo=true;
    API.postStats({igId,mediaId,caption:cap}).then(d=>{if(vivo){sSt(d);sCargando(false);}});
    return()=>{vivo=false;};
  },[igId,publicado,mediaId]);
  useEffect(()=>{if(scroller.current)scroller.current.scrollTop=scroller.current.scrollHeight;},[msgs,pensando]);

  const enviar=async(texto)=>{
    const q=(texto||preg).trim();if(!q||pensando)return;
    const nuevos=[...msgs,{rol:"user",texto:q}];
    sMsgs(nuevos);sPreg("");sPensando(true);
    const d=await API.postChat({igId,mediaId,caption:cap,mensajes:nuevos});
    sMsgs([...nuevos,{rol:"ia",texto:d.respuesta||("No pude responder ahora"+(d.error?": "+d.error:"")+".")}]);
    sPensando(false);
  };

  const nf=n=>(n||0).toLocaleString("es-CL");
  const t=st&&st.target;
  const esReel=st&&st.esReel;
  const tipoTxt=esReel?"reels":"posts";
  const cMult=m=>m==null?PC.tx4:m>=1.3?"#8FF2C2":m>=0.85?PC.cian:"#FF8B8B";
  const sugerencias=["¿Cómo le fue?","¿Qué puedo mejorar?","¿Por qué esos comentarios?"];
  const hayDatos=st&&st.ok&&t;

  // Pieza aún no publicada: todavía no hay métricas que mostrar.
  if(!publicado) return (
    <div style={{marginTop:16,padding:"14px 16px",borderRadius:14,background:PC.bg,border:"1px dashed "+PC.line2,fontSize:12.5,color:PC.tx3,lineHeight:1.5}}>
      📊 Cuando esta pieza se publique, aquí vas a ver <b style={{color:PC.tx2}}>cómo le fue</b> (alcance, interacciones y la comparación con tus otros posts) y vas a poder preguntarle a la IA.
    </div>);

  return(<div style={{marginTop:16,background:PC.panel,border:"1px solid "+PC.line2,borderRadius:16,overflow:"hidden"}}>
    <div style={{padding:"13px 16px 3px",fontSize:11,color:PC.tx4,textTransform:"uppercase",letterSpacing:".08em"}}>📊 Cómo le fue</div>
    {!igId?(
      <div style={{padding:"4px 16px 16px",fontSize:12.5,color:PC.tx3,lineHeight:1.5}}>Conecta tu Instagram (en Planificar) para ver las estadísticas.</div>
    ):cargando?(
      <div style={{padding:"4px 16px 18px",fontSize:12.5,color:PC.tx4}}>Cargando estadísticas…</div>
    ):!hayDatos?(
      <div style={{padding:"4px 16px 16px",fontSize:12.5,color:PC.tx3,lineHeight:1.5}}>Aún no hay datos de esta publicación{st&&st.error?" ("+st.error+")":""}. Puede tardar unas horas tras publicarse.</div>
    ):(<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:1,background:PC.line,borderTop:"1px solid "+PC.line,borderBottom:"1px solid "+PC.line,marginTop:8}}>
        {[["Alcance",t.alcance],["Interac.",t.eng],["Likes",t.likes],["Coment.",t.comentarios]].map(([l,v])=>(
          <div key={l} style={{background:PC.panel,padding:"12px 6px",textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:700,color:PC.tx}}>{nf(v)}</div>
            <div style={{fontSize:10.5,color:PC.tx4,marginTop:2}}>{l}</div>
          </div>))}
      </div>
      {st.base&&st.base.n>0&&(st.alcanceMult!=null||st.engMult!=null)&&(
        <div style={{padding:"14px 16px"}}>
          <div style={{fontSize:11,color:PC.tx4,marginBottom:9,textTransform:"uppercase",letterSpacing:".08em"}}>vs tus últimos {st.base.n} {tipoTxt}</div>
          <div style={{display:"flex",gap:10}}>
            {[["Alcance",st.alcanceMult],["Interacción",st.engMult]].map(([l,m])=>(
              <div key={l} style={{flex:1,background:PC.bg,border:"1px solid "+PC.line2,borderRadius:12,padding:"11px 12px"}}>
                <div style={{fontSize:20,fontWeight:800,color:cMult(m)}}>{m!=null?m+"×":"—"}</div>
                <div style={{fontSize:11,color:PC.tx3,marginTop:1}}>{l}{m!=null?(m>=1?" sobre":" bajo")+" tu mediana":""}</div>
              </div>))}
          </div>
        </div>)}
    </>)}

    {igId&&(
      <div style={{borderTop:"1px solid "+PC.line}}>
        <button onClick={()=>sAbierto(!abierto)} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"12px 16px",background:"transparent",border:"none",color:PC.cian,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
          🤖 Pregúntale a la IA sobre esta publicación<span style={{marginLeft:"auto",color:PC.tx4,fontSize:12}}>{abierto?"▲":"▼"}</span>
        </button>
        {abierto&&(<div style={{padding:"0 16px 16px"}}>
          <div ref={scroller} style={{maxHeight:260,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
            {msgs.length===0&&<div style={{fontSize:12.5,color:PC.tx4,lineHeight:1.5,padding:"2px 0"}}>Pregunta lo que quieras sobre cómo le fue. Responde con tus datos reales, no inventa.</div>}
            {msgs.map((m,i)=>(
              <div key={i} style={{alignSelf:m.rol==="user"?"flex-end":"flex-start",maxWidth:"85%",background:m.rol==="user"?"rgba(111,231,242,.12)":PC.bg,border:"1px solid "+(m.rol==="user"?"rgba(111,231,242,.3)":PC.line2),borderRadius:14,padding:"9px 12px",fontSize:13,color:PC.tx2,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{m.texto}</div>))}
            {pensando&&<div style={{alignSelf:"flex-start",fontSize:12.5,color:PC.tx4,padding:"4px 2px"}}>escribiendo…</div>}
          </div>
          {msgs.length===0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
            {sugerencias.map(s=><button key={s} onClick={()=>enviar(s)} disabled={pensando} style={{background:PC.bg,border:"1px solid "+PC.line2,borderRadius:999,padding:"6px 11px",fontSize:11.5,color:PC.tx3,cursor:pensando?"default":"pointer",fontFamily:"inherit"}}>{s}</button>)}
          </div>}
          <div style={{display:"flex",gap:8}}>
            <input value={preg} onChange={e=>sPreg(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")enviar();}} placeholder="Escribe tu pregunta…" disabled={pensando}
              style={{flex:1,background:PC.bg,border:"1px solid "+PC.line2,borderRadius:999,padding:"10px 14px",color:PC.tx,fontSize:13,fontFamily:"inherit",boxSizing:"border-box"}}/>
            <button onClick={()=>enviar()} disabled={pensando||!preg.trim()} style={{background:preg.trim()&&!pensando?PC.cian:PC.line2,color:preg.trim()&&!pensando?PC.bg:PC.tx4,border:"none",borderRadius:999,padding:"10px 16px",fontSize:14,fontWeight:700,cursor:preg.trim()&&!pensando?"pointer":"default",fontFamily:"inherit",flexShrink:0}}>➤</button>
          </div>
        </div>)}
      </div>)}
  </div>);
}
