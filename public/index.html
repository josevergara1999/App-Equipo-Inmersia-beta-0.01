// El plan define cuántas piezas de cada tipo entran en el mes, pero eso es un número, no una
// lista de tareas vacías: ver `saldoDe`. Subir por lote crea una pieza por archivo mientras
// quede cupo; lo que sobra se crea aparte como adicional, con un clic explícito, porque se
// factura distinto.
// ═══ DASHBOARD ══════════════════════════════════════════════════
// Paneles del rediseño 2026. Dos almacenes nuevos en Supabase:
//   · `eventos`  → hitos por marca (grabaciones, lanzamientos, campañas)
//   · `reuniones`→ agenda con asistentes, día y hora
// Carga del equipo. Vive en la sección Equipo, que es donde se gestiona a las personas.
function CargaEquipo({users,tasks}){
  const equipo=useMemo(()=>users.filter(u=>u.role!=="cliente").map(u=>{
    const asignadas=tasks.filter(t=>Array.isArray(t.responsable)?t.responsable.includes(u.id):t.responsable===u.id);
    const hechas=asignadas.filter(t=>["aprobado","publicado"].includes(t.state));
    return {...u,tot:asignadas.length,done:hechas.length,pct:asignadas.length?Math.round(hechas.length/asignadas.length*100):0};
  }),[users,tasks]);
  return(
    <div style={{marginTop:18,borderRadius:20,padding:"18px 20px 20px",background:"linear-gradient(170deg, rgba(13,17,27,.92), rgba(6,8,14,.96))",border:"1px solid "+D.line}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <span style={{fontSize:15,fontWeight:600,color:D.tx}}>Carga del equipo</span>
        <span style={{padding:"3px 9px",borderRadius:999,background:"rgba(201,191,255,.1)",border:"1px solid rgba(201,191,255,.35)",color:D.lav,fontSize:10,fontWeight:700,letterSpacing:".06em"}}>ADMIN</span>
      </div>
      <span style={{display:"block",fontSize:12,color:D.tx4,marginBottom:14}}>Completadas vs asignadas</span>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {equipo.map(q=>(
          <div key={q.id} style={{display:"flex",alignItems:"center",gap:11}}>
            <span style={{width:26,height:26,flexShrink:0,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",background:q.color||D.peri,color:D.bg,fontSize:9.5,fontWeight:700}}>{q.avatar||q.name.slice(0,2).toUpperCase()}</span>
            <div style={{display:"flex",flexDirection:"column",gap:5,flex:"1 1 auto",minWidth:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                <span style={{fontSize:12.5,fontWeight:600,color:D.tx}}>{q.name}</span>
                <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.tx3}}>{q.done}/{q.tot}</span>
              </div>
              <div style={{height:4,borderRadius:999,background:D.line,overflow:"hidden"}}>
                <div style={{height:"100%",width:q.pct+"%",borderRadius:999,background:"linear-gradient(90deg,"+D.cian+","+D.peri+")",transition:"width .4s"}}/>
              </div>
            </div>
          </div>))}
      </div>
    </div>);
}


function DashboardPg({cu,isA,tasks,sT,cos,users,stats,myTd,pDrafts,sPg,sMd2,addN,avisar,correosDe}){
  const [vista,sVista]=useState("hoy");
  const [marca,sMarca]=useState("all");
  const [eventos,sEventos]=useState([]);
  const [reus,sReus]=useState([]);
  const [evOpen,sEvOpen]=useState(false);
  const [agOpen,sAgOpen]=useState(false);
  const iniT=useRef(false);

  useEffect(()=>{DB.loadAll().then(d=>{
    if(Array.isArray(d.eventos))sEventos(d.eventos);
    if(Array.isArray(d.reuniones))sReus(d.reuniones);
    iniT.current=true;
  }).catch(()=>{iniT.current=true;});},[]);

  const guardarEventos=l=>{sEventos(l);DB.save("eventos",l);};
  const guardarReus=l=>{sReus(l);DB.save("reuniones",l);};

  const colorCo=id=>cos.find(c=>String(c.id)===String(id))?.color||D.tx4;
  const nombreCo=id=>cos.find(c=>String(c.id)===String(id))?.name||"General";
  const hoyDs=td();
  const fmtDia=ds=>{const [y,m,d]=String(ds||"").split("-").map(Number);return new Date(y||1970,(m||1)-1,d||1);};

  // ── Panel Hoy / Semana ──────────────────────────────────────────
  const hoyItems=useMemo(()=>tasks.filter(t=>t.date===hoyDs).sort((a,b)=>(a.publishTime||"99").localeCompare(b.publishTime||"99")),[tasks,hoyDs]);
  const semDias=useMemo(()=>{
    const out=[],base=new Date();
    for(let i=0;i<7;i++){
      const d=new Date(base);d.setDate(base.getDate()+i);
      const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      out.push({ds,num:d.getDate(),abbr:["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"][d.getDay()],esHoy:ds===hoyDs,
        items:tasks.filter(t=>t.date===ds).sort((a,b)=>(a.publishTime||"99").localeCompare(b.publishTime||"99"))});
    }
    return out;
  },[tasks,hoyDs]);

  const toggleHecha=t=>{
    const done=["aprobado","publicado"].includes(t.state);
    sT(p=>p.map(x=>{
      if(x.id!==t.id)return x;
      // Marcar como aprobado desde aquí deja la pieza IGUAL que el flujo real: sin fecha (para
      // que caiga en el banco «Listo para agendar» del cliente) y con el día del equipo guardado
      // en plannedDay como recomendación. Al des-marcar, se recupera ese día como fecha.
      return done
        ? {...x,state:"en_proceso",date:x.date||x.plannedDay||null}
        : {...x,state:"aprobado",date:null,publishTime:null,plannedDay:x.plannedDay||x.date||null};
    }));
  };

  // ── Eventos ─────────────────────────────────────────────────────
  const evFiltrados=useMemo(()=>eventos
    .filter(e=>marca==="all"||String(e.companyId)===String(marca))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"")),[eventos,marca]);

  const [evF,sEvF]=useState({title:"",detail:"",companyId:"",date:td(),hours:"",attendees:[]});
  const togAsistenteEv=id=>sEvF(f=>({...f,attendees:f.attendees.includes(id)?f.attendees.filter(x=>x!==id):[...f.attendees,id]}));
  const crearEvento=()=>{
    if(!evF.title.trim())return addN("❌ Ponle un nombre al evento");
    const co=cos.find(c=>String(c.id)===String(evF.companyId));
    const nuevo={id:Date.now(),title:evF.title.trim(),detail:evF.detail.trim(),companyId:evF.companyId||(cos[0]?.id||""),
      date:evF.date,hours:evF.hours.split(",").map(h=>h.trim()).filter(Boolean),attendees:evF.attendees};
    guardarEventos([...eventos,nuevo]);
    const destino=conAdmins(users.filter(u=>evF.attendees.includes(u.id)));
    if(avisar&&destino.length)avisar({type:"evento",title:"📌 Evento agendado",
      body:nuevo.title+(co?" · "+co.name:"")+" — "+nuevo.date+(nuevo.hours.length?" "+nuevo.hours.join(", "):""),
      to:correosDe(destino),url:"/"});
    sEvF({title:"",detail:"",companyId:"",date:td(),hours:"",attendees:[]});sEvOpen(false);
    addN("📌 Evento agendado");
  };
  const borrarEvento=id=>guardarEventos(eventos.filter(e=>e.id!==id));

  // ── Carga del equipo ────────────────────────────────────────────
  const equipo=useMemo(()=>users.filter(u=>u.role!=="cliente").map(u=>{
    const asignadas=tasks.filter(t=>Array.isArray(t.responsable)?t.responsable.includes(u.id):t.responsable===u.id);
    const hechas=asignadas.filter(t=>["aprobado","publicado"].includes(t.state));
    return {...u,tot:asignadas.length,done:hechas.length,pct:asignadas.length?Math.round(hechas.length/asignadas.length*100):0};
  }),[users,tasks]);

  // Reuniones y eventos: además de los que se apuntan, siempre los admins. Se juntan en
  // UNA sola lista deduplicada por id, así el admin que además va a la reunión recibe un
  // aviso, no dos.
  const conAdmins=gente=>otrosQueYo([...new Map([...gente,...users.filter(u=>u.role==="admin")].map(u=>[u.id,u])).values()],cu);

  // ── Agenda de reuniones ─────────────────────────────────────────
  const [agF,sAgF]=useState({title:"",companyId:"",date:td(),time:"10:00",attendees:[],minutos:60,conMeet:true,extra:""});
  const [agBusy,sAgBusy]=useState(false);
  const [gcalSt,sGcalSt]=useState(null);
  useEffect(()=>{API.gcalStatus().then(sGcalSt).catch(()=>{});},[]);
  const proximas=useMemo(()=>reus.filter(r=>r.date>=hoyDs).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),[reus,hoyDs]);
  // Agendar es tres cosas a la vez: guardar la reunión, avisarle a la gente dentro de la
  // app y crear el evento en Google Calendar con enlace de Meet — que es lo que dispara la
  // invitación por correo a cada invitado.
  const crearReunion=async()=>{
    if(!agF.title.trim())return addN("❌ Ponle un tema a la reunión");
    if(!agF.attendees.length)return addN("❌ Elige al menos una persona");
    sAgBusy(true);
    const co=cos.find(c=>String(c.id)===String(agF.companyId));
    const gente=users.filter(u=>agF.attendees.includes(u.id));
    const sueltos=agF.extra.split(/[,;\s]+/).map(e=>e.trim()).filter(e=>e.includes("@"));
    const invitados=[...new Set([...gente.map(u=>u.gmail||u.email),...sueltos].filter(e=>e&&e.includes("@")))];
    const id=Date.now();
    const cuando=agF.date+" a las "+agF.time;

    let meet=null;
    if(agF.conMeet){
      const r=await API.gcalMeeting({
        title:agF.title.trim()+(co?" · "+co.name:""),
        // La invitación sale a nombre de INMERSIA, así que se deja por escrito quién la
        // agendó: si no, nadie sabe a quién preguntarle.
        description:"Reunión agendada desde INMERSIA"+(cu?.name?" por "+cu.name:"")+"."+(co?"\nEmpresa: "+co.name:""),
        date:agF.date,time:agF.time,minutos:agF.minutos,invitados,
      });
      if(r.ok)meet=r;
      else addN(r.needsConnect?("⚠️ Reunión guardada, pero falta conectar el Calendar de "+r.organizador+" para mandar las invitaciones"):("⚠️ Reunión guardada, pero Google falló: "+(r.msg||"error")));
    }

    guardarReus([...reus,{id,...agF,title:agF.title.trim(),companyId:agF.companyId||"",
      meetLink:meet?.meetLink||"",eventId:meet?.eventId||"",invitados}]);

    const destino=conAdmins(gente);
    if(avisar&&destino.length){
      avisar({type:"reunion",title:"🗓 Reunión agendada",
        body:agF.title.trim()+(co?" · "+co.name:"")+" — "+cuando+(meet?.meetLink?" · con Meet":""),
        to:correosDe(destino),url:meet?.meetLink||"/",important:true});
    }

    sAgF({title:"",companyId:"",date:td(),time:"10:00",attendees:[],minutos:60,conMeet:true,extra:""});
    sAgOpen(false);sAgBusy(false);
    addN(meet?.meetLink?"🗓 Reunión agendada e invitaciones enviadas":"🗓 Reunión agendada");
  };
  const borrarReunion=id=>guardarReus(reus.filter(r=>r.id!==id));
  const togAsistente=id=>sAgF(f=>({...f,attendees:f.attendees.includes(id)?f.attendees.filter(x=>x!==id):[...f.attendees,id]}));

  const rechazadas=useMemo(()=>tasks.filter(t=>t.clientApproval?.status==="rechazado"&&t.state==="en_proceso"),[tasks]);
  const eventosProximos=useMemo(()=>eventos.filter(e=>(e.date||"")>=hoyDs),[eventos,hoyDs]);
  const label={fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4};
  const campo={padding:"11px 13px",borderRadius:11,background:D.bg,border:"1px solid "+D.line2,color:D.tx,fontFamily:"inherit",fontSize:13.5,outline:"none",width:"100%",boxSizing:"border-box"};

  return(<div className="d-in">
    {/* HERO */}
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:16,flexWrap:"wrap",marginBottom:26}}>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <span style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".22em",textTransform:"uppercase",color:D.tx4}}>{new Date().getHours()<12?"Buen día":new Date().getHours()<19?"Buenas tardes":"Buenas noches"}, {cu.name}</span>
        <span style={{fontSize:30,fontWeight:600,letterSpacing:"-.02em",lineHeight:1.1,color:D.tx}}>Tienes <span style={{color:D.cian}}>{myTd.length}</span> tareas hoy</span>
        <span style={{fontSize:13,color:D.tx3}}>{stats.apr} esperan aprobación · {stats.pen} por agendar</span>
      </div>
    </div>

    {/* ALERTAS */}
    {rechazadas.map(t=>(
      <div key={t.id} onClick={()=>sMd2(t)} className="d-in" style={{cursor:"pointer",padding:"14px 16px",marginBottom:10,borderRadius:14,background:"rgba(255,107,107,.05)",border:"1px solid rgba(255,107,107,.35)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Ic n="alert" s={16} c={D.rojo}/><span style={{fontSize:13.5,fontWeight:700,color:D.rojo}}>Rechazado por {t.clientApproval.by}</span></div>
        <div style={{fontSize:13,fontWeight:500,color:D.tx}}>{t.title}</div>
        {t.clientApproval.comment&&<div style={{fontSize:12,color:D.tx2,background:D.panel,padding:"8px 10px",borderRadius:9,marginTop:6,lineHeight:1.5}}>«{t.clientApproval.comment}»</div>}
      </div>))}
    {pDrafts.filter(d=>d.status==="pending").map(d=>(
      <div key={d.id} onClick={()=>sPg("planner")} className="d-in" style={{cursor:"pointer",padding:"14px 16px",marginBottom:10,borderRadius:14,background:"rgba(201,191,255,.05)",border:"1px solid rgba(201,191,255,.35)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><Ic n="planner" s={16} c={D.lav}/><span style={{fontSize:13.5,fontWeight:700,color:D.lav}}>Cambios pendientes de {d.companyName}</span></div>
        <div style={{fontSize:12,color:D.tx3}}>Enviado por {d.clientName} · {new Date(d.date).toLocaleDateString()}</div>
      </div>))}

    {/* FILA RESUMEN */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:18}}>
      {[
        {tag:"Hoy",n:myTd.length,desc:"agendadas para hoy",col:D.cian,ir:()=>sPg("planner")},
        {tag:"Esperando",n:stats.apr,desc:"esperando aprobación",col:D.peri,ir:()=>sPg("contenido")},
        // Rechazado: lo único que exige acción inmediata del equipo, así que se ilumina
        // y late. Si no hay ninguno, queda apagada como el resto.
        {tag:"Rechazado",n:rechazadas.length,desc:"rechazados por el cliente",col:D.rojo,ir:()=>sPg("contenido"),luz:rechazadas.length>0},
        {tag:"Eventos",n:eventosProximos.length,desc:"eventos próximos",col:D.lav,ir:()=>{}},
      ].map((st,i)=>(
        <div key={i} style={{position:"relative",overflow:"hidden",borderRadius:17,padding:st.luz?1.5:1,background:st.luz?"transparent":D.line}}>
          {st.luz&&<span className="halo halo-rojo"/>}
          <button onClick={st.ir} className="d-hov" style={{position:"relative",width:"100%",height:"100%",boxSizing:"border-box",display:"flex",flexDirection:"column",gap:10,padding:"16px 18px",borderRadius:16,background:"linear-gradient(170deg,#0D111B,#06080E)",border:"1px solid "+(st.luz?"transparent":D.line),cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:st.col,boxShadow:"0 0 10px "+st.col+"aa",flexShrink:0}}/>
              <span style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".14em",textTransform:"uppercase",color:D.tx4,whiteSpace:"nowrap"}}>{st.tag}</span>
            </div>
            <span style={{fontFamily:"var(--font-mono)",fontSize:30,fontWeight:600,color:st.col,lineHeight:1,animation:st.luz?"pulseFade 2s ease-in-out infinite":"none"}}>{st.n}</span>
            <span style={{fontSize:12,color:D.tx3}}>{st.desc}</span>
          </button>
        </div>))}
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:18,alignItems:"start"}}>
      {/* ── HOY / SEMANA ── */}
      <div style={{position:"relative",overflow:"hidden",borderRadius:24,padding:5,background:"linear-gradient(160deg, rgba(200,210,228,.28), rgba(200,210,228,.05) 45%, rgba(155,180,255,.18))"}}>
        <span className="halo halo-cian"/>
        <div style={{position:"relative",borderRadius:20,padding:"18px 20px 20px",background:"linear-gradient(170deg,#0D111B,#06080E)",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:14}}>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span style={{fontSize:15,fontWeight:600,color:D.tx}}>{vista==="hoy"?"Hoy":"Esta semana"}</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.tx4}}>{vista==="hoy"?new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"}):"Próximos 7 días"}</span>
            </div>
            <button onClick={()=>sVista(v=>v==="hoy"?"semana":"hoy")} style={{display:"flex",alignItems:"center",gap:7,padding:"8px 16px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
              <Ic n="calendar" s={13} c={D.tx2}/>{vista==="hoy"?"Ver semana":"Ver hoy"}
            </button>
          </div>

          {vista==="hoy"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {hoyItems.length===0&&<span style={{fontSize:12.5,color:D.tx5,padding:"10px 2px"}}>Nada agendado para hoy.</span>}
            {hoyItems.map(t=>{const done=["aprobado","publicado"].includes(t.state);return(
              <button key={t.id} onClick={()=>toggleHecha(t)} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",borderRadius:12,background:D.panel,border:"1px solid "+D.line3,borderLeft:"3px solid "+(TT[t.type]?.c||D.tx4),cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                <span style={{width:19,height:19,flexShrink:0,borderRadius:6,display:"inline-flex",alignItems:"center",justifyContent:"center",background:done?D.cian:"transparent",border:"1px solid "+(done?D.cian:D.line2)}}>
                  {done&&<Ic n="check" s={12} c={D.bg}/>}
                </span>
                <span style={{fontFamily:"var(--font-mono)",fontSize:11.5,color:done?D.tx5:D.tx3,width:44,flexShrink:0,textDecoration:done?"line-through":"none"}}>{t.publishTime||"—"}</span>
                <span style={{fontSize:13,fontWeight:500,flex:"1 1 auto",minWidth:0,color:done?D.tx4:D.tx,textDecoration:done?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span>
                <span style={{padding:"3px 10px",borderRadius:999,background:colorCo(t.companyId)+"1a",border:"1px solid "+colorCo(t.companyId)+"59",color:colorCo(t.companyId),fontSize:11,fontWeight:600,flexShrink:0,opacity:done?.5:1}}>{nombreCo(t.companyId)}</span>
              </button>);})}
          </div>}

          {vista==="semana"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {semDias.map(d=>(
              <div key={d.ds} style={{display:"flex",gap:13,padding:"11px 14px",borderRadius:14,background:D.panel,border:"1px solid "+(d.esHoy?"rgba(111,231,242,.4)":D.line3)}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,width:40,flexShrink:0,paddingTop:2}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".14em",color:d.esHoy?D.cian:D.tx4}}>{d.abbr}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:19,fontWeight:600,color:d.esHoy?D.cian:D.tx}}>{d.num}</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6,flex:"1 1 auto",minWidth:0,justifyContent:"center"}}>
                  {d.items.length===0
                    ? <span style={{fontSize:11.5,color:D.tx5,padding:"6px 2px"}}>Sin nada programado</span>
                    : d.items.map(t=>(
                      <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:8,background:(TT[t.type]?.c||D.tx4)+"12",borderLeft:"3px solid "+(TT[t.type]?.c||D.tx4)}}>
                        <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,color:D.tx3,width:40,flexShrink:0}}>{t.publishTime||"—"}</span>
                        <span style={{fontSize:12.5,fontWeight:500,color:D.tx,flex:"1 1 auto",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</span>
                        <span style={{fontSize:10.5,fontWeight:600,color:colorCo(t.companyId),flexShrink:0}}>{nombreCo(t.companyId)}</span>
                      </div>))}
                </div>
              </div>))}
          </div>}
        </div>
      </div>

      {/* ── EVENTOS POR MARCA ── */}
      <div style={{borderRadius:22,padding:5,background:"linear-gradient(160deg, rgba(200,210,228,.28), rgba(200,210,228,.05) 45%, rgba(155,180,255,.18))"}}>
        <div style={{borderRadius:18,padding:"18px 20px 20px",background:"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)"}}>
          <span style={{fontSize:15,fontWeight:600,color:D.tx,display:"block",marginBottom:12}}>Eventos por marca</span>
          <div style={{...dGrupo,width:"fit-content",marginBottom:14,flexWrap:"wrap"}}>
            <button onClick={()=>sMarca("all")} style={dPill(marca==="all")}>Todas</button>
            {cos.map(c=><button key={c.id} onClick={()=>sMarca(String(c.id))} style={dPill(String(marca)===String(c.id),c.color)}>{c.name}</button>)}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {evFiltrados.length===0&&<span style={{fontSize:12.5,color:D.tx5,padding:"6px 2px"}}>Sin eventos agendados.</span>}
            {evFiltrados.map(ev=>{const esHoy=ev.date===hoyDs;const f=fmtDia(ev.date);return(
              <div key={ev.id} style={{position:"relative",display:"flex",gap:13,padding:"12px 14px",borderRadius:14,background:D.panel,border:"1px solid "+(esHoy?"rgba(111,231,242,.45)":D.line3),borderLeft:"3px solid "+colorCo(ev.companyId),overflow:"hidden"}}>
                {esHoy&&<span style={{position:"absolute",inset:0,borderRadius:14,background:"linear-gradient(270deg, rgba(111,231,242,.2), rgba(111,231,242,.05) 50%, transparent)",animation:"pulseFade 1.6s ease-in-out infinite",pointerEvents:"none"}}/>}
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1,width:40,flexShrink:0,position:"relative"}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".14em",color:D.tx4}}>{MO[f.getMonth()].slice(0,3).toUpperCase()}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:19,fontWeight:600,color:colorCo(ev.companyId)}}>{f.getDate()}</span>
                  <span style={{fontSize:9.5,color:D.tx4}}>{["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"][f.getDay()]}</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:0,flex:1,position:"relative"}}>
                  <span style={{fontSize:13.5,fontWeight:600,color:D.tx}}>{ev.title}</span>
                  {ev.detail&&<span style={{fontSize:11.5,color:D.tx3,lineHeight:1.45}}>{ev.detail}</span>}
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:2}}>
                    {(ev.hours||[]).map((h,i)=><span key={i} style={{padding:"3px 9px",borderRadius:999,background:"rgba(200,210,228,.06)",border:"1px solid "+D.line2,fontFamily:"var(--font-mono)",fontSize:10.5,color:D.tx2}}>{h}</span>)}
                  </div>
                </div>
                <button onClick={()=>borrarEvento(ev.id)} title="Quitar" style={{position:"relative",background:"transparent",border:"none",color:D.tx4,cursor:"pointer",flexShrink:0,alignSelf:"flex-start"}}><Ic n="x" s={14} c={D.tx4}/></button>
              </div>);})}
          </div>

          {!evOpen
            ? <button onClick={()=>sEvOpen(true)} style={{marginTop:12,width:"100%",padding:10,borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>+ Agendar evento</button>
            : <div className="d-in" style={{marginTop:12,borderRadius:16,background:D.panel,border:"1px solid "+D.line3,padding:16,display:"flex",flexDirection:"column",gap:12}}>
                <input value={evF.title} onChange={e=>sEvF({...evF,title:e.target.value})} placeholder="¿Qué evento es?" style={{...campo,fontWeight:600}}/>
                <input value={evF.detail} onChange={e=>sEvF({...evF,detail:e.target.value})} placeholder="Detalle (opcional)" style={campo}/>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  <span style={label}>Marca</span>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {cos.map(c=>{const on=String(evF.companyId)===String(c.id);return(
                      <button key={c.id} onClick={()=>sEvF({...evF,companyId:String(c.id)})} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"7px 13px",borderRadius:999,background:on?c.color+"1a":"transparent",border:"1px solid "+(on?c.color+"73":D.line2),color:on?c.color:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                        <span style={{width:7,height:7,borderRadius:"50%",background:c.color}}/>{c.name}
                      </button>);})}
                  </div>
                </div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <div style={{display:"flex",flexDirection:"column",gap:7,flex:1,minWidth:150}}>
                    <span style={label}>Día</span>
                    <input type="date" value={evF.date} onChange={e=>sEvF({...evF,date:e.target.value})} style={{...campo,colorScheme:"dark",fontFamily:"var(--font-mono)",fontSize:12}}/>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:7,flex:1,minWidth:150}}>
                    <span style={label}>Horas</span>
                    <input value={evF.hours} onChange={e=>sEvF({...evF,hours:e.target.value})} placeholder="10:00, 15:30" style={{...campo,fontFamily:"var(--font-mono)",fontSize:12}}/>
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  <span style={label}>Quiénes van</span>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {users.filter(u=>u.role!=="cliente").map(u=>{const on=evF.attendees.includes(u.id);return(
                      <button key={u.id} onClick={()=>togAsistenteEv(u.id)} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"6px 12px 6px 7px",borderRadius:999,background:on?"rgba(111,231,242,.1)":"transparent",border:"1px solid "+(on?"rgba(111,231,242,.45)":D.line2),color:on?D.cian:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                        <span style={{width:20,height:20,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",background:u.color||D.peri,color:D.bg,fontSize:8.5,fontWeight:700}}>{u.avatar||u.name.slice(0,2).toUpperCase()}</span>
                        {u.name}
                      </button>);})}
                  </div>
                  <span style={{fontSize:11.5,color:D.tx4}}>A los que marques les llega el aviso ahora, la mañana del evento y una hora antes.</span>
                </div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button onClick={()=>sEvOpen(false)} style={{padding:"9px 16px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={crearEvento} style={{padding:"9px 20px",borderRadius:999,background:D.cian,border:"1px solid "+D.cian,color:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>Agendar</button>
                </div>
              </div>}
        </div>
      </div>
    </div>

    {/* ── AGENDA DE REUNIONES ── */}
    <div style={{marginTop:24,...D_MARCO}}>
      <div style={{...D_CARD,padding:"20px 22px 22px"}}>
        <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:12,flexWrap:"wrap",marginBottom:16}}>
          <div style={{display:"flex",flexDirection:"column",gap:3}}>
            <span style={{fontSize:18,fontWeight:700,color:D.tx}}>Agenda de reuniones</span>
            <span style={{fontSize:12,color:D.tx3}}>Crea una reunión y define quiénes van, el día y la hora.</span>
          </div>
          <span style={{padding:"4px 12px",borderRadius:999,background:"rgba(111,231,242,.06)",border:"1px solid rgba(111,231,242,.35)",color:D.cian,fontFamily:"var(--font-mono)",fontSize:10.5,letterSpacing:".1em",textTransform:"uppercase"}}>{proximas.length} próximas</span>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {!agOpen
            ? <button onClick={()=>sAgOpen(true)} style={{padding:"15px 18px",borderRadius:14,background:"transparent",border:"1px dashed "+D.line2,color:D.tx3,fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer",textAlign:"left"}}>+ Nueva reunión</button>
            : <div className="d-in" style={{borderRadius:16,background:D.panel,border:"1px solid "+D.line3,padding:16,display:"flex",flexDirection:"column",gap:14}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                  <span style={{fontSize:13.5,fontWeight:700,color:D.tx}}>Nueva reunión</span>
                  <button onClick={()=>sAgOpen(false)} title="Achicar" style={{width:28,height:28,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"1px solid "+D.line2,color:D.tx3,cursor:"pointer",fontFamily:"inherit",fontSize:11}}>▴</button>
                </div>
                <input value={agF.title} onChange={e=>sAgF({...agF,title:e.target.value})} placeholder="¿De qué es la reunión?" style={{...campo,fontWeight:600}}/>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  <span style={label}>Empresa</span>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {cos.map(c=>{const on=String(agF.companyId)===String(c.id);return(
                      <button key={c.id} onClick={()=>sAgF({...agF,companyId:on?"":String(c.id)})} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"7px 13px",borderRadius:999,background:on?c.color+"1a":"transparent",border:"1px solid "+(on?c.color+"73":D.line2),color:on?c.color:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                        <span style={{width:7,height:7,borderRadius:"50%",background:c.color}}/>{c.name}
                      </button>);})}
                  </div>
                </div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>

function CadenaBuilder({flujo,pubs,onChange,onCerrar,onGuardar,guardando}){
  const [pan,sPan]=useState({x:-180,y:20});
  const [drag,sDrag]=useState(null);
  const [panDrag,sPanDrag]=useState(null);
  const [sel,sSel]=useState(null);
  const [saved,sSaved]=useState(false);
  // Publicación sobre la que está el ratón en el selector, con el sitio que ocupa en pantalla.
  // Las miniaturas caben tres por fila y a ese tamaño no se distingue una de otra; el preview
  // grande es la única forma de saber cuál estás eligiendo.
  const [prevPub,sPrevPub]=useState(null);
  const [zoom,sZoom]=useState(1);
  const lienzoRef=useRef(null);
  const pinchRef=useRef(null);
  const tapRef=useRef({id:null,t:0,movido:false});
  const tRef=useRef(null);
  useEffect(()=>()=>clearTimeout(tRef.current),[]);

  // El constructor se queda donde está, pero se sale de los dos contenedores de 1120 px que lo
  // estrechaban: crece hasta el borde de la ventana **solo hacia abajo y hacia la derecha**,
  // desde su propia esquina. Así la barra de arriba y el menú de la izquierda siguen a la vista
  // y se pueden usar sin cerrar la cadena.
  //
  // Se mide en vez de calcularse con números fijos: el hueco que queda a la derecha depende del
  // ancho del menú lateral, del padding del shell y de si es móvil, y cualquier constante
  // escrita aquí se rompería al tocar cualquiera de las tres. `clientWidth` y no `innerWidth`,
  // que incluye la barra de desplazamiento y dejaría el lienzo asomando por la derecha.
  const cajaRef=useRef(null);
  const [caja,sCaja]=useState(null);
  // Mismo corte que el resto de la app (`isMob`, 768 px), para que el constructor no tenga su
  // propia idea de qué es un teléfono.
  const [movil,sMovil]=useState(()=>window.innerWidth<768);
  useEffect(()=>{
    const medir=()=>{
      sMovil(window.innerWidth<768);
      const el=cajaRef.current;if(!el)return;
      const r=el.getBoundingClientRect();
      const d=document.documentElement;
      const w=Math.max(320,d.clientWidth-r.left-16), h=Math.max(480,d.clientHeight-r.top-16);
      // Si la medida no cambió de verdad se devuelve el MISMO objeto para que React no
      // vuelva a pintar. Sin esto hay bucle: al ensancharse aparece o desaparece la barra de
      // desplazamiento, eso cambia `clientWidth`, se vuelve a medir, y así sin parar.
      sCaja(a=>(a&&Math.abs(a.w-w)<=2&&Math.abs(a.h-h)<=2)?a:{w,h});
    };
    medir();
    window.addEventListener("resize",medir);
    return()=>window.removeEventListener("resize",medir);
  },[]);
  // En el teléfono el constructor SÍ ocupa la pantalla entera: no hay hueco para dejar la app
  // detrás, y encajarlo en la columna de contenido lo dejaba inservible. Con la pantalla tomada,
  // la página de atrás no debe desplazarse bajo el dedo al arrastrar el lienzo.
  useEffect(()=>{
    if(!movil)return;
    const antes=document.body.style.overflow;
    document.body.style.overflow="hidden";
    return()=>{document.body.style.overflow=antes;};
  },[movil]);

  const pasos=flujo.pasos||[];
  const mut=fn=>onChange({...flujo,pasos:fn(pasos)});
  const editPaso=(id,campo,v)=>mut(p=>p.map(x=>x.id===id?{...x,[campo]:v}:x));
  const inicio=flujo.inicio||pasos[0]?.id||"";

  // El disparador no es un paso: es la regla en sí (palabra + publicación). Se dibuja como
  // nodo porque en el diseño toda cadena arranca de uno, pero no se guarda en `pasos`.
  const TRIG="__disparador";
  const trigTitulo=flujo.palabra?('Comentario con "'+flujo.palabra+'"'):"Sin palabra todavía";
  const pubSel=(pubs||[]).find(p=>p.id===flujo.mediaId);
  const trigDetalle=flujo.palabra
    ?("Se activa cuando alguien comenta \""+flujo.palabra+"\" en "+(pubSel?"la publicación elegida":"cualquier publicación de la cuenta")+".")
    :"";

  const nodos=[
    {id:TRIG,tipo:"disparador",titulo:trigTitulo,detalle:trigDetalle,x:flujo.tx??320,y:flujo.ty??30},
    ...pasos.map(p=>({...p,titulo:p.titulo||CC_TIPOS[p.tipo]?.nombre||"Paso"})),
  ];
  const porId={};nodos.forEach(n=>{porId[n.id]=n;});

  // Las aristas se derivan de la propia lógica: los botones de un mensaje, las dos ramas de una
  // condición, la salida única de un retraso o una acción. No hay conexiones sueltas que
  // mantener sincronizadas aparte — el grafo ES la configuración.
  const aristas=[];
  if(inicio&&porId[inicio])aristas.push({from:TRIG,to:inicio});
  for(const p of pasos){
    if(p.tipo==="mensaje"){
      (p.botones||[]).forEach(b=>{if(b.siguiente&&porId[b.siguiente])aristas.push({from:p.id,to:b.siguiente,label:b.titulo||"botón"});});
      // Un mensaje puede además seguir solo, sin esperar a que pulsen nada. Es un hilo distinto
      // del de un botón y por eso lleva su propia etiqueta.
      if(p.siguiente&&porId[p.siguiente])aristas.push({from:p.id,to:p.siguiente,label:"sigue solo"});
    }
    else if(p.tipo==="condicion"){
      if(p.siSi&&porId[p.siSi])aristas.push({from:p.id,to:p.siSi,label:"Sí"});
      if(p.siNo&&porId[p.siNo])aristas.push({from:p.id,to:p.siNo,label:"No"});
    }else if(p.siguiente&&porId[p.siguiente])aristas.push({from:p.id,to:p.siguiente});
  }
  const conEntrada=new Set(aristas.map(a=>a.to));

  // El disparador crece cuando enseña la publicación elegida, así que su alto no es el de los
  // demás. Las aristas salen del borde de abajo: con la constante fija, el hilo del disparador
  // arrancaba desde la mitad de la tarjeta y parecía roto.
  const altoDe=n=>(n.tipo==="disparador"&&pubSel)?CC_H+66:CC_H;

  const moverNodo=(id,x,y)=>{
    if(id===TRIG)onChange({...flujo,tx:Math.round(x),ty:Math.round(y)});
    else mut(p=>p.map(n=>n.id===id?{...n,x:Math.round(x),y:Math.round(y)}:n));
  };

  // Al añadir, el bloque cuelga del seleccionado —o del último— y se coloca debajo, saltando
  // lo que ya ocupe esa columna. Y se conecta solo: un bloque suelto no sirve de nada.
  const addNodo=tipo=>{
    // De dónde cuelga. Si lo seleccionado es el disparador y la cadena ya tiene entrada, se
    // cuelga del último bloque: enganchar al disparador pisaría el inicio, y dejarlo suelto
    // —que es lo que hacía antes— es peor, porque el bloque aparece sin hilo y sin explicación.
    let desde=porId[sel]||nodos[nodos.length-1];
    if(desde.id===TRIG&&inicio&&pasos.length)desde=pasos[pasos.length-1];

    const debajo=nodos.filter(n=>Math.abs(n.x-desde.x)<CC_W&&n.y>desde.y);
    const y=debajo.length?Math.max(...debajo.map(n=>n.y))+180:desde.y+180;
    const nuevo={id:ccId(),tipo,titulo:CC_TIPOS[tipo].nombre+" nuevo",texto:"",botones:[],siSi:"",siNo:"",siguiente:"",minutos:60,que:"sigue",esperaMin:0,minSeguidores:0,x:desde.x,y};

    // Se engancha al primer hueco libre del bloque de origen. Si ya los tiene todos ocupados
    // se deja suelto a propósito: pisar una conexión existente sería peor.
    const conectar=lista=>lista.map(p=>{
      if(p.id!==desde.id)return p;
      if(p.tipo==="mensaje"){
        const bs=p.botones||[];
        const libre=bs.findIndex(b=>!b.siguiente);
        if(libre>=0)return {...p,botones:bs.map((b,i)=>i===libre?{...b,siguiente:nuevo.id}:b)};
        return bs.length>=3?p:{...p,botones:[...bs,{id:ccId(),titulo:bs.length?"Otra opción":"Continuar",siguiente:nuevo.id}]};
      }
      if(p.tipo==="condicion")return !p.siSi?{...p,siSi:nuevo.id}:(!p.siNo?{...p,siNo:nuevo.id}:p);
      return p.siguiente?p:{...p,siguiente:nuevo.id};
    });

    const arrancaLaCadena=desde.id===TRIG||!pasos.length||!inicio;
    onChange({...flujo,pasos:[...(arrancaLaCadena?pasos:conectar(pasos)),nuevo],...(arrancaLaCadena?{inicio:nuevo.id}:{})});
    sSel(nuevo.id);
  };

  const borrarNodo=id=>{
    mut(p=>p.filter(x=>x.id!==id).map(x=>({
      ...x,
      botones:(x.botones||[]).map(b=>b.siguiente===id?{...b,siguiente:""}:b),
      siSi:x.siSi===id?"":x.siSi, siNo:x.siNo===id?"":x.siNo,
      siguiente:x.siguiente===id?"":x.siguiente,
    })));
    if(flujo.inicio===id)onChange({...flujo,inicio:""});
    if(sel===id)sSel(null);
  };

  // Un solo sitio donde se resuelve el arrastre, para que el ratón y el dedo hagan exactamente
  // lo mismo en vez de mantener dos copias del cálculo.
  //
  // El desplazamiento se divide por el zoom: los dedos se mueven en píxeles de pantalla, pero
  // las coordenadas del bloque son las del lienzo. Sin dividir, con el mapa alejado el bloque
  // corre más que el dedo y se despega de él.
  const mover=(x,y)=>{
    if(drag){
      moverNodo(drag.id,drag.px+(x-drag.sx)/zoom,drag.py+(y-drag.sy)/zoom);
      // Un arrastre deja de ser un toque. Sin esto, mover un bloque un poco y levantar el dedo
      // contaría como el primero de un doble toque.
      if(Math.abs(x-drag.sx)>8||Math.abs(y-drag.sy)>8)tapRef.current.movido=true;
    }
    else if(panDrag)sPan({x:panDrag.px+x-panDrag.sx,y:panDrag.py+y-panDrag.sy});
  };
  const soltar=()=>{if(drag)sDrag(null);if(panDrag)sPanDrag(null);};

  // ── Pellizco para acercar y alejar ──
  const distDe=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
  const pinchIniciar=e=>{
    const ts=[e.touches[0],e.touches[1]];
    pinchRef.current={d0:distDe(ts),z0:zoom,pan0:{...pan},
      medio:{x:(ts[0].clientX+ts[1].clientX)/2,y:(ts[0].clientY+ts[1].clientY)/2}};
    sDrag(null);sPanDrag(null);
  };
  const pinchMover=e=>{
    const p=pinchRef.current;if(!p||!p.d0)return;
    const z=Math.max(.35,Math.min(2.2,p.z0*distDe([e.touches[0],e.touches[1]])/p.d0));
    // El punto entre los dedos se queda quieto. Sin esta corrección el mapa se escapa hacia una
    // esquina al acercarlo y hay que perseguirlo con el otro dedo.
    const r=lienzoRef.current?lienzoRef.current.getBoundingClientRect():{left:0,top:0};
    const mx=p.medio.x-r.left, my=p.medio.y-r.top;
    sPan({x:mx-(mx-p.pan0.x)*z/p.z0,y:my-(my-p.pan0.y)*z/p.z0});
    sZoom(z);
  };
  // El toque en un bloque NO lo selecciona: eso lo hace el doble toque. Un toque simple es el
  // comienzo de un arrastre, y abrir el panel de edición cada vez que alguien va a mover algo
  // tapaba media pantalla justo cuando hacía falta verla.
  const toqueEnNodo=id=>{
    const r=tapRef.current;
    if(r.movido)return;                       // fue un arrastre, no un toque
    const ahora=Date.now();
    if(r.id===id&&ahora-r.t<320){sSel(id);tapRef.current={id:null,t:0,movido:false};}
    else tapRef.current={id,t:ahora,movido:false};
  };

  const nSel=porId[sel];
  const tSel=nSel?CC_TIPOS[nSel.tipo]:null;

  // Selector de destino, reutilizado por botones, ramas y salidas únicas.
  const selDestino=(valor,onCh,vacio,excluir)=>(
    <select value={valor||""} onChange={e=>onCh(e.target.value)}
      style={{padding:"8px 11px",borderRadius:10,background:"#0B0E17",border:"1px solid #262D40",color:valor?"#F4F2ED":"#6B7484",fontFamily:"inherit",fontSize:12.5,outline:"none",width:"100%",boxSizing:"border-box"}}>
      <option value="">{vacio}</option>
      {nodos.filter(n=>n.id!==TRIG&&n.id!==excluir).map(n=>
        <option key={n.id} value={n.id}>{CC_TIPOS[n.tipo]?.nombre} · {n.titulo}</option>)}
    </select>);

  const etiqueta=(txt,extra)=>(<label style={{fontSize:12.5,fontWeight:600,color:"#C9CFDC",...extra}}>{txt}</label>);

  // En el teléfono se monta en el <body> a pantalla completa; en el escritorio se queda en su
  // sitio dentro de la página y crece hacia abajo y a la derecha.
  const marco=movil
    ? {position:"fixed",inset:0,zIndex:1000,paddingTop:"env(safe-area-inset-top, 0px)",paddingBottom:"env(safe-area-inset-bottom, 0px)"}
    : {width:caja?caja.w:"100%",height:caja?caja.h:"calc(100vh - 150px)",minHeight:480,borderRadius:16,border:"1px solid #161B2A"};

  const cuerpo=(<div ref={cajaRef} style={{...marco,
    display:"flex",flexDirection:"column",overflow:"hidden",position:marco.position||"relative",
    fontFamily:"'Instrument Sans', system-ui, sans-serif",color:"#F4F2ED",background:"#05060B",boxSizing:"border-box"}}>

    {/* ── Barra superior ── */}
    {/* En el teléfono se cae el logo, el separador y el rótulo "constructor de cadena": son
        adorno, y ahí cada píxel de ancho lo necesita el nombre de la cadena. El interruptor de
        activa/pausada se queda en el punto de color, sin texto. */}
    <header style={{display:"flex",alignItems:"center",gap:movil?9:14,padding:movil?"9px 12px":"12px 22px",background:"rgba(5, 6, 11, 0.94)",borderBottom:"1px solid #161B2A",flexShrink:0,zIndex:10}}>
      {!movil&&<>
        <div style={{width:30,height:30,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(140deg, #6FE7F2, #9BB4FF)",color:"#05060B",fontSize:12,fontWeight:700}}>IN</div>
        <div style={{width:1,height:22,background:"#1E2536"}}/>
      </>}
      <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:0,flex:movil?"1 1 auto":"0 1 auto"}}>
        {!movil&&<span style={{fontFamily:"ui-monospace, monospace",fontSize:9.5,letterSpacing:"0.18em",textTransform:"uppercase",color:"#6B7484"}}>Constructor de cadena</span>}
        <input value={flujo.nombre||""} onChange={e=>onChange({...flujo,nombre:e.target.value})} placeholder="Cadena sin nombre"
          onFocus={e=>e.target.style.borderBottomColor="rgba(111, 231, 242, 0.5)"} onBlur={e=>e.target.style.borderBottomColor="transparent"}
          style={{padding:"2px 0",background:"transparent",border:"none",borderBottom:"1px dashed transparent",color:"#F4F2ED",fontFamily:"inherit",fontSize:movil?14:15,fontWeight:600,outline:"none",width:movil?"100%":240,minWidth:0}}/>
      </div>
      {!movil&&<div style={{flex:"1 1 auto"}}/>}
      <button onClick={()=>onChange({...flujo,activa:flujo.activa===false})}
        title={flujo.activa!==false?"Cadena activa — toca para pausar":"Pausada — toca para activar"}
        style={{flexShrink:0,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,
          padding:movil?"0":"8px 16px",width:movil?34:"auto",height:movil?34:"auto",borderRadius:999,
          background:flujo.activa!==false?"rgba(111, 231, 242, 0.08)":"transparent",
          border:"1px solid "+(flujo.activa!==false?"rgba(111, 231, 242, 0.4)":"#262D40"),
          color:flujo.activa!==false?"#6FE7F2":"#8E93A6",fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>
        <span style={{width:8,height:8,borderRadius:"50%",background:flujo.activa!==false?"#6FE7F2":"#4A5265",
          animation:flujo.activa!==false?"ccPulse 2.2s ease-in-out infinite":"none"}}/>
        {!movil&&(flujo.activa!==false?"Cadena activa":"Pausada")}
      </button>
      <button onClick={()=>{onGuardar();sSaved(true);clearTimeout(tRef.current);tRef.current=setTimeout(()=>sSaved(false),1600);}} disabled={guardando}
        style={{flexShrink:0,padding:movil?"7px 13px":"9px 20px",borderRadius:999,background:"#6FE7F2",border:"1px solid #6FE7F2",color:"#05060B",fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:guardando?"default":"pointer"}}>
        {guardando?"…":(saved?"✓":"Guardar")}
      </button>
      <button onClick={onCerrar} title="Volver a la lista"
        style={{width:movil?34:32,height:movil?34:32,borderRadius:"50%",background:"transparent",border:"1px solid #262D40",color:"#8E93A6",fontFamily:"inherit",fontSize:13,cursor:"pointer",flexShrink:0}}>✕</button>
    </header>

    <div style={{flex:"1 1 auto",display:"flex",minHeight:0,position:"relative"}}>

      {/* ── Paleta de bloques ── */}
      {/* En el teléfono deja de ser una columna de 216 px —que se comería más de la mitad del
          ancho— y pasa a una tira horizontal que se desliza, con solo el nombre del bloque.
          La descripción y la nota de ayuda se caen: ahí no hay sitio y no son imprescindibles. */}
      {movil
        ?<div style={{position:"absolute",left:0,right:0,bottom:0,zIndex:4,display:"flex",gap:8,padding:"10px 12px",overflowX:"auto",
          background:"rgba(5, 6, 11, 0.94)",borderTop:"1px solid #161B2A",WebkitOverflowScrolling:"touch"}}>
          {["mensaje","condicion","retraso","accion"].map(k=>{const t=CC_TIPOS[k];return(
            <button key={k} onClick={()=>addNodo(k)}
              style={{flexShrink:0,display:"inline-flex",alignItems:"center",gap:7,padding:"9px 14px",borderRadius:999,background:"#0B0E17",border:"1px solid "+t.bor,cursor:"pointer",fontFamily:"inherit"}}>
              <span style={{width:8,height:8,borderRadius:"50%",background:t.col,flexShrink:0}}/>
              <span style={{fontSize:12.5,fontWeight:600,color:"#F4F2ED",whiteSpace:"nowrap"}}>{t.nombre}</span>
            </button>);})}
        </div>
        :<aside style={{width:216,flexShrink:0,display:"flex",flexDirection:"column",gap:8,padding:"18px 14px",borderRight:"1px solid #161B2A",background:"rgba(11, 14, 23, 0.55)",overflow:"auto",boxSizing:"border-box"}}>
          <span style={{fontFamily:"ui-monospace, monospace",fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",color:"#6B7484",padding:"0 4px 4px"}}>Bloques</span>
          {["mensaje","condicion","retraso","accion"].map(k=>{const t=CC_TIPOS[k];return(
            <button key={k} onClick={()=>addNodo(k)}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=t.bor;e.currentTarget.style.transform="translateY(-1px)";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor="#1E2536";e.currentTarget.style.transform="none";}}
              style={{display:"flex",alignItems:"flex-start",gap:10,padding:"11px 12px",borderRadius:12,background:"#0B0E17",border:"1px solid #1E2536",cursor:"pointer",textAlign:"left",fontFamily:"inherit",transition:"border-color 0.25s, transform 0.2s"}}>
              <span style={{width:26,height:26,flexShrink:0,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:t.bg,border:"1px solid "+t.bor}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:t.col}}/>
              </span>
              <span style={{display:"flex",flexDirection:"column",gap:2}}>
                <span style={{fontSize:13,fontWeight:600,color:"#F4F2ED"}}>{t.nombre}</span>
                <span style={{fontSize:11,color:"#6B7484",lineHeight:1.4}}>{t.desc}</span>
              </span>
            </button>);})}
          <p style={{margin:"8px 4px 0",fontSize:11,lineHeight:1.55,color:"#4A5265"}}>Toca un bloque para añadirlo — se conecta al bloque seleccionado en el lienzo.</p>
        </aside>}

      {/* ── Lienzo ── */}
      {/* Los gestos van duplicados a propósito. El navegador sintetiza un clic a partir de un
          toque, pero NO sintetiza `mousemove` a partir de `touchmove`: con solo los eventos de
          ratón, en el teléfono no se podía ni mover el mapa ni arrastrar un bloque. `touchAction:
          none` es lo que impide que el gesto se lo quede el scroll de la página. */}
      <div ref={lienzoRef}
        onMouseDown={e=>{if(movil)return;sPanDrag({sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y});sSel(null);}}
        onTouchStart={e=>{
          if(e.touches.length>=2)return pinchIniciar(e);
          const t=e.touches[0];if(!t)return;
          sPanDrag({sx:t.clientX,sy:t.clientY,px:pan.x,py:pan.y});sSel(null);
        }}
        onMouseMove={e=>{if(movil)return;mover(e.clientX,e.clientY);}}
        onTouchMove={e=>{
          if(e.touches.length>=2&&pinchRef.current)return pinchMover(e);
          const t=e.touches[0];if(t)mover(t.clientX,t.clientY);
        }}
        onMouseUp={soltar}
        onTouchEnd={e=>{if(e.touches.length<2)pinchRef.current=null;soltar();}}
        onTouchCancel={()=>{pinchRef.current=null;soltar();}}
        onMouseLeave={soltar}
        style={{flex:"1 1 auto",position:"relative",overflow:"hidden",cursor:panDrag?"grabbing":"grab",touchAction:"none",
          backgroundColor:"#05060B",backgroundImage:"radial-gradient(rgba(200, 210, 228, 0.12) 1px, transparent 1.2px)",
          backgroundSize:(26*zoom)+"px "+(26*zoom)+"px",backgroundPosition:pan.x+"px "+pan.y+"px"}}>
        {/* `transformOrigin` en la esquina, no en el centro: es lo que hace que las cuentas del
            pellizco —y las coordenadas de cada bloque— sigan siendo las de siempre. */}
        <div style={{position:"absolute",top:0,left:0,transformOrigin:"0 0",transform:"translate("+pan.x+"px, "+pan.y+"px) scale("+zoom+")"}}>
          <svg width="4000" height="4000" style={{position:"absolute",top:0,left:0,pointerEvents:"none",overflow:"visible"}}>
            {aristas.map((e,i)=>{
              const a=porId[e.from],b=porId[e.to];
              const t=CC_TIPOS[a.tipo];
              const x1=a.x+CC_W/2,y1=a.y+altoDe(a),x2=b.x+CC_W/2,y2=b.y;
              return(<g key={i}>
                <path d={"M "+x1+" "+y1+" C "+x1+" "+(y1+55)+", "+x2+" "+(y2-55)+", "+x2+" "+y2} fill="none" stroke={t.bor} strokeWidth="1.6"/>
                <circle cx={x2} cy={y2} r="3" fill={CC_TIPOS[b.tipo].col}/>
              </g>);})}
          </svg>
          {/* Las etiquetas caen en el punto medio de su curva, y dos ramas hacia bloques
              cercanos acaban en el mismo sitio: se leía "ya Sí no" encima de sí mismo. Se
              colocan una a una y, si una choca con otra ya puesta, baja hasta dejar de chocar. */}
          {(()=>{
            const puestas=[];
            return aristas.filter(e=>e.label).map((e,i)=>{
              const a=porId[e.from],b=porId[e.to];
              let lx=((a.x+CC_W/2)+(b.x+CC_W/2))/2, ly=((a.y+altoDe(a))+b.y)/2;
              for(let intento=0;intento<6;intento++){
                if(!puestas.some(p=>Math.abs(p.lx-lx)<96&&Math.abs(p.ly-ly)<26))break;
                ly+=27;
              }
              puestas.push({lx,ly});
              const si=e.label==="Sí",no=e.label==="No";
              return(<span key={"c"+i} style={{position:"absolute",left:lx,top:ly,
                transform:"translate(-50%, -50%)",padding:"3px 10px",borderRadius:999,background:"#0B0E17",
                border:"1px solid "+(si?"rgba(127, 232, 192, 0.4)":no?"rgba(255, 107, 107, 0.4)":"rgba(155, 180, 255, 0.4)"),
                color:si?"#7FE8C0":no?"#FF8B8B":"#9BB4FF",fontSize:11,fontWeight:700,pointerEvents:"none",whiteSpace:"nowrap",maxWidth:150,overflow:"hidden",textOverflow:"ellipsis"}}>{e.label}</span>);
            });
          })()}
          {nodos.map(n=>{
            const t=CC_TIPOS[n.tipo];
            const isSel=n.id===sel;
            const puedeBorrar=n.id!==TRIG;
            const detalle=n.tipo==="disparador"?n.detalle
              :n.tipo==="retraso"?((()=>{const[v,u]=ccDescomponer(n.minutos);return "Espera "+v+" "+(CC_UNIDADES.find(x=>x[1]===u)||["minutos"])[0]+".";})())
              :n.tipo==="condicion"?((CC_CONDICIONES[n.que||"sigue"]||CC_CONDICIONES.sigue).pregunta
                  +(n.que==="seguidores"?" ("+(n.minSeguidores||0)+")":"")
                  +(n.esperaMin?(()=>{const[v,u]=ccDescomponer(n.esperaMin);return " · tras "+v+" "+(CC_UNIDADES.find(x=>x[1]===u)||["min"])[0];})():""))
              :(n.texto||"");
            return(<div key={n.id}
              onMouseDown={e=>{if(movil)return;e.stopPropagation();sDrag({id:n.id,sx:e.clientX,sy:e.clientY,px:n.x,py:n.y});sSel(n.id);}}
              // Con el dedo, tocar un bloque solo empieza a moverlo. Para editarlo, doble toque.
              onTouchStart={e=>{
                if(e.touches.length>=2)return;          // dos dedos son un pellizco, no un bloque
                e.stopPropagation();
                const t=e.touches[0];if(!t)return;
                sDrag({id:n.id,sx:t.clientX,sy:t.clientY,px:n.x,py:n.y});
                tapRef.current={...tapRef.current,movido:false};
              }}
              onTouchEnd={()=>toqueEnNodo(n.id)}
              style={{position:"absolute",left:n.x,top:n.y,width:CC_W,boxSizing:"border-box",borderRadius:16,padding:"13px 15px 14px",
                background:"linear-gradient(170deg, rgba(13, 17, 27, 0.97), rgba(6, 8, 14, 0.99))",
                border:"1px solid "+(isSel?t.bor.replace("0.4","0.85"):"rgba(200, 210, 228, 0.12)"),
                boxShadow:isSel?"0 0 0 1px "+t.bor+", 0 18px 44px rgba(2, 3, 8, 0.6)":"0 12px 30px rgba(2, 3, 8, 0.45)",
                cursor:"grab",userSelect:"none",transition:"border-color 0.2s, box-shadow 0.2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 10px",borderRadius:999,background:t.bg,border:"1px solid "+t.bor,color:t.col,fontSize:10.5,fontWeight:700,letterSpacing:"0.04em",textTransform:"uppercase"}}>{t.nombre}</span>
                {puedeBorrar&&<button onClick={e=>{e.stopPropagation();borrarNodo(n.id);}} onMouseDown={e=>e.stopPropagation()}
                  style={{marginLeft:"auto",width:20,height:20,borderRadius:"50%",background:"transparent",border:"none",color:"#4A5265",fontFamily:"inherit",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
              </div>
              <div style={{fontSize:13.5,fontWeight:600,lineHeight:1.35,marginBottom:4}}>{n.titulo}</div>
              <div style={{fontSize:11.5,color:"#6B7484",lineHeight:1.45,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{detalle||"Sin contenido — edítalo en el panel"}</div>
              {/* La publicación elegida, aquí mismo. "La publicación elegida" en texto no dice
                  cuál es, y para comprobarlo había que abrir el panel y buscarla en la rejilla. */}
              {n.id===TRIG&&pubSel&&<div style={{display:"flex",alignItems:"center",gap:9,marginTop:10,padding:"7px 9px",borderRadius:11,background:"rgba(111, 231, 242, 0.06)",border:"1px solid rgba(111, 231, 242, 0.22)"}}>
                {pubSel.img
                  ?<img src={pubSel.img} alt="" draggable={false} onError={e=>{e.target.style.display="none";}}
                     style={{width:38,height:38,borderRadius:8,objectFit:"cover",flexShrink:0,display:"block"}}/>
                  :<span style={{width:38,height:38,borderRadius:8,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:"#0B0E17",fontSize:16}}>{pubSel.tipo==="VIDEO"?"🎬":"📷"}</span>}
                <span style={{display:"flex",flexDirection:"column",gap:2,minWidth:0}}>
                  <span style={{fontSize:9.5,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",color:"#6FE7F2"}}>En esta publicación</span>
                  <span style={{fontSize:10.5,color:"#6B7484",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                    {pubSel.comentarios!=null?(pubSel.comentarios+" comentario"+(pubSel.comentarios===1?"":"s")):(pubSel.tipo==="VIDEO"?"Video":"Imagen")}
                  </span>
                </span>
              </div>}
              <span style={{position:"absolute",bottom:-5,left:108,width:8,height:8,borderRadius:"50%",background:"#0B0E17",border:"1.5px solid "+t.col}}/>
              {conEntrada.has(n.id)&&<span style={{position:"absolute",top:-5,left:108,width:8,height:8,borderRadius:"50%",background:t.col}}/>}
              {/* Un bloque sin hilo de entrada no se ejecuta nunca. Antes quedaba ahí flotando
                  sin más, y la pregunta obvia era si estaba bien o no. */}
              {n.id!==TRIG&&!conEntrada.has(n.id)&&
                <span title="Nada lleva a este bloque, así que no se ejecutará"
                  style={{position:"absolute",top:-11,right:10,padding:"2px 9px",borderRadius:999,background:"#0B0E17",border:"1px dashed rgba(239, 217, 160, 0.5)",color:"#EFD9A0",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>sin conectar</span>}
            </div>);})}
        </div>
        {/* En el teléfono se cae: caería justo detrás de la tira de bloques. */}
        {!movil&&<span style={{position:"absolute",bottom:14,left:16,fontSize:11,color:"#4A5265",pointerEvents:"none"}}>Arrastra los bloques para ordenarlos · arrastra el fondo para moverte</span>}

        {/* Mandos de zoom. El pellizco es el gesto natural, pero con una sola mano sujetando el
            teléfono no siempre se puede, y quedarse al 35 % sin saber cómo volver es fácil. */}
        {movil&&<div style={{position:"absolute",top:10,right:10,display:"flex",flexDirection:"column",gap:6}}>
          {[["+",()=>sZoom(z=>Math.min(2.2,z+.2))],["−",()=>sZoom(z=>Math.max(.35,z-.2))]].map(([txt,fn])=>(
            <button key={txt} onClick={fn} onTouchStart={e=>e.stopPropagation()}
              style={{width:34,height:34,borderRadius:11,background:"rgba(11, 14, 23, 0.92)",border:"1px solid #262D40",color:"#C9CFDC",fontFamily:"inherit",fontSize:16,lineHeight:1,cursor:"pointer"}}>{txt}</button>))}
          <button onClick={()=>{sZoom(1);sPan({x:-180,y:20});}} onTouchStart={e=>e.stopPropagation()}
            title="Volver al tamaño normal"
            style={{width:34,height:34,borderRadius:11,background:"rgba(11, 14, 23, 0.92)",border:"1px solid #262D40",color:zoom===1?"#4A5265":"#6FE7F2",fontFamily:"ui-monospace, monospace",fontSize:9.5,fontWeight:700,cursor:"pointer"}}>
            {Math.round(zoom*100)}
          </button>
        </div>}
      </div>

      {/* ── Panel de edición ── */}
      {/* En el teléfono una columna de 360 px no cabe al lado de nada: se convierte en una hoja
          que sube desde abajo y ocupa hasta tres cuartos de la pantalla, dejando ver el lienzo
          por encima para no perder de vista qué bloque se está editando. Entra deslizando desde
          abajo, no desde el lado, porque es de donde viene. */}
      {nSel&&<aside style={movil
        ?{position:"absolute",left:0,right:0,bottom:0,zIndex:6,maxHeight:"76%",display:"flex",flexDirection:"column",gap:14,
          padding:"14px 16px calc(16px + env(safe-area-inset-bottom, 0px))",borderTop:"1px solid #262D40",
          borderTopLeftRadius:18,borderTopRightRadius:18,
          background:"linear-gradient(170deg, rgba(13, 17, 27, 0.99), rgba(6, 8, 14, 1))",overflow:"auto",boxSizing:"border-box",
          boxShadow:"0 -18px 44px rgba(2, 3, 8, 0.7)",animation:"ccSubir 0.26s cubic-bezier(0.22, 1, 0.36, 1)"}
        :{width:360,flexShrink:0,display:"flex",flexDirection:"column",gap:16,padding:"18px 20px",borderLeft:"1px solid #161B2A",
          background:"linear-gradient(170deg, rgba(13, 17, 27, 0.99), rgba(6, 8, 14, 1))",overflow:"auto",boxSizing:"border-box",
          animation:"ccSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:999,background:tSel.bg,border:"1px solid "+tSel.bor,color:tSel.col,fontSize:11,fontWeight:700,letterSpacing:"0.04em",textTransform:"uppercase"}}>{tSel.nombre}</span>
          <button onClick={()=>sSel(null)} style={{marginLeft:"auto",width:28,height:28,borderRadius:"50%",background:"transparent",border:"1px solid #262D40",color:"#8E93A6",fontFamily:"inherit",fontSize:12,cursor:"pointer"}}>✕</button>
        </div>

        {nSel.id!==TRIG&&<div style={{display:"flex",flexDirection:"column",gap:7}}>
          {etiqueta("Título del bloque")}
          <input value={nSel.titulo||""} onChange={e=>editPaso(nSel.id,"titulo",e.target.value)}
            style={{padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13.5,outline:"none",boxSizing:"border-box",width:"100%"}}/>
        </div>}

        {/* Disparador: palabra y publicación. Es la regla en sí. */}
        {nSel.id===TRIG&&<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(tSel.detLabel)}
            <input value={flujo.palabra||""} onChange={e=>onChange({...flujo,palabra:e.target.value})} placeholder="EXPLORA"
              style={{padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13.5,fontWeight:700,outline:"none",boxSizing:"border-box",width:"100%"}}/>
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>No distingue mayúsculas ni tildes, y basta con que el comentario la contenga.</span>
            {/* Sin palabra no hay nada que dispare la cadena, y el servidor la descarta al
                guardar. Se avisa aquí y no solo al pulsar Guardar: con una plantilla de diez
                bloques ya montados, enterarse al final es enterarse tarde. */}
            {!String(flujo.palabra||"").trim()&&
              <div style={{padding:"9px 11px",borderRadius:10,background:"rgba(239, 217, 160, 0.06)",border:"1px solid rgba(239, 217, 160, 0.3)",fontSize:11.5,color:"#EFD9A0",lineHeight:1.5}}>
                Escribe la palabra o <b>esta cadena no se guardará</b>, por muy armada que esté.
              </div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("¿En qué publicación?")}
            <div onMouseLeave={()=>sPrevPub(null)}
              style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(92px, 1fr))",gap:7,maxHeight:330,overflowY:"auto",padding:2}}>
              <button onClick={()=>onChange({...flujo,mediaId:""})} title="En cualquier publicación"
                onMouseEnter={()=>sPrevPub(null)}
                style={{position:"relative",aspectRatio:"1",borderRadius:10,cursor:"pointer",padding:0,overflow:"hidden",fontFamily:"inherit",
                  background:!flujo.mediaId?"rgba(111, 231, 242, 0.08)":"#0B0E17",border:"2px solid "+(!flujo.mediaId?"#6FE7F2":"#262D40"),
                  display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3}}>
                <span style={{fontSize:17}}>✳️</span>
                <span style={{fontSize:10,fontWeight:700,color:!flujo.mediaId?"#6FE7F2":"#6B7484"}}>Todas</span>
              </button>
              {(pubs||[]).map(p=>{
                const on=flujo.mediaId===p.id;
                const hov=prevPub&&prevPub.p.id===p.id;
                return(
                <button key={p.id} onClick={()=>onChange({...flujo,mediaId:p.id})} title={p.titulo}
                  // Se guarda el rectángulo, no solo la publicación: el preview va en un Portal
                  // y necesita saber dónde está la miniatura para colocarse a su lado.
                  // En el teléfono no hay ratón: el toque dispara un `mouseenter` que nunca tiene
                  // su `mouseleave`, así que el preview se quedaría pegado tapando la rejilla. Y
                  // ahí sobra: a pantalla completa las miniaturas ya se ven.
                  onMouseEnter={e=>{if(movil)return;const r=e.currentTarget.getBoundingClientRect();sPrevPub({p,l:r.left,r:r.right,cy:r.top+r.height/2});}}
                  onFocus={e=>{if(movil)return;const r=e.currentTarget.getBoundingClientRect();sPrevPub({p,l:r.left,r:r.right,cy:r.top+r.height/2});}}
                  onBlur={()=>sPrevPub(null)}
                  style={{position:"relative",aspectRatio:"1",borderRadius:10,cursor:"pointer",padding:0,overflow:"hidden",fontFamily:"inherit",background:"#0B0E17",
                    border:"2px solid "+(on?"#6FE7F2":hov?"rgba(111, 231, 242, 0.55)":"#262D40"),
                    transition:"border-color 0.15s"}}>
                  <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:"#4A5265"}}>{p.tipo==="VIDEO"?"🎬":"📷"}</div>
                  {p.img&&<img src={p.img} alt="" draggable={false} onError={e=>{e.target.style.display="none";}}
                    style={{position:"relative",width:"100%",height:"100%",objectFit:"cover",display:"block",opacity:(on||hov)?1:.75,transition:"opacity 0.15s"}}/>}
                  {p.comentarios!=null&&<span style={{position:"absolute",top:3,right:3,padding:"0 5px",borderRadius:999,background:"rgba(2,3,8,.75)",fontFamily:"ui-monospace, monospace",fontSize:9,color:"#fff"}}>{p.comentarios}</span>}
                </button>);})}
            </div>
            {pubs===null&&<span style={{fontSize:11.5,color:"#4A5265"}}>Cargando publicaciones…</span>}
            {/* Solo en escritorio: en el teléfono no hay ratón, y a pantalla completa las
                miniaturas ya salen grandes, así que la ayuda sobraría y mentiría. */}
            {!movil&&(pubs||[]).length>0&&<span style={{fontSize:11,color:"#4A5265",lineHeight:1.5}}>Pasa el ratón por encima para verla en grande.</span>}
          </div>
          <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>{tSel.hint}</span>
          <div style={{flex:"1 1 auto"}}/>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("Primer bloque de la cadena")}
            {selDestino(inicio,v=>onChange({...flujo,inicio:v}),"— elige por dónde empieza —")}
          </div>
        </>}

        {/* Mensaje: texto y botones. Cada botón es una arista. */}
        {nSel.tipo==="mensaje"&&<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(tSel.detLabel)}
            <textarea value={nSel.texto||""} onChange={e=>editPaso(nSel.id,"texto",e.target.value)} placeholder={tSel.ph} rows={5}
              style={{resize:"vertical",padding:"11px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13,lineHeight:1.5,outline:"none",boxSizing:"border-box",width:"100%"}}/>
            <span style={{fontFamily:"ui-monospace, monospace",fontSize:10.5,color:(nSel.texto||"").length>640?"#FF8B8B":"#4A5265",alignSelf:"flex-end"}}>{(nSel.texto||"").length}/640</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            {etiqueta("Botones")}
            {(nSel.botones||[]).map((b,k)=>{
              const edBot=(campo,v)=>editPaso(nSel.id,"botones",(nSel.botones||[]).map((x,n)=>n===k?{...x,[campo]:v}:x));
              // Los botones de antes no tienen `modo`; se deduce de si llevan enlace.
              const esEnlace=(b.modo||(b.url?"enlace":"bloque"))==="enlace";
              const urlOk=/^https?:\/\/\S+$/i.test(b.url||"");
              return(
              <div key={b.id} style={{display:"flex",flexDirection:"column",gap:7,padding:"10px 11px",borderRadius:11,background:"#0B0E17",border:"1px solid #1E2536"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <input value={b.titulo} maxLength={20} onChange={e=>edBot("titulo",e.target.value)}
                    placeholder="Ya te sigo"
                    style={{flex:1,minWidth:0,padding:"7px 10px",borderRadius:9,background:"#05060B",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:12.5,fontWeight:600,outline:"none"}}/>
                  <button onClick={()=>editPaso(nSel.id,"botones",(nSel.botones||[]).filter((_,n)=>n!==k))}
                    style={{width:24,height:24,borderRadius:7,background:"transparent",border:"none",color:"#4A5265",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>✕</button>
                </div>

                {/* Un botón hace UNA de las dos cosas, no las dos: o sigue la cadena, o abre una
                    web. Al elegir enlace se borra el destino y al revés, porque guardar los dos
                    dejaría en pantalla un destino que no se va a usar. */}
                <div style={{display:"flex",gap:3,padding:3,borderRadius:999,background:"#05060B",border:"1px solid #1E2536"}}>
                  {[["bloque","Lleva a un bloque"],["enlace","Abre un enlace"]].map(([modo,txt])=>{
                    const on=esEnlace===(modo==="enlace");
                    return(
                    <button key={modo} onClick={()=>editPaso(nSel.id,"botones",(nSel.botones||[]).map((x,n)=>n!==k?x
                      :(modo==="enlace"?{...x,modo:"enlace",siguiente:""}:{...x,modo:"bloque",url:""})))}
                      style={{flex:1,padding:"6px 8px",borderRadius:999,border:"none",background:on?"#1A2032":"transparent",
                        color:on?"#F4F2ED":"#6B7484",fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>{txt}</button>);})}
                </div>

                {esEnlace
                  ?<>
                    <input value={b.url||""} onChange={e=>edBot("url",e.target.value)} placeholder="https://…"
                      style={{padding:"7px 10px",borderRadius:9,background:"#05060B",border:"1px solid "+(urlOk?"#262D40":"rgba(255,139,139,.45)"),color:"#F4F2ED",fontFamily:"ui-monospace, monospace",fontSize:11.5,outline:"none",width:"100%",boxSizing:"border-box"}}/>
                    <span style={{fontSize:11,color:urlOk?"#6B7484":"#FF8B8B",lineHeight:1.45}}>
                      {urlOk
                        ?"Al pulsarlo se abre la web y la cadena se corta ahí: Instagram no nos avisa de ese toque."
                        :(b.url||"").trim()
                          ?"Tiene que empezar por http:// o https://. Así como está, el servidor lo descarta y el botón no se envía."
                          :"Falta el enlace. Sin él este botón no se manda — el resto del mensaje sí."}
                    </span>
                  </>
                  :selDestino(b.siguiente,v=>edBot("siguiente",v),"— lleva a… —",nSel.id)}
              </div>);})}
            {(nSel.botones||[]).length<3&&
              <button onClick={()=>editPaso(nSel.id,"botones",[...(nSel.botones||[]),{id:ccId(),titulo:"",siguiente:"",url:""}])}
                style={{alignSelf:"flex-start",padding:"7px 14px",borderRadius:999,background:"transparent",border:"1px dashed #262D40",color:"#8E93A6",fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>+ Botón</button>}
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>
              Hasta 3 botones, 20 caracteres cada uno. <b style={{color:"#C9CFDC"}}>Sin al menos un botón que lleve a un bloque, la cadena termina aquí</b>: es el toque de la persona lo que abre la ventana de 24 h de Instagram, y el de enlace no cuenta porque Instagram no nos lo notifica.
            </span>
          </div>
          {/* Salida automática, sin esperar a que pulsen nada. Es lo que permite entregar algo y
              hacer seguimiento un rato después: mensaje → retraso → mensaje. */}
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("Y sin esperar respuesta, seguir con")}
            {selDestino(nSel.siguiente,v=>editPaso(nSel.id,"siguiente",v),"— nada, esperar al botón —",nSel.id)}
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>
              Se ejecuta al instante, justo después de enviar este mensaje. Para dejar pasar tiempo, apunta a un <b style={{color:"#C9CFDC"}}>retraso</b>.
            </span>
          </div>
        </>}

        {/* Condición: las dos ramas. */}
        {nSel.tipo==="condicion"&&(()=>{const que=nSel.que||"sigue";const C=CC_CONDICIONES[que];return(<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(tSel.detLabel)}
            <select value={que} onChange={e=>editPaso(nSel.id,"que",e.target.value)}
              style={{padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13,outline:"none",width:"100%",boxSizing:"border-box"}}>
              {Object.entries(CC_CONDICIONES).map(([k,c])=><option key={k} value={k}>{c.pregunta}</option>)}
            </select>
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>{C.hint}</span>
          </div>

          {que==="seguidores"&&<div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("A partir de cuántos seguidores")}
            <input type="number" min="0" value={nSel.minSeguidores||0} onChange={e=>editPaso(nSel.id,"minSeguidores",Math.max(0,Number(e.target.value)||0))}
              style={{padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13.5,outline:"none",width:"100%",boxSizing:"border-box"}}/>
          </div>}

          {/* La espera es lo que convierte "¿respondió?" en "¿no respondió en 3 horas?". */}
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("Esperar antes de comprobar")}
            {(()=>{const[v,u]=nSel.esperaMin?ccDescomponer(nSel.esperaMin):[0,60];return(
              <div style={{display:"flex",gap:8}}>
                <input type="number" min="0" value={nSel.esperaMin?v:0} onChange={e=>editPaso(nSel.id,"esperaMin",Math.max(0,Number(e.target.value)||0)*u)}
                  style={{width:88,padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13.5,outline:"none",boxSizing:"border-box"}}/>
                <select value={u} onChange={e=>editPaso(nSel.id,"esperaMin",(nSel.esperaMin?v:0)*Number(e.target.value))}
                  style={{flex:1,padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box"}}>
                  {CC_UNIDADES.map(([n,m])=><option key={m} value={m}>{n}</option>)}
                </select>
              </div>);})()}
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>
              {nSel.esperaMin?"Se comprobará pasado ese tiempo, no al momento.":"Cero = se comprueba al instante."}
            </span>
          </div>
          {!!nSel.esperaMin&&que==="respondio"&&
            <div style={{padding:"10px 12px",borderRadius:11,background:"rgba(239, 217, 160, 0.06)",border:"1px solid rgba(239, 217, 160, 0.28)",fontSize:11.5,color:"#EFD9A0",lineHeight:1.5}}>
              Si la espera pasa de <b>24 h</b> desde la última acción de la persona, el mensaje de la rama que toque no se podrá enviar. Es la ventana de Instagram.
            </div>}
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(C.si,{color:"#7FE8C0"})}
            {selDestino(nSel.siSi,v=>editPaso(nSel.id,"siSi",v),"— terminar la cadena —",nSel.id)}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(C.no,{color:"#FF8B8B"})}
            {selDestino(nSel.siNo,v=>editPaso(nSel.id,"siNo",v),"— terminar la cadena —",nSel.id)}
          </div>
        </>);})()}

        {/* Retraso: cantidad, unidad y salida. */}
        {nSel.tipo==="retraso"&&(()=>{const[v,u]=ccDescomponer(nSel.minutos);return(<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(tSel.detLabel)}
            <div style={{display:"flex",gap:8}}>
              <input type="number" min="1" value={v} onChange={e=>editPaso(nSel.id,"minutos",Math.max(1,Number(e.target.value)||1)*u)}
                style={{width:88,padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13.5,outline:"none",boxSizing:"border-box"}}/>
              <select value={u} onChange={e=>editPaso(nSel.id,"minutos",v*Number(e.target.value))}
                style={{flex:1,padding:"10px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13,outline:"none",boxSizing:"border-box"}}>
                {CC_UNIDADES.map(([n,m])=><option key={m} value={m}>{n}</option>)}
              </select>
            </div>
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>{tSel.hint}</span>
          </div>
          <div style={{padding:"10px 12px",borderRadius:11,background:"rgba(239, 217, 160, 0.06)",border:"1px solid rgba(239, 217, 160, 0.28)",fontSize:11.5,color:"#EFD9A0",lineHeight:1.5}}>
            Instagram solo deja escribir dentro de las <b>24 h</b> desde la última acción de la persona. Una espera más larga que eso fallará salvo que vuelva a interactuar. Además el reloj se revisa cada 10 minutos, así que la espera real puede pasarse un poco.
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta("Después continuar con")}
            {selDestino(nSel.siguiente,x=>editPaso(nSel.id,"siguiente",x),"— terminar la cadena —",nSel.id)}
          </div>
        </>);})()}

        {/* Acción: aviso interno. */}
        {nSel.tipo==="accion"&&<>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {etiqueta(tSel.detLabel)}
            <textarea value={nSel.texto||""} onChange={e=>editPaso(nSel.id,"texto",e.target.value)} placeholder={tSel.ph} rows={5}
              style={{resize:"vertical",padding:"11px 13px",borderRadius:11,background:"#0B0E17",border:"1px solid #262D40",color:"#F4F2ED",fontFamily:"inherit",fontSize:13,lineHeight:1.5,outline:"none",boxSizing:"border-box",width:"100%"}}/>
            <span style={{fontSize:11.5,color:"#6B7484",lineHeight:1.5}}>Llega como aviso al equipo en la campanita de la app. La persona no ve nada de esto.</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
