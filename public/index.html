            <div className="num" style={{fontSize:12,color:"var(--tx2)"}}>{r.date}</div>
            <div className="num" style={{fontSize:13,fontWeight:600,color:"var(--success)"}}>{fP(r.co&&plans[r.co.plan]?Math.round(plans[r.co.plan].price/2):0)}</div>
            <span style={{fontSize:11,color:"var(--accent)"}}><Ic n="paperclip" s={12} style={{display:"inline"}}/> comprobante</span>
          </div>);
        })}</div>
      </div>)}

      <Bt v="p" onClick={()=>{DB.save("billRcpts",billRcpts);addN("✅ Facturación guardada");}} icon="save" style={{width:"100%",marginTop:12,justifyContent:"center"}}>Guardar facturación</Bt>
    </div>)}

    {/* REGISTER MODAL */}
    <Md open={showReg} onClose={()=>sShowReg(false)} title={tab==="team"?"Registrar pago al equipo":"Registrar cobro"} width={480}>
      {tab==="team"?(<div>
        <Fd label="Colaborador"><select value={f.userId} onChange={e=>sF({...f,userId:parseInt(e.target.value)})}>{users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></Fd>
        <Fd label="Monto"><input value={f.amount} onChange={e=>sF({...f,amount:e.target.value})} placeholder="420000" type="number"/></Fd>
        <Fd label="Concepto"><input value={f.concept} onChange={e=>sF({...f,concept:e.target.value})} placeholder="Pago abril — Edición videos"/></Fd>
        <Fd label="Fecha"><input type="date" value={f.date} onChange={e=>sF({...f,date:e.target.value})}/></Fd>
        <Fd label="Comprobante"><label style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"var(--bg3)",border:"1px dashed var(--border2)",borderRadius:10,cursor:"pointer",fontSize:13,color:"var(--tx2)"}}><Ic n="paperclip" s={16}/>{pImg?"Archivo seleccionado ✓":"Subir comprobante"}<input type="file" accept="image/*" onChange={hImg} style={{display:"none"}}/></label></Fd>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}><Bt v="s" onClick={()=>sShowReg(false)}>Cancelar</Bt><Bt v="p" onClick={add} disabled={!f.amount} icon="check">Registrar pago</Bt></div>
      </div>):(<div style={{textAlign:"center",padding:20,color:"var(--tx3)"}}><Ic n="paperclip" s={28} c="var(--tx3)"/><div style={{marginTop:8,fontSize:14}}>Sube comprobantes desde la tabla de cuotas</div></div>)}
    </Md>
  </div>);
}

function AutoTx({value,onChange,placeholder,style,...props}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current){ref.current.style.height="auto";ref.current.style.height=ref.current.scrollHeight+"px";}},[value]);
  return(<textarea ref={ref} value={value||""} onChange={onChange} placeholder={placeholder} {...props} style={{...style,overflow:"hidden",resize:"none",minHeight:32,transition:"height .1s ease"}}/>);
}

// ═══ WEEK PLANNER ══════════════════════════════════════════════
// ═══ CALENDARIO MENSUAL (Org Semanal · vista Mes) ═══════════════
// Dos capas sobre el mismo mes:
//   · "cliente"  → publicaciones que el cliente agendó desde su portal (tasks con fecha)
//   · "interno"  → la planificación del equipo (ítems de Org Semanal + días de grabación)
// Se consulta, no se edita: el cliente agenda en su portal y aquí el equipo mira.
function MesPlanner({tasks,cos,planners,addN,soloEmpresa}){
  const hoy=new Date();
  const[cM,sCM]=useState(hoy.getMonth());
  const[cY,sCY]=useState(hoy.getFullYear());
  const[capa,sCapa]=useState("cliente");
  const[filtroCo,sFiltroCo]=useState(soloEmpresa!=null?String(soloEmpresa):"all");
  useEffect(()=>{if(soloEmpresa!=null)sFiltroCo(String(soloEmpresa));},[soloEmpresa]);
  const[selDia,sSelDia]=useState(null);
  const[abierto,sAbierto]=useState({});

  const dsDe=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const hoyDs=dsDe(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  const colorCo=id=>cos.find(c=>String(c.id)===String(id))?.color||D.tx4;
  const nombreCo=id=>cos.find(c=>String(c.id)===String(id))?.name||"—";

  // Celdas del mes, empezando en lunes
  const celdas=useMemo(()=>{
    const primer=new Date(cY,cM,1).getDay(),off=primer===0?6:primer-1;
    const dim=new Date(cY,cM+1,0).getDate(),out=[];
    for(let i=0;i<off;i++)out.push(null);
    for(let i=1;i<=dim;i++)out.push({day:i,ds:dsDe(cY,cM,i)});
    return out;
  },[cM,cY]);

  // Días de grabación: viven en localStorage por semana y empresa (grab_<lunes>_<empresa>),
  // así que para pintar un mes hay que recorrer todas las semanas que lo tocan.
  const grabaciones=useMemo(()=>{
    const out={};
    const ini=new Date(cY,cM,1),fin=new Date(cY,cM+1,0);
    const cur=new Date(ini);
    const dow=cur.getDay();cur.setDate(cur.getDate()-(dow===0?6:dow-1));
    while(cur<=fin){
      const lunes=dsDe(cur.getFullYear(),cur.getMonth(),cur.getDate());
      cos.forEach(c=>{
        try{
          const raw=localStorage.getItem("grab_"+lunes+"_"+String(c.id));
          if(!raw)return;
          const obj=JSON.parse(raw);
          Object.entries(obj).forEach(([ds,arr])=>{
            (arr||[]).forEach(e=>{(out[ds]=out[ds]||[]).push({...e,companyId:c.id,company:c.name});});
          });
        }catch(_){}
      });
      cur.setDate(cur.getDate()+7);
    }
    return out;
  },[cM,cY,cos]);

  // Piezas por día según la capa activa
  const porDia=useMemo(()=>{
    const m={};
    const pref=cY+"-"+String(cM+1).padStart(2,"0");
    if(capa==="cliente"){
      tasks.forEach(t=>{
        if(!t.date||!t.date.startsWith(pref))return;
        if(!["aprobado","publicado"].includes(t.state))return;
        if(filtroCo!=="all"&&String(t.companyId)!==String(filtroCo))return;
        (m[t.date]=m[t.date]||[]).push({
          id:t.id,tipo:t.type,titulo:t.title,companyId:t.companyId,
          hora:t.publishTime||"",estado:t.state,desc:t.description||"",
          files:t.files||[],origen:"cliente",
        });
      });
    }else{
      // Ítems del planner semanal
      planners.forEach(p=>{
        if(filtroCo!=="all"&&String(p.companyId)!==String(filtroCo))return;
        (p.items||[]).forEach(it=>{
          if(!it.day||!it.day.startsWith(pref))return;
          (m[it.day]=m[it.day]||[]).push({
            id:it.id,tipo:it.type,titulo:it.title,companyId:p.companyId,
            hora:"",estado:"planificado",desc:it.description||"",estrategia:it.strategy||"",
            origen:"interno",
          });
        });
      });
      // Tareas internas con fecha (aún no aprobadas por el cliente)
      tasks.forEach(t=>{
        if(!t.date||!t.date.startsWith(pref))return;
        if(["aprobado","publicado"].includes(t.state))return;
        if(filtroCo!=="all"&&String(t.companyId)!==String(filtroCo))return;
        (m[t.date]=m[t.date]||[]).push({
          id:t.id,tipo:t.type,titulo:t.title,companyId:t.companyId,
          hora:"",estado:t.state,desc:t.description||"",files:t.files||[],origen:"interno",
        });
      });
    }
    return m;
  },[tasks,planners,capa,filtroCo,cM,cY]);

  // Agrupa las piezas de un día por empresa, para pintar una fila por marca
  const porEmpresa=ds=>{
    const g={};
    (porDia[ds]||[]).forEach(p=>{(g[p.companyId]=g[p.companyId]||[]).push(p);});
    return Object.entries(g).map(([id,arr])=>({companyId:id,items:arr}));
  };

  const totalMes=Object.values(porDia).reduce((s,a)=>s+a.length,0);
  const conteoCo=id=>Object.values(porDia).flat().filter(p=>String(p.companyId)===String(id)).length;

  const tiposPresentes=useMemo(()=>{
    const set=new Set();Object.values(porDia).flat().forEach(p=>set.add(p.tipo));
    return [...set];
  },[porDia]);

  const irMes=n=>{let m=cM+n,y=cY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}sCM(m);sCY(y);sSelDia(null);};
  const items=selDia?(porDia[selDia]||[]):[];
  const grabs=selDia?(grabaciones[selDia]||[]):[];

  const capaChip=(k,l,dot)=>(
    <button key={k} onClick={()=>{sCapa(k);sSelDia(null);}} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"7px 18px",borderRadius:999,border:"none",background:capa===k?D.cian:"transparent",color:capa===k?D.bg:D.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:capa===k?D.bg:dot}}/>{l}
    </button>);

  return(<div>
    {/* Cabecera de controles */}
    <div style={{...D_MARCO,marginBottom:24}}>
      <div style={D_CARD}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:14,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>irMes(-1)} style={dNav()}>‹</button>
            <span style={{fontFamily:"var(--font-mono)",fontSize:15,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",color:D.tx}}>{MO[cM]} {cY}</span>
            <button onClick={()=>irMes(1)} style={dNav()}>›</button>
            <button onClick={()=>{sCM(hoy.getMonth());sCY(hoy.getFullYear());sSelDia(null);}} style={{padding:"7px 14px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>Hoy</button>
          </div>
          <div style={dGrupo}>
            {capaChip("cliente","Cliente",D.cian)}
            {capaChip("interno","Interno",D.lav)}
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:16,minHeight:26}}>
          <button onClick={()=>sFiltroCo("all")} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"6px 13px",borderRadius:999,background:filtroCo==="all"?"rgba(111,231,242,.1)":"transparent",border:"1px solid "+(filtroCo==="all"?"rgba(111,231,242,.45)":D.line2),color:filtroCo==="all"?D.cian:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
            Todas<span style={{fontFamily:"var(--font-mono)",fontSize:10.5}}>{totalMes}</span>
          </button>
          {cos.map(c=>{const on=String(filtroCo)===String(c.id);const n=conteoCo(c.id);return(
            <button key={c.id} onClick={()=>sFiltroCo(on?"all":String(c.id))} style={{display:"inline-flex",alignItems:"center",gap:7,padding:"6px 13px",borderRadius:999,background:on?c.color+"1a":"transparent",border:"1px solid "+(on?c.color+"73":D.line2),color:on?c.color:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
              <span style={{width:7,height:7,borderRadius:"50%",background:c.color}}/>{c.name}
              <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,color:on?c.color:D.tx4}}>{n}</span>
            </button>);})}
          <span style={{marginLeft:"auto",fontSize:12,color:D.tx3}}>
            {totalMes===0?"Nada agendado este mes":`${totalMes} ${totalMes===1?"publicación":"publicaciones"} · capa ${capa==="cliente"?"del cliente":"interna"}`}
          </span>
        </div>
      </div>
    </div>

    <div style={{display:"flex",gap:18,alignItems:"flex-start",flexWrap:"wrap"}}>
      {/* Rejilla del mes */}
      <div style={{flex:"1 1 560px",minWidth:0,...D_MARCO,borderRadius:20,padding:5}}>
        <div style={{borderRadius:16,background:D.panel3,border:"1px solid rgba(200,210,228,.08)",overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
            {["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"].map(d=>(
              <span key={d} style={{padding:"11px 0 9px",textAlign:"center",fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",color:D.tx4,borderBottom:"1px solid "+D.line15}}>{d}</span>))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,background:D.line15}}>
            {celdas.map((c,i)=>{
              if(!c)return <div key={"e"+i} style={{minHeight:94,background:"#06080D"}}/>;
              const emps=porEmpresa(c.ds);
              const hayGrab=(grabaciones[c.ds]||[]).length>0&&capa==="interno";
              const esHoy=c.ds===hoyDs, sel=selDia===c.ds;
              return(<button key={c.ds} onClick={()=>sSelDia(sel?null:c.ds)}
                style={{position:"relative",minHeight:94,minWidth:0,padding:"8px 8px 9px",background:sel?"rgba(111,231,242,.07)":"#080B12",border:"none",boxShadow:sel?"inset 0 0 0 1.5px "+D.cian:(esHoy?"inset 0 0 0 1.5px rgba(155,180,255,.5)":"none"),cursor:"pointer",fontFamily:"inherit",textAlign:"left",display:"flex",flexDirection:"column",gap:7,alignItems:"stretch",transition:"background .2s"}}>
                <span style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:22,height:22,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--font-mono)",fontSize:11.5,fontWeight:700,color:esHoy?D.bg:(emps.length?D.tx:D.tx4),background:esHoy?D.peri:"transparent",flexShrink:0}}>{c.day}</span>
                  {hayGrab&&<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 7px",borderRadius:6,background:"rgba(255,107,107,.1)",border:"1px solid rgba(255,107,107,.45)",color:D.rojo,fontSize:8.5,fontWeight:700,letterSpacing:".08em"}}>GRAB</span>}
                </span>
                <span style={{display:"flex",flexDirection:"column",gap:4}}>
                  {emps.slice(0,3).map(e=>(
                    <span key={e.companyId} style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{width:7,height:7,borderRadius:"50%",background:colorCo(e.companyId),flexShrink:0}}/>
                      <span style={{display:"flex",gap:3,alignItems:"center",flex:"1 1 auto",minWidth:0,overflow:"hidden"}}>
                        {e.items.slice(0,4).map((p,k)=>(
                          <span key={k} title={p.titulo} style={{width:12,height:5,borderRadius:3,background:TT[p.tipo]?.c||D.tx4,opacity:p.estado==="publicado"?.45:1,flexShrink:0}}/>))}
                        {e.items.length>4&&<span style={{fontFamily:"var(--font-mono)",fontSize:9,color:D.tx4}}>+{e.items.length-4}</span>}
                      </span>
                      <span style={{fontFamily:"var(--font-mono)",fontSize:10,fontWeight:700,color:colorCo(e.companyId)}}>{e.items.length}</span>
                    </span>))}
                  {emps.length>3&&<span style={{fontFamily:"var(--font-mono)",fontSize:9,color:D.tx4,paddingLeft:12}}>+{emps.length-3} marcas</span>}
                </span>
              </button>);})}
          </div>
          {tiposPresentes.length>0&&<div style={{display:"flex",gap:12,flexWrap:"wrap",padding:"10px 14px",borderTop:"1px solid "+D.line15}}>
            {tiposPresentes.map(t=>(
              <span key={t} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:10,color:D.tx3}}>
                <span style={{width:12,height:5,borderRadius:3,background:TT[t]?.c||D.tx4}}/>{TT[t]?.l||t}
              </span>))}
          </div>}
        </div>
      </div>

      {/* Panel del día seleccionado */}
      <div style={{flex:"1 1 280px",maxWidth:360,position:"sticky",top:16,...D_MARCO,borderRadius:20,padding:5}}>
        <div style={{borderRadius:16,background:"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)",padding:16,display:"flex",flexDirection:"column",gap:11,maxHeight:"76vh",overflow:"auto"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:10}}>
            <div style={{display:"flex",flexDirection:"column",gap:2,minWidth:0}}>
              <span style={{fontSize:17,fontWeight:700,color:D.tx,whiteSpace:"nowrap"}}>
                {selDia?`${parseInt(selDia.slice(8))} de ${MO[cM]}`:"Elige un día"}
              </span>
              <span style={{fontSize:11,color:D.tx4}}>
                {selDia?`${items.length} ${items.length===1?"pieza":"piezas"}${grabs.length&&capa==="interno"?` · ${grabs.length} grabación`:""}`:"Toca una celda del calendario"}
              </span>
            </div>
            <span style={{padding:"3px 10px",borderRadius:999,border:"1px solid "+(capa==="cliente"?"rgba(111,231,242,.45)":"rgba(201,191,255,.45)"),color:capa==="cliente"?D.cian:D.lav,fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".16em",flexShrink:0}}>{capa==="cliente"?"CLIENTE":"INTERNO"}</span>
          </div>

          {capa==="interno"&&grabs.map((g,i)=>(
            <div key={i} style={{borderRadius:12,background:"rgba(255,107,107,.05)",border:"1px solid rgba(255,107,107,.4)",padding:"11px 13px",display:"flex",flexDirection:"column",gap:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <Ic n="camera" s={14} c={D.rojo}/>
                <span style={{fontSize:12.5,fontWeight:700,color:D.rojo}}>Día de grabación</span>
                {g.time&&<span style={{marginLeft:"auto",fontFamily:"var(--font-mono)",fontSize:11,color:D.rojo}}>{g.time}</span>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:colorCo(g.companyId)}}/>
                <span style={{fontSize:11.5,fontWeight:600,color:colorCo(g.companyId)}}>{g.company}</span>
              </div>
            </div>))}

          {selDia&&items.length===0&&grabs.length===0&&
            <span style={{fontSize:12.5,color:D.tx4,padding:"6px 2px"}}>
              {capa==="cliente"?"El cliente no agendó nada este día.":"Sin planificación interna este día."}
            </span>}

          {items.map(p=>{const ab=!!abierto[p.id];return(
            <div key={p.id} style={{borderRadius:12,border:"1px solid "+D.line2,background:D.panel,overflow:"hidden"}}>
              <button onClick={()=>sAbierto(o=>({...o,[p.id]:!o[p.id]}))} style={{width:"100%",boxSizing:"border-box",display:"flex",alignItems:"center",gap:10,padding:"9px 11px",background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                <span style={{width:36,height:36,borderRadius:8,background:(TT[p.tipo]?.c||D.tx4)+"26",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:15,overflow:"hidden"}}>
                  {p.files&&p.files[0]&&isImg(p.files[0])
                    ? <img src={fSrc(p.files[0])} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    : (TT[p.tipo]?.i||"•")}
                </span>
                <span style={{display:"flex",flexDirection:"column",gap:2,flex:"1 1 auto",minWidth:0}}>
                  <span style={{display:"flex",alignItems:"center",gap:6,minWidth:0,overflow:"hidden"}}>
                    <span style={{fontSize:10,fontWeight:700,color:TT[p.tipo]?.c,whiteSpace:"nowrap",flexShrink:0}}>{TT[p.tipo]?.l||p.tipo}</span>
                    <span style={{width:5,height:5,borderRadius:"50%",background:colorCo(p.companyId),flexShrink:0}}/>
                    <span style={{fontSize:10,color:colorCo(p.companyId),fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nombreCo(p.companyId)}</span>
                    {p.hora&&<span style={{fontFamily:"var(--font-mono)",fontSize:10,color:D.tx3,flexShrink:0}}>{p.hora}</span>}
                  </span>
                  <span style={{fontSize:12.5,fontWeight:600,color:D.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.titulo}</span>
                </span>
                <span style={{padding:"3px 9px",borderRadius:999,background:(SS[p.estado]?.c||D.tx4)+"1f",border:"1px solid "+(SS[p.estado]?.c||D.tx4)+"59",color:SS[p.estado]?.c||D.tx3,fontSize:9.5,fontWeight:700,flexShrink:0,whiteSpace:"nowrap"}}>{SS[p.estado]?.l||p.estado}</span>
              </button>
              {ab&&<div style={{padding:"0 11px 12px",display:"flex",flexDirection:"column",gap:9}}>
                {p.files&&p.files[0]&&<div onClick={()=>openZoom(p.files,0)} style={{height:110,borderRadius:10,overflow:"hidden",cursor:"zoom-in",background:D.panel3}}>
                  <DeckMedia f={p.files[0]} h={110} fit="cover"/>
                </div>}
                {p.desc&&<div style={{display:"flex",flexDirection:"column",gap:3}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".18em",textTransform:"uppercase",color:D.tx4}}>Descripción</span>
                  <span style={{fontSize:12,color:D.tx2,lineHeight:1.55}}>{p.desc}</span>
                </div>}
                {p.estrategia&&<div style={{display:"flex",flexDirection:"column",gap:3}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".18em",textTransform:"uppercase",color:D.tx4}}>Estrategia</span>
                  <span style={{fontSize:12,color:D.tx2,lineHeight:1.55}}>{p.estrategia}</span>
                </div>}
              </div>}
            </div>);})}
        </div>
      </div>
    </div>
  </div>);
}

function WeekPlanner({tasks,sT,cos,users,planners,sPlanners,pDrafts,sPDrafts,fCo,addN,avisar,correosDe,cu}){
  const[wkOff,sWkOff]=useState(0);const[dragItem,sDragItem]=useState(null);const[dragOver,sDragOver]=useState(null);
  const[selCo,sSelCo]=useState(()=>fCo!=="all"?String(fCo):cos[0]?String(cos[0].id):"0");
  // Sync with topbar filter
  useEffect(()=>{if(fCo!=="all")sSelCo(String(fCo));},[fCo]);
  // Ensure valid company when cos loads
  useEffect(()=>{if(selCo==="0"&&cos.length>0)sSelCo(String(cos[0].id));},[cos,selCo]);
  const co=cos.find(c=>String(c.id)===String(selCo));

  const weekDays=useMemo(()=>{
    const now=new Date();now.setDate(now.getDate()+wkOff*7);const dow=now.getDay();const mon=dow===0?6:dow-1;
    const start=new Date(now);start.setDate(start.getDate()-mon);const today=new Date();const days=[];
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push({date:d,ds:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),day:d.getDate(),month:MO[d.getMonth()],dayName:["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"][i],dayShort:["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"][i],isToday:d.toDateString()===today.toDateString()});}
    return days;
  },[wkOff]);

  const weekKey=weekDays[0]?.ds+"_"+String(selCo);
  const plan=planners.find(p=>p.weekKey===weekKey)||{weekKey,companyId:selCo,items:[]};
  const items=plan.items||[];
  const dayItems=day=>items.filter(it=>it.day===day).sort((a,b)=>(a.order||0)-(b.order||0));

  const updatePlan=(newItems)=>{
    const np={...plan,items:newItems,weekKey,companyId:selCo,companyName:co?.name||""};
    sPlanners(prev=>{const idx=prev.findIndex(p=>p.weekKey===weekKey);if(idx>=0){const u=[...prev];u[idx]=np;return u;}return[...prev,np];});
  };

  const addItem=(day)=>{const ni2={id:String(Date.now())+Math.floor(Math.random()*1000),day,type:"post",title:"",description:"",strategy:"",production:[],state:"borrador",order:dayItems(day).length};updatePlan([...items,ni2]);};
  const updateItem=(id,u)=>updatePlan(items.map(it=>it.id===id?{...it,...u}:it));
  // Borrar una pieza aquí también la saca de Contenido. Antes solo desaparecía del planner
  // y su tarea quedaba huérfana: la pieza seguía en Contenido para siempre, porque nada
  // volvía a mirarla. El barrido lo hacía de rebote el viejo "Guardar y sincronizar", que
  // recreaba la semana entera, y solo si alguien se acordaba de pulsarlo.
  const borrarTareasDe=(ids)=>{
    const set=new Set(ids.map(String));
    sT(prev=>{
      const result=prev.filter(t=>!(t.itemId!==undefined&&set.has(String(t.itemId))));
      if(result.length!==prev.length)DB.save("tasks",result);
      return result;
    });
  };
  const removeItem=async(id)=>{
    const tarea=tasks.find(t=>String(t.itemId)===String(id));
    const enPortal=salioAlPortal(tarea);
    const aviso=enPortal
      ? "Esta pieza ya pasó por el portal del cliente. Si la eliminas se va también de Contenido, con sus votos, archivos, correcciones y la respuesta del cliente. ¿Eliminar igual?"
      : tarea ? "Se elimina del planner y también de Contenido. ¿Eliminar?"
      : "¿Eliminar este contenido?";
    if(!confirm(aviso))return;
    const newItems=items.filter(it=>it.id!==id);updatePlan(newItems);
    borrarTareasDe([id]);
    // Se relee fresco y solo se toca NUESTRA semana. loadAllStrict lanza si la lectura falla:
    // con el loadAll tolerante, un fallo devolvía {}, `fresh.planners||[]` daba [] y se escribía
    // un array con solo esta semana ENCIMA de las de todas las demás empresas, borrándolas.
    try{const fresh=await DB.loadAllStrict();const freshPlanners=fresh.planners||[];
      const updated=freshPlanners.some(p=>p.weekKey===weekKey)?freshPlanners.map(p=>p.weekKey===weekKey?{...p,items:newItems}:p):[...freshPlanners,{weekKey,companyId:selCo,companyName:co?.name||"",items:newItems}];
      await DB.save("planners",updated);sPlanners(updated);
    }catch(e){console.error("Safe remove error:",e);addN("❌ No se pudo guardar, revisa tu conexión");}};
  const clearWeek=async()=>{
    const conTarea=items.filter(it=>tasks.some(t=>String(t.itemId)===String(it.id))).length;
    if(!confirm("¿Limpiar TODA la semana de "+co?.name+"?"+(conTarea?" Se van también las "+conTarea+" pieza"+(conTarea===1?"":"s")+" que ya están en Contenido.":"")+" Esto no se puede deshacer."))return;
    const idsFuera=items.map(it=>it.id);
    updatePlan([]);
    borrarTareasDe(idsFuera);
    // loadAllStrict, mismo motivo: con el loadAll tolerante un fallo daba [] y `[].map()` era []
    // → se guardaba un planners vacío ENCIMA de todo, borrando las semanas de todas las empresas.
    try{const fresh=await DB.loadAllStrict();const freshPlanners=fresh.planners||[];
      const updated=freshPlanners.map(p=>p.weekKey===weekKey?{...p,items:[]}:p);
      await DB.save("planners",updated);sPlanners(updated);addN("🗑 Semana limpiada");
    }catch(e){console.error("Safe clear error:",e);addN("❌ No se pudo guardar, revisa tu conexión");}};
  const moveItem=(itemId,toDay)=>{updatePlan(items.map(it=>it.id===itemId?{...it,day:toDay,order:dayItems(toDay).length}:it));sDragItem(null);sDragOver(null);};

  // ── Confirmación pieza por pieza ────────────────────────────────────────────
  // Antes había un solo botón para toda la semana, que hacía dos cosas a la vez: grabar el
  // planner y volcarlo al calendario. Eso obligaba a acordarse de pulsarlo para no perder
  // lo escrito, y mandaba al calendario piezas a medio llenar. Ahora el planner se guarda
  // solo (ver el efecto de `planners` en Main) y cada tarjeta decide cuándo sale.
  const[confirmando,sConfirmando]=useState(null);
  const hoyY=new Date().getFullYear(), hoyM=new Date().getMonth();
  // Aquí también se sube material, así que aquí también hay que avisar si el almacenamiento
  // no está disponible. Sin archivo no se puede marcar Listo ni enviar al portal —y el portal
  // tampoco muestra piezas sin material—, con lo que un fallo de Storage bloquea el flujo
  // entero sin decir por qué.
  const[stReady,sStReady]=useState(true);
  const[stMotivo,sStMotivo]=useState("");
  useEffect(()=>{API.uploadStatus().then(d=>{sStReady(!!d.ready);sStMotivo(d.motivo||"");});},[]);

  // Firma de los campos que se vuelcan a la tarea. Si cambia alguno, la pieza vuelve a
  // quedar por confirmar: lo que hay en Contenido dejó de reflejar lo que dice el planner.
  // El campo de automatización se AÑADE solo cuando está activo, en vez de ser siempre el 9º
  // elemento: así las piezas ya confirmadas (que no lo tienen) conservan su firma de 8 campos y
  // no se marcan de golpe como "sin confirmar" al desplegar. Solo cambia la firma de las piezas
  // que de verdad llevan automatización.
  const firmaItem=it=>JSON.stringify([it.type,(it.title||"").trim(),(it.description||"").trim(),(it.strategy||"").trim(),[...(it.production||[])].sort(),it.day,it.state||"borrador",(it.files||[]).map(f=>f.url||f.name||"")].concat(it.autoComentario?["auto"]:[]));
  const confirmada=it=>{
    if(it.confirmadaSig)return it.confirmadaSig===firmaItem(it);
    // Piezas de semanas anteriores a este cambio: no tienen firma, pero si ya tienen su
    // tarea en Contenido es que en su momento se sincronizaron. Se dan por confirmadas para
    // no marcar como pendiente media agenda vieja; en cuanto se confirmen una vez quedan
    // con firma y a partir de ahí sí se detectan los cambios.
    return tasks.some(t=>String(t.itemId)===String(it.id));
  };
  const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h).toString(36);};

  const confirmarItem=async(it)=>{
    const titulo=(it.title||"").trim();
    if(!titulo&&!(it.description||"").trim()){addN("⚠️ Escribe al menos un título para confirmar la pieza");return;}
    sConfirmando(it.id);
    const plannerTag="planner_"+weekKey;
    try{
      // Se relee de Supabase ANTES de decidir nada. `vieja` y las guardas de abajo tienen que
      // mirar el estado REAL, no la copia en memoria del arranque: un equipo con Org Semanal
      // abierto desde la mañana, si el cliente aprobó a mediodía, veía la pieza todavía en
      // en_aprobacion y al reconfirmar le borraba la aprobación y le devolvía el día del planner.
      // El volcado de tareas se hace además sobre esta MISMA copia fresca, no sobre la de memoria,
      // para no revertir lo que otros hayan tocado esa mañana. loadAllStrict lanza si la lectura
      // falla, así que un fallo de red aborta en el catch en vez de escribir a ciegas.
      const fresh=await DB.loadAllStrict();
      const freshTasks=Array.isArray(fresh.tasks)?fresh.tasks:[];
      const vieja=freshTasks.find(t=>String(t.itemId)===String(it.id));
      // Una vez que la pieza salió al portal manda lo que pasó allá —su estado, su fecha y su
      // material—, no lo que diga el planner. Una pieza rechazada no se elimina, se arregla.
      const enElPortal=salioAlPortal(vieja);
      // Aprobada por el cliente, la fecha de publicación es suya y "sin fecha" es válido (está en
      // su banco esperando que la agende). Sin distinguirlo, reconfirmar le devolvía el día del
      // planner y le reagendaba la pieza por su cuenta.
      const clienteAprobo=vieja?.clientApproval?.status==="aprobado";
      // Traducción de estados planner→tarea, calculada antes del objeto para poder aplicarle la
      // invariante de fecha. Confirmar significa que la pieza sale, así que el peor caso es "en
      // producción", nunca "no_realizado" (que Contenido no dibuja).
      const estadoFinal=enElPortal?vieja.state:({
        publicado:"publicado",
        aprobado:"aprobado",
        en_aprobacion:"en_aprobacion",
      }[it.state]||"en_proceso");
      const tarea={
        ...(vieja||{}),
        id:vieja?vieja.id:uid(),
        itemId:it.id,
        title:titulo||(TT[it.type]?.l||"Contenido")+" "+(co?.name||""),
        company:co?.name||"",
        companyId:parseInt(selCo)||0,
        type:it.type,
        description:(it.description||"")+(it.strategy?"\n\n📌 Estrategia: "+it.strategy:""),
        responsable:it.production||[],
        // Invariante "aprobado ⇒ sin fecha": si el equipo marca la pieza como Aprobada desde Org
        // Semanal (sin pasar por el portal), va al banco "Listo para agendar" —date:null— con el
        // día del equipo guardado en plannedDay como recomendación, igual que cuando aprueba el
        // cliente. Antes quedaba fijada a it.day, agendada a un día que nadie eligió.
        date:clienteAprobo?(vieja.date||null):(estadoFinal==="aprobado"?null:(enElPortal&&vieja.date?vieja.date:it.day)),
        state:estadoFinal,
        comments:vieja?vieja.comments||[]:[],
        votes:{...(it.votes||{}),...(vieja?.votes||{})},
        clientApproval:vieja?vieja.clientApproval||null:null,
        files:enElPortal?(vieja.files||[]):((it.files||[]).length?it.files:(vieja?vieja.files||[]:[])),
        // El día que planificó el equipo, guardado aparte de `date`. Una vez que el cliente
        // aprobó, plannedDay es el ancla de facturación (el mes en que se gastó el cupo) y NO se
        // reescribe: si tomara `it.day`, mover la pieza de semana en Org Semanal y reconfirmar
        // movería el cupo ya gastado a otro mes.
        plannedDay:clienteAprobo?(vieja.plannedDay||vieja.date||it.day):(it.day||vieja?.plannedDay||null),
        // El switch de automatización viaja del item a la tarea: manda el interruptor de Org
        // Semanal. Contenido → Automatización usa esto para listar las piezas que esperan cadena.
        autoComentario:!!it.autoComentario,
        // Estado del ciclo de la automatización, que también ve el cliente en su portal:
        // "pendiente" (marcada, sin cadena) → "lista" (cadena armada) → "armada" (activa tras
        // publicar). Si ya iba lista/armada no se degrada al reconfirmar; si el switch se apaga,
        // se limpia.
        autoEstado:!it.autoComentario?null:(["lista","armada"].includes(vieja?.autoEstado)?vieja.autoEstado:"pendiente"),
        plannerTag,
      };
      const sig=firmaItem(it);
      const nuevosItems=items.map(x=>x.id===it.id?{...x,confirmadaSig:sig,confirmadaAt:new Date().toISOString()}:x);
      const fp=Array.isArray(fresh.planners)?fresh.planners:planners;
      const np={...plan,items:nuevosItems,weekKey,companyId:selCo,companyName:co?.name||""};
      const all=fp.some(p=>p.weekKey===weekKey)?fp.map(p=>p.weekKey===weekKey?np:p):[...fp,np];
      await DB.save("planners",all);sPlanners(all);

      // El volcado de la tarea va sobre la copia FRESCA, no sobre la de memoria.
      const idx=freshTasks.findIndex(t=>String(t.itemId)===String(it.id));
      const result=idx>=0?freshTasks.map((t,i)=>i===idx?{...tarea,id:t.id}:t):[...freshTasks,tarea];
      const guardado=await DB.save("tasks",result);
      if(!guardado){addN("❌ No se pudo guardar la pieza, revisa tu conexión");sConfirmando(null);return;}
      sT(result);

      // Al confirmar una pieza nueva se consume cupo del mes. Se avisa si ya no queda, pero no
      // se impide: producir de más es una decisión del equipo, y se factura aparte.
      const libre=vieja?null:(saldoDe(co,freshTasks,hoyY,hoyM).find(s=>s.tipo===it.type)?.libre??null);
      addN(vieja?"✅ Cambios confirmados en «"+tarea.title+"»"
        :libre!==null&&libre<=0?"⚠️ «"+tarea.title+"» está en Contenido, pero "+(co?.name||"la empresa")+" ya no tenía cupo de "+(TT[it.type]?.l||it.type)+" este mes"
        :"✅ «"+tarea.title+"» ya está en Contenido"+(libre!==null?" · quedan "+(libre-1)+" "+(TT[it.type]?.l||it.type):""));

      // Aviso por pieza: producción de esa tarjeta más los admins, deduplicado. Nunca a quien
      // confirma: ya sabe lo que acaba de hacer.
      const dest=otrosQueYo([...new Map([...users.filter(u=>(it.production||[]).includes(u.id)),...users.filter(u=>u.role==="admin")].map(u=>[u.id,u])).values()],cu);
      if(avisar&&dest.length)avisar({
        type:"asignacion",
        title:vieja?"📝 Pieza actualizada":"📋 Nueva pieza confirmada",
        body:tarea.title+" · "+(co?.name||"")+(it.day?" · "+it.day:""),
        to:correosDe(dest),url:"/",
        dedupKey:"item_"+it.id+"_"+hash(sig),
      });

      // Una pieza confirmada con material entra directa en la etapa Listo, o sea que abre la
      // votación. Solo se avisa a los votantes que TODAVÍA no votaron (mirando `tarea.votes`, ya
      // fusionado arriba): avisar a todos re-pingaba a quien ya había votado. El dedupKey va por
      // id de pieza, no por firma: por firma, cualquier edición posterior acuñaría clave nueva y
      // volvería a sonar. A quien confirma no se le avisa, como en el resto.
      const votos=tarea.votes||{};
      const aVotar=otrosQueYo(votantes(users).filter(u=>votos[u.id]===undefined),cu);
      const abiertaAVoto=!["en_aprobacion","aprobado","publicado"].includes(tarea.state)&&!tarea.clientApproval;
      if(avisar&&(tarea.files||[]).length&&abiertaAVoto&&aVotar.length)avisar({
        type:"votacion",
        title:"🗳 Contenido esperando tu voto",
        body:"«"+tarea.title+"» de "+(co?.name||"")+" quedó lista. Falta que votes para poder enviarla.",
        to:correosDe(aVotar),url:"/",
        dedupKey:"voto_item_"+it.id,
      });
    }catch(e){console.error("Confirmar item error:",e);addN("❌ No se pudo confirmar: "+e.message);}
    sConfirmando(null);
  };

  const dupWeek=()=>{const nextOff=wkOff+1;const now2=new Date();now2.setDate(now2.getDate()+nextOff*7);const dow2=now2.getDay();const mon2=dow2===0?6:dow2-1;
    const start2=new Date(now2);start2.setDate(start2.getDate()-mon2);const nDays=[];
    for(let i=0;i<7;i++){const d2=new Date(start2);d2.setDate(start2.getDate()+i);nDays.push(d2.getFullYear()+"-"+String(d2.getMonth()+1).padStart(2,"0")+"-"+String(d2.getDate()).padStart(2,"0"));}
    const newKey=nDays[0]+"_"+String(selCo);
    const dayMap={};weekDays.forEach((wd,i)=>{dayMap[wd.ds]=nDays[i];});
    // uid() en vez de `Date.now()+Math.random()*1000|0`: ese id se truncaba a 32 bits y, como
    // todos los items se crean en el mismo tick, la única entropía era ±1000 → ~10% de choque al
    // duplicar una semana de 15 piezas, y dos items con el mismo id se pisaban al editar/borrar.
    const dupItems=items.map(it=>({...it,id:uid(),day:dayMap[it.day]||it.day,state:"borrador"}));
    const np={weekKey:newKey,companyId:selCo,companyName:co?.name||"",items:dupItems};
    DB.loadAll().then(fresh=>{const fp=fresh.planners||planners;const newAll=[...fp,np];sPlanners(newAll);DB.save("planners",newAll);}).catch(()=>{const newAll=[...planners,np];sPlanners(newAll);DB.save("planners",newAll);});
    sWkOff(nextOff);addN("📋 Semana duplicada");};

  // Estados del rediseño: nombran el paso real del flujo, con el color y el realce que
  // define el diseño. Cuatro estados llevan brillo de fondo, pero SOLO dos laten:
  //   · Listo y Rechazado por cliente  → pulsan, porque piden acción ahora
  //   · Enviado al portal y Aprobado   → color mantenido, sin animación: son estados
  //                                      de espera/cierre, no urgencias
  const STATES={
    borrador:     {l:"Borrador",              c:"#8E93A6", bor:"#262D40"},
    en_proceso:   {l:"En producción",         c:"#EFD9A0", bor:"rgba(239,217,160,.4)"},
    listo:        {l:"Listo",                 c:"#8FF2C2", bor:"rgba(143,242,194,.4)",
                   glow:"linear-gradient(270deg, rgba(111,231,242,.2), rgba(111,231,242,.05) 50%, transparent)",
                   marco:"linear-gradient(160deg, rgba(200,210,228,.35), rgba(200,210,228,.08) 45%, rgba(155,180,255,.25))", late:true},
    en_aprobacion:{l:"Enviado al portal",     c:"#9BB4FF", bor:"rgba(155,180,255,.45)",
                   glow:"linear-gradient(270deg, rgba(155,180,255,.18), rgba(155,180,255,.04) 50%, transparent)",
                   marco:"linear-gradient(160deg, rgba(155,180,255,.4), rgba(155,180,255,.1) 45%, rgba(201,191,255,.3))"},
    rechazado:    {l:"Rechazado por cliente", c:"#FF8B8B", bor:"rgba(255,107,107,.4)",
                   glow:"linear-gradient(270deg, rgba(255,107,107,.2), rgba(255,107,107,.05) 50%, transparent)",
                   marco:"linear-gradient(160deg, rgba(255,139,139,.45), rgba(255,139,139,.1) 45%, rgba(255,107,107,.3))", late:true},
    aprobado:     {l:"Aprobado por cliente",  c:"#8FF2C2", bor:"rgba(143,242,194,.45)",
                   glow:"linear-gradient(270deg, rgba(143,242,194,.2), rgba(143,242,194,.05) 50%, transparent)",
                   marco:"linear-gradient(160deg, rgba(143,242,194,.4), rgba(143,242,194,.1) 45%, rgba(111,231,242,.25))"},
    publicado:    {l:"Publicado",             c:"#9BB4FF", bor:"rgba(155,180,255,.4)"},
  };
  // Candados del flujo. No se puede saltar pasos:
  //   · "Listo" exige que el archivo esté subido
  //   · "Enviado al portal" exige que hayan votado los cuatro que deciden y que nadie objete
  const votoResumen=it=>{
    const equipo=votantes(users);
    const v=it.votes||{};
    const emitidos=equipo.filter(u=>v[u.id]!==undefined);
    const aFavor=equipo.filter(u=>v[u.id]===true);
    const enContra=equipo.filter(u=>v[u.id]===false);
    return {equipo,emitidos,aFavor,enContra,faltan:equipo.length-emitidos.length,
            todosVotaron:emitidos.length===equipo.length&&equipo.length>0,
            todosAprueban:aFavor.length===equipo.length&&equipo.length>0};
  };
  const bloqueoEstado=(it,nuevo)=>{
    if(nuevo==="listo"&&!(it.files||[]).length)
      return "Primero sube el archivo: sin contenido no se puede marcar como Listo.";
    if(nuevo==="en_aprobacion"){
      if(!(it.files||[]).length)return "Falta subir el archivo antes de enviarlo al portal.";
      const r=votoResumen(it);
      if(r.enContra.length)return `${r.enContra.map(u=>u.name).join(", ")} ${r.enContra.length===1?"objetó":"objetaron"} — corrige antes de enviar al portal.`;
      if(!r.todosVotaron)return `Faltan ${r.faltan} ${r.faltan===1?"voto":"votos"} del equipo (${r.equipo.filter(u=>(it.votes||{})[u.id]===undefined).map(u=>u.name).join(", ")}).`;
      if(!r.todosAprueban)return "Todo el equipo tiene que aprobar antes de enviarlo al portal.";
    }
    return null;
  };
  const cambiarEstado=(it,nuevo)=>{
    const motivo=bloqueoEstado(it,nuevo);
    if(motivo)return addN("🔒 "+motivo);
    updateItem(it.id,{state:nuevo});
  };

  const [abierto,sAbierto]=useState({});      // ítems expandidos
  const [prodOpen,sProdOpen]=useState(null);  // desplegable de producción
  const [drvOpen,sDrvOpen]=useState(null);    // desplegable de drive
  const [guionOpen,sGuionOpen]=useState({});  // panel de guión por día

  // Los archivos van a Supabase Storage y en el item queda solo la URL. Antes se guardaban
  // en base64 dentro del propio item, o sea dentro de la fila `planners`, que `DB.loadAll()`
  // trae entera en cada carga y para todos los usuarios: un solo reel la infla decenas de MB.
  // Es la misma trampa que ya estaba documentada para `tasks`. `API.upload` cae a base64 por
  // su cuenta solo si el bucket no está configurado y el archivo es chico.
  const[subiendo,sSubiendo]=useState(null);
  const handleFiles=async(itemId,field,e)=>{
    const files=Array.from(e.target.files||[]);if(!files.length)return;
    e.target.value="";                    // permite volver a elegir el mismo archivo
    sSubiendo(itemId);
    try{
      const subidos=[];
      for(const f of files)subidos.push({...(await API.upload(f,selCo)),date:td()});
      const actual=items.find(it=>it.id===itemId)?.[field]||[];
      updateItem(itemId,{[field]:[...actual,...subidos]});
    }catch(err){addN("❌ "+err.message);}
    sSubiendo(null);
  };
  const removeFile=(itemId,field,idx)=>{const it=items.find(x=>x.id===itemId);if(!it)return;updateItem(itemId,{[field]:(it[field]||[]).filter((_,i)=>i!==idx)});};

  const[guiones,sGuionesLocal]=useState([]);
  const[grabRefresh,sGrabRefresh]=useState(0);
  // Los días de grabación vivían en localStorage, o sea que solo los veía quien los marcó y
  // el servidor no podía recordarlos. Ahora van a Supabase bajo la clave `grabs`, con la
  // fecha dentro de cada entrada para que el repaso diario los pueda leer.
  const[grabs,sGrabs]=useState({});
  useEffect(()=>{
    DB.loadAll().then(d=>{
      const raw=d.guiones?.length?d.guiones:JSON.parse(localStorage.getItem("inm_guiones")||"[]");
      sGuionesLocal(raw.map(x=>normG(x,cos)));
      const{grabs:g,migrado}=migrarGrabs(d.grabs);
      sGrabs(g);
      if(migrado)DB.save("grabs",g);   // se sube una sola vez lo que había en este navegador
    }).catch(()=>{
      try{sGuionesLocal(JSON.parse(localStorage.getItem("inm_guiones")||"[]").map(x=>normG(x,cos)));}catch{sGuionesLocal([]);}
      sGrabs(migrarGrabs(null).grabs);
    });
  },[grabRefresh]);
  const[vista,sVista]=useState("semana");
  const[driveOpen,sDriveOpen]=useState(false);
  const[lightbox,sLightbox]=useState(null);
  const[showGrabPicker,sShowGrabPicker]=useState(null);
  const[grabTime,sGrabTime]=useState("");
  const[expandedGrab,sExpandedGrab]=useState({});// {dayGrabKey: "guion"|"crono"|null}

  // Entradas: {id, day:"YYYY-MM-DD", guionId, time}, agrupadas por semana+empresa.
  const guardarGrabs=g=>{sGrabs(g);DB.save("grabs",g);};
  const linkGrab=(day,guionId,time)=>{
    const entry={id:String(Date.now())+Math.floor(Math.random()*1000),day,guionId:guionId||null,time:time||null,companyId:selCo,companyName:co?.name||""};
    guardarGrabs({...grabs,[weekKey]:[...(grabs[weekKey]||[]),entry]});
    sShowGrabPicker(null);sGrabTime("");addN("🎬 Día de grabación agregado");
    const gu=guionId?guiones.find(x=>String(x.id)===String(guionId)):null;
    if(avisar)avisar({type:"grabacion",title:"🎬 Nuevo día de grabación",
      body:(gu?gu.title:"Día de grabación")+" · "+day+(time?" "+time:"")+(co?" · "+co.name:""),
      to:correosDe(otrosQueYo(users,cu)),url:"/"});
  };
  const unlinkGrab=(day,entryId)=>guardarGrabs({...grabs,[weekKey]:(grabs[weekKey]||[]).filter(e=>e.id!==entryId)});
  const dayGrabEntries=(day)=>(grabs[weekKey]||[]).filter(e=>e.day===day).map(e=>({...e,guion:e.guionId?guiones.find(g=>String(g.id)===String(e.guionId)):null}));

  return(<div className="d-in">
    {/* ENCABEZADO — marca, empresas en chips, conmutador Semana/Mes, navegación y acciones */}
    <div style={{...D_MARCO,marginBottom:24}}>
      <div style={D_CARD}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <span style={{fontSize:26,fontWeight:700,letterSpacing:".04em",color:co?.color||D.cian}}>{co?.name?.toUpperCase()||"EMPRESA"}</span>
            <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>INMERSIA SPA · Marketing digital 2026</span>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div style={dGrupo}>
              {cos.map(c=><button key={c.id} onClick={()=>sSelCo(String(c.id))} style={dPill(String(selCo)===String(c.id),c.color)}>{c.name}</button>)}
            </div>
            <div style={dGrupo}>
              {[["semana","Semana"],["mes","Mes"]].map(([k,l])=>(
                <button key={k} onClick={()=>sVista(k)} style={dPill(vista===k)}>{l}</button>))}
            </div>
          </div>
        </div>

        {vista==="semana"?(<>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:14,flexWrap:"wrap",marginTop:18}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <button onClick={()=>sWkOff(w=>w-1)} style={dNav()}>‹</button>
              <span style={{fontFamily:"var(--font-mono)",fontSize:15,fontWeight:600,letterSpacing:".08em",textTransform:"uppercase",color:D.tx}}>
                SEMANA {weekDays[0]?.day} {weekDays[0]?.month?.slice(0,3).toUpperCase()} — {weekDays[6]?.day} {weekDays[6]?.month?.slice(0,3).toUpperCase()} {weekDays[0]?.date?.getFullYear()}
              </span>
              <button onClick={()=>sWkOff(w=>w+1)} style={dNav()}>›</button>
              {wkOff!==0&&<button onClick={()=>sWkOff(0)} style={{padding:"7px 14px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>Hoy</button>}
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div style={{position:"relative"}}>
                <button onClick={()=>sDriveOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:7,padding:"9px 16px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>
                  <Ic n="companies" s={13} c={D.tx2}/>Drive<span style={{fontSize:9}}>▾</span>
                </button>
                {driveOpen&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:30,maxWidth:"calc(100vw - 32px)",minWidth:210,borderRadius:12,background:D.panel2,border:"1px solid "+D.line2,boxShadow:"0 18px 44px rgba(2,3,8,.7)",padding:6,display:"flex",flexDirection:"column",gap:2}}>
                  {(co?.links||[]).length===0&&<span style={{fontSize:11.5,color:D.tx4,padding:"8px 10px"}}>Esta empresa no tiene carpetas.</span>}
                  {(co?.links||[]).map(l=>(
                    <a key={l.id} href={l.url} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:8,color:D.tx2,fontSize:12.5,fontWeight:600,textDecoration:"none"}}>
                      <span style={{width:24,height:24,borderRadius:7,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"rgba(201,191,255,.12)",flexShrink:0}}><Ic n="companies" s={12} c={D.lav}/></span>
                      {l.name}
                    </a>))}
                </div>}
              </div>
              <button onClick={dupWeek} style={{padding:"9px 16px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Duplicar →</button>
              {items.length>0&&<button onClick={clearWeek} style={{padding:"9px 16px",borderRadius:999,background:"rgba(255,107,107,.07)",border:"1px solid rgba(255,107,107,.35)",color:D.rojo,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Limpiar</button>}
              {/* Donde estaba "Guardar y sincronizar" ahora solo se informa cómo va la
                  semana: guardar dejó de ser algo que haya que pedir, y quién sale al
                  calendario lo decide cada tarjeta. */}
              {(()=>{
                const conTexto=items.filter(it=>(it.title||"").trim()||(it.description||"").trim());
                const pend=conTexto.filter(it=>!confirmada(it)).length;
                if(pend)return<span style={{padding:"9px 16px",borderRadius:999,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.32)",color:"#EFD9A0",fontSize:12.5,fontWeight:600}}>{pend} sin confirmar</span>;
                if(conTexto.length)return<span style={{padding:"9px 16px",borderRadius:999,background:"rgba(168,226,107,.06)",border:"1px solid "+STATES.listo.c+"4d",color:STATES.listo.c,fontSize:12.5,fontWeight:600}}>Todo confirmado ✓</span>;
                return null;
              })()}
            </div>
          </div>

          <div style={{marginTop:16}}>
            {!stReady&&<div style={{marginBottom:10,padding:"11px 13px",borderRadius:12,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.3)",fontSize:12.5,color:"#EFD9A0",lineHeight:1.5}}>
              <b>⚠️ No se pueden subir archivos.</b>{stMotivo?<> {stMotivo}.</>:null} Sin material no se puede marcar una pieza como <b>Listo</b> ni enviarla al portal, así que el flujo queda detenido hasta arreglarlo.
            </div>}
            <Cupos co={co} tasks={tasks} y={hoyY} m={hoyM} compact/>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",minHeight:26}}>
            {Object.entries(TT).map(([k,v])=>{const c=items.filter(it=>it.type===k).length;if(!c)return null;return(
              <span key={k} style={{padding:"5px 13px",borderRadius:999,background:v.c+"14",border:"1px solid "+v.c+"59",color:v.c,fontFamily:"var(--font-mono)",fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase"}}>{c} {v.l}{c>1?"S":""}</span>);})}
          </div>
        </>):null}
      </div>
    </div>
    {/* PENDING DRAFTS REVIEW */}
    {(pDrafts||[]).filter(d=>d.status==="pending"&&d.weekKey===weekKey).map(draft=>(<div key={draft.id} style={{marginBottom:14,background:"linear-gradient(135deg,rgba(240,192,64,.08),rgba(240,192,64,.02))",border:"2px solid rgba(240,192,64,.4)",borderRadius:12,padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontSize:14,fontWeight:800,color:"var(--gold)"}}>📝 Cambios propuestos por {draft.clientName}</div>
          <div style={{fontSize:10,color:"var(--tx2)"}}>Enviado: {new Date(draft.date).toLocaleString()}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <Bt v="p" onClick={()=>{
            // Approve: apply proposed items to planner
            updatePlan(draft.proposed);
            const newDrafts=(pDrafts||[]).map(d=>d.id===draft.id?{...d,status:"approved"}:d);
            sPDrafts(newDrafts);DB.save("planner_drafts",newDrafts);
            addN("✅ Cambios de "+draft.clientName+" aprobados");
          }} style={{padding:"8px 16px",fontSize:11}}>✅ Aprobar cambios</Bt>
          <Bt v="d" onClick={()=>{
            const newDrafts=(pDrafts||[]).map(d=>d.id===draft.id?{...d,status:"rejected"}:d);
            sPDrafts(newDrafts);DB.save("planner_drafts",newDrafts);
            addN("✗ Cambios de "+draft.clientName+" rechazados");
          }} style={{padding:"8px 16px",fontSize:11}}>✗ Rechazar</Bt>
        </div>
      </div>
      {/* DIFF VIEW */}
      {(draft.proposed||[]).map(prop=>{const orig=(draft.original||[]).find(o=>o.id===prop.id);if(!orig)return null;
        const descChanged=orig.description!==prop.description;const stratChanged=orig.strategy!==prop.strategy;
        if(!descChanged&&!stratChanged)return null;
        return(<div key={prop.id} style={{background:"var(--bg2)",borderRadius:8,padding:10,marginBottom:6,borderLeft:"3px solid var(--gold)"}}>
          <div style={{fontSize:11,fontWeight:700,marginBottom:4}}>{TT[prop.type]?.i} {prop.title} <span style={{color:"var(--tx3)",fontSize:9}}>({weekDays.find(w=>w.ds===prop.day)?.dayName})</span></div>
          {descChanged&&(<div style={{marginBottom:6}}>
            <div style={{fontSize:9,color:"var(--tx3)",marginBottom:2}}>DESCRIPCIÓN:</div>
            <div style={{fontSize:10,padding:6,background:"rgba(255,68,68,.06)",borderRadius:4,borderLeft:"3px solid rgba(255,68,68,.4)",color:"var(--danger)",textDecoration:"line-through",marginBottom:3}}>{orig.description}</div>
            <div style={{fontSize:10,padding:6,background:"rgba(78,205,196,.06)",borderRadius:4,borderLeft:"3px solid rgba(78,205,196,.4)",color:"var(--success)"}}>{prop.description}</div>
          </div>)}
          {stratChanged&&(<div>
            <div style={{fontSize:9,color:"var(--gold)",marginBottom:2}}>ESTRATEGIA:</div>
            <div style={{fontSize:10,padding:6,background:"rgba(255,68,68,.06)",borderRadius:4,borderLeft:"3px solid rgba(255,68,68,.4)",color:"var(--danger)",textDecoration:"line-through",marginBottom:3}}>{orig.strategy}</div>
            <div style={{fontSize:10,padding:6,background:"rgba(78,205,196,.06)",borderRadius:4,borderLeft:"3px solid rgba(78,205,196,.4)",color:"var(--success)"}}>{prop.strategy}</div>
          </div>)}
        </div>);
      })}
    </div>))}

    {/* VERTICAL DAY LIST */}
    {vista==="mes"&&<MesPlanner tasks={tasks} cos={cos} planners={planners} addN={addN} soloEmpresa={selCo}/>}
    {vista==="semana"&&<div style={{display:"flex",flexDirection:"column",gap:34}}>
    {weekDays.map(wd=>{
      const di=dayItems(wd.ds);
      const grabs=dayGrabEntries(wd.ds);
      const soltando=dragOver===wd.ds;
      // Un día de grabación cuenta como planificación: antes el día quedaba apagado y
      // diciendo "Sin contenido" aunque tuviera rodaje agendado.
      const partes=[];
      if(di.length)partes.push(`${di.length} contenido${di.length===1?"":"s"}`);
      if(grabs.length)partes.push(grabs.length===1?"grabación":`${grabs.length} grabaciones`);
      const resumen=partes.length?partes.join(" · "):"Sin contenido";
      // El destacado marca los días que ya tienen algo planificado — es lo que interesa
      // de un vistazo. El día de hoy se distingue aparte, con el número en cian.
      const conContenido=di.length>0||grabs.length>0;
      const acc=conContenido?D.cian:(soltando?D.peri:D.line);
      return(
      <div key={wd.ds}
        onDragOver={e=>{e.preventDefault();sDragOver(wd.ds);}}
        onDragLeave={()=>sDragOver(null)}
        onDrop={()=>{if(dragItem)moveItem(dragItem,wd.ds);sDragOver(null);}}
        style={{borderRadius:20,padding:(conContenido||soltando)?5:0,background:(conContenido||soltando)?"linear-gradient(160deg, rgba(111,231,242,.35), rgba(200,210,228,.05) 45%, rgba(155,180,255,.22))":"transparent"}}>
        <div style={{borderRadius:16,border:"1px solid "+(conContenido?"rgba(111,231,242,.3)":D.line),background:"linear-gradient(170deg, rgba(13,17,27,.95), rgba(6,8,14,.98))",display:"flex",flexDirection:"column",overflow:"hidden"}}>

          {/* Banda del día */}
          <div style={{display:"flex",alignItems:"center",gap:14,padding:"10px 16px",background:conContenido?"rgba(111,231,242,.05)":"rgba(200,210,228,.02)",borderBottom:"1px solid "+(conContenido?"rgba(111,231,242,.3)":D.line),borderLeft:"3px solid "+acc}}>
            <div style={{width:44,height:44,borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:conContenido?D.cian:D.panel,flexShrink:0,boxShadow:conContenido?"0 0 18px rgba(111,231,242,.45)":"none"}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".14em",color:conContenido?"rgba(5,6,11,.65)":D.tx4,lineHeight:1}}>{wd.dayShort}</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:19,fontWeight:700,color:conContenido?D.bg:(wd.isToday?D.cian:D.tx),lineHeight:1.15}}>{wd.day}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:0}}>
              <span style={{fontSize:15,fontWeight:700,color:conContenido?D.cian:D.tx}}>{wd.dayName}</span>
              <span style={{fontSize:11,color:D.tx4}}>{wd.month}</span>
            </div>
            <span style={{marginLeft:"auto",fontFamily:"var(--font-mono)",fontSize:11,color:di.length?D.tx2:D.tx4,whiteSpace:"nowrap"}}>{resumen}</span>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:10,padding:"12px 14px 14px"}}>

            {di.map(it=>{
              const col=TT[it.type]?.c||D.tx4;
              const est=STATES[it.state||"borrador"]||STATES.borrador;
              const exp=!!abierto[it.id];
              const realce=est.glow?{glow:est.glow,marco:est.marco,late:!!est.late}:null;
              const prodSel=(it.production||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
              const drvSel=(it.driveLinks||[]).map(lid=>(co?.links||[]).find(l=>l.id===lid)).filter(Boolean);

              if(!exp)return(
                <div key={it.id} style={{borderRadius:14,padding:realce?2:0,background:realce?realce.marco:"transparent"}}>
                  <button draggable onDragStart={()=>sDragItem(it.id)} onDragEnd={()=>sDragItem(null)}
                    onClick={()=>sAbierto(o=>({...o,[it.id]:true}))} title="Toca para abrir"
                    className="d-in"
                    style={{width:"100%",boxSizing:"border-box",position:"relative",display:"flex",alignItems:"center",gap:12,padding:"11px 14px",borderRadius:12,background:D.panel,border:"1px solid "+(realce?est.bor:D.line3),borderLeft:"3px solid "+col,cursor:"pointer",fontFamily:"inherit",textAlign:"left",overflow:"hidden"}}>
                    {realce&&<span style={{position:"absolute",inset:0,borderRadius:12,background:realce.glow,animation:realce.late?"pulseFade 1.6s ease-in-out infinite":"none",pointerEvents:"none"}}/>}
                    <span style={{position:"relative",padding:"3px 10px",borderRadius:999,background:col+"1f",border:"1px solid "+col+"59",color:col,fontSize:10.5,fontWeight:700,flexShrink:0}}>{TT[it.type]?.l}</span>
                    <span style={{position:"relative",flex:"1 1 auto",minWidth:0,fontSize:13,fontWeight:600,color:D.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it.title||"Sin título…"}</span>
                    {/* Distintivo: este contenido lleva automatización de comentario→DM */}
                    {it.autoComentario&&<span title="Lleva automatización de comentario→DM" style={{position:"relative",fontSize:12,flexShrink:0}}>💬</span>}
                    {/* Punto ámbar = escrita pero sin confirmar, así que no está en Contenido */}
                    {((it.title||"").trim()||(it.description||"").trim())&&!confirmada(it)&&
                      <span title="Sin confirmar — no aparece en Contenido" style={{position:"relative",width:7,height:7,borderRadius:"50%",background:"#EFD9A0",flexShrink:0}}/>}
                    <span style={{position:"relative",fontSize:11,fontWeight:600,color:est.c,flexShrink:0}}>{est.l}</span>
                    <span style={{position:"relative",fontSize:10,color:D.tx4,flexShrink:0}}>▾</span>
                  </button>
                </div>);

              return(
                <div key={it.id} className="d-in" style={{borderRadius:20,padding:5,background:realce?realce.marco:"linear-gradient(160deg, rgba(200,210,228,.28), rgba(200,210,228,.05) 45%, rgba(155,180,255,.18))"}}>
                  <div style={{position:"relative",borderRadius:16,background:"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))",border:"1px solid rgba(200,210,228,.08)",boxShadow:"inset 0 1px 0 rgba(255,255,255,.06)",borderLeft:"3px solid "+col,padding:"14px 16px",display:"flex",flexDirection:"column",gap:12,overflow:"hidden"}}>
                    {realce&&<span style={{position:"absolute",inset:0,borderRadius:16,background:realce.glow,animation:realce.late?"pulseFade 1.6s ease-in-out infinite":"none",pointerEvents:"none"}}/>}

                    {/* Fila de controles */}
                    <div style={{position:"relative",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                      <select value={it.type} onChange={e=>updateItem(it.id,{type:e.target.value})} style={{padding:"8px 10px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:col,fontFamily:"inherit",fontSize:12.5,fontWeight:600,outline:"none",colorScheme:"dark",cursor:"pointer",width:"auto"}}>
                        {Object.entries(TT).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
                      </select>
                      <input value={it.title||""} onChange={e=>updateItem(it.id,{title:e.target.value})} placeholder="Título…" style={{flex:"1 1 160px",minWidth:120,padding:"9px 12px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontFamily:"inherit",fontSize:13.5,fontWeight:600,outline:"none"}}/>
                      <select value={it.state||"borrador"} onChange={e=>cambiarEstado(it,e.target.value)} style={{padding:"8px 10px",borderRadius:10,background:D.panel,border:"1px solid "+(est.bor||est.c+"59"),color:est.c,fontFamily:"inherit",fontSize:12,fontWeight:600,outline:"none",colorScheme:"dark",cursor:"pointer",width:"auto"}}>
                        {Object.entries(STATES).map(([k,v])=>{const bl=bloqueoEstado(it,k);return <option key={k} value={k}>{bl?"🔒 ":""}{v.l}</option>;})}
                      </select>

                      {/* Producción */}
                      <div style={{position:"relative"}}>
                        <button onClick={()=>sProdOpen(p=>p===it.id?null:it.id)} style={{display:"flex",alignItems:"center",gap:7,padding:"8px 12px",borderRadius:10,background:D.panel,border:"1px solid "+(prodSel.length?"rgba(111,231,242,.45)":D.line2),color:prodSel.length?D.cian:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer",maxWidth:210}}>
                          <span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{prodSel.length?prodSel.map(u=>u.name).join(", "):"Producción"}</span>
                          <span style={{fontSize:9,flexShrink:0}}>▾</span>
                        </button>
                        {prodOpen===it.id&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:30,maxWidth:"calc(100vw - 32px)",minWidth:180,borderRadius:12,background:D.panel2,border:"1px solid "+D.line2,boxShadow:"0 18px 44px rgba(2,3,8,.7)",padding:6,display:"flex",flexDirection:"column",gap:2}}>
                          {users.map(u=>{const on=(it.production||[]).includes(u.id);return(
                            <button key={u.id} onClick={()=>updateItem(it.id,{production:on?(it.production||[]).filter(x=>x!==u.id):[...(it.production||[]),u.id]})} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 10px",borderRadius:8,background:"transparent",border:"none",color:on?D.tx:D.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
                              <span style={{width:7,height:7,borderRadius:"50%",background:u.color||D.peri,flexShrink:0}}/>
                              <span style={{flex:"1 1 auto"}}>{u.name}</span>
                              {on&&<Ic n="check" s={12} c={D.cian}/>}
                            </button>);})}
                        </div>}
                      </div>

                      {/* Drive por contenido */}
                      <div style={{position:"relative"}}>
                        <button onClick={()=>sDrvOpen(p=>p===it.id?null:it.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 12px",borderRadius:10,background:D.panel,border:"1px solid "+(drvSel.length?"rgba(201,191,255,.45)":D.line2),color:drvSel.length?D.lav:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer",maxWidth:170}}>
                          <Ic n="companies" s={12} c={drvSel.length?D.lav:D.tx3}/>
                          <span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{drvSel.length?drvSel.map(d=>d.name).join(", "):"Drive"}</span>
                          <span style={{fontSize:9,flexShrink:0}}>▾</span>
                        </button>
                        {drvOpen===it.id&&<div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:30,maxWidth:"calc(100vw - 32px)",minWidth:220,borderRadius:12,background:D.panel2,border:"1px solid "+D.line2,boxShadow:"0 18px 44px rgba(2,3,8,.7)",padding:6,display:"flex",flexDirection:"column",gap:2}}>
                          <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4,padding:"6px 10px 4px"}}>Asignar drive a este contenido</span>
                          {(co?.links||[]).length===0&&<span style={{fontSize:11.5,color:D.tx4,padding:"4px 10px 8px"}}>Esta empresa no tiene carpetas.</span>}
                          {(co?.links||[]).map(l=>{const on=(it.driveLinks||[]).includes(l.id);return(
                            <button key={l.id} onClick={()=>updateItem(it.id,{driveLinks:on?(it.driveLinks||[]).filter(x=>x!==l.id):[...(it.driveLinks||[]),l.id]})} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 10px",borderRadius:8,background:"transparent",border:"none",color:on?D.tx:D.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",textAlign:"left"}}>
                              <span style={{width:24,height:24,borderRadius:7,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"rgba(201,191,255,.12)",flexShrink:0}}><Ic n="companies" s={12} c={D.lav}/></span>
                              <span style={{flex:"1 1 auto",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.name}</span>
                              <a href={l.url} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} title="Abrir en Drive" style={{color:D.tx4,display:"inline-flex",flexShrink:0}}><Ic n="external" s={12} c={D.tx4}/></a>
                              {on&&<Ic n="check" s={12} c={D.cian}/>}
                            </button>);})}
                        </div>}
                      </div>

                      {/* Switch de automatización de comentario→DM. Solo en reel/post (los tipos a
                          los que se les puede atar una cadena). Marca que este contenido va con una
                          automatización, para que todos lo sepan desde la planificación. La cadena
                          se prepara después en Contenido → Automatización. */}
                      {["reel","post"].includes(it.type)&&(
                        <button onClick={()=>updateItem(it.id,{autoComentario:!it.autoComentario})}
                          title={it.autoComentario?"Lleva automatización de comentario→DM. La cadena se arma en Contenido → Automatización.":"Marca que este contenido lleva una automatización de comentario→DM"}
                          style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:it.autoComentario?"rgba(155,180,255,.14)":D.panel,border:"1px solid "+(it.autoComentario?"rgba(155,180,255,.55)":D.line2),color:it.autoComentario?D.peri:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                          💬 Automatización
                          <span style={{width:26,height:15,borderRadius:999,background:it.autoComentario?D.peri:D.line2,position:"relative",flexShrink:0,transition:"background .2s"}}>
                            <span style={{position:"absolute",top:2,left:it.autoComentario?13:2,width:11,height:11,borderRadius:"50%",background:it.autoComentario?D.bg:D.tx3,transition:"left .2s"}}/>
                          </span>
                        </button>
                      )}

                      <button onClick={()=>sAbierto(o=>({...o,[it.id]:false}))} title="Achicar" style={{width:32,height:32,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"1px solid "+D.line2,color:D.tx3,cursor:"pointer",fontFamily:"inherit",fontSize:11}}>▴</button>
                      <button onClick={()=>removeItem(it.id)} title="Eliminar" style={{width:32,height:32,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,107,107,.07)",border:"1px solid rgba(255,107,107,.3)",color:D.rojo,cursor:"pointer"}}><Ic n="trash" s={13} c={D.rojo}/></button>
                    </div>

                    {/* Descripción */}
                    <div style={{position:"relative",display:"flex",flexDirection:"column",gap:6}}>
                      <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>Descripción</span>
                      <AutoTx value={it.description||""} onChange={e=>updateItem(it.id,{description:e.target.value})} placeholder="Idea, contenido…" style={{padding:"10px 12px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontSize:13,width:"100%",boxSizing:"border-box",lineHeight:1.55}}/>
                    </div>

                    <div style={{position:"relative",display:"flex",gap:16,flexWrap:"wrap"}}>
                      {/* Referencias */}
                      <div style={{display:"flex",flexDirection:"column",gap:6,flex:"1 1 220px",minWidth:0}}>
                        <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>Referencias</span>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                          {(it.refs||[]).map((rf,i)=>(
                            <div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 11px",borderRadius:10,background:"rgba(201,191,255,.06)",border:"1px solid rgba(201,191,255,.3)",maxWidth:"100%"}}>
                              <Ic n="paperclip" s={12} c={D.lav}/>
                              <span onClick={()=>openZoom(it.refs,i)} title="Toca para ver" style={{fontSize:12,fontWeight:600,color:D.lav,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",cursor:"zoom-in"}}>{rf.name||"Referencia"}</span>
                              <button onClick={()=>removeFile(it.id,"refs",i)} style={{width:18,height:18,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",color:D.tx4,cursor:"pointer",flexShrink:0,padding:0}}>✕</button>
                            </div>))}
                          <label style={{display:"flex",alignItems:"center",gap:8,padding:"9px 13px",borderRadius:10,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:subiendo===it.id?"default":"pointer"}}>
                            {subiendo===it.id?"Subiendo…":"+ Anclar referencia"}
                            <input type="file" multiple accept="image/*,video/*" disabled={subiendo===it.id} style={{display:"none"}} onChange={e=>handleFiles(it.id,"refs",e)}/>
                          </label>
                        </div>
                      </div>

                      {/* Aprobación interna */}
                      <div style={{display:"flex",flexDirection:"column",gap:6,flex:"1 1 220px",minWidth:0}}>
                        <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".2em",textTransform:"uppercase",color:D.tx4}}>Aprobación</span>
                        {!(it.files||[]).length
                          ? <label style={{display:"flex",alignItems:"center",gap:9,padding:"11px 14px",borderRadius:10,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:subiendo===it.id?"default":"pointer",width:"fit-content"}}>
                              <Ic n="inbox" s={14} c={D.tx4}/>{subiendo===it.id?"Subiendo…":"Subir contenido para aprobación del equipo"}
                              <input type="file" accept="image/*,video/*" disabled={subiendo===it.id} style={{display:"none"}} onChange={e=>handleFiles(it.id,"files",e)}/>
                            </label>
                          : <div style={{display:"flex",flexDirection:"column",gap:8,padding:"10px 13px",borderRadius:12,background:"rgba(111,231,242,.04)",border:"1px solid rgba(111,231,242,.3)",maxWidth:"100%",boxSizing:"border-box"}}>
                              <div style={{display:"flex",alignItems:"center",gap:10}}>
                                <Ic n="check" s={14} c={D.cian}/>
                                <span onClick={()=>openZoom(it.files,0)} title="Toca para agrandar" style={{fontSize:12.5,fontWeight:600,color:D.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:"1 1 auto",minWidth:0,cursor:"zoom-in"}}>{it.files[0].name||"Archivo"}</span>
                                <button onClick={()=>removeFile(it.id,"files",0)} style={{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",color:D.tx4,cursor:"pointer",flexShrink:0}}>✕</button>
                              </div>
                              {/* La votación se abre al marcarlo Listo: antes no hay nada que juzgar */}
                              {(it.state||"borrador")==="borrador"||it.state==="en_proceso"
                                ? <span style={{fontSize:11.5,color:D.tx4,lineHeight:1.5}}>Marca el contenido como <b style={{color:STATES.listo.c}}>Listo</b> para abrir la votación del equipo.</span>
                                : (()=>{const r=votoResumen(it);return(<>
                                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                                    <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4,width:"100%"}}>Votación del equipo · {r.emitidos.length}/{r.equipo.length}</span>
                                    {r.equipo.map(u=>{
                                      const v=(it.votes||{})[u.id];
                                      const c=v===true?STATES.listo.c:v===false?D.rojo:D.tx4;
                                      return(<button key={u.id} title="Toca para cambiar el voto"
                                        onClick={()=>updateItem(it.id,{votes:{...(it.votes||{}),[u.id]:v===true?false:v===false?undefined:true}})}
                                        style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 10px",borderRadius:999,background:v===undefined?"transparent":c+"14",border:"1px solid "+(v===undefined?D.line2:c+"73"),color:c,fontFamily:"inherit",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                                        {u.name}<span style={{fontSize:10}}>{v===true?"✓":v===false?"✕":"–"}</span>
                                      </button>);})}
                                  </div>
                                  {/* Barra de avance hacia el envío al portal */}
                                  <div style={{height:4,borderRadius:999,background:D.line,overflow:"hidden"}}>
                                    <div style={{height:"100%",width:(r.equipo.length?r.emitidos.length/r.equipo.length*100:0)+"%",borderRadius:999,background:r.enContra.length?D.rojo:"linear-gradient(90deg,"+D.cian+","+STATES.listo.c+")",transition:"width .4s"}}/>
                                  </div>
                                  {(()=>{
                                    const listoParaEnviar=r.todosVotaron&&r.todosAprueban;
                                    const txt=r.enContra.length
                                      ? `${r.enContra.map(u=>u.name).join(", ")} ${r.enContra.length===1?"objetó":"objetaron"} — corrige antes de enviar`
                                      : listoParaEnviar ? "Aprobado por todo el equipo — ya puedes enviarlo al portal"
                                      : r.emitidos.length===0 ? "Nadie ha votado todavía"
                                      : `Faltan ${r.faltan} ${r.faltan===1?"voto":"votos"}: ${r.equipo.filter(u=>(it.votes||{})[u.id]===undefined).map(u=>u.name).join(", ")}`;
                                    return(<>
                                      <span style={{fontSize:11.5,fontWeight:600,color:r.enContra.length?D.rojo:listoParaEnviar?STATES.listo.c:D.tx4,lineHeight:1.5}}>{txt}</span>
                                      {listoParaEnviar&&(it.state||"")==="listo"&&
                                        <button onClick={()=>cambiarEstado(it,"en_aprobacion")} style={{alignSelf:"flex-start",padding:"8px 16px",borderRadius:999,background:STATES.en_aprobacion.c,border:"1px solid "+STATES.en_aprobacion.c,color:D.bg,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>Enviar al portal →</button>}
                                    </>);
                                  })()}
                                </>);})()}
                            </div>}
                      </div>
                    </div>

                    {/* Confirmar la pieza. Es lo que reemplaza al "Guardar y sincronizar" de
                        toda la semana: hasta que no se confirma, la pieza vive solo en el
                        planner y no aparece en Contenido. Lo escrito no se pierde igual,
                        porque el planner se guarda solo. */}
                    {(()=>{
                      const lista=confirmada(it);
                      const yaEsta=tasks.some(t=>String(t.itemId)===String(it.id));
                      const vacia=!(it.title||"").trim()&&!(it.description||"").trim();
                      const trabajando=confirmando===it.id;
                      return(
                        <div style={{position:"relative",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",paddingTop:12,borderTop:"1px solid "+D.line3}}>
                          <span style={{flex:"1 1 160px",minWidth:0,fontSize:11.5,fontWeight:600,lineHeight:1.45,color:lista?STATES.listo.c:yaEsta?"#EFD9A0":D.tx4}}>
                            {lista?"Confirmada · está en Contenido"
                              :yaEsta?"Tiene cambios sin confirmar"
                              :vacia?"Ponle un título para poder confirmarla"
                              :"Sin confirmar · todavía no aparece en Contenido"}
                          </span>
