<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INMERSIA">
<meta name="theme-color" content="#05060B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
<title>INMERSIA · Content Management Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

:root{--r:10px;--r-lg:14px;--font-mono:'JetBrains Mono',monospace}

/* ─── REDISEÑO 2026 ───────────────────────────────────────────────
   Estas variables se remapearon a la paleta nueva en vez de reescribir cada sección:
   quedaban ~360 usos de var(--*) repartidos por Contenido, Pagos, Guionado, Métricas,
   Prospectos y Org Semanal. Cambiándolas aquí, todas heredan el look nuevo de una vez.
   Los nombres se conservan (--accent, --gold…) para no romper el código existente. */
body{
  --bg:#05060B;--bg2:#0B0E17;--bg3:#0D111B;--bg4:#151A28;
  --border:#161B2A;--border2:#262D40;
  --tx:#F4F2ED;--tx2:#C9CFDC;--tx3:#8E93A6;
  --accent:#6FE7F2;--accent2:#8FEFF7;--accent3:#4FC7D2;
  --gold:#C9BFFF;--gold2:#9BB4FF;
  --danger:#FF8B8B;--success:#6FE7F2;--warn:#FFC97A;--info:#9BB4FF;
}

/* ─── VARIANTE B: NIGHT & CORAL ─── */
body[data-variant="B"]{
  --bg:#0b0d14;--bg2:#12151f;--bg3:#181c29;--bg4:#222739;
  --border:#1f2434;--border2:#2f3547;
  --tx:#eaecf3;--tx2:#a4aac0;--tx3:#6b708a;
  --accent:#ff7a6b;--accent2:#ff5a4e;--accent3:#e04a3e;
  --gold:#ffc857;--gold2:#e6b44e;
  --danger:#ff5a4e;--success:#35d6a5;--warn:#ffc857;--info:#6fa8ff;
}

/* ─── VARIANTE C: LIGHT LINEN ─── */
body[data-variant="C"]{
  --bg:#f6f4ee;--bg2:#ffffff;--bg3:#f0ede4;--bg4:#e6e2d6;
  --border:#e4dfd1;--border2:#cec7b5;
  --tx:#1e1d19;--tx2:#585548;--tx3:#8c886e;
  --accent:#4a7a2b;--accent2:#3a6221;--accent3:#2d4e1a;
  --gold:#d97706;--gold2:#c48a09;
  --danger:#c53b2e;--success:#2f8f64;--warn:#c48a09;--info:#1f7fb8;
}
body[data-variant="C"] .card,body[data-variant="C"] .cd{box-shadow:0 1px 2px rgba(30,29,25,.04)}
body[data-variant="C"] ::-webkit-scrollbar-thumb{background:#cec7b5}

/* El rediseño scrollea la página completa (la barra lateral es sticky). Antes el body
   estaba fijado a 100vh con overflow:hidden y el scroll ocurría dentro de un contenedor;
   al quitar ese contenedor, cualquier panel que crezca quedaba inalcanzable. */
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;overflow-x:hidden;min-height:100vh}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

input,textarea,select{background:var(--bg3);border:1px solid var(--border);color:var(--tx);padding:10px 12px;border-radius:var(--r);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(123,201,60,.18)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
select option{background:var(--bg3);color:var(--tx)}

button{cursor:pointer;border:none;font-family:inherit;transition:all .15s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(255,90,78,.4)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes slowBlink{0%,100%{opacity:1}50%{opacity:.35}}
/* Animaciones del rediseño 2026 */
@keyframes cardIn{from{opacity:0;transform:translateY(-5px) scale(.99)}to{opacity:1;transform:none}}
@keyframes pulseFade{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* Panel lateral del portal. `backwards` a propósito, nunca `forwards`: un transform retenido
   convierte al panel en ancestro de referencia de los `fixed` que cuelguen de él (ver
   CLAUDE.md). Termina en el estado natural, así que no retiene nada. */
@keyframes drawerIn{from{opacity:.5;transform:translateX(26px)}to{opacity:1;transform:none}}
/* Constructor de cadenas. `ccSlideIn` termina en el estado natural, así que no retiene
   transform — un transform retenido convertiría al panel en ancestro de los `fixed`. */
@keyframes ccPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ccSlideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* Solo opacidad, a propósito: el preview de la publicación se centra con un `transform`
   inline, y una animación que tocara `transform` lo pisaría mientras dura — el preview
   aparecería descolocado y luego saltaría a su sitio. */
@keyframes ccFadeIn{from{opacity:0}to{opacity:1}}
/* La hoja de edición del teléfono entra desde abajo, que es de donde viene. Sin fill-mode:
   el transform no debe quedarse retenido o la hoja se vuelve ancestro de los `fixed`. */
@keyframes ccSubir{from{transform:translateY(100%)}to{transform:none}}
@keyframes drawerInMob{from{opacity:.5;transform:translateY(26px)}to{opacity:1;transform:none}}

/* Borde iluminado que recorre el marco.
   Se anima el ÁNGULO del gradiente, no la rotación de un elemento: girar un rectángulo
   con conic-gradient hace que el destello avance a distinta velocidad en los lados largos
   que en los cortos, y se veía entrecortado. Así el recorrido es parejo en cualquier
   proporción de tarjeta. */
@property --haloAng{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes haloSpin{to{--haloAng:360deg}}
.halo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.halo-cian{background:conic-gradient(from var(--haloAng),transparent 0deg,rgba(111,231,242,.55) 38deg,rgba(255,255,255,.75) 55deg,rgba(111,231,242,.55) 72deg,transparent 130deg,transparent 360deg);animation:haloSpin 4s linear infinite}
.halo-rojo{background:conic-gradient(from var(--haloAng),transparent 0deg,rgba(255,107,107,.65) 38deg,rgba(255,255,255,.8) 55deg,rgba(255,107,107,.65) 72deg,transparent 130deg,transparent 360deg);animation:haloSpin 3s linear infinite}
/* `backwards`, no `both`: con fill-mode hacia adelante el efecto de cardIn (que anima
   transform) queda aplicado para siempre, y en iOS eso convierte a la página en el
   ancestro de referencia de cualquier position:fixed que cuelgue de ella. Los overlays
   se anclaban al alto completo del documento en vez de al viewport. `backwards` conserva
   el estado inicial antes de arrancar —que es lo que evita el parpadeo— sin retener nada
   al terminar. */
.d-in{animation:cardIn .28s ease backwards}
.d-hov{transition:border-color .2s,background .2s}
.d-hov:hover{border-color:rgba(111,231,242,.45)!important}
.blink-slow{animation:slowBlink 1.8s ease-in-out infinite}
@keyframes borderGlow{0%,100%{border-color:#a8e26b;box-shadow:0 0 7px rgba(168,226,107,.6)}33%{border-color:#4dc7ff;box-shadow:0 0 7px rgba(77,199,255,.6)}66%{border-color:#ff9b3d;box-shadow:0 0 7px rgba(255,155,61,.6)}}
.shimmer-btn{border:2px solid #a8e26b!important;animation:borderGlow 2.4s ease-in-out infinite,slowBlink 1.8s ease-in-out infinite!important;font-weight:700!important}

.fi{animation:fadeIn .35s ease}.su{animation:slideUp .4s ease}

.card,.cd{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);transition:border-color .2s,transform .2s}
.card:hover,.cd:hover{border-color:var(--border2)}

.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.num{font-family:var(--font-mono);font-feature-settings:"tnum"}

.ep{cursor:grab;padding:6px 9px;margin-bottom:4px;border-radius:8px;font-size:10px;background:var(--bg3);transition:transform .15s;border-left:3px solid var(--accent)}
.ep:hover{transform:translateX(3px);background:var(--bg4)}
.ep{-webkit-user-select:none;user-select:none}

.tb{background:linear-gradient(135deg,rgba(255,155,61,.08),rgba(255,155,61,.02));border:1px solid rgba(255,155,61,.25);border-radius:12px;padding:14px 16px}
.rd{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:rec 1.5s infinite}

*:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.cronoNota:focus{border-color:#262D40!important;background:#05060B!important}
@media(max-width:1080px){#guionGrid{grid-template-columns:1fr!important}}
@media(max-width:820px){
  body{overflow:auto;height:auto}
  .sidebar{display:none}
  .main-col{height:auto!important}
  .main-col>div{overflow:visible!important}
}
</style>
</head>
<body data-variant="A">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useMemo,useRef}=React;

// ═══ DATOS ═══════════════════════════════════════════════════════
// El navegador YA NO habla con Supabase directamente. Antes la clave de Supabase estaba en este
// mismo HTML y la tabla no tenía RLS, así que cualquiera con ver-código-fuente podía leer los
// tokens de los clientes y borrar la base. Ahora todo pasa por el servidor (/api/data), que exige
// sesión (la cookie HttpOnly del login) y usa la service_role, que nunca llega al cliente.
const DB={
  async load(key){
    try{
      const r=await fetch("/api/data/"+encodeURIComponent(key),{credentials:"same-origin"});
      if(!r.ok)return[];
      const d=await r.json();
      return d?.value??[];
    }catch(e){console.error("DB load error:",key,e);return[];}
  },
  async save(key,value){
    try{
      const r=await fetch("/api/data/"+encodeURIComponent(key),{
        method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
        body:JSON.stringify({value})
      });
      // Devuelve si de verdad se guardó. Antes se tragaba el fallo en silencio, así que quien
      // llamaba cantaba "guardado" aunque la escritura muriera.
      return r.ok;
    }catch(e){console.error("DB save error:",key,e);return false;}
  },
  async loadAll(){
    try{
      const r=await fetch("/api/data",{credentials:"same-origin"});
      if(!r.ok)return{};
      const d=await r.json();
      return(d&&typeof d==="object"&&!Array.isArray(d))?d:{};
    }catch(e){console.error("DB loadAll error:",e);return{};}
  },
  // Igual que loadAll pero LANZA si la lectura falla, en vez de devolver {}. Lo usan los sitios
  // que releen-antes-de-escribir (safeSaveTask, confirmarItem, limpiar/quitar semana): con la
  // versión tolerante, un fallo devolvía {}, el `fresh.tasks||[]` daba [] y se escribía un array
  // vacío ENCIMA de las tareas de todas las empresas, borrándolas sin recuperación. Lanzando, el
  // try/catch de cada sitio aborta la escritura y no se pisa nada. Los lectores de arranque siguen
  // usando el loadAll tolerante (degradan a su respaldo local).
  async loadAllStrict(){
    const r=await fetch("/api/data",{credentials:"same-origin"});
    if(!r.ok)throw new Error("El servidor respondió "+r.status);
    const d=await r.json();
    if(!d||typeof d!=="object"||Array.isArray(d))throw new Error("respuesta inesperada del servidor");
    return d;
  }
};
// Id único que NO se trunca. `Date.now()+Math.random()*N|0` metía el timestamp de 13 dígitos por
// un OR a 32 bits: salían ids negativos, no crecientes y con choques dentro de una ventana
// estrecha. El id es la clave con la que se casan tareas e items en todo el flujo, así que un
// choque hace que aprobar/borrar una pieza toque otra.
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);

// Debounce helper
const debounceTimers={};
function dbSave(key,value){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key]=setTimeout(()=>DB.save(key,value),800);
}

// ═══ API CLIENT — all calls go through backend ═════════════════
// Auth cookie is sent automatically by the browser (HttpOnly, same-origin)
const API={
  async generate(prompt,temperature=0.7){
    const r=await fetch("/api/ai/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,temperature})});
    const d=await r.json();if(d.error)throw new Error(d.error);return d.text;
  },
  async transcribe(audioBlob){
    const fd=new FormData();fd.append("audio",audioBlob,"audio.webm");
    const r=await fetch("/api/transcribe",{method:"POST",body:fd});
    const d=await r.json();if(d.error)throw new Error(d.error);return d.transcript;
  },
  async generateActa(audioBlob,company,participants){
    const fd=new FormData();
    if(audioBlob)fd.append("audio",audioBlob,"audio.webm");
    fd.append("company",company);fd.append("participants",participants);
    const r=await fetch("/api/generate-acta",{method:"POST",body:fd});
    const d=await r.json();if(d.error)throw new Error(d.error);return d;
  },
  async loyaltyPush(company,topic){
    const r=await fetch("/api/loyalty/generate-push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,topic})});
    const d=await r.json();if(d.error)throw new Error(d.error);return d.text;
  },
  async metaAdvisor(company,campaigns,totalBudget,question){
    const r=await fetch("/api/meta/advisor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company,campaigns,totalBudget,question})});
    const d=await r.json();if(d.error)throw new Error(d.error);return d.text;
  },
  async health(){const r=await fetch("/api/health");return r.json();},
  // Limpieza de contenido de prueba (solo admins; el servidor respalda antes de borrar).
  async limpiarContenido(){const r=await fetch("/api/admin/limpiar-contenido",{method:"POST",credentials:"same-origin"});const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudo limpiar");return d;},
  async changePassword(email,actual,nueva){
    const r=await fetch("/api/auth/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,actual,nueva})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudo actualizar");return d;
  },
  async pushKey(){const r=await fetch("/api/push/key");return r.json();},
  // Se recuerda el endpoint propio para poder decirle al servidor cuál reemplaza esta
  // suscripción. iOS rota el endpoint cada pocas horas y el anterior no siempre devuelve 410,
  // así que sin esto la lista acumula una entrada muerta por rotación: en un solo día un mismo
  // iPhone llegó a tener tres, y los envíos salían por triplicado.
  async pushSubscribe(subscription,email,gmail,name){
    let renewedFrom=null;
    try{
      const prev=localStorage.getItem("inm_push_endpoint");
      if(prev&&prev!==subscription.endpoint)renewedFrom=prev;
    }catch(_){}
    const r=await fetch("/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription,email,gmail,name,renewedFrom})});
    const d=await r.json();if(d.error)throw new Error(d.error);
    try{localStorage.setItem("inm_push_endpoint",subscription.endpoint);}catch(_){}
    return d;
  },
  async pushUnsubscribe(endpoint){try{await fetch("/api/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint})});}catch(e){}},
  async pushTest(email){const r=await fetch("/api/push/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});return r.json();},
  // ── Centro de notificaciones ──
  // Se guardan en el servidor: el push es el aviso del momento, esto es el historial que
  // queda aunque la persona no tenga la app instalada o no lo haya visto.
  async notifsGet(alt){try{const r=await fetch("/api/notifs"+(alt?"?alt="+encodeURIComponent(alt):""));if(!r.ok)return{notifs:[],unread:0};return await r.json();}catch(e){return{notifs:[],unread:0};}},
  async notifsCreate(n){try{const r=await fetch("/api/notifs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(n)});return await r.json();}catch(e){return{error:e.message};}},
  async notifsRead(ids){try{await fetch("/api/notifs/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids})});}catch(e){}},
  // ── Reuniones con Google Meet ──
  async gcalStatus(email){try{const r=await fetch("/api/gcal/status"+(email?"?email="+encodeURIComponent(email):""));return await r.json();}catch(e){return{conectado:false};}},
  // Estadísticas + comparativa de una publicación (Meta), y chat de IA sobre ella (Gemini).
  async postStats({igId,mediaId,caption}){const p=new URLSearchParams({igId});if(mediaId)p.set("mediaId",mediaId);if(caption)p.set("caption",caption);try{const r=await fetch("/api/meta/post-stats?"+p,{credentials:"same-origin"});return await r.json();}catch(e){return{ok:false,error:e.message};}},
  async postChat(d){try{const r=await fetch("/api/ai/post-chat",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(d)});return await r.json();}catch(e){return{error:e.message};}},
  async gcalMeeting(d){try{const r=await fetch("/api/gcal/meeting",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});return await r.json();}catch(e){return{ok:false,msg:e.message};}},
  async uploadStatus(){try{const r=await fetch("/api/upload/status");return await r.json();}catch(e){return{ready:false};}},
  // ── Publicación en redes (Zernio) ──
  // Un profile de Zernio por empresa: la cuenta de cada marca vive en el suyo. Todo pasa por
  // el servidor porque la llave de Zernio no puede bajar al navegador.
  async socialAccounts(companyId){try{const r=await fetch("/api/social/accounts"+(companyId?"?companyId="+encodeURIComponent(companyId):""));if(!r.ok)return{};return await r.json();}catch(e){return{};}},
  async socialConnect(companyId,nombre,platform){try{const r=await fetch("/api/social/connect",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({companyId,nombre,platform:platform||"instagram"})});return await r.json();}catch(e){return{error:e.message};}},
  async socialPublish(d){try{const r=await fetch("/api/social/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});return await r.json();}catch(e){return{error:e.message};}},
  // 200 al publicar no significa publicado: Instagram procesa el archivo después.
  async socialPost(id){try{const r=await fetch("/api/social/post/"+encodeURIComponent(id));return await r.json();}catch(e){return{status:null};}},
  // ── Instagram directo: comentario → DM ──
  // Aparte de Zernio a propósito: la respuesta privada es de Meta y Zernio no la expone.
  async igStatus(companyId){try{const r=await fetch("/api/ig/status?companyId="+encodeURIComponent(companyId));return await r.json();}catch(e){return{configurado:false};}},
  async igConnect(companyId){try{const r=await fetch("/api/ig/connect?companyId="+encodeURIComponent(companyId));return await r.json();}catch(e){return{error:e.message};}},
  async igPublicaciones(companyId){try{const r=await fetch("/api/ig/publicaciones?companyId="+encodeURIComponent(companyId));return await r.json();}catch(e){return{error:e.message};}},
  async igReglas(companyId,reglas){try{
    const r=await fetch("/api/ig/reglas",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({companyId,reglas})});
    return await r.json();}catch(e){return{error:e.message};}},
  // Sube el binario a Supabase Storage y devuelve {name,type,url}. Si el bucket todavía
  // no está configurado cae a base64 SOLO para archivos chicos: meter un reel dentro del
  // JSON de tasks revienta la fila y la carga inicial de todos los usuarios.
  async upload(file,companyId){
    const fd=new FormData();fd.append("file",file);fd.append("companyId",String(companyId||""));
    let d;
    try{const r=await fetch("/api/upload",{method:"POST",body:fd});d=await r.json();}
    catch(e){throw new Error("No se pudo contactar el servidor para subir el archivo");}
    if(d.url)return{name:d.name,type:d.type,url:d.url,size:d.size};
    if(d.error==="storage_no_configurado"){
      if(file.size>3*1024*1024)throw new Error((d.motivo?"Almacenamiento no disponible: "+d.motivo+". ":"Falta configurar el almacenamiento (bucket de Supabase). ")+"Mientras tanto solo se pueden subir archivos de menos de 3 MB.");
      const data=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>res(e.target.result);rd.onerror=rej;rd.readAsDataURL(file);});
      return{name:file.name,type:file.type,data,size:file.size};
    }
    throw new Error(d.error||"Error al subir el archivo");
  },
  async notify(data){try{await fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})}catch(e){console.log("notify err:",e)}},
  async gcalSync(email,title,company,date){try{const r=await fetch("/api/gcal/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,title,company,date})});return r.json();}catch(e){console.log("gcal sync err:",e);return{ok:false};}},
  async logout(){try{await fetch("/api/auth/logout",{method:"POST"});}catch(e){}localStorage.clear();sessionStorage.clear();window.location.href="/";},
};

// ═══ CUPOS DEL PLAN ═════════════════════════════════════════════
// El cupo es un número, no una cosa. Antes cada unidad del plan se materializaba como una
// tarea vacía ("Post 1 Fauna", "Historia 3 Fauna"…) que ocupaba sitio en la fila `tasks`,
// aparecía en las listas sin que nadie la hubiera pedido y, si alguien la movía de estado,
// se quedaba anclada para siempre. Ahora no se crea nada: lo disponible se calcula.
//
//   disponible = incluido − (piezas reales del mes + ajuste de arranque)
//
// El ajuste existe porque el conteo real se lleva fuera de la app: al empezar el mes se
// escribe a mano cuántas van consumidas y de ahí en adelante baja solo.
const mesKey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");   // m es 0-11, como en Date

// Lo que incluye el plan de una empresa, por tipo. `incluido` manda sobre la plantilla del
// plan: los planes se negocian caso a caso y tienen que poder editarse sin tocar el código.
const incluidoDe=co=>({...(PLANS[co?.plan]?.tasks||{}),...(co?.tasks||{}),...(co?.incluido||{})});

// Las piezas que cuentan contra el cupo son las reales: las que alguien creó. Se imputan al
// mes de su fecha. Las que todavía no tienen fecha son trabajo del mes en curso pendiente de
// agendar, así que cuentan solo ahí: imputarlas a cualquier mes que se mirara hacía que una
// pieza sin agendar apareciera consumida en todos los meses a la vez.
// Una unidad del plan se da por gastada cuando el cliente la aprueba: publicar viene después
// y depende de él, así que aprobada ya cuenta. Lo que está en camino —en producción, listo,
// esperando respuesta o corrigiéndose tras un rechazo— todavía no se gastó, pero sí está
// comprometido: no se puede prometer dos veces el mismo post. Por eso se cuentan aparte y las
// dos cosas restan del saldo.
const usadasEnMes=(tasks,coId,y,m)=>{
  const h=new Date(), esMesActual=(y===h.getFullYear()&&m===h.getMonth());
  const o={};
  (tasks||[]).forEach(t=>{
    if(String(t.companyId)!==String(coId))return;
    if(t.extraSlot)return;                       // los adicionales se cobran aparte
    // Un slot que se resetea o se vacía vuelve a "no_realizado" sin material: eso es cupo
    // liberado ("el cupo queda libre para usarlo más adelante"), no consumo. Sin esta línea
    // seguía restando para siempre, y con el respaldo de plannedDay de abajo quedaba además
    // clavado a un mes fijo, así que la promesa de la papelera nunca se cumplía.
    if(t.state==="no_realizado"&&!(t.files||[]).length)return;
    // Mes al que se imputa. El cupo se gasta cuando el cliente APRUEBA (regla del dominio), así
    // que una pieza aprobada queda anclada a su mes de producción —plannedDay— y no se mueve
    // aunque el cliente la publique en otro mes: la fecha de publicación es decisión suya y no
    // puede recolocar un cupo ya gastado. El resto va por su fecha de publicación; y sin fecha,
    // al mes en curso (es trabajo pendiente de agendar).
    const aprob=["aprobado","publicado"].includes(t.state);
    const ref=aprob?(t.plannedDay||t.date):(t.date||t.plannedDay);
    if(ref){const p=String(ref).split("-");if(+p[0]!==y||+p[1]!==m+1)return;}
    else if(!esMesActual)return;
    const c=o[t.type]||(o[t.type]={aprobadas:0,enCurso:0});
    if(aprob)c.aprobadas++;else c.enCurso++;
  });
  return o;
};

// ¿Esta pieza ya pasó por las manos del cliente? Da igual en qué punto esté: esperando
// respuesta, aprobada, publicada, rechazada o ya corregida. Desde el momento en que el cliente
// la vio, mandan su estado, su fecha y su material por sobre lo que diga el planner.
//
// Mirar solo el estado no alcanzaba: una pieza rechazada vuelve a `en_proceso`, y al subir la
// corrección `clientApproval` se pone a null. En esos dos momentos parecía una pieza cualquiera
// en producción, así que confirmarla desde Org Semanal devolvía los archivos del planner —es
// decir, la versión que el cliente ya había rechazado— y borraba la corrección.
// A quién avisar de una acción. Por defecto, a todos menos a quien la hizo: ya lo sabe, y
// recibir eco de lo propio convierte el teléfono en un espejo. Pero cuando alguien trabaja
// solo eso deja la app en silencio total y parece rota —fue exactamente lo que pasó—, así que
// hay un interruptor por persona para recibir también lo suyo.
//
// Se lee del almacenamiento en el momento de avisar, no en el render: estos filtros corren
// dentro de los callbacks de cada acción, no mientras se pinta.
const ecoPropio=()=>{try{return localStorage.getItem("inm_eco_propio")==="1";}catch(_){return false;}};
const otrosQueYo=(lista,cu)=>{
  const l=(lista||[]).filter(Boolean);
  return ecoPropio()?l:l.filter(u=>u.id!==cu?.id);
};

const saldoDe=(co,tasks,y,m)=>{
  const inc=incluidoDe(co);
  const usadas=usadasEnMes(tasks,co?.id,y,m);
  const ajuste=(co?.ajuste||{})[mesKey(y,m)]||{};
  const tipos=[...new Set([...Object.keys(inc),...Object.keys(usadas)])].filter(k=>TT[k]);
  return tipos.map(k=>{
    const incluido=inc[k]||0;
    const u=usadas[k]||{aprobadas:0,enCurso:0};
    // El ajuste es lo que ya venía consumido según el registro de fuera de la app: cuenta
    // como aprobado, porque es trabajo cerrado.
    const aprobadas=u.aprobadas+(ajuste[k]||0);
    return{tipo:k,incluido,aprobadas,enCurso:u.enCurso,usado:aprobadas,libre:incluido-aprobadas-u.enCurso};
  }).sort((a,b)=>b.incluido-a.incluido);
};

// "2026-08-07" → "jue, 7 de agosto". Se parte a mano en vez de `new Date(ds)`: esa forma se
// interpreta como UTC y en Chile pinta el día anterior.
const fechaDia=ds=>{
  // Solo los 10 primeros caracteres (YYYY-MM-DD): un timestamp ISO ("…-07T00:00:00Z") daría
  // tres trozos igual al partir por "-", el tercero sería "07T00:00:00Z", `+p[2]` NaN y saldría
  // "Invalid Date". Se toma el prefijo y se valida que sean tres números.
  const p=String(ds||"").slice(0,10).split("-");
  if(p.length!==3||p.some(x=>x===""||isNaN(+x)))return String(ds||"");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"long"});
};

// Días de grabación: antes vivían en localStorage bajo `grab_<semana>` con la forma
// {"YYYY-MM-DD":[{id,guionId,time}]}. Ahora van a Supabase como {semana:[{id,day,…}]}, con
// la fecha adentro para que el servidor pueda avisar. Esto rescata lo viejo una única vez.
const migrarGrabs=srv=>{
  const grabs=(srv&&typeof srv==="object"&&!Array.isArray(srv))?{...srv}:{};
  let migrado=false;
  try{
    Object.keys(localStorage).filter(k=>k.startsWith("grab_")).forEach(k=>{
      const wk=k.slice(5);
      if((grabs[wk]||[]).length)return;
      const viejo=JSON.parse(localStorage.getItem(k)||"{}");
      const lista=[];
      Object.entries(viejo).forEach(([day,arr])=>(arr||[]).forEach(e=>lista.push({id:String(e.id),day,guionId:e.guionId||null,time:e.time||null})));
      if(lista.length){grabs[wk]=lista;migrado=true;}
    });
  }catch(e){}
  return{grabs,migrado};
};

  if(s<86400)return "hace "+Math.floor(s/3600)+" h";
  if(s<172800)return "ayer";
  return "hace "+Math.floor(s/86400)+" días";};

// Todo lo que ocupa la pantalla entera se monta en el <body>, nunca dentro del árbol de la
// app: basta un ancestro con transform (una animación de entrada, por ejemplo) para que el

// centrado a media altura del documento —fuera de la pantalla— y solo se veía el fondo

function Portal({children:ch}){return ReactDOM.createPortal(ch,document.body)}

// Barra de cupos del mes. Se usa igual en Contenido y en Org Semanal: es el mismo dato y
// tiene que decir lo mismo en los dos sitios.
function Cupos({co,tasks,y,m,compact}){
  const saldo=useMemo(()=>co?saldoDe(co,tasks,y,m):[],[co,tasks,y,m]);
  if(!co||!saldo.length)return null;
  const agotados=saldo.filter(s=>s.libre<=0&&s.incluido>0).length;
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",padding:compact?"8px 12px":"11px 14px",borderRadius:12,background:PC.panel,border:"1px solid "+(agotados?"rgba(255,139,139,.3)":PC.line3),marginBottom:compact?10:14}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:PC.tx4,marginRight:2}}>
        {MO[m]} · disponible
      </span>
      {/* Cada tipo lleva su barra: relleno sólido = aprobado (gastado de verdad), relleno
          tenue = en curso (comprometido, todavía sin confirmar). Se ve sin pasar el dedo por
          encima, que en el teléfono no existe. */}
      {saldo.map(s=>{
        const c=TT[s.tipo]?.c||PC.tx3;
        const sinCupo=s.libre<=0;
        const pct=n=>s.incluido>0?Math.min(100,n/s.incluido*100)+"%":"0%";
        return(
          <div key={s.tipo} style={{display:"flex",flexDirection:"column",gap:4,padding:"7px 11px",borderRadius:12,minWidth:86,background:sinCupo?"rgba(255,139,139,.07)":c+"12",border:"1px solid "+(sinCupo?"rgba(255,139,139,.42)":c+"38")}}>
            <div style={{display:"flex",alignItems:"baseline",gap:5}}>
              <b style={{fontFamily:"var(--font-mono)",fontSize:15,lineHeight:1,color:sinCupo?PC.rojo:c}}>{s.libre}</b>
              <span style={{fontSize:11,fontWeight:600,color:PC.tx2}}>{TT[s.tipo]?.l||s.tipo}</span>
              {s.incluido>0&&<span style={{marginLeft:"auto",fontSize:9.5,color:PC.tx4}}>de {s.incluido}</span>}
            </div>
            {s.incluido>0&&<div style={{display:"flex",height:3,borderRadius:2,overflow:"hidden",background:PC.line}}>
              <span style={{width:pct(s.aprobadas),background:c}}/>
              <span style={{width:pct(s.enCurso),background:c,opacity:.34}}/>
            </div>}
            <span style={{fontFamily:"var(--font-mono)",fontSize:9,color:PC.tx4,letterSpacing:".03em"}}>
              {s.aprobadas} aprob · {s.enCurso} en curso
            </span>
          </div>);
      })}
      {agotados>0&&<span style={{fontSize:11,color:PC.rojo,fontWeight:600,flexBasis:"100%"}}>
        Sin cupo en {agotados===1?"un tipo":agotados+" tipos"}: lo que se cree de más va como adicional.
      </span>}
      <span style={{fontSize:10.5,color:PC.tx4,flexBasis:"100%",lineHeight:1.4}}>
        El número grande es lo que queda por empezar. El cupo se confirma como gastado recién
        cuando el cliente aprueba; publicar ya depende de él.
      </span>
    </div>);
}

// La llave VAPID viaja en base64url; pushManager.subscribe la quiere como Uint8Array.
function b64ToU8(b64){
  const pad="=".repeat((4-b64.length%4)%4);
  const s=(b64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(s);const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
const esIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const enPantallaInicio=()=>window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;

// `tile` lo dibuja como una baldosa del menú móvil. La barra lateral no existe bajo 820px,
// así que sin esto el botón de activar notificaciones era inalcanzable desde el celular —
// justo el único lugar donde las notificaciones importan.
function PushBtn({user,tile}){
  const[st,sSt]=useState("cargando");   // cargando|no-soportado|instalar|denegado|off|on|trabajando
  const[msg,sMsg]=useState("");
  const[ayuda,sAyuda]=useState(false);
  const[eco,sEco]=useState(ecoPropio);
  const togEco=()=>{const v=!eco;try{localStorage.setItem("inm_eco_propio",v?"1":"0");}catch(_){}sEco(v);sMsg(v?"Ahora también recibes lo tuyo":"");};

  useEffect(()=>{(async()=>{
    // En iOS la Push API solo existe si la app se abrió desde la pantalla de inicio
    if(esIOS()&&!enPantallaInicio())return sSt("instalar");
    if(!("serviceWorker" in navigator)||!("PushManager" in window))return sSt("no-soportado");
    let sub=null;
    try{
      const reg=await navigator.serviceWorker.ready;
      sub=await reg.pushManager.getSubscription();
    }catch(_){}
    if(sub){
      sSt("on");
      // Red de seguridad: si el navegador tiene suscripción, se vuelve a registrar en cada
      // apertura. Es un upsert por endpoint, cuesta una petición, y deja al servidor con el
      // correo correcto aunque la suscripción se haya renovado por su cuenta mientras la app
      // estaba cerrada. Sin esto la única forma de recuperarla era pulsar el botón a mano.
      if(user?.email)API.pushSubscribe(sub.toJSON(),user.email,user.gmail||"",user.name).catch(()=>{});
      return;
    }
    // Se consulta el servidor recién ahora: si Render está despertando, la llamada falla y
    // antes eso se traducía en "no-soportado", que esconde el botón justo cuando hace falta.
    const cfg=await API.pushKey().catch(()=>null);
    if(!cfg)return sSt("off");
    if(!cfg.ready)return sSt("no-soportado");
    sSt(Notification.permission==="denied"?"denegado":"off");
  })();},[user?.email]);

  const activar=async()=>{
    sSt("trabajando");sMsg("");
    try{
      const{publicKey}=await API.pushKey();
      const perm=await Notification.requestPermission();   // debe venir de un gesto del usuario
      if(perm!=="granted"){sSt(perm==="denied"?"denegado":"off");return;}
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(publicKey)});
      // Se guardan las dos identidades: el correo con el que inicia sesión y el Gmail con el
      // que entra por Google. Los avisos apuntan a cualquiera de las dos.
      await API.pushSubscribe(sub.toJSON(),user.email,user.gmail||"",user.name);
      await API.pushTest(user.email);
      sSt("on");sMsg("Listo, te llegó una de prueba");
    }catch(e){sSt("off");sMsg("No se pudo activar: "+e.message);}
  };

  const desactivar=async()=>{
    sSt("trabajando");
    try{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(sub){await API.pushUnsubscribe(sub.endpoint);await sub.unsubscribe();}
    }catch(_){}
    sSt("off");sMsg("");
  };

  const fila=(color,icono,texto,onClick,corto)=>(tile
    ? <button onClick={onClick} disabled={!onClick} style={{background:"var(--bg3)",border:"1px solid "+(st==="on"?"var(--success)":st==="denegado"?"rgba(255,68,68,.3)":"var(--border)"),borderRadius:10,padding:"12px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color,fontSize:10,fontFamily:"inherit",cursor:onClick?"pointer":"default",width:"100%"}}>
        <span style={{fontSize:22}}>🔔</span>{corto||texto}
      </button>
    : <button onClick={onClick} disabled={!onClick} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 12px",borderRadius:8,background:"transparent",color,fontSize:14,fontWeight:500,textAlign:"left",border:"none",cursor:onClick?"pointer":"default",fontFamily:"inherit",width:"100%"}}>
        <Ic n={icono} s={18}/>{texto}
      </button>);

  if(st==="cargando")return null;
  if(st==="no-soportado")return null;
  if(st==="instalar")return(<>
    {fila("var(--gold)","bell","Activar notificaciones",()=>sAyuda(true),"Activar")}
    <Md open={ayuda} onClose={()=>sAyuda(false)} title="Instala INMERSIA en tu iPhone" width={430}>
      <div style={{fontSize:13.5,color:"var(--tx2)",lineHeight:1.7}}>
        Para recibir notificaciones en el celular, iPhone exige que la app esté en la pantalla de inicio. Es una sola vez:
        <ol style={{paddingLeft:20,marginTop:12,marginBottom:14}}>
          <li style={{marginBottom:7}}>Abre esta página en <b style={{color:"var(--tx)"}}>Safari</b> (no sirve Chrome).</li>
          <li style={{marginBottom:7}}>Toca el botón <b style={{color:"var(--tx)"}}>Compartir</b> (el cuadrito con la flecha hacia arriba).</li>
          <li style={{marginBottom:7}}>Elige <b style={{color:"var(--tx)"}}>Añadir a pantalla de inicio</b>.</li>
          <li>Abre INMERSIA desde el ícono nuevo y vuelve a tocar «Activar notificaciones».</li>
        </ol>
        <div style={{fontSize:12.5,color:"var(--tx3)",background:"var(--bg3)",borderRadius:8,padding:"9px 11px",lineHeight:1.55}}>
          Cuando el iPhone pregunte por el permiso, <b style={{color:"var(--gold)"}}>acepta a la primera</b>. Si lo rechazas, la única forma de volver a preguntar es borrar el ícono y repetir estos pasos.
        </div>
      </div>
    </Md>
  </>);
  if(st==="denegado")return(<>
    {fila("var(--danger)","bell","Notificaciones bloqueadas",()=>sAyuda(true),"Bloqueadas")}
    <Md open={ayuda} onClose={()=>sAyuda(false)} title="Notificaciones bloqueadas" width={430}>
      <div style={{fontSize:13.5,color:"var(--tx2)",lineHeight:1.7}}>
        Rechazaste el permiso en este dispositivo.
        {esIOS()
          ?<> En iPhone no se puede volver a preguntar desde la app: hay que <b style={{color:"var(--tx)"}}>mantener pulsado el ícono de INMERSIA, eliminarlo</b>, y volver a añadirlo a la pantalla de inicio desde Safari.</>
          :<> Ábrelo desde el candado en la barra de direcciones y permite las notificaciones para este sitio.</>}
      </div>
    </Md>
  </>);
  if(st==="trabajando")return fila("var(--tx3)","bell","Activando…",null,"Activando…");
  if(st==="on")return(<>
    {fila("var(--success)","bell","Notificaciones ✓",desactivar,"Avisos ✓")}
    {msg&&<div style={{fontSize:10.5,color:"var(--tx3)",padding:"0 12px 6px"}}>{msg}</div>}
    {/* Normalmente no se recibe eco de lo propio: ya lo sabes y el teléfono se vuelve un
        espejo. Pero trabajando solo eso deja la app en silencio y parece rota, así que se
        puede activar — sirve para comprobar que los avisos salen de verdad. */}
    {tile
      ? <button onClick={togEco} style={{background:"var(--bg3)",border:"1px solid "+(eco?"var(--accent2)":"var(--border)"),borderRadius:10,padding:"12px 6px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:eco?"var(--accent)":"var(--tx3)",fontSize:10,fontFamily:"inherit",width:"100%",cursor:"pointer"}}>
          <span style={{fontSize:22}}>{eco?"🔁":"🔇"}</span>Lo mío
        </button>
      : <button onClick={togEco} title="Recibir también los avisos de las acciones que haces tú" style={{display:"flex",alignItems:"center",gap:9,padding:"7px 12px",borderRadius:8,background:"transparent",border:"none",color:eco?"var(--accent)":"var(--tx3)",fontSize:12,fontWeight:500,textAlign:"left",cursor:"pointer",fontFamily:"inherit",width:"100%"}}>
          <span style={{width:26,height:15,borderRadius:999,background:eco?"var(--accent)":"var(--bg4)",position:"relative",flexShrink:0,transition:"background .2s"}}>
            <span style={{position:"absolute",top:2,left:eco?13:2,width:11,height:11,borderRadius:"50%",background:eco?"var(--bg)":"var(--tx3)",transition:"left .2s"}}/>
          </span>
          Avisarme también de lo mío
        </button>}
  </>);
  return(<>
    {fila("var(--tx2)","bell","Activar notificaciones",activar,"Activar")}
    {msg&&<div style={{fontSize:10.5,color:"var(--danger)",padding:"0 12px 6px",lineHeight:1.4}}>{msg}</div>}
  </>);
}

// ═══ VISOR A PANTALLA COMPLETA ══════════════════════════════════
// Se abre lanzando un evento en vez de pasar estado por toda la jerarquía: cualquier
// miniatura de la app puede pedir el zoom sin que haya que cablear props hasta la raíz.
const openZoom=(files,index)=>{
  const list=(Array.isArray(files)?files:[files]).filter(Boolean);
  if(!list.length)return;
  window.dispatchEvent(new CustomEvent("inm:zoom",{detail:{files:list,index:index||0}}));
};

function ZoomLayer(){
  const[z,sZ]=useState(null);
  useEffect(()=>{
    const on=e=>sZ({files:e.detail.files,i:e.detail.index||0});
    window.addEventListener("inm:zoom",on);
    return()=>window.removeEventListener("inm:zoom",on);
  },[]);
  useEffect(()=>{
    if(!z)return;
    const k=e=>{
      if(e.key==="Escape")sZ(null);
      else if(e.key==="ArrowRight")sZ(p=>p&&{...p,i:Math.min(p.i+1,p.files.length-1)});
      else if(e.key==="ArrowLeft")sZ(p=>p&&{...p,i:Math.max(p.i-1,0)});
    };
    window.addEventListener("keydown",k);
    const prevOv=document.body.style.overflow;document.body.style.overflow="hidden";
    return()=>{window.removeEventListener("keydown",k);document.body.style.overflow=prevOv;};
  },[z]);
  if(!z)return null;
  const f=z.files[z.i],src=fSrc(f),many=z.files.length>1;
  const navBtn=extra=>({position:"absolute",top:"50%",transform:"translateY(-50%)",width:46,height:46,borderRadius:"50%",background:"rgba(255,255,255,.10)",border:"1px solid rgba(255,255,255,.20)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",backdropFilter:"blur(8px)",...extra});
  return(<Portal><div onClick={()=>sZ(null)} style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(4,6,9,.93)",backdropFilter:"blur(10px)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:20}}>
    <button onClick={()=>sZ(null)} title="Cerrar (Esc)" style={{position:"absolute",top:"calc(18px + env(safe-area-inset-top, 0px))",right:18,width:42,height:42,borderRadius:"50%",background:"rgba(255,255,255,.10)",border:"1px solid rgba(255,255,255,.20)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",backdropFilter:"blur(8px)"}}><Ic n="x" s={20} c="#fff"/></button>
    {many&&z.i>0&&<button onClick={e=>{e.stopPropagation();sZ(p=>({...p,i:p.i-1}));}} style={navBtn({left:18})}><Ic n="chev_l" s={22} c="#fff"/></button>}
    {many&&z.i<z.files.length-1&&<button onClick={e=>{e.stopPropagation();sZ(p=>({...p,i:p.i+1}));}} style={navBtn({right:18})}><Ic n="chev_r" s={22} c="#fff"/></button>}
    <div onClick={e=>e.stopPropagation()} style={{maxWidth:"100%",maxHeight:"84vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      {isVid(f)?<video src={src} controls autoPlay playsInline style={{maxWidth:"92vw",maxHeight:"84vh",borderRadius:12,display:"block",boxShadow:"0 30px 90px rgba(0,0,0,.7)"}}/>
       :isImg(f)?<img src={src} alt={f.name||""} style={{maxWidth:"92vw",maxHeight:"84vh",borderRadius:12,display:"block",objectFit:"contain",boxShadow:"0 30px 90px rgba(0,0,0,.7)"}}/>
       :<a href={src} download={f.name} style={{color:"#fff",fontSize:15,padding:"14px 22px",background:"rgba(255,255,255,.1)",borderRadius:10}}>Descargar {f.name||"archivo"}</a>}
    </div>
    <div onClick={e=>e.stopPropagation()} style={{fontSize:12.5,color:"rgba(255,255,255,.62)",textAlign:"center"}}>
      {f.name||""}{many?` · ${z.i+1} de ${z.files.length}`:""}
    </div>
  </div></Portal>);
}

function FilePrev({f,h=160,style,files,index}){
  const src=fSrc(f);if(!src)return null;
  const all=files||[f];
  const base={width:"100%",height:h,borderRadius:8,display:"block",background:"var(--bg4)",...style};

  return(<div style={{position:"relative"}}>{media}<ZoomBtn files={all} index={index||0}/></div>);
}

// Vista previa de video en bucle para las tarjetas. El atributo autoplay no basta: Chrome
// pausa el video mudo sin audio cuando cree que la pestaña no se ve, y la tarjeta queda
// en negro. Reintentamos al cargar y al volver a ser visible; si aun así no corre, se ve
// el triángulo de play sobre el primer cuadro.
function MiniVid({src,h=130,style}){
  const vref=useRef(null);const[corre,sCorre]=useState(false);
  useEffect(()=>{
    sCorre(false);
    const v=vref.current;if(!v)return;
    v.muted=true;
    // `playing` no basta como señal: con la pestaña en segundo plano Chrome deja el
    // elemento en estado "reproduciendo" pero no descarga ni un cuadro. Lo que decide si
    // hay algo que mirar es readyState ≥ 2 (HAVE_CURRENT_DATA) y que no esté en pausa.
    const sync=()=>sCorre(v.readyState>=2&&!v.paused);
    const go=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{});sync();};
    const onVis=()=>{if(!document.hidden)go();};
    ["play","pause","canplay","loadeddata","timeupdate","waiting","stalled"].forEach(ev=>v.addEventListener(ev,sync));
    v.addEventListener("canplay",go);
    document.addEventListener("visibilitychange",onVis);
    go();
    return()=>{["play","pause","canplay","loadeddata","timeupdate","waiting","stalled"].forEach(ev=>v.removeEventListener(ev,sync));v.removeEventListener("canplay",go);document.removeEventListener("visibilitychange",onVis);};
  },[src]);
  return(<div style={{position:"relative",lineHeight:0}}>

// ═══ LOGIN ══════════════════════════════════════════════════════
function Login({users:us,onLogin:ol}){

  const[e,sE]=useState("");
  const[p,sP]=useState("");
  const[er,sEr]=useState("");

  // Primero se valida contra el servidor: eso emite la cookie de sesión que necesitan
  // las notificaciones push, los avisos y la IA. Si el servidor no responde (caído o
  // sin red) se cae al chequeo local de siempre, para no dejar a nadie fuera.
  const go=async()=>{
    const el=e.toLowerCase().trim();
    const u=us.find(x=>x.email.toLowerCase()===el||x.name.toLowerCase()===el||(x.gmail&&x.gmail.toLowerCase()===el));
    if(!u)return sEr("Credenciales incorrectas");
    try{
      const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:u.email,password:p})});
      if(r.ok)return ol(u);
      if(r.status===401)return sEr("Credenciales incorrectas");
      throw new Error("servidor");
    }catch(_){
      if(u.pass===p)ol(u);else sEr("Credenciales incorrectas");
    }
  };

  const loginGoogle=()=>{
    window.location.href="/api/auth/google-login";
  };

  return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
      <div className="su" style={{width:420,padding:34,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:20}}>

        <h1 style={{textAlign:"center",marginBottom:20}}>INMERSIA</h1>

        {er && <div style={{color:"red",marginBottom:10}}>{er}</div>}

        <input
          type="text"
          value={e}
          onChange={x=>{sE(x.target.value);sEr("")}}
          placeholder="Email o usuario"
        />

        <input
          type="password"
          value={p}
          onChange={x=>{sP(x.target.value);sEr("")}}
          placeholder="Contraseña"
        />

        <button onClick={go} style={{width:"100%",marginTop:10,padding:10}}>
          Iniciar sesión
        </button>

        <button onClick={loginGoogle} style={{width:"100%",marginTop:10,padding:10,background:"#4285F4",color:"#fff"}}>
          Iniciar con Google
        </button>

      </div>
    </div>
  );
}

              {limpiando?"Limpiando…":"Borrar contenido"}

    </div>

}

function MiniLineChart({values,color="#60a5fa",h=72}){
  if(!values||values.length<2)return null;
  const max=Math.max(...values,1);const W=300;const H=h;
  const pts=values.map((v,i)=>`${(i/(values.length-1))*W},${H-2-((v/max)*(H-4))}`).join(" ");
  const gId="mlg"+color.replace(/[^a-z0-9]/gi,"");
  return(<div>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,overflow:"visible"}}>
      <defs><linearGradient id={gId} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".25"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <polygon points={`0,${H} ${pts} ${W},${H}`} fill={`url(#${gId})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--tx3)",marginTop:2}}><span>-30 días</span><span>Hoy</span></div>
  </div>);
}

function MiniBarChart({data,color="#60a5fa",h=90,fN}){
  if(!data||data.length<2)return null;
  const max=Math.max(...data.map(d=>d.v),1);
  const W=320;const barW=Math.max(Math.floor(W/data.length)-8,10);
  const gap=(W-barW*data.length)/(data.length+1);
  const fmt=fN||(n=>n>=1000000?(n/1000000).toFixed(1)+"M":n>=1000?(n/1000).toFixed(1)+"K":String(n));
  const isLast=(i)=>i===data.length-1;
  return(<svg viewBox={`0 0 ${W} ${h+28}`} style={{width:"100%",overflow:"visible"}}>
    <defs><linearGradient id={"bcg"+color.replace(/[^a-z0-9]/gi,"")} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.85"/>
      <stop offset="100%" stopColor={color} stopOpacity="0.25"/>
    </linearGradient></defs>
    {data.map((d,i)=>{
      const bh=Math.max((d.v/max)*h,2);
      const x=gap+(barW+gap)*i;
      const y=h-bh;
      return(<g key={i}>
        <rect x={x} y={y} width={barW} height={bh} fill={isLast(i)?color:`url(#bcg${color.replace(/[^a-z0-9]/gi,"")})`} opacity={isLast(i)?1:0.7} rx="3"/>
        {bh>18&&<text x={x+barW/2} y={y+12} textAnchor="middle" fontSize="8" fill={isLast(i)?"#fff":"var(--tx3)"} fontWeight="600">{fmt(d.v)}</text>}
        <text x={x+barW/2} y={h+16} textAnchor="middle" fontSize="9" fill={isLast(i)?"var(--tx2)":"var(--tx3)"} fontWeight={isLast(i)?"600":"400"}>{d.label}</text>
      </g>);
    })}
  </svg>);
}

  const[dragOverCol,sDragOverCol]=useState(null);
  const[pendingMove,sPendingMove]=useState(null);
  const[mChannels,sMChannels]=useState([]);
  const[mComunicacion,sMComunicacion]=useState("");
  const[mPeople,sMPeople]=useState([]);
  const[mDate,sMDate]=useState("");
  const[mTime,sMTime]=useState("");
  const[mFile,sMFile]=useState(null);

  const[expandedIds,sExpandedIds]=useState({});
  const[showAdd,sShowAdd]=useState(false);
  const[addName,sAddName]=useState("");
  const[addArea,sAddArea]=useState("");

  const[addInstagram,sAddInstagram]=useState("");
  const[addWebsite,sAddWebsite]=useState("");

  const[addMaps,sAddMaps]=useState("");
  const resetAddForm=()=>{sAddName("");sAddArea("");sAddCategory("");sAddInstagram("");sAddWebsite("");sAddPhone("");sAddMaps("");};
  const normalizeInstagram=(v)=>{
    if(!v)return"";
    const m=v.match(/instagram\.com\/([A-Za-z0-9_.]+)/);
    if(m)return m[1].replace(/\/$/,"");
    return v.replace(/^@/,"").trim();
  };
  const addDisabled=!addName.trim()||!addArea||!addCategory;
  const submitAdd=()=>{
    if(addDisabled)return;
    const np={
      id:"manual_"+Date.now(),
      name:addName.trim(),
      area:addArea,
      category:addCategory,
      instagram_handle:normalizeInstagram(addInstagram),
      website:addWebsite.trim(),
      phone:addPhone.trim(),
      maps_url:addMaps.trim(),
      fit_flag:"MANUAL",
      fit_reason:"Agregado manualmente"+(currentUser?.name?" por "+currentUser.name:""),
      status:"pendiente",
      created_at:new Date().toISOString(),
    };
    const nl=[...(pros||[]),np];
    sPros(nl);DB.save("prospects",nl);
    addN&&addN("Prospecto agregado: "+np.name);
    resetAddForm();sShowAdd(false);
  };

  useEffect(()=>{
    if(!pendingMove){sMChannels([]);sMComunicacion("");sMPeople([]);sMDate("");sMTime("");sMFile(null);return;}
    const p=(pros||[]).find(x=>x.id===pendingMove.id)||{};
    sMChannels(p.canales_primer_contacto||[]);
    sMComunicacion(p.comunicacion_status||"");
    sMPeople(p.reunion_personas||[]);
    sMDate(p.reunion_fecha||"");
    sMTime(p.reunion_hora||"");

  const setStatus=(id,status)=>{const nl=pros.map(x=>x.id===id?{...x,status}:x);sPros(nl);DB.save("prospects",nl);};
  const commitMove=(id,etapa,extra)=>{
    const nl=pros.map(x=>x.id===id?{...x,etapa,...extra}:x);

  const modalTitle=!pendingMove?"":
    pendingMove.targetEtapa==="contactado"?"¿Por qué canal(es) se hizo el primer contacto?":
    pendingMove.targetEtapa==="en_respuesta"?"¿Cómo está la comunicación?":
    pendingMove.targetEtapa==="reunion_agendada"?"Agendar reunión":
    pendingMove.targetEtapa==="cotizacion_lista"?"Subir cotización":"";
