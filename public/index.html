function ClientView({user:cu,onLogout:ol}){
  const[tasks,sT]=useState([]);const[cos,sCos]=useState([]);const[loaded,sLoaded]=useState(false);
  const[tab,sTab]=useState("aprobar");
  const[isMob,sIsMob]=useState(window.innerWidth<768);
  const[vw,sVw]=useState(window.innerWidth);
  const[busy,sBusy]=useState(false);
  const[toast,sToast]=useState("");
  const[perfil,sPerfil]=useState(false);

  useEffect(()=>{const h=()=>{sIsMob(window.innerWidth<768);sVw(window.innerWidth);};window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  useEffect(()=>{
    document.body.style.overflow="auto";document.body.style.height="auto";
    return()=>{document.body.style.overflow="";document.body.style.height="";};
  },[]);
  useEffect(()=>{DB.loadAll().then(d=>{if(d.companies)sCos(d.companies);if(d.tasks)sT(d.tasks);sLoaded(true);}).catch(()=>sLoaded(true));},[]);
  useEffect(()=>{if(!toast)return;const id=setTimeout(()=>sToast(""),2600);return()=>clearTimeout(id);},[toast]);

  const co=cos.find(c=>c.name.toLowerCase()===cu.companyName?.toLowerCase());
  const myTasks=useMemo(()=>tasks.filter(t=>co&&String(t.companyId)===String(co.id)),[tasks,co]);
  const approval=useMemo(()=>myTasks.filter(t=>t.state==="en_aprobacion"&&t.files&&t.files.length),[myTasks]);
  const planItems=useMemo(()=>myTasks.filter(t=>t.state==="aprobado"||t.state==="publicado"),[myTasks]);
  // Publicadas (ya salieron): tienen resultados que mostrar. Más reciente primero.
  const publicadas=useMemo(()=>myTasks.filter(t=>t.state==="publicado").sort((a,b)=>String(b.date||b.socialPost?.at||"").localeCompare(String(a.date||a.socialPost?.at||""))),[myTasks]);
  // Se deriva del equipo, no se escribe a mano: cuando alguien entra o sale, esto lo sigue.
  const equipoNoCliente=INIT_USERS.filter(u=>u.role!=="cliente");
  const teamEmails=[...new Set(equipoNoCliente.map(u=>u.gmail||u.email).filter(e=>e&&e.includes("@")))];
  const teamTargets=[...new Set(equipoNoCliente.flatMap(u=>[u.email,u.gmail]).filter(Boolean))];
  // El aviso al equipo va por correo (plantilla de siempre) y por push/campanita.
  const avisarEquipo=(title,body,important)=>API.notifsCreate({type:"cliente",title,body,to:teamTargets,url:"/",important:!!important});

  // Releemos desde Supabase antes de escribir: el equipo puede estar tocando otras tareas
  // al mismo tiempo y guardar nuestra copia entera las pisaría.
  //
  // Las escrituras van encoladas en una cadena de promesas. Sin esto, dos acciones
  // seguidas (que es justo lo que provoca un deck de swipe) se solapan: la segunda
  // relee ANTES de que la primera termine de guardar, y al escribir revierte la
  // aprobación anterior. El usuario ve que lo que aprobó "no aparece para agendar".
  const saveChain=useRef(Promise.resolve());
  const safeSaveTask=(taskId,updates)=>{
    const run=async()=>{
      sBusy(true);
      try{
        // loadAllStrict LANZA si la lectura falla. Con el loadAll tolerante, un fallo de red
        // devolvía {}, `fresh.tasks||[]` daba [], el map sobre [] daba [] y se escribía un array
        // vacío ENCIMA de app_data.tasks: se borraban las tareas de TODAS las empresas, sin
        // recuperación (la guarda hadData de Main luego se niega a re-guardar). Y como la tarea a
        // tocar tiene que existir en lo recién leído, si no aparece se aborta en vez de perderla.
        const fresh=await DB.loadAllStrict();
        const ft=Array.isArray(fresh.tasks)?fresh.tasks:[];
        if(!ft.some(t=>t.id===taskId)){sToast("⚠️ No se encontró la pieza; recarga e inténtalo de nuevo");return null;}
        const updated=ft.map(t=>t.id===taskId?{...t,...updates}:t);
        const ok=await DB.save("tasks",updated);
        if(!ok){sToast("⚠️ No se pudo guardar, revisa tu conexión");return null;}
        sT(updated);
        return updated;
      }catch(e){console.error("Safe save error:",e);sToast("⚠️ No se pudo guardar, revisa tu conexión");return null;}
      finally{sBusy(false);}
    };
    saveChain.current=saveChain.current.then(run,run);
    return saveChain.current;
  };

  // Aprobar NO agenda. La pieza llega desde Org Semanal arrastrando el día que puso el equipo,
  // y el banco de «Listo para agendar» es justamente `!t.date`: dejándolo, la publicación
  // aparecía ya colocada en un día que el cliente no eligió y nunca pasaba por el banco —
  // contradiciendo lo que promete la propia pantalla ("queda lista para agendar en Planificar").
  // El día del equipo no se tira: queda en `plannedDay` y se muestra como referencia al agendar.
  // safeSaveTask devuelve null si la escritura falló (ya mostró su propio aviso). Hay que
  // comprobarlo ANTES de cantar éxito y avisar al equipo: en datos móviles flojos, el cliente
  // veía «✅ Aprobado», al equipo le llegaba correo y push de aprobación, y en realidad nada se
  // había guardado — la pieza seguía en «Por aprobar» y el equipo perseguía algo que no existía.
  const approve=async t=>{
    const planificado=t.plannedDay||t.date||null;
    const ok=await safeSaveTask(t.id,{state:"aprobado",date:null,publishTime:null,plannedDay:planificado,clientApproval:{by:cu.name,date:new Date().toISOString(),status:"aprobado"}});
    if(!ok)return;
    sToast("✅ Aprobado — ya puedes agendarlo");
    API.notify({type:"task_status",to:teamEmails,taskTitle:t.title,company:cu.companyName,state:"✅ APROBADO por "+cu.companyName,date:planificado});
    avisarEquipo("✓ "+cu.companyName+" aprobó","\""+t.title+"\" quedó aprobada. Falta que la agenden en su calendario.");
  };
  const reject=async(t,motivo)=>{
    const ok=await safeSaveTask(t.id,{state:"en_proceso",clientApproval:{by:cu.name,date:new Date().toISOString(),status:"rechazado",comment:motivo},comments:[...(t.comments||[]),{user:"🏢 "+cu.name,text:motivo}]});
    if(!ok)return;
    sToast("Enviado al equipo con tu motivo");
    API.notify({type:"task_status",to:teamEmails,taskTitle:t.title,company:cu.companyName,state:"❌ RECHAZADO por "+cu.companyName+": "+motivo,date:t.date});
    avisarEquipo("✕ "+cu.companyName+" pidió cambios","\""+t.title+"\": "+motivo,true);
  };
  // Agendar no manda email: el cliente puede mover varias piezas seguidas y serían 7
  // correos al equipo. El equipo lo ve en su calendario y en la pestaña Contenido.
  const schedule=async(id,{date,publishTime,caption})=>{
    const ok=await safeSaveTask(id,{date,publishTime:publishTime||null,caption:caption||""});
    if(!ok)return;
    sToast("📅 Agendado para "+date+(publishTime?" a las "+publishTime:""));
  };
  const unschedule=async id=>{
    const ok=await safeSaveTask(id,{date:null,publishTime:null});
    if(!ok)return;
    sToast("Devuelto a «listo para agendar»");
  };

  // Conexión de Instagram desde el propio portal. Vive aquí y no solo en la vista del equipo
  // porque la autorización la tiene que dar quien está con la sesión de esa marca puesta: si
  // lo hace el equipo, hay que coordinarlo por fuera y eso es justo la fricción a evitar.
  const [ig,sIg]=useState(null);
  useEffect(()=>{if(co)API.igStatus(co.id).then(sIg);},[co]);
  const conectarIG=async()=>{
    const d=await API.igConnect(co.id);
    if(d&&d.authUrl)window.location.href=d.authUrl;
    else sToast("No se pudo abrir la conexión: "+((d&&d.error)||"error"));
  };
  // La otra conexión: la de publicar. Vive aquí por la misma razón que la de arriba, y era la
  // única que faltaba. Estaba solo en la vista del equipo, así que había que hacerla con el
  // cliente delante —la pestaña de autorización usa la sesión de Instagram del navegador, y la
  // del equipo no es la suya—. Aquí la abre él, con su cuenta ya puesta, y de paso deja de
  // haber un paso del alta que exige coordinar una videollamada.
  const [pub,sPub]=useState(null);
  const [pubCarga,sPubCarga]=useState(true);
  const leerPub=()=>{
    if(!co)return;
    sPubCarga(true);
    API.socialAccounts(co.id).then(d=>{sPub(d&&d.instagram?d.instagram:null);sPubCarga(false);});
  };
  useEffect(leerPub,[co]);
  const conectarPub=async()=>{
    const d=await API.socialConnect(co.id,co.name,"instagram");
    // A la misma pestaña, no a una nueva: en el teléfono una pestaña nueva se pierde detrás y
    // la persona cree que no pasó nada. Al volver, Zernio trae de vuelta aquí.
    if(d&&d.authUrl)window.location.href=d.authUrl;
    else sToast("No se pudo abrir la conexión: "+((d&&d.error)||"error"));
  };
  // Instagram vuelve con ?ig=ok|error. Se avisa y se limpia la URL, para que un F5 no repita
  // el mensaje ni deje el parámetro pegado en la barra.
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    if(!p.get("ig"))return;
    sToast((p.get("ig")==="ok"?"✅ ":"❌ ")+(p.get("msg")||""));
    window.history.replaceState({},"",window.location.pathname);
    if(co)API.igStatus(co.id).then(sIg);
  },[co]);

  if(!loaded)return(<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",flexDirection:"column",gap:12}}><div style={{width:36,height:36,borderRadius:9,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--bg)",fontWeight:700,fontSize:17}}>IN</div><div style={{color:"var(--tx2)",fontSize:13}}>Cargando...</div></div>);

  const pad=isMob?16:24;
  // El informe es de Huemul y sus cifras están escritas a mano, así que la pestaña solo
  // aparece en ese portal. En cuanto haya informe de otra empresa, esto pasa a mirar un dato
  // de la empresa en vez del nombre.
  const tieneInforme=/huemul/i.test(co?.name||"");
  const tabs=[["aprobar","Por aprobar",approval.length],["planificar","Planificar",0],...(publicadas.length?[["resultados","Resultados",0]]:[]),...(tieneInforme?[["informe","Informe del mes",0]]:[])];
  const iniciales=(cu.companyName||cu.name||"?").slice(0,2).toUpperCase();

  return(
    <div style={{minHeight:"100vh",color:PC.tx,fontFamily:"'Instrument Sans', 'Outfit', system-ui, sans-serif",
      background:"radial-gradient(900px 420px at 50% -140px, rgba(111,231,242,.07), transparent 70%), "+PC.bg}}>

      <header style={{position:"sticky",top:0,zIndex:100,display:"flex",alignItems:"center",gap:isMob?10:14,padding:isMob?"calc(12px + env(safe-area-inset-top, 0px)) 16px 12px":"14px 28px",background:"rgba(5,6,11,.92)",backdropFilter:"blur(12px)",borderBottom:"1px solid "+PC.line}}>
        <div style={{width:30,height:30,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(140deg,"+PC.cian+","+PC.peri+")",color:PC.bg,fontSize:12,fontWeight:700,flexShrink:0}}>IN</div>
        {!isMob&&<div style={{width:1,height:22,background:"#1E2536"}}/>}
        {/* El chip abre el perfil: correo, contraseña y carpetas de Drive */}
        <button onClick={()=>sPerfil(true)} title="Tu perfil" style={{display:"flex",alignItems:"center",gap:10,padding:"4px 12px 4px 4px",margin:"-4px 0",borderRadius:999,background:"transparent",border:"1px solid transparent",cursor:"pointer",fontFamily:"inherit",textAlign:"left",minWidth:0}}>
          <div style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(140deg,"+PC.lav+",#8E7BE0)",color:"#14101F",fontSize:11,fontWeight:700,flexShrink:0}}>{iniciales}</div>
          <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:0}}>
            <span style={{fontSize:14,fontWeight:600,lineHeight:1,color:PC.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cu.companyName||cu.name}</span>
            <span style={{fontSize:11,color:PC.tx4,lineHeight:1}}>Portal cliente</span>
          </div>
          <span style={{display:"flex",flexShrink:0}}><Ic n="chev_r" s={12} c={PC.tx4} style={{transform:"rotate(90deg)"}}/></span>
        </button>
        <div style={{flex:"1 1 auto"}}/>
        <button onClick={ol} style={{padding:isMob?"8px 12px":"8px 16px",borderRadius:999,background:"transparent",border:"1px solid "+PC.line2,color:PC.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:500,cursor:"pointer",flexShrink:0}}>{isMob?"Salir":"Cerrar sesión"}</button>
      </header>

      <ZoomLayer/>
      <PerfilModal open={perfil} onClose={()=>sPerfil(false)} user={cu} co={co} onToast={sToast}/>
      {busy&&<div className="blink-slow" style={{position:"fixed",top:"env(safe-area-inset-top, 0px)",left:0,right:0,height:3,background:PC.cian,zIndex:200}}/>}
      {toast&&<div style={{position:"fixed",top:"calc(70px + env(safe-area-inset-top, 0px))",left:"50%",transform:"translateX(-50%)",zIndex:300,background:PC.panel,border:"1px solid "+PC.line2,borderRadius:999,padding:"10px 20px",fontSize:13,fontWeight:600,color:PC.tx,boxShadow:"0 8px 28px rgba(0,0,0,.5)",maxWidth:"90vw",textAlign:"center"}}>{toast}</div>}

      <div style={{maxWidth:780,margin:"0 auto",padding:pad,paddingBottom:90,boxSizing:"border-box"}}>
        <div style={{display:"flex",gap:isMob?18:26,marginBottom:26,borderBottom:"1px solid "+PC.line}}>
          {tabs.map(([k,l,n])=>{const on=tab===k;return(
            <button key={k} onClick={()=>sTab(k)} style={{display:"flex",alignItems:"center",gap:8,padding:"12px 2px 14px",background:"none",border:"none",borderBottom:"2px solid "+(on?PC.cian:"transparent"),marginBottom:-1,color:on?PC.tx:PC.tx4,fontFamily:"inherit",fontSize:14,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
              <Ic n={k==="aprobar"?"ai":(k==="informe"||k==="resultados")?"trend_up":"calendar"} s={15} c={on?PC.cian:PC.tx4}/>
              {l}
              {n>0&&<span style={{minWidth:18,height:18,padding:"0 5px",borderRadius:999,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"rgba(111,231,242,.14)",border:"1px solid rgba(111,231,242,.4)",color:PC.cian,fontSize:11,fontWeight:700}}>{n}</span>}
            </button>);})}
        </div>

        {!co?(
          <div style={{textAlign:"center",padding:48,color:PC.tx3,fontSize:14}}>No encontramos la empresa «{cu.companyName}». Avísale al equipo de Inmersia.</div>
        ):tab==="informe"?(
          <InformePg/>
        ):tab==="aprobar"?(
          <SwipeDeck items={approval} onApprove={approve} onReject={reject} isMob={isMob} busy={busy} onGoPlan={()=>sTab("planificar")}/>
        ):tab==="resultados"?(
          <div>
            <div style={{fontSize:12.5,color:PC.tx3,lineHeight:1.5,marginBottom:14}}>Cómo le fue a cada publicación y qué dicen los números. Toca "Pregúntale a la IA" para conversar sobre cualquiera.</div>
            {publicadas.length===0
              ? <div style={{textAlign:"center",padding:40,color:PC.tx4,fontSize:13}}>Todavía no tienes publicaciones. Cuando salga la primera, aquí verás sus resultados.</div>
              : publicadas.map(t=><ResultadoPost key={t.id} co={co} task={t} isMob={isMob}/>)}
          </div>
        ):(<>
          {/* Los dos permisos que necesita la marca, juntos y en un solo sitio.
              Se nombran por lo que HACEN, no por el servicio que hay detrás: al cliente no le
              dice nada que uno vaya por Zernio y el otro contra Meta, y son dos autorizaciones
              de la misma cuenta de Instagram, así que sin decir para qué sirve cada una parece
              que la app le pide lo mismo dos veces.
              Cada tarjeta desaparece al quedar conectada: una tarjeta que pide algo ya hecho
              es ruido, y una que pide algo que todavía no se puede hacer —la app de Meta sin
              configurar— es peor que no mostrar nada. */}
          {[
            {k:"auto", ver:!!(ig&&ig.configurado&&!ig.conectada), icono:"💬",
              titulo:"Conecta tu Instagram para responder solo",
              texto:"Para contestar por privado a quien comente en tus publicaciones. Son tres toques en la pantalla de Instagram, y puedes desconectarla cuando quieras.",
              fn:conectarIG, error:ig&&ig.ultimoError?ig.ultimoError.msg:null},
            {k:"pub", ver:!pubCarga&&!pub, icono:"📸",
              titulo:"Conecta tu Instagram para publicar",
              texto:"Es un permiso aparte del de arriba: este deja que publiquemos y programemos tus piezas desde acá, sin que tengas que subirlas a mano.",
              fn:conectarPub, error:null},
          ].filter(c=>c.ver).map(c=>(
            <div key={c.k} style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",marginBottom:12,padding:"14px 16px",borderRadius:16,background:PC.panel,border:"1px solid "+PC.line2}}>
              <div style={{fontSize:22,flexShrink:0}}>{c.icono}</div>
              <div style={{flex:"1 1 240px",minWidth:0}}>
                <div style={{fontSize:13.5,fontWeight:600,color:PC.tx,marginBottom:3}}>{c.titulo}</div>
                <div style={{fontSize:12,color:PC.tx3,lineHeight:1.5}}>{c.texto}</div>
              </div>
              <button onClick={c.fn} style={{flexShrink:0,padding:"10px 20px",borderRadius:999,background:PC.cian,border:"1px solid "+PC.cian,color:PC.bg,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}}>Conectar</button>
              {/* El aviso flotante dura dos segundos y se pierde con la recarga que hace
                  Instagram al volver. El último fallo se muestra fijo hasta que se conecte. */}
              {c.error&&<div style={{flex:"1 1 100%",fontSize:12,color:"#FF8B8B",lineHeight:1.5,paddingTop:2}}>
                Último intento: {c.error}
              </div>}
            </div>))}
          {ig&&ig.conectada&&(
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:16,fontSize:12,color:PC.tx3}}>
              <span style={{width:7,height:7,borderRadius:"50%",background:"#8FF2C2",flexShrink:0}}/>
              Instagram conectado como <b style={{color:PC.tx2}}>@{ig.username}</b>
            </div>)}
          {/* El @ real de la cuenta. Primero la de comentario→DM (`/api/ig/status`), pero esa
              suele faltar porque exige Acceso Avanzado; entonces vale la de publicación de Zernio
              (`pub.username`), que es la que de verdad publica. El nombre de la marca es el último
              recurso: para una maqueta cumple, pero puede llevar espacios/acentos que ningún @
              real tiene. */}
          <PlanBoard items={planItems} onSchedule={schedule} onUnschedule={unschedule} isMob={isMob} coColor={co?.color} co={co}
            cuenta={ig?.username||pub?.username||co?.name||cu.companyName||""}/>
        </>)}
      </div>
    </div>
  );
}

function App(){
  const [u,sU]=useState(null);
  const [us,sUs]=useState(INIT_USERS);

  // 🔥 LOGIN GOOGLE
useEffect(() => {
  const params = new URLSearchParams(window.location.search);

  const email = params.get("email");
  const login = params.get("login");
  const gcal = params.get("gcal");
  const meta = params.get("meta");

  // 🔐 LOGIN
  if (login === "success" && email) {
    localStorage.setItem("userEmail", email);
    const found = us.find(x => x.email === email || x.gmail === email);
    sU(found || { id:99, name: email.split("@")[0], email, role: "admin", avatar: email.slice(0,2).toUpperCase(), color: "#9d6bff" });
    window.history.replaceState({}, document.title, "/");
  }

  // 📅 GCAL
  if (gcal === "success") {
    const gcalToken = params.get("gcal_token");
    if (gcalToken) {
      const saved2 = JSON.parse(localStorage.getItem("inm_gcal_tokens") || "{}");
      const userEmail2 = localStorage.getItem("userEmail");
      if (userEmail2) { saved2[userEmail2] = gcalToken; }
      else { saved2["default"] = gcalToken; }
      localStorage.setItem("inm_gcal_tokens", JSON.stringify(saved2));
    }
    alert("Google Calendar conectado ✅");
    window.history.replaceState({}, document.title, "/");
  }

  // 📊 META
  if (meta === "connected") {
    sessionStorage.setItem("meta_connected","1");
    window.history.replaceState({}, document.title, "/");
  }

  // 🔄 mantener sesión
  const saved = localStorage.getItem("userEmail");
  if (saved && !u) {
    const sl=saved.toLowerCase();
    const found = us.find(x => x.email.toLowerCase()===sl || x.name.toLowerCase()===sl || (x.gmail&&x.gmail.toLowerCase()===sl));
    sU(found || { id:99, name: saved.split("@")[0], email: saved, role: "admin", avatar: saved.slice(0,2).toUpperCase(), color: "#9d6bff" });
  }

}, []);

  if(!u) return <Login users={us} onLogin={x=>{localStorage.setItem("userEmail",x.email);sU(x);}}/>;
  if(u.role==="cliente") return <ClientView user={u} onLogout={()=>API.logout()}/>;
  return <Main user={u} users={us} onLogout={()=>API.logout()} setUsers={sUs}/>;
}

// Red de seguridad: sin esto, cualquier excepción no capturada en un render (una fila con un
// dato viejo/malo, un campo que se esperaba y no está) hace que React 18 desmonte TODO el árbol y
// deje la pantalla en blanco —lo peor posible en una demo delante de un cliente—. Con esto, el
// fallo queda acotado a un aviso con botón de recarga y el error se ve en consola para depurar.
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return{err};}
  componentDidCatch(err,info){console.error("ErrorBoundary atrapó:",err,info);}
  render(){
    if(this.state.err){
      return React.createElement("div",{style:{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",fontFamily:"system-ui,sans-serif",background:"#0f1115",color:"#e8e8ea",textAlign:"center"}},
        React.createElement("div",{style:{maxWidth:"420px"}},
          React.createElement("div",{style:{fontSize:"40px",marginBottom:"12px"}},"⚠️"),
          React.createElement("h2",{style:{margin:"0 0 8px"}},"Algo se cargó mal"),
          React.createElement("p",{style:{opacity:.7,margin:"0 0 20px",lineHeight:1.5}},"Recarga la página para volver. Si insiste, avísale al equipo."),
          React.createElement("button",{onClick:()=>window.location.reload(),style:{background:"#4ecdc4",color:"#08252a",border:"none",borderRadius:"10px",padding:"12px 22px",fontSize:"15px",fontWeight:700,cursor:"pointer"}},"Recargar")
        )
      );
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App,null)));
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});

  // El service worker sirve la app desde la caché para que abra al instante aunque Render
  // esté dormido. El precio es que la primera apertura tras un despliegue muestra todavía la
  // versión anterior; cuando el refresco de fondo detecta que cambió, avisa por aquí.
  //
  // NO se recarga sola a propósito: recargar bajo los pies de alguien que está escribiendo un
  // guion o votando una pieza le borraría lo que lleva hecho. El aviso se puede cerrar y la
  // versión nueva entra igual en la siguiente apertura.
  var swAvisoPuesto = false;
  navigator.serviceWorker.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.tipo !== 'version-nueva' || swAvisoPuesto) return;
    swAvisoPuesto = true;

    var caja = document.createElement('div');
    caja.setAttribute('role', 'status');
    // Se cuelga del <body>, no del árbol de la app: cualquier ancestro con `transform` o
    // `filter` rompe `position: fixed`, que es la trampa que ya obligó a montar los modales
    // con el helper Portal. El hueco de abajo esquiva la barra inferior del teléfono.
    caja.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);' +
      'bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);z-index:99999;' +
      'display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;' +
      'border-radius:14px;background:#0C0F17;border:1px solid #2A3145;' +
      'box-shadow:0 8px 32px -8px rgba(0,0,0,.75);max-width:calc(100vw - 32px);' +
      'font:500 13px/1.4 "DM Sans",system-ui,sans-serif;color:#E7EAF3';

    var texto = document.createElement('span');
    texto.textContent = 'Hay una versión nueva de la app.';

    var recargar = document.createElement('button');
    recargar.type = 'button';
    recargar.textContent = 'Recargar';
    recargar.style.cssText = 'flex:none;border:1px solid rgba(111,231,242,.4);border-radius:9px;' +
      'background:rgba(111,231,242,.12);color:#6FE7F2;padding:6px 12px;cursor:pointer;' +
      'font:600 13px/1 "DM Sans",system-ui,sans-serif';
    recargar.onclick = function () { location.reload(); };

    var cerrar = document.createElement('button');
    cerrar.type = 'button';
    cerrar.textContent = '✕';
    cerrar.setAttribute('aria-label', 'Cerrar aviso');
    cerrar.style.cssText = 'flex:none;border:0;background:transparent;color:#98A0B6;' +
      'padding:6px 8px;cursor:pointer;font-size:13px;line-height:1';
    cerrar.onclick = function () { caja.remove(); };

    caja.appendChild(texto);
    caja.appendChild(recargar);
    caja.appendChild(cerrar);
    document.body.appendChild(caja);
  });
}
</script>
