            {etiqueta("Después continuar con")}
            {selDestino(nSel.siguiente,v=>editPaso(nSel.id,"siguiente",v),"— terminar la cadena —",nSel.id)}
          </div>
        </>}

        <div style={{flex:"1 1 auto"}}/>
        {nSel.id!==TRIG&&<button onClick={()=>borrarNodo(nSel.id)}
          style={{padding:"10px 16px",borderRadius:999,background:"transparent",border:"1px solid rgba(255, 107, 107, 0.35)",color:"#FF8B8B",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer"}}>Eliminar bloque</button>}
      </aside>}
    </div>

    {/* ── Vista grande de la publicación bajo el ratón ──
        Va en su propio Portal: la rejilla vive dentro de un contenedor con `overflow: auto`,
        así que cualquier cosa que quisiera asomarse por encima se recortaría contra el borde.
        `pointerEvents: none` para que no se interponga entre el ratón y la miniatura, que
        haría parpadear el preview al entrar y salir sin parar. */}
    {prevPub&&(()=>{
      const p=prevPub.p, ancho=270, alto=368;
      // Sale hacia el lienzo, al lado de la miniatura, no encima: la rejilla está pegada al
      // borde derecho y en las filas de abajo un preview vertical se salía por arriba de la
      // ventana y quedaba cortado. Si por lo que sea no cabe a la izquierda, se va a la derecha.
      const cabeIzq=prevPub.l-14-ancho>=8;
      const left=cabeIzq?prevPub.l-14:prevPub.r+14;
      // Centrado en la miniatura, pero sujeto a la ventana: así nunca se sale ni por arriba ni
      // por abajo, sea cual sea la fila. El alto es fijo para poder calcularlo.
      const top=Math.min(Math.max(prevPub.cy-alto/2,12),Math.max(12,window.innerHeight-alto-12));
      return(<Portal>
        <div style={{position:"fixed",left,top,transform:cabeIzq?"translateX(-100%)":"none",
          zIndex:1050,pointerEvents:"none",width:ancho,height:alto,display:"flex",flexDirection:"column",
          borderRadius:16,overflow:"hidden",background:"#0B0E17",border:"1px solid #2A3145",
          boxShadow:"0 26px 64px rgba(2, 3, 8, 0.85)",animation:"ccFadeIn 0.14s ease-out"}}>
          {p.img
            ?<img src={p.img} alt="" style={{width:ancho,height:ancho,objectFit:"cover",display:"block",flexShrink:0}}/>
            :<div style={{width:ancho,height:ancho,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,color:"#4A5265"}}>{p.tipo==="VIDEO"?"🎬":"📷"}</div>}
          <div style={{padding:"11px 13px",display:"flex",flexDirection:"column",gap:5,minHeight:0}}>
            <span style={{fontSize:12,lineHeight:1.45,color:"#F4F2ED",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
              {p.titulo||"Sin texto"}
            </span>
            <span style={{fontFamily:"ui-monospace, monospace",fontSize:10.5,color:"#6B7484"}}>
              {p.tipo==="VIDEO"?"Video":"Imagen"}{p.comentarios!=null?" · "+p.comentarios+" comentario"+(p.comentarios===1?"":"s"):""}
            </span>
          </div>
        </div>
      </Portal>);
    })()}
  </div>);

  // En el teléfono va montado en el <body>: a pantalla completa dentro de la columna de
  // contenido no existe, y `position: fixed` se rompe en cuanto un ancestro tiene `transform`.
  return movil?<Portal>{cuerpo}</Portal>:cuerpo;
}

function ContenidoPg({cos,tasks,sT,addN,users,avisar,correosDe,cu,planners,sPlanners}){
  const [selCo,sSelCo]=useState(()=>cos[0]?.id||0);
  useEffect(()=>{if(cos.length&&!cos.find(c=>String(c.id)===String(selCo)))sSelCo(cos[0].id);},[cos]);
  const co=cos.find(c=>String(c.id)===String(selCo));
  const [upType,sUpType]=useState("post");
  const [busy,sBusy]=useState(false);
  const [prog,sProg]=useState("");
  const [leftover,sLeftover]=useState([]);
  const [dragOver,sDragOver]=useState(false);
  const [stReady,sStReady]=useState(true);
  const [stMotivo,sStMotivo]=useState("");
  const [dzOpen,sDzOpen]=useState(false);
  // Qué pieza aprobada está desplegada. Solo una a la vez: son las cerradas, se consultan de
  // una en una y varias abiertas devolverían la parrilla que se quiso quitar.
  const [aprobAbierta,sAprobAbierta]=useState(null);
  const [preset,sPreset]=useState(false);   // selector de plantilla al crear una cadena
  // Cuando se prepara una cadena PARA una pieza concreta (desde la lista de pendientes), aquí va
  // su id: la cadena que se cree se ata a esa tarea (taskId) y arranca "pendiente de media" —
  // sin publicación asignada — para que se arme sola al publicarse el reel/post.
  const [taskParaCadena,sTaskParaCadena]=useState(null);
  const fileRef=useRef(null);
  useEffect(()=>{API.uploadStatus().then(d=>{sStReady(!!d.ready);sStMotivo(d.motivo||"");});},[]);
  // Instagram de la empresa seleccionada. Se relee al cambiar de empresa porque la conexión
  // vive en Zernio: si el cliente la corta desde allá, aquí tiene que dejar de ofrecerse.
  const [ig,sIg]=useState(null);
  const [igCarga,sIgCarga]=useState(true);
  const [pubId,sPubId]=useState(null);
  useEffect(()=>{let vivo=true;sIgCarga(true);sIg(null);
    API.socialAccounts(selCo).then(d=>{if(!vivo)return;sIg(d&&d.instagram?d.instagram:null);sIgCarga(false);});
    return()=>{vivo=false;};},[selCo]);

  // Producción, publicación y automatización son tres trabajos distintos y se pisaban en la
  // misma pantalla. Publicar no es una etapa más del ciclo: pasa DESPUÉS de que el cliente
  // aprueba, y mezclarlo con las cinco etapas obligaba a rebuscar entre piezas a medio hacer.
  const [vista,sVista]=useState("produccion");

  // Automatización comentario → DM. Va por Meta directo, no por Zernio: la respuesta privada
  // es la única forma de escribirle a alguien que no te ha escrito, y Zernio no la expone.
  const [igEst,sIgEst]=useState(null);
  const [reglas,sReglas]=useState([]);
  const [guardando,sGuardando]=useState(false);
  const [pubs,sPubs]=useState(null);
  const [abierta,sAbierta]=useState(null);   // índice de la cadena que se está construyendo
  // Las reglas de antes tenían un solo `mensaje`. Se convierten a cadena de un paso al
  // cargarlas, para que el constructor las muestre sin que haya que migrar nada a mano.
  const cargarAuto=()=>API.igStatus(selCo).then(d=>{
    sIgEst(d);
    sReglas((d.reglas||[]).map(r=>(Array.isArray(r.pasos)&&r.pasos.length)?r
      :{...r,pasos:[{id:"p1",tipo:"mensaje",texto:r.mensaje||"",botones:[]}]}));
  });
  useEffect(()=>{if(vista==="automatizacion")cargarAuto();},[vista,selCo]);
  // Las publicaciones reales de Instagram, para poder atar una regla a una en concreto.
  useEffect(()=>{
    if(vista!=="automatizacion"){sPubs(null);return;}
    let vivo=true;
    API.igPublicaciones(selCo).then(d=>{if(vivo)sPubs(d&&d.publicaciones?d.publicaciones:[]);});
    return()=>{vivo=false;};
  },[vista,selCo]);

  const conectarIGMeta=async()=>{
    const d=await API.igConnect(selCo);
    if(d&&d.authUrl){window.open(d.authUrl,"_blank","noopener");addN("Autoriza la cuenta en la pestaña nueva y vuelve a abrir esta ventana.");}
    else addN("❌ "+((d&&d.error)||"no se pudo generar el enlace"));
  };
  const guardarReglas=async()=>{
    // El servidor descarta las cadenas sin palabra clave: sin ella no hay nada que dispare, así
    // que no es una cadena todavía. Pero descartarla en silencio, después de armarla entera, es
    // perder el trabajo sin saber por qué — sobre todo con las plantillas, que llegan con diez
    // bloques puestos y la palabra vacía a propósito.
    const sinPalabra=reglas.filter(r=>!String(r.palabra||"").trim()).length;
    if(sinPalabra){
      addN("⚠️ "+sinPalabra+(sinPalabra===1?" cadena no se guarda: le falta la palabra clave.":" cadenas no se guardan: les falta la palabra clave."));
      return;
    }
    sGuardando(true);
    try{
      const d=await API.igReglas(selCo,reglas);
      if(d&&d.error)addN("❌ "+d.error);
      else{
        sReglas(d.reglas||[]);addN("✅ Automatización guardada");
        // Piezas cuya cadena quedó vinculada (taskId) y aún no estaban "lista": se marcan y se
        // avisa UNA vez al equipo y al cliente. La cadena se activará sola al publicarse la pieza.
        const conCadena=new Set((d.reglas||reglas).filter(r=>r.taskId).map(r=>String(r.taskId)));
        const recienListas=(tasks||[]).filter(t=>conCadena.has(String(t.id))&&t.autoEstado!=="lista"&&t.autoEstado!=="armada");
        if(recienListas.length){
          sT(prev=>{const next=prev.map(t=>conCadena.has(String(t.id))&&t.autoEstado!=="lista"&&t.autoEstado!=="armada"?{...t,autoEstado:"lista"}:t);DB.save("tasks",next);return next;});
          recienListas.forEach(t=>{
            avisarEquipo("🔧 Automatización lista","«"+(t.title||"Pieza")+"» ya tiene su cadena de comentarios. Se activará sola cuando se publique.",false,"autolista_"+t.id);
            if(co&&co.email&&co.email.includes("@"))API.notify({type:"task_status",to:[co.email],taskTitle:t.title,company:co.name,state:"🔧 Tu contenido lleva una automatización de comentarios y ya quedó lista",date:td()});
          });
        }
      }
    }finally{sGuardando(false);}
  };
  // Borrar una cadena se guarda en el acto, no espera a "Guardar cambios": una automatización
  // que parece eliminada y reaparece al recargar es peor que un clic de más. Si el servidor
  // rechaza el guardado se devuelve la lista como estaba, para no dejar en pantalla una cadena
  // borrada que en realidad sigue viva y respondiendo comentarios.
  const borrarRegla=async i=>{
    const r=reglas[i];
    const cual=r.nombre||(r.palabra?("la cadena de “"+r.palabra+"”"):"esta cadena sin nombre");
    if(!confirm("¿Eliminar "+cual+"?\n\nDeja de responder a los comentarios en cuanto se guarde. No se puede deshacer."))return;
    const antes=reglas;
    const nuevas=reglas.filter((_,j)=>j!==i);
    sReglas(nuevas);
    sGuardando(true);
    try{
      const d=await API.igReglas(selCo,nuevas);
      if(d&&d.error){sReglas(antes);addN("❌ "+d.error);}
      else{sReglas(d.reglas||[]);addN("🗑 Cadena eliminada");}
    }catch(e){sReglas(antes);addN("❌ No se pudo eliminar");}
    finally{sGuardando(false);}
  };
  const nid=()=>Math.random().toString(36).slice(2,8);
  const pasoVacio=tipo=>tipo==="condicion"
    ?{id:nid(),tipo:"condicion",texto:"",botones:[],siSi:"",siNo:""}
    :{id:nid(),tipo:"mensaje",texto:"",botones:[]};
  // Nace con un mensaje ya puesto y marcado como inicio: una cadena vacía no se puede
  // arrancar, y obligar a crear el primer bloque a mano no aporta nada.
  // Una plantilla no crea nada especial: deja los mismos pasos que se habrían puesto a mano, y
  // desde ahí se edita como cualquier otra. Lo que NO trae es la palabra ni la publicación —eso
  // se elige en el disparador, que es lo primero que se abre.
  // Si la cadena se está preparando PARA una pieza (taskParaCadena), se le pega el vínculo:
  // taskId + pendienteMedia. `pendienteMedia` hace que el webhook la IGNORE hasta que la pieza se
  // publique y el motor le ponga el mediaId real (Fase 4). Así la cadena se deja lista hoy y no
  // dispara nada hasta que el reel esté online.
  const _vinculo=()=>taskParaCadena?{taskId:taskParaCadena,pendienteMedia:true}:{};
  const crearDesdePreset=p=>{
    const d=p.construir();
    sReglas(r=>[...r,{id:"n"+Date.now(),mediaId:"",activa:true,...d,..._vinculo()}]);
    sAbierta(reglas.length);
    sPreset(false);
    sTaskParaCadena(null);
  };
  const nuevaRegla=()=>{const v=_vinculo();sTaskParaCadena(null);sReglas(r=>{
    const p=pasoVacio();
    p.titulo="Mensaje de bienvenida";p.x=320;p.y=210;
    return[...r,{id:"n"+Date.now(),nombre:"",mediaId:"",palabra:"",activa:true,inicio:p.id,pasos:[p],tx:320,ty:30,...v}];
  });};

  const equipo=votantes(users);
  // Avisos. Nunca se avisa a quien hizo la acción: ya lo sabe.
  const otrosVotantes=()=>otrosQueYo(equipo,cu);
  const avisarListas=n=>{
    const dest=otrosVotantes();
    if(!avisar||!co||!n||!dest.length)return;
    avisar({type:"votacion",title:"🗳 Contenido esperando tu voto",
      body:`${n} pieza${n===1?"":"s"} de ${co.name} ${n===1?"quedó lista":"quedaron listas"}. Falta que votes para poder enviarlas.`,
      to:correosDe(dest),url:"/"});
  };
  const avisarEquipo=(titulo,cuerpo,importante,clave)=>{
    const dest=otrosQueYo((users||[]).filter(u=>u.role!=="cliente"),cu);
    if(!avisar||!dest.length)return;
    avisar({type:"contenido",title:titulo,body:cuerpo,to:correosDe(dest),url:"/",important:!!importante,dedupKey:clave||null});
  };
  // Encargados de una pieza = quienes figuran como responsables. Los admins se suman en los
  // hitos que cierran etapa (envío al cliente y respuesta del cliente).
  const encargados=t=>(users||[]).filter(u=>u.role!=="cliente"&&(Array.isArray(t.responsable)?t.responsable:[t.responsable]).includes(u.id));
  const adminsEq=()=>(users||[]).filter(u=>u.role==="admin");
  const avisarA=(gente,titulo,cuerpo,importante,clave)=>{
    const dest=[...new Map(otrosQueYo(gente,cu).map(u=>[u.id,u])).values()];
    if(!avisar||!dest.length)return;
    avisar({type:"contenido",title:titulo,body:cuerpo,to:correosDe(dest),url:"/",important:!!importante,dedupKey:clave||null});
  };

  // Piezas que quedaron sueltas: su item se borró en Org Semanal pero la tarea sobrevivió,
  // así que siguen apareciendo aquí para siempre. Ya no se generan nuevas —borrar en el
  // planner ahora borra las dos cosas—, pero hay que poder limpiar las que quedaron. Solo
  // se calcula con los planners cargados: con la lista vacía, todo parecería huérfano.
  const huerfanas=useMemo(()=>{
    if(!planners?.length)return[];
    const vivos=new Set(planners.flatMap(p=>(p.items||[]).map(i=>String(i.id))));
    return tasks.filter(t=>t.itemId!==undefined&&t.itemId!==null&&t.plannerTag&&!vivos.has(String(t.itemId)));
  },[tasks,planners]);
  const limpiarHuerfanas=()=>{
    if(!confirm("Se eliminan "+huerfanas.length+" pieza"+(huerfanas.length===1?"":"s")+" que ya no existen en Org Semanal:\n\n"+huerfanas.map(t=>"· "+(t.title||"Sin título")).join("\n")+"\n\n¿Eliminar?"))return;
    const fuera=new Set(huerfanas.map(t=>t.id));
    sT(prev=>{const r=prev.filter(t=>!fuera.has(t.id));DB.save("tasks",r);return r;});
    addN("🧹 "+huerfanas.length+" pieza"+(huerfanas.length===1?"":"s")+" fuera de Contenido");
  };

  // ── Crear una pieza a mano ──
  // Se escribe en los dos lados a la vez: el item del planner (para que aparezca en Org
  // Semanal, en su día) y la tarea (para que aparezca aquí). Las une `itemId`, que es lo
  // que evita que "Guardar y sincronizar" las duplique o las pise.
  const[nueva,sNueva]=useState(false);
  const[nf,sNf]=useState({title:"",type:"post",date:td()});
  const lunesDe=ds=>{const q=ds.split("-").map(Number);const d=new Date(q[0],q[1]-1,q[2]);
    const dow=d.getDay();d.setDate(d.getDate()-(dow===0?6:dow-1));
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
  const crearPieza=()=>{
    if(!co)return;
    const dia=nf.date||td();
    const wk=lunesDe(dia)+"_"+String(selCo);
    const itemId=uid();
    const titulo=nf.title.trim()||((TT[nf.type]?.l||"Contenido")+" "+co.name);
    const item={id:itemId,day:dia,type:nf.type,title:titulo,description:"",strategy:"",production:[],state:"borrador",order:0};
    sPlanners(prev=>{
      const i=(prev||[]).findIndex(x=>x.weekKey===wk);
      const np=i>=0
        ?(prev.map((x,j)=>j===i?{...x,items:[...(x.items||[]),item]}:x))
        :[...(prev||[]),{weekKey:wk,companyId:String(selCo),companyName:co.name,items:[item]}];
      DB.save("planners",np);return np;});
    sT(p=>[...p,{id:ni(),itemId,plannerTag:"planner_"+wk,title:titulo,company:co.name,companyId:co.id,
      type:nf.type,description:"",responsable:[],date:dia,state:"en_proceso",
      comments:[],votes:{},files:[],clientApproval:null}]);
    // El cupo avisa, no bloquea: a veces se produce de más y eso se factura como adicional.
    // Quien lo decide es el equipo, no la app.
    const quedaban=libreDe(nf.type);
    addN(quedaban>0
      ?"✅ Pieza creada en "+co.name+" · "+dia+" · quedan "+(quedaban-1)+" "+(TT[nf.type]?.l||nf.type)
      :"⚠️ Pieza creada, pero "+co.name+" ya no tenía cupo de "+(TT[nf.type]?.l||nf.type)+" este mes: va como adicional");
    sNueva(false);sNf({title:"",type:"post",date:td()});
  };

  const coTasks=useMemo(()=>tasks.filter(t=>String(t.companyId)===String(selCo)),[tasks,selCo]);
  const hasFiles=t=>!!(t.files&&t.files.length);
  // El cupo dejó de ser una lista de tareas vacías y pasó a ser un número: lo que incluye el
  // plan menos lo que ya se hizo este mes.
  const hoyY=new Date().getFullYear(), hoyM=new Date().getMonth();
  const saldo=useMemo(()=>co?saldoDe(co,tasks,hoyY,hoyM):[],[co,tasks,hoyY,hoyM]);
  const libreDe=tp=>Math.max(0,saldo.find(s=>s.tipo===tp)?.libre??0);
  const slotCounts=useMemo(()=>{const o={};saldo.forEach(s=>{if(s.libre>0)o[s.tipo]=s.libre;});return o;},[saldo]);

  // A qué etapa pertenece cada pieza
  const etapaDe=t=>{
    if(t.state==="en_proceso"&&t.clientApproval?.status==="rechazado")return "rechazado";
    if(t.state==="aprobado"||t.state==="publicado")return "aprobado";
    if(t.state==="en_aprobacion")return "enviado";
    if(hasFiles(t))return "listo";
    if(t.state==="en_proceso")return "produccion";
    return null;   // hueco del plan sin material: no se muestra
  };
  const porEtapa=useMemo(()=>{const o={};CONT_META.forEach(m=>o[m.k]=[]);
    coTasks.forEach(t=>{const e=etapaDe(t);if(e&&o[e])o[e].push(t);});return o;},[coTasks]);

  // Antes esto repartía los archivos entre las tareas vacías que había creado el plan. Ya no
  // hay tareas vacías: cada archivo crea su pieza. Lo que entra en el cupo del mes se crea
  // como pieza del plan; lo que sobra espera un clic, porque una pieza fuera del plan se
  // factura aparte y no es una decisión que deba tomar sola la app.
  const handleFiles=async fileList=>{
    const files=Array.from(fileList||[]);if(!files.length||!co)return;
    const libre=libreDe(upType);
    const n=Math.min(files.length,libre);
    sBusy(true);sLeftover([]);
    try{
      const yaHay=coTasks.filter(t=>t.type===upType).length;
      const creadas=[];
      for(let i=0;i<n;i++){
        sProg(`Subiendo ${i+1} de ${n}…`);
        const meta=await API.upload(files[i],selCo);
        creadas.push({id:ni(),title:(TT[upType]?.l||upType)+" "+(yaHay+i+1)+" "+co.name,company:co.name,companyId:selCo,type:upType,description:"",responsable:[],date:null,state:"no_realizado",comments:[],votes:{},files:[meta]});
      }
      if(creadas.length)sT(p=>{const r=[...p,...creadas];DB.save("tasks",r);return r;});
      if(files.length>n)sLeftover(files.slice(n));
      if(n){addN(`✅ ${n} pieza(s) nuevas en ${co.name}`);avisarListas(n);}
      else if(files.length)addN(`⚠️ ${co.name} no tiene cupo de ${TT[upType]?.l||upType} este mes — puedes crearlas como adicionales`);
    }catch(e){addN("❌ "+e.message);}
    finally{sBusy(false);sProg("");if(fileRef.current)fileRef.current.value="";}
  };

  // Si sobran archivos es porque el plan no tiene más slots de ese tipo. No los creamos
  // solos: piezas fuera del plan afectan la facturación, así que requiere un clic explícito.
  const createExtras=async()=>{
    if(!leftover.length||!co)return;
    sBusy(true);
    try{
      const created=[];
      for(let i=0;i<leftover.length;i++){
        sProg(`Subiendo adicional ${i+1} de ${leftover.length}…`);
        const meta=await API.upload(leftover[i],selCo);
        created.push({id:ni(),title:(TT[upType]?.l||upType)+" adicional "+(i+1)+" "+co.name,company:co.name,companyId:selCo,type:upType,description:"",responsable:[],date:null,state:"no_realizado",comments:[],votes:{},files:[meta],extraSlot:true});
      }
      sT(p=>[...p,...created]);
      sLeftover([]);
      addN(`✅ ${created.length} pieza(s) adicional(es) creadas para ${co.name}`);
      avisarListas(created.length);
    }catch(e){addN("❌ "+e.message);}
    finally{sBusy(false);sProg("");}
  };

  // Subir la corrección de una pieza rechazada. La versión anterior NO se pisa: se empuja
  // a `revisions` junto con el motivo, que es lo que le permite al cliente ver el antes
  // y el después. La pieza vuelve a "Listo" marcada como corregida.
  const corrRef=useRef(null);
  const[corrFor,sCorrFor]=useState(null);
  const pickCorrection=tid=>{sCorrFor(tid);setTimeout(()=>corrRef.current&&corrRef.current.click(),0);};
  const handleCorrection=async fileList=>{
    const f=(fileList||[])[0],tid=corrFor;
    if(!f||tid==null){sCorrFor(null);return;}
    sBusy(true);
    try{
      sProg("Subiendo corrección…");
      const meta=await API.upload(f,selCo);
      sT(p=>p.map(t=>t.id!==tid?t:({
        ...t,
        revisions:[...(t.revisions||[]),{files:t.files||[],comment:t.clientApproval?.comment||"",by:t.clientApproval?.by||"",date:t.clientApproval?.date||null}],
        files:[meta],
        state:"no_realizado",
        votes:{},
        clientApproval:null,
      })));
      addN("✅ Corrección subida, lista para reenviar");
      avisarListas(1);
    }catch(e){addN("❌ "+e.message);}
    finally{sBusy(false);sProg("");sCorrFor(null);if(corrRef.current)corrRef.current.value="";}
  };

  // Sacar una pieza de Contenido. Hay dos cosas distintas viviendo en la misma lista y no se
  // borran igual:
  //   · Los huecos que genera el plan de la empresa (sin itemId ni plannerTag) son cupos, no
  //     piezas. Se devuelven a "no realizado", que es su estado natural: desaparecen de la
  //     vista y el cupo sigue disponible. Borrarlos le quitaría un post al plan de la empresa.
  //   · Las piezas de verdad se borran, y si vienen de Org Semanal también se quita su item
  //     del planner para que no reaparezcan en la próxima confirmación.
  const eliminarPieza=async t=>{
    const esHueco=t.itemId==null&&!t.plannerTag&&!(t.files||[]).length;
    if(esHueco){
      if(!confirm("«"+(t.title||"Sin título")+"» es un cupo del plan de "+(co?.name||"la empresa")+", no una pieza creada.\n\nSe devuelve a «no realizado»: desaparece de aquí y el cupo queda libre para usarlo más adelante.\n\n¿Continuar?"))return;
      sT(p=>{const r=p.map(x=>x.id===t.id?{...x,state:"no_realizado",responsable:[],votes:{},comments:[]}:x);DB.save("tasks",r);return r;});
      addN("↩️ «"+(t.title||"Pieza")+"» volvió a ser un cupo libre");
      return;
    }
    const enPortal=salioAlPortal(t);
    if(!confirm("¿Eliminar «"+(t.title||"Sin título")+"»?"+(enPortal?"\n\nOJO: ya pasó por el portal del cliente. Se pierden sus votos, archivos, correcciones y la respuesta del cliente.":"")+(t.itemId!=null?"\n\nTambién se quita de Org Semanal.":"")+"\n\nEsto no se puede deshacer."))return;
    sT(p=>{const r=p.filter(x=>x.id!==t.id);DB.save("tasks",r);return r;});
    // Su item en el planner tiene que irse también: si no, la próxima confirmación la revive.
    if(t.itemId!=null&&sPlanners){
      sPlanners(prev=>{
        const np=prev.map(pl=>({...pl,items:(pl.items||[]).filter(i=>String(i.id)!==String(t.itemId))}));
        DB.save("planners",np);return np;
      });
    }
    addN("🗑 «"+(t.title||"Pieza")+"» eliminada");
  };

  // Subir material a una pieza concreta (etapas Borrador y En producción)
  const perRef=useRef(null);
  const[perFor,sPerFor]=useState(null);
  const pickFor=tid=>{sPerFor(tid);setTimeout(()=>perRef.current&&perRef.current.click(),0);};
  const handlePer=async fileList=>{
    const f=(fileList||[])[0],tid=perFor;
    if(!f||tid==null){sPerFor(null);return;}
    sBusy(true);
    try{
      sProg("Subiendo…");
      const meta=await API.upload(f,selCo);
      sT(p=>p.map(t=>t.id===tid?{...t,files:[...(t.files||[]),meta]}:t));
      addN("✅ Material subido");
      avisarListas(1);
    }catch(e){addN("❌ "+e.message);}
    finally{sBusy(false);sProg("");sPerFor(null);if(perRef.current)perRef.current.value="";}
  };

  const upT=(tid,u)=>sT(p=>p.map(t=>t.id===tid?{...t,...u}:t));
  const togVoto=(tid,uid)=>{
    const t=coTasks.find(x=>x.id===tid);
    const actual=(t&&t.votes||{})[uid];
    const nuevo=actual===undefined?true:(actual===true?false:undefined);
    sT(p=>p.map(x=>{
      if(x.id!==tid)return x;
      const v={...(x.votes||{})};
      if(nuevo===undefined)delete v[uid]; else v[uid]=nuevo;
      return {...x,votes:v};
    }));
    // Un ✕ frena la pieza: el resto tiene que enterarse, sobre todo quien la subió.
    if(nuevo===false&&t){
      const quien=(users||[]).find(u=>u.id===uid);
      avisarEquipo("✕ Cambios pedidos en el equipo",`${quien?quien.name:"Alguien"} pidió cambios en "${t.title}" (${co?co.name:""}).`,true,"voto_"+t.id+"_"+uid+"_"+td());
    }
    // Si este voto fue el que completó la unanimidad, la pieza queda aprobada por el
    // equipo: se le avisa a los encargados, que son los que la tienen que mandar.
    if(nuevo===true&&t){
      const v={...(t.votes||{})};v[uid]=true;
      if(equipo.length&&equipo.every(x=>v[x.id]===true)){
        avisarA(encargados(t),"✅ Aprobada por el equipo","\""+t.title+"\" tiene los "+equipo.length+" votos"+(co?" · "+co.name:"")+". Ya se puede enviar al cliente.",false,"unan_"+t.id);
      }
    }
  };
  const enviarAlPortal=t=>{
    upT(t.id,{state:"en_aprobacion",clientApproval:null});
    addN(`📤 "${t.title}" enviada a ${co.name}`);
    avisarA([...encargados(t),...adminsEq()],"📤 Enviada al cliente","\""+t.title+"\" ya está en el portal de "+co.name+", esperando su respuesta.",false,"env_"+t.id);
    if(co.email&&co.email.includes("@"))API.notify({type:"task_status",to:[co.email],taskTitle:t.title,company:co.name,state:"📤 Tienes contenido nuevo esperando tu aprobación",date:td()});
  };
  // Aprobar NO agenda, igual que en el portal del cliente (ClientView.approve): se limpia la
  // fecha para que la pieza caiga en el banco «Listo para agendar» y el día del equipo se guarda
  // en plannedDay como referencia. Este atajo del equipo (cuando el cliente aprueba por WhatsApp)
  // tiene que dejar la tarea con la MISMA forma que la del portal; si no, la pieza queda pinchada
  // en un día que el cliente no eligió y nunca pasa por el banco.
  const cliAprueba=t=>{const planificado=t.plannedDay||t.date||null;upT(t.id,{state:"aprobado",date:null,publishTime:null,plannedDay:planificado,clientApproval:{status:"aprobado",by:co.name,date:new Date().toISOString()}});
    avisarA([...encargados(t),...adminsEq()],"✓ "+co.name+" aprobó","\""+t.title+"\" quedó aprobada por el cliente.");};
  const cliRechaza=t=>{upT(t.id,{state:"en_proceso",clientApproval:{status:"rechazado",by:co.name,date:new Date().toISOString(),comment:""}});
    avisarA([...encargados(t),...adminsEq()],"✕ "+co.name+" pidió cambios","\""+t.title+"\" volvió al equipo. Anota el motivo y sube la corrección.",true);};
  const setMotivo=(t,v)=>upT(t.id,{clientApproval:{...(t.clientApproval||{}),status:"rechazado",comment:v}});

  // ── Publicación en Instagram ──
  // La autorización la hace una persona con la sesión de Instagram de esa marca puesta, así
  // que la URL de Zernio se abre en otra pestaña en vez de navegar fuera de la app.
  const conectarIG=async()=>{
    if(!co)return;
    const d=await API.socialConnect(co.id,co.name,"instagram");
    if(d&&d.authUrl){
      window.open(d.authUrl,"_blank","noopener");
      addN("Autoriza la cuenta en la pestaña nueva y vuelve aquí para actualizar.");
    }else addN("❌ "+((d&&d.error)||"Zernio no devolvió la URL de autorización"));
  };
  const refrescarIG=async()=>{
    sIgCarga(true);
    const d=await API.socialAccounts(selCo);
    sIg(d&&d.instagram?d.instagram:null);sIgCarga(false);
  };
  // Instagram descarga el archivo desde su URL: una pieza que quedó en base64 porque Storage
  // estaba caído no se puede publicar, y más vale decirlo aquí que dejar que falle del otro lado.
  // `programar` usa el día y la hora que eligió el cliente en su portal. Sin hora se asume el
  // mediodía: es preferible una hora razonable a rechazar la programación por un dato que el
  // cliente dejó a propósito en manos del equipo.
  const publicarIG=async(t,programar)=>{
    const f=(t.files||[])[0];
    if(!f||!/^https?:\/\//i.test(String(f.url||""))){
      addN("❌ Esta pieza no está en el almacenamiento: Instagram necesita una URL pública del archivo.");return;
    }
    const cuando=(programar&&t.date)?`${t.date}T${t.publishTime||"12:00"}:00`:null;
    if(cuando&&new Date(cuando).getTime()<Date.now()){
      addN("❌ Ese día y hora ya pasaron. Usa «Publicar ahora» o pide al cliente que la reagende.");return;
    }
    sPubId(t.id);
    try{
      const d=await API.socialPublish({companyId:selCo,platform:"instagram",
        // SOLO el pie que se escribió para publicar (`caption`). Antes caía a `description`, que
        // en las piezas de Org Semanal arrastra las notas internas ("📌 Estrategia: …"), y a
        // `title`, que es un nombre interno ("Post 1 Fauna"): cualquiera de los dos se publicaba
        // tal cual en el Instagram del cliente. El preview promete que lo que sale es el texto de
        // ese campo, así que aquí manda solo ese; vacío es preferible a filtrar lo de dentro.
        caption:t.caption||"",
        media:[{type:isVid(f)?"video":"image",url:f.url}],
        ...(cuando?{scheduledFor:cuando,timezone:"America/Santiago"}:{})});
      if(!d||d.error){
        addN("❌ "+(d&&d.error==="no_conectada"?((co?.name||"La empresa")+" no tiene Instagram conectado todavía."):((d&&d.error)||"No se pudo publicar")));
        return;
      }
      if(cuando){
        // Programada no es publicada: la pieza sigue su curso y el estado no cambia hasta que
        // Instagram la publique de verdad.
        upT(t.id,{socialPost:{id:d.postId||null,platform:"instagram",programadaPara:cuando}});
        addN("🕐 \""+t.title+"\" programada para "+t.date+" a las "+(t.publishTime||"12:00"));
      }else{
        upT(t.id,{state:"publicado",socialPost:{id:d.postId||null,platform:"instagram",at:new Date().toISOString()}});
        addN("📸 \""+t.title+"\" publicada en Instagram");
        avisarA([...encargados(t),...adminsEq()],"📸 Publicada en Instagram","\""+t.title+"\" ya salió en el Instagram de "+(co?.name||"")+".");
      }
    }finally{sPubId(null);}
  };

  const dz=(<div
    onDragOver={e=>{e.preventDefault();sDragOver(true);}}
    onDragLeave={()=>sDragOver(false)}
    onDrop={e=>{e.preventDefault();sDragOver(false);handleFiles(e.dataTransfer.files);}}
    onClick={()=>!busy&&fileRef.current?.click()}
    style={{border:"2px dashed "+(dragOver?D.cian:D.line2),borderRadius:14,padding:"26px 20px",textAlign:"center",cursor:busy?"default":"pointer",background:dragOver?"rgba(111,231,242,.05)":D.panel,transition:"border-color .15s,background .15s"}}>
    <div style={{fontSize:26,marginBottom:8}}>{busy?"⏳":"📤"}</div>
    <div style={{fontSize:13.5,fontWeight:600,marginBottom:4}}>{busy?prog:"Arrastra los archivos aquí o haz clic"}</div>
    <div style={{fontSize:12,color:D.tx3}}>
      {busy?"No cierres la pestaña":`Se crean como ${TT[upType]?.l} · quedan ${libreDe(upType)} en el plan de este mes`}
    </div>
  </div>);

  // ── Tarjeta ──
  const card=(t,m)=>{
    const gl=CONT_GLOW[m.k];
    const tc=TT[t.type]?.c||D.tx2;
    const f0=(t.files||[])[0];
    const rev=(t.revisions&&t.revisions.length)?t.revisions[t.revisions.length-1]:null;
    const v=t.votes||{};
    const aFavor=equipo.filter(u=>v[u.id]===true);
    const enContra=equipo.filter(u=>v[u.id]===false);
    const unanime=equipo.length>0&&aFavor.length===equipo.length;
    const resumen=enContra.length?"Cambios pedidos por "+enContra.map(u=>u.name).join(", ")
      :(unanime?"Aprobado por el equipo ✓ — listo para enviar":aFavor.length+" de "+equipo.length+" aprobaciones");
    const resCol=enContra.length?D.rojo:(unanime?D.cian:D.tx4);

    let acc=null;
    if(m.k==="produccion")acc={label:"↑ Sube el contenido para dejarlo listo",fn:()=>pickFor(t.id),bg:"transparent",bor:D.line2,col:D.tx4};
    else if(m.k==="listo"&&unanime)acc={label:"Enviar al portal de "+(co?.name||"")+" →",fn:()=>enviarAlPortal(t),bg:D.cian,bor:D.cian,col:D.bg};

    return(<div key={t.id} style={{borderRadius:15,padding:gl?2:0,background:gl?"linear-gradient(160deg, "+m.col+"50, "+m.col+"14 45%, "+m.col+"35)":"transparent"}}>
      <div style={{position:"relative",height:"100%",boxSizing:"border-box",borderRadius:13,background:D.panel,border:"1px solid "+m.col+"45",borderLeft:"3px solid "+tc,padding:"13px 15px",display:"flex",flexDirection:"column",gap:9}}>
        {gl&&<span style={{position:"absolute",inset:0,borderRadius:13,background:"linear-gradient(270deg, "+gl.rgb+".18), "+gl.rgb+".04) 50%, transparent)",animation:gl.late?"pulseFade 1.6s ease-in-out infinite":"none",pointerEvents:"none"}}/>}

        <div style={{display:"flex",alignItems:"center",gap:8,position:"relative"}}>
          <span style={{padding:"2px 9px",borderRadius:999,background:"rgba(200,210,228,.05)",border:"1px solid "+tc+"55",color:tc,fontSize:10,fontWeight:700}}>{TT[t.type]?.l||t.type}</span>
          {t.extraSlot&&<span style={{fontSize:10,fontWeight:600,color:D.lav}}>Adicional</span>}
          {rev&&m.k!=="aprobado"&&<span style={{fontSize:10,fontWeight:600,color:D.peri}}>✎ Corregido</span>}
          <span style={{marginLeft:"auto",fontFamily:"var(--font-mono)",fontSize:10,color:D.tx4}}>{diaLblPlan(t)}</span>
          <button onClick={()=>eliminarPieza(t)} title="Eliminar esta pieza" style={{width:24,height:24,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",background:"transparent",border:"none",color:D.tx4,cursor:"pointer",flexShrink:0,padding:0}}>
            <Ic n="trash" s={12} c={D.tx4}/>
          </button>
        </div>
        <span style={{fontSize:13.5,fontWeight:600,lineHeight:1.35,position:"relative"}}>{t.title||"Sin título…"}</span>

        {/* De quién es y quién la tiene. La tarjeta mostraba solo tipo, fecha y título, así
            que había que abrirla para saber a quién le tocaba. */}
        {(()=>{
          const enc=(t.responsable||[]).map(id=>users.find(u=>u.id===id)).filter(Boolean);
          return(
            <div style={{position:"relative",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",fontSize:10.5,color:D.tx4}}>
              {t.company&&<span style={{fontWeight:600,color:D.tx3}}>{t.company}</span>}
              {t.company&&<span style={{opacity:.45}}>·</span>}
              {enc.length
                ? enc.map(u=>(
                    <span key={u.id} style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 8px",borderRadius:999,background:(u.color||D.peri)+"1a",border:"1px solid "+(u.color||D.peri)+"4d",color:D.tx2,fontWeight:600}}>
                      <span style={{width:6,height:6,borderRadius:"50%",background:u.color||D.peri,flexShrink:0}}/>{u.name}
                    </span>))
                : <span style={{fontStyle:"italic"}}>Sin encargado</span>}
            </div>);
        })()}

        {f0&&isImg(f0)&&<div onClick={()=>openZoom(t.files,0)} title="Toca para agrandar" style={{position:"relative",width:"100%",height:130,borderRadius:9,cursor:"zoom-in",backgroundImage:'url("'+fSrc(f0)+'")',backgroundSize:"cover",backgroundPosition:"center",backgroundRepeat:"no-repeat",backgroundColor:D.bg,border:"1px solid "+D.line3}}/>}
        {f0&&isVid(f0)&&<div onClick={()=>openZoom(t.files,0)} title="Toca para agrandar" style={{cursor:"zoom-in",position:"relative"}}>
          <MiniVid src={fSrc(f0)} h={130}/>
        </div>}

        {f0&&<button onClick={()=>openZoom(t.files,0)} title="Toca para ver" style={{position:"relative",display:"flex",alignItems:"center",gap:8,padding:"7px 11px",borderRadius:9,background:"rgba(111,231,242,.04)",border:"1px solid rgba(111,231,242,.25)",cursor:"zoom-in",fontFamily:"inherit",textAlign:"left",maxWidth:"100%"}}>
          <svg viewBox="0 0 24 24" style={{width:12,height:12,color:D.cian,flexShrink:0}}><path d="M4.5 12.5 L 9.5 17.5 L 19.5 6.5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          <span style={{fontSize:11.5,fontWeight:600,color:D.tx2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f0.name||"Archivo"}</span>
        </button>}
        {!f0&&m.k!=="produccion"&&<button onClick={()=>pickFor(t.id)} disabled={busy} style={{position:"relative",display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderRadius:9,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer",width:"fit-content"}}>
          <svg viewBox="0 0 24 24" style={{width:12,height:12}}><path d="M12 16 V 5 M 7.5 9 L 12 4.5 L 16.5 9 M 5 16 V 19 H 19 V 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Subir material
        </button>}

        {m.k==="listo"&&<>
          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",position:"relative"}}>
            {equipo.map(u=>{const vv=v[u.id];
              return(<button key={u.id} onClick={()=>togVoto(t.id,u.id)} title="Toca para cambiar el voto" style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 9px",borderRadius:999,background:vv===true?"rgba(111,231,242,.09)":(vv===false?"rgba(255,107,107,.07)":"transparent"),border:"1px solid "+(vv===true?"rgba(111,231,242,.45)":(vv===false?"rgba(255,107,107,.35)":D.line2)),color:vv===true?D.cian:(vv===false?D.rojo:D.tx4),fontFamily:"inherit",fontSize:10.5,fontWeight:600,cursor:"pointer"}}>
                {u.name} <span style={{fontSize:9}}>{vv===true?"✓":(vv===false?"✕":"·")}</span>
              </button>);})}
          </div>
          <span style={{fontSize:11,fontWeight:600,color:resCol,position:"relative"}}>{resumen}</span>
        </>}

        {m.k==="enviado"&&<div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginTop:"auto",position:"relative"}}>
          <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".14em",textTransform:"uppercase",color:D.peri}}>Portal cliente</span>
          <button onClick={()=>cliAprueba(t)} style={{padding:"5px 11px",borderRadius:999,background:"rgba(143,242,194,.07)",border:"1px solid rgba(143,242,194,.35)",color:"#8FF2C2",fontFamily:"inherit",fontSize:10.5,fontWeight:600,cursor:"pointer"}}>✓ Aprobó</button>
          <button onClick={()=>cliRechaza(t)} style={{padding:"5px 11px",borderRadius:999,background:"rgba(255,107,107,.06)",border:"1px solid rgba(255,107,107,.3)",color:D.rojo,fontFamily:"inherit",fontSize:10.5,fontWeight:600,cursor:"pointer"}}>✕ Pidió cambios</button>
        </div>}

        {m.k==="rechazado"&&<div style={{display:"flex",flexDirection:"column",gap:7,padding:"9px 11px",borderRadius:10,background:"rgba(255,107,107,.05)",border:"1px solid rgba(255,107,107,.22)",position:"relative"}}>
          <span style={{fontSize:10,fontWeight:700,color:D.rojo}}>Motivo del cliente</span>
          <input value={t.clientApproval?.comment||""} onChange={e=>setMotivo(t,e.target.value)} placeholder="Qué pidió cambiar…" style={{padding:"6px 9px",borderRadius:7,background:D.bg,border:"1px solid "+D.line2,color:D.tx,fontFamily:"inherit",fontSize:12,outline:"none"}}/>
          <button onClick={()=>pickCorrection(t.id)} disabled={busy} style={{padding:8,borderRadius:999,background:"rgba(255,107,107,.08)",border:"1px solid rgba(255,107,107,.35)",color:D.rojo,fontFamily:"inherit",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>⇪ Subir corrección</button>
        </div>}

        {m.k==="aprobado"&&<span style={{fontSize:11.5,fontWeight:600,color:"#8FF2C2",marginTop:"auto",position:"relative"}}>
          {t.date?"✓ Agendada para "+t.date+(t.publishTime?" · "+t.publishTime:""):"✓ Cerrada — falta que el cliente la agende"}
        </span>}

        {/* Publicar. Solo aquí: el cupo se gasta al aprobar el cliente y publicar viene después.
            Una pieza ya publicada no vuelve a ofrecer el botón — Instagram no deshace nada. */}
        {m.k==="aprobado"&&(t.state==="publicado"
          ?<span style={{position:"relative",display:"inline-flex",alignItems:"center",gap:6,fontSize:11,fontWeight:600,color:D.peri}}>
             📸 Publicada en Instagram{t.socialPost?.at?" · "+new Date(t.socialPost.at).toLocaleDateString("es-CL"):""}
           </span>
          :(ig
            ?<button onClick={()=>publicarIG(t)} disabled={pubId===t.id||!f0}
               title={!f0?"La pieza no tiene archivo":"Publica ahora en @"+(ig.username||"")}
               style={{position:"relative",padding:8,borderRadius:999,background:pubId===t.id?"transparent":"rgba(201,191,255,.08)",border:"1px solid "+(pubId===t.id?D.line2:"rgba(201,191,255,.4)"),color:pubId===t.id?D.tx4:D.lav,fontFamily:"inherit",fontSize:11.5,fontWeight:700,cursor:(pubId===t.id||!f0)?"default":"pointer",opacity:!f0?.5:1}}>
               {pubId===t.id?"Publicando…":"📸 Publicar en @"+(ig.username||"instagram")}
             </button>
            :(!igCarga&&<button onClick={conectarIG}
               style={{position:"relative",padding:8,borderRadius:999,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>
               Conectar el Instagram de {co?.name||"la empresa"}
             </button>)))}

        {acc&&<button onClick={acc.fn} disabled={busy} style={{marginTop:"auto",position:"relative",padding:8,borderRadius:999,background:acc.bg,border:"1px solid "+acc.bor,color:acc.col,fontFamily:"inherit",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>{acc.label}</button>}
      </div>
    </div>);
  };

  return(<div className="d-in">
    {/* ENCABEZADO */}
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:16,flexWrap:"wrap",marginBottom:18}}>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        <span style={{fontSize:26,fontWeight:700,letterSpacing:"-.01em"}}>Contenido</span>
        <span style={{fontSize:12.5,color:D.tx3}}>Conectado en vivo con <span style={{color:D.tx2,fontWeight:600}}>Org Semanal</span> y el <span style={{color:D.tx2,fontWeight:600}}>portal del cliente</span> — lo que cambia aquí, cambia allá.</span>
      </div>
      {/* En la fila del título quedan SOLO las acciones. El selector de empresa se fue de aquí:
          elegir de qué empresa estás viendo el contenido no es una acción, y con la misma
          píldora y el mismo tamaño que "+ Nueva pieza" la fila entera se leía como seis botones
          equivalentes. */}
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        {/* Subir y crear piezas solo tiene sentido en producción. En las otras dos vistas
            estorbaba y confundía sobre qué se está haciendo. */}
        {vista==="produccion"&&<>
          <button onClick={()=>sNueva(true)} style={{padding:"9px 18px",borderRadius:999,background:D.cian,border:"1px solid "+D.cian,color:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>+ Nueva pieza</button>
          <button onClick={()=>sDzOpen(o=>!o)} style={{padding:"9px 16px",borderRadius:999,background:dzOpen?"rgba(111,231,242,.08)":"transparent",border:"1px solid "+(dzOpen?"rgba(111,231,242,.4)":D.line2),color:dzOpen?D.cian:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>⇪ Subir varios</button>
        </>}
        {/* Estado de Instagram de esta empresa. Vive aquí y no solo en las tarjetas porque una
            empresa sin piezas aprobadas no tendría dónde conectar la cuenta. */}
        {!igCarga&&(ig
          ?<button onClick={refrescarIG} title="Conectada en Zernio · toca para releer el estado"
             style={{padding:"9px 16px",borderRadius:999,background:"rgba(201,191,255,.07)",border:"1px solid rgba(201,191,255,.35)",color:D.lav,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>📸 @{ig.username||"instagram"}</button>
          :<button onClick={conectarIG} title="Autoriza la cuenta de la marca en Instagram"
             style={{padding:"9px 16px",borderRadius:999,background:"transparent",border:"1px dashed "+D.line2,color:D.tx3,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Conectar Instagram</button>)}
      </div>
    </div>

    {/* Selector de empresa: qué estás mirando, no qué vas a hacer. Lleva su etiqueta delante
        para que se lea como un rótulo y no como un menú de botones. */}
    <div style={{display:"flex",alignItems:"center",gap:11,flexWrap:"wrap",marginBottom:16}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4}}>Empresa</span>
      <div style={dGrupo}>
        {cos.map(c=>{const on=String(selCo)===String(c.id);return(
          <button key={c.id} onClick={()=>sSelCo(c.id)} style={{padding:"7px 16px",borderRadius:999,border:"none",background:on?"#1A2032":"transparent",color:on?D.tx:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>{c.name}</button>);})}
      </div>
    </div>

    {/* Las tres vistas. Producción es el ciclo de siempre; las otras dos empiezan donde ese
        ciclo termina, y por eso no son etapas suyas sino pantallas aparte.
        Son pestañas subrayadas, no píldoras: encima está el selector de empresa, que sí es un
        grupo de píldoras, y con la misma forma las dos filas parecían el mismo control repetido.
        Cambiar de empresa y cambiar de pantalla no son la misma clase de gesto. */}
    <div style={{display:"flex",gap:26,marginBottom:20,borderBottom:"1px solid "+D.line3,flexWrap:"wrap"}}>
      {[["produccion","Producción",porEtapa.produccion.length+porEtapa.listo.length+porEtapa.enviado.length+porEtapa.rechazado.length],
        ["publicar","Publicar",porEtapa.aprobado.length],
        ["automatizacion","Automatización",(igEst?.reglas||reglas||[]).filter(r=>r.activa!==false).length]].map(([k,l,n])=>{
        const on=vista===k;
        return(<button key={k} onClick={()=>sVista(k)}
          style={{display:"inline-flex",alignItems:"center",gap:8,padding:"0 2px 11px",background:"transparent",border:"none",
            borderBottom:"2px solid "+(on?D.cian:"transparent"),marginBottom:-1,
            color:on?D.tx:D.tx4,fontFamily:"inherit",fontSize:14,fontWeight:on?700:600,cursor:"pointer"}}>
          {l}
          {n>0&&<span style={{fontFamily:"var(--font-mono)",fontSize:10.5,padding:"1px 7px",borderRadius:999,background:on?"rgba(111,231,242,.12)":"rgba(200,210,228,.05)",color:on?D.cian:D.tx5}}>{n}</span>}
        </button>);})}
    </div>

    {vista==="produccion"&&<Cupos co={co} tasks={tasks} y={hoyY} m={hoyM}/>}

    {vista==="produccion"&&!stReady&&<div style={{marginBottom:14,padding:"12px 14px",borderRadius:12,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.3)",fontSize:12.5,color:"#EFD9A0",lineHeight:1.5}}>
      <b>⚠️ Almacenamiento sin configurar.</b>{stMotivo?<> Motivo: {stMotivo}.</>:<> Falta el bucket de Supabase Storage.</>} Por ahora solo se pueden subir archivos de menos de 3 MB, que no alcanza para reels.
    </div>}

    {vista==="produccion"&&huerfanas.length>0&&<div style={{marginBottom:14,padding:"12px 14px",borderRadius:12,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.3)",fontSize:12.5,color:"#EFD9A0",lineHeight:1.5,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <span style={{flex:"1 1 220px",minWidth:0}}>
        <b>{huerfanas.length} pieza{huerfanas.length===1?"":"s"} sin respaldo en Org Semanal.</b> {huerfanas.length===1?"Se borró":"Se borraron"} de la planificación pero {huerfanas.length===1?"quedó":"quedaron"} aquí.
      </span>
      <button onClick={limpiarHuerfanas} style={{flexShrink:0,padding:"8px 15px",borderRadius:999,background:"transparent",border:"1px solid rgba(239,217,160,.5)",color:"#EFD9A0",fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>Eliminarlas</button>
    </div>}

    {!co?<div style={{textAlign:"center",padding:48,color:D.tx3}}>No hay empresas cargadas.</div>:(<>

      <input ref={fileRef} type="file" multiple accept="image/*,video/*" style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
      <input ref={corrRef} type="file" accept="image/*,video/*" style={{display:"none"}} onChange={e=>handleCorrection(e.target.files)}/>
      <input ref={perRef} type="file" accept="image/*,video/*" style={{display:"none"}} onChange={e=>handlePer(e.target.files)}/>

      {/* SUBIDA POR LOTE — plegada, para cargar varios archivos de una */}
      {vista==="produccion"&&dzOpen&&<div className="d-in" style={{...D_CARD,marginBottom:18}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {Object.entries(TT).map(([k,vv])=>{const n=slotCounts[k]||0;const on=upType===k;return(
            <button key={k} onClick={()=>sUpType(k)} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:999,fontSize:12,fontWeight:on?700:600,cursor:"pointer",fontFamily:"inherit",border:"1px solid "+(on?vv.c:D.line2),background:on?vv.c+"1f":"transparent",color:on?vv.c:D.tx3}}>
              {vv.l} <span style={{opacity:.7,fontSize:10.5}}>{n}</span>
            </button>);})}
        </div>
        {dz}
        {leftover.length>0&&<div style={{marginTop:12,padding:"12px 14px",borderRadius:12,background:"rgba(239,217,160,.06)",border:"1px solid rgba(239,217,160,.28)"}}>
          <div style={{fontSize:13,fontWeight:600,color:"#EFD9A0",marginBottom:6}}>Sobran {leftover.length} archivo(s)</div>
          <div style={{fontSize:12,color:D.tx2,marginBottom:10,lineHeight:1.5}}>
            El plan {PLANS[co.plan]?.name||co.plan} de {co.name} no tiene más slots de {TT[upType]?.l} este mes. Si los creas igual, quedan marcados como piezas adicionales fuera del plan.
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={createExtras} disabled={busy} style={{padding:"8px 16px",borderRadius:999,background:D.cian,border:"1px solid "+D.cian,color:D.bg,fontFamily:"inherit",fontSize:12,fontWeight:700,cursor:"pointer"}}>Crear {leftover.length} adicional(es)</button>
            <button onClick={()=>sLeftover([])} disabled={busy} style={{padding:"8px 16px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>Descartar</button>
          </div>
        </div>}
      </div>}

      {/* Aquí había un resumen por etapa: cinco píldoras con el número de piezas de cada una.
          Se quitó por dos razones. Repetía un dato que la cabecera de cada grupo ya da tres
          centímetros más abajo ("En producción · 0 piezas"), y sobre todo se leía como una
          contradicción de la franja de cupos que tiene justo encima: los cupos cuentan SOLO el
          mes en curso y esas píldoras contaban todas las piezas de la empresa de cualquier mes
          (`coTasks` filtra por empresa y nada más), así que salía "8 Post disponibles de 8"
          encima de "7 aprobadas por cliente". Los dos números eran correctos y hablaban de
          periodos distintos, que es la peor clase de número junto a otro número. */}

      {/* GRUPOS */}
      {vista==="produccion"&&<div style={{display:"flex",flexDirection:"column",gap:30,marginTop:8}}>
        {CONT_META.map(m=>(
          <div key={m.k} id={"grp-"+m.k} style={{display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",alignItems:"baseline",gap:10,flexWrap:"wrap",paddingBottom:8,borderBottom:"1px solid #141928"}}>
              <span style={{width:9,height:9,borderRadius:"50%",background:m.col,boxShadow:"0 0 10px "+m.col,alignSelf:"center"}}/>
              <span style={{fontSize:15.5,fontWeight:700,color:m.col}}>{m.est}</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:12,color:D.tx4}}>{porEtapa[m.k].length} {porEtapa[m.k].length===1?"pieza":"piezas"}</span>
              <span style={{fontSize:11.5,color:D.tx4,marginLeft:"auto"}}>{m.desc}</span>
            </div>
            {porEtapa[m.k].length===0&&<span style={{fontSize:12,color:D.tx5,padding:"4px 2px"}}>Nada en esta etapa.</span>}

            {/* "Aprobado por cliente" va en lista, no en parrilla. Es la etapa que más crece y
                la única cerrada: son piezas que ya no se tocan, se consultan. En tarjetas
                ocupaban cuatro filas de la pantalla para repetir siete veces el mismo botón de
                subir material que ahí ya no sirve de nada. En lista se ve el título y el tipo
                de un vistazo, y quien quiera el detalle lo despliega. La ficha desplegada es la
                MISMA tarjeta de siempre, así que no se pierde ni un dato ni una acción. */}
            {m.k==="aprobado"
              ?<div style={{display:"flex",flexDirection:"column",gap:7}}>
                {porEtapa[m.k].map(t=>{
                  const ab=aprobAbierta===t.id, tt=TT[t.type];
                  return(<div key={t.id} style={{borderRadius:12,border:"1px solid "+(ab?m.col+"55":D.line2),background:D.panel,overflow:"hidden",transition:"border-color .18s"}}>
                    <button onClick={()=>sAprobAbierta(ab?null:t.id)} aria-expanded={ab}
                      style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                      <span style={{flexShrink:0,padding:"3px 10px",borderRadius:999,border:"1px solid "+((tt?.c)||D.tx3)+"55",color:(tt?.c)||D.tx3,fontSize:10.5,fontWeight:700}}>{tt?.l||t.type}</span>
                      <span style={{flex:1,minWidth:0,fontSize:13.5,fontWeight:600,color:D.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title||"Sin título"}</span>
                      <span style={{flexShrink:0,fontFamily:"var(--font-mono)",fontSize:11,color:D.tx4}}>{diaLblPlan(t)}</span>
                      {t.socialPost?.at&&<span style={{flexShrink:0,fontSize:11,color:D.lav}} title="Ya publicada en Instagram">📸</span>}
                      <span style={{flexShrink:0,color:D.tx4,fontSize:14,lineHeight:1,transform:ab?"rotate(90deg)":"none",transition:"transform .18s"}}>›</span>
                    </button>
                    {ab&&<div className="d-in" style={{padding:"0 10px 10px"}}>{card(t,m)}</div>}
                  </div>);})}
              </div>
              :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(250px, 1fr))",gap:12}}>
                {porEtapa[m.k].map(t=>card(t,m))}
              </div>}
          </div>))}
      </div>}

      {/* ── PUBLICAR ── Solo lo que el cliente ya aprobó. Se muestran el día y la hora que él
          eligió en su portal, porque es él quien decide cuándo sale. */}
      {vista==="publicar"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        {!ig&&<div style={{padding:"14px 16px",borderRadius:12,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.3)",fontSize:12.5,color:"#EFD9A0",lineHeight:1.5}}>
          <b>{co.name} no tiene Instagram conectado.</b> Conéctalo con el botón de arriba para poder publicar desde aquí.
        </div>}
        {porEtapa.aprobado.length===0
          ?<div style={{textAlign:"center",padding:"48px 20px",borderRadius:14,border:"1px dashed "+D.line2,color:D.tx4,fontSize:13,lineHeight:1.6}}>
             Nada aprobado todavía.<br/>
             <span style={{fontSize:12,color:D.tx5}}>Aquí aparecen las piezas en cuanto el cliente las aprueba en su portal.</span>
           </div>
          :porEtapa.aprobado.map(t=>{
            const f=(t.files||[])[0];
            const publicada=t.state==="publicado";
            const programada=!!t.socialPost?.programadaPara;
            const sinUrl=!f||!/^https?:\/\//i.test(String(f.url||""));
            return(<div key={t.id} style={{display:"flex",gap:14,alignItems:"flex-start",flexWrap:"wrap",padding:"14px 16px",borderRadius:14,background:D.panel,border:"1px solid "+(publicada?"rgba(201,191,255,.3)":D.line2)}}>
              {f&&isImg(f)
                ? <img src={fSrc(f)} alt="" onClick={()=>openZoom(t.files,0)} style={{width:74,height:74,borderRadius:11,objectFit:"cover",cursor:"zoom-in",flexShrink:0}}/>
                : <div style={{width:74,height:74,borderRadius:11,background:D.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>{TT[t.type]?.i}</div>}

              <div style={{flex:"1 1 240px",minWidth:0,display:"flex",flexDirection:"column",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{padding:"2px 9px",borderRadius:999,border:"1px solid "+(TT[t.type]?.c||D.tx3)+"55",color:TT[t.type]?.c,fontSize:10,fontWeight:700}}>{TT[t.type]?.l}</span>
                  <span style={{fontSize:13.5,fontWeight:600}}>{t.title}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",fontFamily:"var(--font-mono)",fontSize:11.5,color:D.tx4}}>
                  <span>{t.date?"📅 "+t.date:(t.plannedDay?"📌 Planificada "+diaLbl(t.plannedDay):"sin día")}</span>
                  <span>{t.publishTime?"🕐 "+t.publishTime:"sin hora"}</span>
                  {!t.date&&<span style={{color:D.tx5,fontFamily:"inherit"}}>— el cliente aún no la agendó</span>}
                </div>
                {t.caption
                  ?<div style={{fontSize:12,color:D.tx2,background:D.bg,padding:"8px 10px",borderRadius:9,lineHeight:1.5,whiteSpace:"pre-wrap",maxHeight:96,overflow:"auto"}}>{t.caption}</div>
                  :<span style={{fontSize:11.5,color:D.tx5,fontStyle:"italic"}}>Sin texto — se publicará solo la imagen.</span>}
              </div>

              <div style={{display:"flex",flexDirection:"column",gap:7,alignItems:"stretch",flexShrink:0,minWidth:170}}>
                {publicada
                  ?<span style={{padding:"9px 14px",borderRadius:999,textAlign:"center",fontSize:12,fontWeight:700,color:D.lav,background:"rgba(201,191,255,.08)",border:"1px solid rgba(201,191,255,.3)"}}>
                     📸 Publicada{t.socialPost?.at?" · "+new Date(t.socialPost.at).toLocaleDateString("es-CL"):""}
                   </span>
                  :programada
                  ?<span style={{padding:"9px 14px",borderRadius:999,textAlign:"center",fontSize:12,fontWeight:700,color:"#EFD9A0",background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.35)"}}>
                     🕐 Programada · {String(t.socialPost.programadaPara).replace("T"," ").slice(0,16)}
                   </span>
                  :<>
                    <button onClick={()=>publicarIG(t)} disabled={pubId===t.id||sinUrl||!ig}
                      style={{padding:"9px 14px",borderRadius:999,background:(sinUrl||!ig)?"transparent":D.cian,border:"1px solid "+((sinUrl||!ig)?D.line2:D.cian),color:(sinUrl||!ig)?D.tx4:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:(pubId===t.id||sinUrl||!ig)?"default":"pointer"}}>
                      {pubId===t.id?"Publicando…":"Publicar ahora"}
                    </button>
                    {/* Programar en el pasado no existe: en vez de dejar pulsar y fallar con un
                        aviso que se desvanece, el botón se apaga y dice por qué. */}
                    {t.date&&(()=>{
                      const cuando=new Date(`${t.date}T${t.publishTime||"12:00"}:00`).getTime();
                      const pasado=cuando<Date.now();
                      const off=pubId===t.id||sinUrl||!ig||pasado;
                      return(<>
                        <button onClick={()=>publicarIG(t,true)} disabled={off}
                          style={{padding:"9px 14px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:off?D.tx5:D.tx2,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:off?"default":"pointer"}}>
                          Programar
                        </button>
                        {pasado&&<span style={{fontSize:11,color:D.tx5,lineHeight:1.45}}>Su día ya pasó. Publica ahora, o pide al cliente que la reagende.</span>}
                      </>);})()}
                    {sinUrl&&<span style={{fontSize:11,color:"#EFD9A0",lineHeight:1.45}}>El archivo no está en el almacenamiento: Instagram necesita una URL pública.</span>}
                  </>}
              </div>
            </div>);
          })}
      </div>}

      {/* ── AUTOMATIZACIÓN ── */}
      {vista==="automatizacion"&&<div style={{display:"flex",flexDirection:"column",gap:16,maxWidth:abierta==null?820:"none"}}>
        {!igEst?<div style={{color:D.tx3,fontSize:13,padding:"20px 2px"}}>Cargando…</div>
        :!igEst.configurado?(
          <div style={{padding:"14px 16px",borderRadius:12,background:"rgba(239,217,160,.07)",border:"1px solid rgba(239,217,160,.3)",fontSize:12.5,color:"#EFD9A0",lineHeight:1.55}}>
            <b>Falta configurar la app de Meta en el servidor.</b> {igEst.motivo||""}
          </div>
        ):(<>
          {/* Quién autoriza es el cliente, desde SU portal: es su cuenta de Instagram y el
              permiso se lo da él a Meta, no nosotros. Aquí solo se refleja si ya está o no, y
              qué falta cuando no está — antes decía "Hay que autorizar la cuenta", que sonaba a
              tarea nuestra y no lo es. El botón se queda como salida para las cuentas propias de
              Inmersia, en segundo plano. */}
          <div style={{display:"flex",alignItems:"center",gap:11,flexWrap:"wrap",padding:"13px 15px",borderRadius:12,
            background:igEst.conectada?"rgba(143,242,194,.05)":D.panel,
            border:"1px solid "+(igEst.conectada?"rgba(143,242,194,.3)":D.line2)}}>
            <span style={{width:9,height:9,borderRadius:"50%",flexShrink:0,background:igEst.conectada?"#8FF2C2":D.tx4,boxShadow:igEst.conectada?"0 0 9px #8FF2C2":"none"}}/>
            <div style={{minWidth:0,flex:"1 1 260px"}}>
              <div style={{fontSize:13.5,fontWeight:700,color:igEst.conectada?"#8FF2C2":D.tx}}>
                {igEst.conectada?("Disponible · @"+igEst.username):("Falta que "+(co?.name||"el cliente")+" lo autorice")}
              </div>
              <div style={{fontSize:11.5,color:D.tx4,lineHeight:1.5,marginTop:2}}>
                {igEst.conectada
                  ?("Ya se pueden crear automatizaciones sobre sus publicaciones. El permiso se renueva solo · vence en "+igEst.expiraEn+" días.")
                  :"El permiso lo da el cliente desde su portal, con su propia cuenta. Hasta entonces las cadenas se pueden dejar armadas, pero no responden."}
              </div>
            </div>
            <button onClick={conectarIGMeta} title={igEst.conectada?"Volver a pedir el permiso":"Solo para cuentas propias de Inmersia — la del cliente la conecta él"}
              style={{flexShrink:0,padding:"7px 14px",borderRadius:999,background:"transparent",border:"1px solid "+D.line2,color:D.tx3,fontFamily:"inherit",fontSize:12,fontWeight:600,cursor:"pointer"}}>
              {igEst.conectada?"Reconectar":"Conectar una cuenta propia"}
            </button>
          </div>

          <div style={{fontSize:12.5,color:D.tx3,lineHeight:1.6}}>
            Cuando alguien comente la palabra elegida, le llega el mensaje <b>por privado</b>.
            Instagram permite <b>un solo mensaje por comentario</b> y solo dentro de los 7 días siguientes; para seguir conversando, la persona tiene que responder.
          </div>

          {/* Sin cadena abierta: la lista. Con una abierta: el constructor a pantalla completa. */}
          {abierta==null?(<>
            {/* Automatizaciones PENDIENTES: piezas marcadas con el switch en Org Semanal que
                todavía no tienen su cadena armada. Desde aquí se prepara (preset o a medida) y
                queda atada a la pieza para activarse sola al publicarse. */}
            {(()=>{
              const pend=(tasks||[]).filter(t=>String(t.companyId)===String(selCo)&&t.autoComentario&&!reglas.some(r=>String(r.taskId)===String(t.id))&&t.state!=="publicado");
              if(!pend.length)return null;
              return(<div style={{borderRadius:16,border:"1px solid rgba(155,180,255,.35)",background:"rgba(155,180,255,.05)",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:15}}>💬</span>
                  <span style={{fontSize:13.5,fontWeight:700,color:D.peri}}>{pend.length} automatización{pend.length===1?"":"es"} pendiente{pend.length===1?"":"s"}</span>
                </div>
                <div style={{fontSize:12,color:D.tx3,lineHeight:1.5,marginTop:-4}}>Estas piezas van con automatización (marcadas en Org Semanal). Prepárales la cadena; se activará sola cuando el contenido se publique.</div>
                {pend.map(t=>(
                  <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"9px 11px",borderRadius:11,background:D.panel,border:"1px solid "+D.line2}}>
                    <span style={{flexShrink:0,padding:"2px 9px",borderRadius:999,border:"1px solid "+(TT[t.type]?.c||D.tx3)+"55",color:TT[t.type]?.c||D.tx3,fontSize:10.5,fontWeight:700}}>{TT[t.type]?.l||t.type}</span>
                    <span style={{flex:"1 1 140px",minWidth:0,fontSize:13,fontWeight:600,color:D.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title||"Sin título"}</span>
                    <button onClick={()=>{sTaskParaCadena(t.id);sPreset(true);}} style={{flexShrink:0,padding:"8px 14px",borderRadius:999,background:D.peri,border:"1px solid "+D.peri,color:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>Preparar cadena →</button>
                  </div>))}
              </div>);
            })()}
            {reglas.length===0&&<div style={{padding:"34px 20px",textAlign:"center",borderRadius:14,border:"1px dashed "+D.line2,color:D.tx4,fontSize:13}}>Todavía no hay ninguna cadena.</div>}
            {reglas.map((r,i)=>{
              const nPasos=(r.pasos||[]).length;
              const pub=(pubs||[]).find(p=>p.id===r.mediaId);
              // ¿Está atada a una pieza y esperando que se publique para armarse sola?
              const tareaVinc=r.taskId?(tasks||[]).find(t=>String(t.id)===String(r.taskId)):null;
              const espera=!!r.pendienteMedia;
              const puntoColor=espera?"#EFD9A0":(r.activa!==false?"#6FE7F2":D.tx5);
              // La fila deja de ser un solo <button>: la papelera es otro botón y uno no puede
              // ir dentro del otro. El contenedor es un <div> y cada acción tiene el suyo.
              return(<div key={r.id} style={{display:"flex",alignItems:"stretch",gap:8}}>
                <button onClick={()=>sAbierta(i)}
                  style={{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:14,background:D.panel,border:"1px solid "+(espera?"rgba(239,217,160,.35)":D.line2),cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                  <span style={{width:9,height:9,borderRadius:"50%",flexShrink:0,background:puntoColor,boxShadow:puntoColor!==D.tx5?"0 0 8px "+puntoColor:"none"}}/>
                  <span style={{display:"flex",flexDirection:"column",gap:3,minWidth:0,flex:1}}>
                    <span style={{fontSize:14,fontWeight:600,color:D.tx}}>{r.nombre||(r.palabra?("Cadena de “"+r.palabra+"”"):"Cadena sin nombre")}</span>
                    <span style={{fontSize:11.5,color:D.tx4}}>
                      {r.palabra?("Comentan “"+r.palabra+"”"):"Sin palabra"} · {espera?"se atará a la publicación al salir":(pub?"una publicación":"todas las publicaciones")} · {nPasos} bloque{nPasos===1?"":"s"}
                      {tareaVinc?(" · para «"+(tareaVinc.title||"pieza")+"»"):""}
                    </span>
                  </span>
                  {pub&&pub.img&&<img src={pub.img} alt="" onError={e=>{e.target.style.display="none";}} style={{width:38,height:38,borderRadius:9,objectFit:"cover",flexShrink:0}}/>}
                  <span style={{flexShrink:0,fontSize:11.5,color:espera?"#EFD9A0":(r.activa!==false?"#6FE7F2":D.tx5),fontWeight:600}}>{espera?"Esperando publicación":(r.activa!==false?"Activa":"Pausada")}</span>
                  <span style={{flexShrink:0,color:D.tx4,fontSize:15}}>›</span>
                </button>
                <button onClick={()=>borrarRegla(i)} disabled={guardando} title="Eliminar esta cadena"
                  style={{flexShrink:0,width:46,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:14,background:"transparent",border:"1px solid "+D.line2,color:D.tx4,cursor:guardando?"default":"pointer",fontFamily:"inherit"}}
                  onMouseEnter={e=>{if(guardando)return;e.currentTarget.style.borderColor="rgba(255,107,107,.45)";e.currentTarget.style.color="#FF8B8B";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=D.line2;e.currentTarget.style.color=D.tx4;}}>
                  <Ic n="trash" s={15}/>
                </button>
              </div>);})}
            <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
              <Bt v="s" onClick={()=>{sTaskParaCadena(null);sPreset(true);}} icon="plus">Nueva cadena</Bt>
              <Bt v="p" onClick={guardarReglas} disabled={guardando}>{guardando?"Guardando…":"Guardar cambios"}</Bt>
            </div>

            {/* Elegir plantilla antes de abrir el lienzo. Empezar de cero está bien cuando ya
                sabes lo que quieres montar; la primera vez, con el lienzo vacío delante, no hay
                por dónde agarrarlo. */}
            <Md open={preset} onClose={()=>{sPreset(false);sTaskParaCadena(null);}} title="¿Cómo empezamos?" width={520}>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {CC_PRESETS.map(p=>(
                  <button key={p.id} onClick={()=>crearDesdePreset(p)}
                    onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(111,231,242,.45)";}}
                    onMouseLeave={e=>{e.currentTarget.style.borderColor=D.line2;}}
                    style={{display:"flex",flexDirection:"column",gap:5,padding:"14px 16px",borderRadius:14,background:D.panel,
                      border:"1px solid "+D.line2,cursor:"pointer",fontFamily:"inherit",textAlign:"left",transition:"border-color .18s"}}>
                    <span style={{fontSize:14,fontWeight:700,color:D.tx}}>{p.nombre}</span>
                    <span style={{fontSize:12.5,color:D.tx3,lineHeight:1.5}}>{p.resumen}</span>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.cian,lineHeight:1.5,marginTop:2}}>{p.mapa}</span>
                  </button>))}
                <button onClick={()=>{nuevaRegla();sAbierta(reglas.length);sPreset(false);}}
                  style={{padding:"12px 16px",borderRadius:14,background:"transparent",border:"1px dashed "+D.line2,color:D.tx3,
                    cursor:"pointer",fontFamily:"inherit",fontSize:12.5,fontWeight:600,textAlign:"left"}}>
                  En blanco — un solo mensaje y lo armo yo
                </button>
                <span style={{fontSize:11.5,color:D.tx4,lineHeight:1.5,paddingTop:2}}>
                  Las plantillas llegan con los textos escritos y los bloques conectados. Faltan la palabra que las dispara, la publicación y el enlace del beneficio: eso se elige después, en el disparador.
                </span>
              </div>
            </Md>
          </>):(
            <CadenaBuilder flujo={reglas[abierta]} pubs={pubs}
              onChange={f=>sReglas(rs=>rs.map((x,j)=>j===abierta?f:x))}
              onCerrar={()=>sAbierta(null)}
              onGuardar={guardarReglas} guardando={guardando}/>
          )}
        </>)}
      </div>}
    </>)}
    {/* NUEVA PIEZA */}
    <Md open={nueva} onClose={()=>sNueva(false)} title={"Nueva pieza"+(co?" para "+co.name:"")} width={430}>
      <Fd label="Título"><input value={nf.title} onChange={e=>sNf({...nf,title:e.target.value})} placeholder={"Ej: "+(TT[nf.type]?.l||"Post")+" "+(co?co.name:"")}/></Fd>
      <Fd label="Tipo"><select value={nf.type} onChange={e=>sNf({...nf,type:e.target.value})}>{Object.entries(TT).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}</select></Fd>
      <Fd label="Día" hint="Es el día en que queda puesta en Org Semanal. El cliente decide después cuándo se publica."><input type="date" value={nf.date} onChange={e=>sNf({...nf,date:e.target.value})}/></Fd>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
        <Bt v="s" onClick={()=>sNueva(false)}>Cancelar</Bt>
        <Bt v="p" onClick={crearPieza} icon="plus">Crear</Bt>
      </div>
    </Md>


  </div>);
}

// ═══ INFORME MENSUAL ═════════════════════════════════════════════
// Pantalla de reunión con cliente: se proyecta y se lee de un vistazo, así que manda el
// titular por sobre el detalle. Las dos campañas llevan color fijo —cian la activa, cálido
// la pausada— y CADA barra lleva su número impreso: la identidad nunca depende del color,
// que es lo que la hace legible en un proyector malo o para quien no distingue tonos.
const INF_A="#6FE7F2";   // JUNIO · recirculación (activa)
const INF_B="#FF8B8B";   // 04 · verano (pausada)

const CAMP={
  a:{n:"JUNIO · Recirculación videos",corto:"Junio",estado:"Activa",desde:"11 jun 2026",dias:53,
     visitas:12467,coste:17,ctr:7.45,gasto:217506,impresiones:192915,alcance:80431,ritmo:235},
  b:{n:"04 · Huemul Verano",corto:"Verano",estado:"Pausada",desde:"15 dic 2025",dias:120,
     visitas:10549,coste:22,ctr:3.42,gasto:231230,impresiones:333269,alcance:87845,ritmo:88},
};

const nInf=n=>n.toLocaleString("es-CL");
const $Inf=n=>"$"+n.toLocaleString("es-CL");

// Barra comparativa. `mejorBajo` invierte la lectura: en coste por resultado gana el menor,
// y sin esto la barra más larga parecería la mejor.
function InfBarra({label,a,b,fmt,mejorBajo,nota}){
  const max=Math.max(a,b)*1.15;
  const ganaA=mejorBajo?a<b:a>b;
  const fila=(v,color,nombre,gana)=>(
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
      <span style={{width:58,flexShrink:0,fontSize:11,fontWeight:600,color:PC.tx3,textAlign:"right"}}>{nombre}</span>
      <div style={{flex:1,minWidth:0,height:26,borderRadius:6,background:"rgba(255,255,255,.03)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:"0 auto 0 0",width:Math.max(2,v/max*100)+"%",background:color,borderRadius:"0 4px 4px 0",transition:"width .5s ease"}}/>
        <span style={{position:"absolute",left:10,top:0,bottom:0,display:"flex",alignItems:"center",fontFamily:"var(--font-mono)",fontSize:12.5,fontWeight:700,color:"#05060B"}}>{fmt(v)}</span>
      </div>
      {gana&&<span style={{flexShrink:0,fontSize:10,fontWeight:700,color:PC.cian,letterSpacing:".04em"}}>MEJOR</span>}
    </div>);
  return(
    <div style={{padding:"14px 16px",borderRadius:14,background:PC.panel,border:"1px solid "+PC.line3}}>
      <div style={{fontSize:12.5,fontWeight:700,color:PC.tx2,marginBottom:2}}>{label}</div>
      {nota&&<div style={{fontSize:10.5,color:PC.tx4,marginBottom:9}}>{nota}</div>}
      {!nota&&<div style={{height:9}}/>}
      {fila(a,INF_A,CAMP.a.corto,ganaA)}
      {fila(b,INF_B,CAMP.b.corto,!ganaA)}
    </div>);
}

function InfHero({valor,texto,sub}){
  return(
    <div style={{flex:"1 1 190px",padding:"18px 18px 16px",borderRadius:16,background:"linear-gradient(160deg, rgba(111,231,242,.10), rgba(111,231,242,.02))",border:"1px solid rgba(111,231,242,.34)"}}>
      <div style={{fontFamily:"var(--font-mono)",fontSize:34,fontWeight:700,lineHeight:1,color:PC.cian,letterSpacing:"-.02em"}}>{valor}</div>
      <div style={{fontSize:13,fontWeight:700,color:PC.tx,marginTop:8,lineHeight:1.35}}>{texto}</div>
      <div style={{fontSize:11.5,color:PC.tx3,marginTop:5,lineHeight:1.45}}>{sub}</div>
    </div>);
}

function InformePg({cos}){
  const a=CAMP.a, b=CAMP.b;
  const freqA=a.impresiones/a.alcance, freqB=b.impresiones/b.alcance;
  const ahorro=Math.round(a.visitas*b.coste-a.gasto);   // lo que habría costado al precio de verano

  const filas=[
    ["Estado",a.estado,b.estado,null],
    ["Visitas al perfil",nInf(a.visitas),nInf(b.visitas),"a"],
    ["Coste por resultado",$Inf(a.coste),$Inf(b.coste),"a"],
    ["CTR (tasa de clics)",a.ctr+"%",b.ctr+"%","a"],
    ["Importe gastado",$Inf(a.gasto),$Inf(b.gasto),"a"],
    ["Impresiones",nInf(a.impresiones),nInf(b.impresiones),null],
    ["Alcance (cuentas)",nInf(a.alcance),nInf(b.alcance),null],
    ["Frecuencia por persona",freqA.toFixed(1)+"×",freqB.toFixed(1)+"×","a"],
    ["Días activa",a.dias+" días",b.dias+" días",null],
    ["Visitas por día",nInf(a.ritmo),nInf(b.ritmo),"a"],
  ];

  const Bloque=({titulo,children,color})=>(
    <div style={{...D_CARD,marginBottom:14,borderLeft:"3px solid "+(color||PC.line2)}}>
      <div style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".16em",textTransform:"uppercase",color:PC.tx4,marginBottom:10}}>{titulo}</div>
      {children}
    </div>);

  return(<div className="d-in" style={{maxWidth:1120,margin:"0 auto"}}>

    <div style={{marginBottom:20}}>
      <div style={{fontFamily:"var(--font-mono)",fontSize:10.5,letterSpacing:".18em",textTransform:"uppercase",color:PC.cian,marginBottom:6}}>Informe mensual · Meta Ads</div>
      <h1 style={{fontSize:29,fontWeight:600,letterSpacing:"-.025em",margin:0}}>Huemul Restaurante</h1>
      <p style={{fontSize:13.5,color:PC.tx3,marginTop:6,lineHeight:1.55,maxWidth:720}}>
        Comparativa de la campaña activa <b style={{color:PC.cian}}>Junio · Recirculación de videos</b> frente
        a <b style={{color:INF_B}}>04 · Huemul Verano</b>, desde el inicio de cada una hasta hoy.
      </p>
    </div>

    {/* El veredicto primero: es lo que se lee en los primeros diez segundos de reunión */}
    <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:18}}>
      <InfHero valor="−22,7%" texto="más barata por visita" sub={"$"+a.coste+" por visita al perfil, frente a $"+b.coste+" en verano"}/>
      <InfHero valor="2,2×" texto="más efectiva por clic" sub={"CTR de "+a.ctr+"% contra "+b.ctr+"%. Excepcional en restauración"}/>
      <InfHero valor="2,7×" texto="más rápida" sub={a.ritmo+" visitas al día frente a "+b.ritmo+". Mismo resultado en menos tiempo"}/>
    </div>

    <div style={{padding:"15px 18px",borderRadius:14,background:"linear-gradient(160deg, rgba(143,242,194,.10), rgba(143,242,194,.02))",border:"1px solid rgba(143,242,194,.35)",marginBottom:20}}>
      <div style={{fontSize:14.5,fontWeight:700,color:"#8FF2C2",marginBottom:5}}>Más resultados, gastando menos</div>
      <div style={{fontSize:13,color:PC.tx2,lineHeight:1.6}}>
        La campaña actual consiguió <b style={{color:PC.tx}}>{nInf(a.visitas-b.visitas)} visitas más</b> que la
        de verano <b style={{color:PC.tx}}>gastando {$Inf(b.gasto-a.gasto)} menos</b>. Al precio por visita
        que tenía verano, estas mismas visitas habrían costado {$Inf(a.visitas*b.coste)}:
        el ahorro real es de <b style={{color:"#8FF2C2"}}>{$Inf(ahorro)}</b>.
      </div>
    </div>


    {/* El tiempo es el argumento más fuerte y estaba enterrado en la tabla: la campaña actual
        superó el total de toda una temporada en menos de la mitad de días, y sigue corriendo.
        Las barras van a la misma escala —los 120 días de verano— para que la diferencia se vea
        sin leer un solo número. */}
    <div style={{...D_CARD,marginBottom:14,borderLeft:"3px solid "+PC.cian}}>
      <div style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:".16em",textTransform:"uppercase",color:PC.tx4,marginBottom:12}}>En cuánto tiempo lo logró cada una</div>
