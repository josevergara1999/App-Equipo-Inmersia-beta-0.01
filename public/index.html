      <div style={{display:"flex",flexDirection:"column",gap:15}}>
        {[[a,INF_A],[b,INF_B]].map(([c,col])=>(
          <div key={c.corto}>
            <div style={{display:"flex",alignItems:"baseline",gap:9,flexWrap:"wrap",marginBottom:7}}>
              <span style={{fontSize:13.5,fontWeight:700,color:PC.tx}}>{c.corto}</span>
              <span style={{fontFamily:"var(--font-mono)",fontSize:12.5,fontWeight:700,color:col}}>{c.dias} días</span>
              <span style={{fontSize:11.5,color:PC.tx4}}>desde el {c.desde}</span>
              <span style={{marginLeft:"auto",fontFamily:"var(--font-mono)",fontSize:14,fontWeight:700,color:PC.tx,whiteSpace:"nowrap"}}>{nInf(c.visitas)} visitas</span>
            </div>
            <div style={{height:15,borderRadius:5,background:"rgba(255,255,255,.03)",overflow:"hidden"}}>
              <div style={{width:(c.dias/b.dias*100)+"%",height:"100%",background:col,borderRadius:"0 4px 4px 0",transition:"width .5s ease"}}/>
            </div>
            <div style={{fontSize:11,color:PC.tx4,marginTop:5}}>{nInf(c.ritmo)} visitas por día</div>
          </div>))}
      </div>
      <div style={{marginTop:15,paddingTop:13,borderTop:"1px solid "+PC.line,fontSize:13.5,color:PC.tx2,lineHeight:1.65}}>
        La campaña de junio ya superó el resultado de <b style={{color:PC.tx}}>toda la temporada de verano</b> en
        el <b style={{color:PC.cian}}>{Math.round(a.dias/b.dias*100)}% del tiempo</b> — {a.dias} días frente
        a {b.dias} — y <b style={{color:"#8FF2C2"}}>sigue activa</b>, sumando {nInf(a.ritmo)} visitas cada día.
      </div>
    </div>

    {/* Leyenda: identidad por color + estado escrito, nunca solo el color */}
    <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center",marginBottom:12,padding:"9px 14px",borderRadius:999,background:PC.panel,border:"1px solid "+PC.line3,width:"fit-content"}}>
      {[[INF_A,a],[INF_B,b]].map(([c,cp])=>(
        <span key={cp.corto} style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:12,fontWeight:600,color:PC.tx2}}>
          <span style={{width:11,height:11,borderRadius:3,background:c,flexShrink:0}}/>
          {cp.n}
          <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:999,background:cp.estado==="Activa"?"rgba(143,242,194,.14)":"rgba(255,255,255,.05)",color:cp.estado==="Activa"?"#8FF2C2":PC.tx4}}>{cp.estado}</span>
        </span>))}
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(268px,1fr))",gap:12,marginBottom:20}}>
      <InfBarra label="Visitas al perfil" nota="El objetivo de la campaña. Más es mejor." a={a.visitas} b={b.visitas} fmt={nInf}/>
      <InfBarra label="Coste por visita" nota="Lo que cuesta cada resultado. Menos es mejor." a={a.coste} b={b.coste} fmt={$Inf} mejorBajo/>
      <InfBarra label="CTR · tasa de clics" nota="Qué porcentaje de quienes lo ven, hacen clic." a={a.ctr} b={b.ctr} fmt={v=>v+"%"}/>
      <InfBarra label="Visitas por día" nota="Ritmo de captación. Más es mejor." a={a.ritmo} b={b.ritmo} fmt={nInf}/>
      <InfBarra label="Importe gastado" nota="La activa gastó menos y rindió más." a={a.gasto} b={b.gasto} fmt={$Inf} mejorBajo/>
      <InfBarra label="Veces que se repite por persona" nota="Frecuencia. Menos repetición para el mismo efecto es mejor." a={+freqA.toFixed(1)} b={+freqB.toFixed(1)} fmt={v=>v+"×"} mejorBajo/>
    </div>

    <Bloque titulo="Por qué funciona mejor" color={PC.cian}>
      <div style={{display:"flex",flexDirection:"column",gap:13}}>
        {[
          ["El contenido convence antes",
           "En verano cada persona tuvo que ver el anuncio "+freqB.toFixed(1)+" veces para reaccionar. Ahora bastan "+freqA.toFixed(1)+". El video engancha desde el primer impacto, y por eso hacen falta muchas menos impresiones para el mismo resultado."],
          ["Menos impresiones, más visitas",
           "Verano necesitó "+nInf(b.impresiones)+" impresiones para "+nInf(b.visitas)+" visitas. La campaña actual lleva "+nInf(a.visitas)+" visitas con solo "+nInf(a.impresiones)+" impresiones: un "+Math.round((1-a.impresiones/b.impresiones)*100)+"% menos de exposición para más resultado."],
          ["Deja audiencia para el futuro",
           "Más de 5.700 reproducciones de video de 3 segundos y cerca de 7.000 interacciones con la página. Eso construye una base de retargeting mucho más valiosa que la que dejó verano, y sirve para las próximas promociones."],
        ].map(([t,d])=>(
          <div key={t} style={{display:"flex",gap:11}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:PC.cian,marginTop:6,flexShrink:0}}/>
            <div style={{minWidth:0}}>
              <div style={{fontSize:13.5,fontWeight:700,color:PC.tx,marginBottom:3}}>{t}</div>
              <div style={{fontSize:12.5,color:PC.tx3,lineHeight:1.6}}>{d}</div>
            </div>
          </div>))}
      </div>
    </Bloque>

    <Bloque titulo="Detalle completo">
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:420}}>
          <thead>
            <tr style={{borderBottom:"1px solid "+PC.line2}}>
              <th style={{textAlign:"left",padding:"7px 10px 9px 0",color:PC.tx4,fontWeight:600,fontSize:11}}>Métrica</th>
              <th style={{textAlign:"right",padding:"7px 10px 9px",color:INF_A,fontWeight:700,fontSize:11.5,whiteSpace:"nowrap"}}>{a.corto} · activa</th>
              <th style={{textAlign:"right",padding:"7px 0 9px 10px",color:INF_B,fontWeight:700,fontSize:11.5,whiteSpace:"nowrap"}}>{b.corto} · pausada</th>
            </tr>
          </thead>
          <tbody>
            {filas.map(([m,va,vb,gana])=>(
              <tr key={m} style={{borderBottom:"1px solid "+PC.line}}>
                <td style={{padding:"9px 10px 9px 0",color:PC.tx3}}>{m}</td>
                <td style={{padding:"9px 10px",textAlign:"right",fontFamily:"var(--font-mono)",fontWeight:gana==="a"?700:500,color:gana==="a"?PC.cian:PC.tx2,whiteSpace:"nowrap"}}>{va}{gana==="a"&&" ✓"}</td>
                <td style={{padding:"9px 0 9px 10px",textAlign:"right",fontFamily:"var(--font-mono)",color:PC.tx3,whiteSpace:"nowrap"}}>{vb}</td>
              </tr>))}
          </tbody>
        </table>
      </div>
    </Bloque>

    <Bloque titulo="A qué prestar atención" color="#EFD9A0">
      <div style={{fontSize:13,color:PC.tx2,lineHeight:1.65}}>
        <b style={{color:"#EFD9A0"}}>La audiencia es pequeña y puede saturarse.</b> El conjunto de anuncios
        del 1% apunta a unas 17.600–20.800 personas. Con un CTR tan alto no es un problema hoy, pero si el
        coste por visita empieza a subir de forma sostenida por encima de los ${a.coste}, será el momento
        de activar <b style={{color:PC.tx}}>Advantage+ Audience</b> para ampliar el alcance sin perder la
        esencia de la segmentación.
      </div>
    </Bloque>

    <Bloque titulo="Recomendación" color="#8FF2C2">
      <div style={{fontSize:13.5,color:PC.tx2,lineHeight:1.7}}>
        <b style={{color:"#8FF2C2"}}>Subir el presupuesto diario de la campaña actual.</b> Hoy está en
        $5.000 diarios y rinde mejor que nunca: cada peso extra entra a ${a.coste} por visita en vez de
        los ${b.coste} que costaba en verano. Es el momento de acelerar, porque el margen de rentabilidad
        es el más alto que ha tenido la cuenta.
      </div>
    </Bloque>

    <div style={{fontSize:11,color:PC.tx4,textAlign:"center",padding:"6px 0 10px",lineHeight:1.6}}>
      Datos de Meta Ads desde el inicio de cada campaña hasta hoy · {a.corto} desde el {a.desde} · {b.corto} desde el {b.desde}
    </div>
  </div>);
}

function MetricasPg({cos,addN}){
  const[metaSt,sMetaSt]=useState(null);
  const[selCo,sSelCo]=useState(null);
  const[data,sData]=useState(null);
  const[loading,sLoading]=useState(false);
  const[tab,sTab]=useState("resumen");
  const[postSort,sPostSort]=useState("engagement");
  const[periodDays,sPeriodDays]=useState(30);
  const igCos=cos.filter(c=>c.igId);

  useEffect(()=>{
    fetch("/api/meta/status").then(r=>r.json()).then(sMetaSt).catch(()=>sMetaSt({connected:false}));
    if(sessionStorage.getItem("meta_connected")){addN("✅ Meta conectado correctamente");sessionStorage.removeItem("meta_connected");}
  },[]);
  useEffect(()=>{if(igCos.length>0&&!selCo)sSelCo(igCos[0].id);},[cos.length]);
  useEffect(()=>{
    if(!selCo||!metaSt?.connected)return;
    const co=cos.find(c=>c.id===selCo);
    if(!co?.igId)return;
    sLoading(true);sData(null);
    fetch(`/api/meta/insights-full?igId=${co.igId}&days=${periodDays}`).then(r=>r.json()).then(d=>{sData(d);sLoading(false);}).catch(()=>sLoading(false));
  },[selCo,metaSt?.connected,periodDays]);

  const sum=(arr,name)=>{const m=(arr||[]).find(i=>i.name===name);if(!m)return 0;return m.values.reduce((s,v)=>s+(v.value||0),0);};
  const pct=(c,p)=>{if(!p)return null;return((c-p)/p*100).toFixed(0);};
  const fN=(n)=>(n||0).toLocaleString("es-CL");
  const aggWeekly=(vals,mode="sum")=>{if(vals.length<=35)return vals;const w=[];for(let i=0;i<vals.length;i+=7){const c=vals.slice(i,i+7);w.push(mode==="last"?c[c.length-1]:c.reduce((s,v)=>s+v,0));}return w;};

  const curr=data?.insights||[];const prev=data?.prevInsights||[];
  const tot=data?.totals||{};const prevTot=data?.prevTotals||{};
  const followers=data?.profile?.followers_count||0;
  const periodLabel=periodDays===30?"30 días":periodDays===90?"3 meses":"6 meses";
  const rawChartVals=(curr.find(m=>m.name==="reach")?.values||[]).map(v=>v.value||0);
  const chartVals=aggWeekly(rawChartVals);
  const prevChartVals=aggWeekly((prev.find(m=>m.name==="reach")?.values||[]).map(v=>v.value||0));
  const followerChartVals=aggWeekly((data?.followerTrend||[]).map(v=>v.value||0),"last");

  const ageGender=data?.demoAge||[];
  const ageMap={};
  ageGender.forEach(r=>{const age=r.dimension_values?.[0];if(age)ageMap[age]=(ageMap[age]||0)+r.value;});
  const ageArr=Object.entries(ageMap).sort((a,b)=>a[0].localeCompare(b[0]));
  const ageMax=Math.max(...ageArr.map(([,v])=>v),1);
  const genderMap={F:0,M:0,U:0};
  ageGender.forEach(r=>{const g=r.dimension_values?.[1];if(g)genderMap[g]=(genderMap[g]||0)+r.value;});
  const gTotal=Object.values(genderMap).reduce((s,v)=>s+v,0)||1;
  const cities=(data?.demoCity||[]).sort((a,b)=>b.value-a.value).slice(0,8);
  const cityMax=cities[0]?.value||1;

  const posts=(data?.media||[]).map(p=>{
    const likes=p.like_count||0;const comments=p.comments_count||0;
    const saves=p.ins?.saved||0;const shares=p.ins?.shares||0;const reach=p.ins?.reach||0;
    const interactions=likes+comments+saves+shares;
    const engRate=followers>0?(interactions/followers*100):0;
    const reachEngRate=reach>0?(interactions/reach*100):0;
    return{...p,likes,comments,saves,shares,reach,interactions,engRate:parseFloat(engRate.toFixed(2)),reachEngRate:parseFloat(reachEngRate.toFixed(2))};
  });
  const sortedPosts=[...posts].sort((a,b)=>{
    if(postSort==="engagement")return b.engRate-a.engRate;
    if(postSort==="reach")return b.reach-a.reach;
    if(postSort==="likes")return b.likes-a.likes;
    if(postSort==="saves")return b.saves-a.saves;
    return new Date(b.timestamp)-new Date(a.timestamp);
  });
  const typeMap={};
  posts.forEach(p=>{if(!typeMap[p.media_type])typeMap[p.media_type]={count:0,eng:0,reach:0};typeMap[p.media_type].count++;typeMap[p.media_type].eng+=p.engRate;typeMap[p.media_type].reach+=p.reach;});
  const typeArr=Object.entries(typeMap).map(([t,d])=>({t,count:d.count,avgEng:(d.eng/d.count).toFixed(2),avgReach:Math.round(d.reach/d.count)}));
  const typeLabel={IMAGE:"📷 Fotos",VIDEO:"🎬 Videos",CAROUSEL_ALBUM:"🖼 Carruseles"};
  const dayMap={};
  posts.forEach(p=>{const day=new Date(p.timestamp).toLocaleDateString("es-CL",{weekday:"short"});if(!dayMap[day])dayMap[day]={count:0,eng:0};dayMap[day].count++;dayMap[day].eng+=p.engRate;});
  const bestDays=Object.entries(dayMap).map(([day,d])=>({day,avg:(d.eng/d.count).toFixed(2)})).sort((a,b)=>b.avg-a.avg);

  const kMetrics=[
    {label:"Seguidores",val:followers,icon:"👥",color:"#a78bfa"},
    {label:"Alcance",val:sum(curr,"reach")||tot.reach||0,prev:sum(prev,"reach")||prevTot.reach||0,icon:"📡",color:"#34d399"},
    {label:"Interacciones",val:tot.total_interactions||0,prev:prevTot.total_interactions,icon:"❤️",color:"#60a5fa"},
    {label:"Cuentas activas",val:tot.accounts_engaged||0,prev:prevTot.accounts_engaged,icon:"🔥",color:"#f87171"},
    // "Impresiones" y "Visitas perfil" se sacaron 2026-07-13 — Meta deprecó ambas
    // metricas en Instagram Insights, ya no hay dato real que mostrar aqui.
    ...(data?.followerGrowth!=null?[{label:"Crecimiento",val:data.followerGrowth,prev:data.prevFollowerGrowth,icon:"📈",color:"#a3e635"}]:[]),
  ];

  const tabs=[["resumen","📊 Resumen"],["crecimiento","📈 Crecimiento"],["audiencia","👥 Audiencia"],["contenido","🎨 Contenido"]];

  if(igCos.length===0)return(<div className="fi" style={{maxWidth:1100,margin:"0 auto"}}><div className="card" style={{padding:32,textAlign:"center",color:"var(--tx3)"}}><div style={{fontSize:36,marginBottom:10}}>📊</div><div style={{fontSize:15,fontWeight:600,marginBottom:6}}>Sin cuentas conectadas</div><div style={{fontSize:13}}>Edita una empresa y agrega su ID de Instagram</div></div></div>);

  return(<div className="fi" style={{maxWidth:1100,margin:"0 auto"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div>
        <h1 style={{fontSize:28,fontWeight:600,letterSpacing:"-0.025em"}}>Métricas Instagram</h1>
        <div style={{fontSize:13,color:"var(--tx3)",marginTop:2}}>Meta Graph API</div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:3,background:"var(--bg3)",borderRadius:8,padding:3,border:"1px solid var(--border)"}}>
          {[[30,"30d"],[90,"3m"],[180,"6m"]].map(([d,l])=><button key={d} onClick={()=>sPeriodDays(d)} style={{padding:"5px 12px",borderRadius:6,fontSize:12,fontWeight:600,border:"none",background:periodDays===d?"var(--accent)":"transparent",color:periodDays===d?"var(--bg)":"var(--tx3)",cursor:"pointer",fontFamily:"inherit",transition:"all .15s"}}>{l}</button>)}
        </div>
        {metaSt&&(metaSt.connected?<div style={{display:"flex",gap:6,alignItems:"center"}}><Bg color="var(--success)">✓ {metaSt.user}</Bg><a href="/api/auth/meta" title="Reconectar (por ejemplo si se agrego un permiso nuevo)" style={{fontSize:11,color:"var(--tx3)",textDecoration:"underline",cursor:"pointer"}}>reconectar</a></div>:<a href="/api/auth/meta" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"9px 16px",background:"#1877F2",color:"#fff",borderRadius:10,fontSize:14,fontWeight:600,textDecoration:"none"}}>Conectar</a>)}
      </div>
    </div>

    {igCos.length>1&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      {igCos.map(c=><button key={c.id} onClick={()=>{sSelCo(c.id);sData(null);}} style={{padding:"7px 14px",borderRadius:9,fontSize:13,fontWeight:600,border:`2px solid ${selCo===c.id?c.color:"var(--border)"}`,background:selCo===c.id?c.color+"22":"transparent",color:selCo===c.id?c.color:"var(--tx2)",cursor:"pointer",fontFamily:"inherit"}}>{c.name}</button>)}
    </div>}

    {metaSt&&!metaSt.connected&&<div className="card" style={{padding:32,textAlign:"center",marginBottom:16}}><div style={{fontSize:36,marginBottom:10}}>📱</div><div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Conecta tu cuenta de Meta</div><a href="/api/auth/meta" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"10px 20px",background:"#1877F2",color:"#fff",borderRadius:10,fontSize:14,fontWeight:600,textDecoration:"none"}}>Conectar con Meta</a></div>}

    {metaSt?.connected&&<div style={{display:"flex",gap:4,marginBottom:20,borderBottom:"1px solid var(--border)",paddingBottom:0}}>
      {tabs.map(([k,l])=><button key={k} onClick={()=>sTab(k)} style={{padding:"8px 16px",background:"transparent",border:"none",borderBottom:`2px solid ${tab===k?"var(--accent)":"transparent"}`,color:tab===k?"var(--accent)":"var(--tx2)",fontSize:13,fontWeight:tab===k?600:400,cursor:"pointer",fontFamily:"inherit",marginBottom:-1}}>{l}</button>)}
    </div>}

    {loading&&<div style={{textAlign:"center",padding:60,color:"var(--tx3)"}}><div style={{display:"inline-flex",gap:5}}>{[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:"var(--accent)",opacity:.6,animation:`pulse 1s infinite ${i*.2}s`}}/>)}</div><div style={{marginTop:10,fontSize:13}}>Cargando métricas...</div></div>}

    {data?.error&&<div className="card" style={{padding:20,borderColor:"rgba(255,90,78,.3)"}}><div style={{color:"var(--danger)",fontSize:14,fontWeight:600}}>Error: {data.error}</div><a href="/api/auth/meta" style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:10,padding:"8px 14px",background:"#1877F2",color:"#fff",borderRadius:8,fontSize:13,fontWeight:600,textDecoration:"none"}}>Reconectar</a></div>}

    {data?.connected&&!loading&&tab==="resumen"&&<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:16}}>
        {kMetrics.map(m=>{const t=m.prev!=null?pct(m.val,m.prev):null;return(
          <div key={m.label} className="card" style={{padding:"14px 16px"}}>
            <div style={{fontSize:11,color:"var(--tx3)",marginBottom:4}}>{m.icon} {m.label}</div>
            <div className="num" style={{fontSize:24,fontWeight:700,color:m.color}}>{fN(m.val)}</div>
            {t!==null&&<div style={{fontSize:11,marginTop:3,fontWeight:600,color:Number(t)>=0?"var(--success)":"var(--danger)"}}>{Number(t)>=0?"↑":"↓"}{Math.abs(t)}% vs anterior</div>}
          </div>);})}
      </div>
      {chartVals.length>2&&<div className="card" style={{padding:20,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>Alcance</div>
        <div style={{fontSize:12,color:"var(--tx3)",marginBottom:12}}>Últimos {periodLabel}{periodDays>30?" · agrupado por semana":""}</div>
        <MiniLineChart values={chartVals} color="#34d399"/>
      </div>}
      {(data.monthly||[]).length>1&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:12,marginBottom:16}}>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:12,color:"var(--tx3)",marginBottom:2}}>📡 Alcance mes a mes</div>
          <MiniBarChart data={(data.monthly||[]).map(m=>({label:m.label,v:m.reach||0}))} color="#34d399" fN={fN}/>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:12,color:"var(--tx3)",marginBottom:2}}>❤️ Interacciones mes a mes</div>
          <MiniBarChart data={(data.monthly||[]).map(m=>({label:m.label,v:m.total_interactions||0}))} color="#60a5fa" fN={fN}/>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{fontSize:12,color:"var(--tx3)",marginBottom:2}}>🔥 Cuentas activas mes a mes</div>
          <MiniBarChart data={(data.monthly||[]).map(m=>({label:m.label,v:m.accounts_engaged||0}))} color="#f87171" fN={fN}/>
        </div>
        {/* "Visitas perfil" e "Impresiones" mes a mes se sacaron 2026-07-13 — Meta
            deprecó ambas metricas, ya no llegan datos para esos graficos. */}
      </div>}
      {data.cta&&Object.values(data.cta).some(v=>v>0)&&<div className="card" style={{padding:20,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Acciones del perfil ({periodLabel})</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>
          {[{k:"website_clicks",l:"Clics web",icon:"🔗",c:"#34d399"},{k:"email_contacts",l:"Email",icon:"✉️",c:"#60a5fa"},{k:"phone_call_clicks",l:"Llamadas",icon:"📞",c:"#f59e0b"},{k:"direction_clicks",l:"Dirección",icon:"📍",c:"#f87171"}].filter(x=>data.cta[x.k]>0).map(x=>(
            <div key={x.k} style={{padding:"12px 14px",background:"var(--bg3)",borderRadius:10,border:"1px solid var(--border)"}}>
              <div style={{fontSize:11,color:"var(--tx3)",marginBottom:2}}>{x.icon} {x.l}</div>
              <div className="num" style={{fontSize:20,fontWeight:700,color:x.c}}>{fN(data.cta[x.k])}</div>
            </div>
          ))}
        </div>
      </div>}
      {data.media?.length>0&&<div className="card" style={{padding:20}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Publicaciones recientes</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:8}}>
          {data.media.slice(0,6).map(post=>(
            <div key={post.id} style={{background:"var(--bg3)",borderRadius:8,overflow:"hidden",border:"1px solid var(--border)"}}>
              {(post.media_url||post.thumbnail_url)?<img src={post.thumbnail_url||post.media_url} alt="" style={{width:"100%",aspectRatio:"1",objectFit:"cover",display:"block"}} onError={e=>e.target.style.display="none"}/>:<div style={{width:"100%",aspectRatio:"1",background:"var(--bg4)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{post.media_type==="VIDEO"?"🎬":"📷"}</div>}
              <div style={{padding:"6px 8px"}}>
                <div style={{fontSize:12,color:"var(--tx3)",display:"flex",gap:8}}><span>❤️ {fN(post.like_count)}</span><span>💬 {fN(post.comments_count)}</span></div>
              </div>
            </div>))}
        </div>
      </div>}
    </>}

    {data?.connected&&!loading&&tab==="crecimiento"&&<>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10,marginBottom:16}}>
        {[
          {label:"Seguidores actuales",val:fN(followers),icon:"👥",color:"#a78bfa"},
                {label:"Crecimiento neto (30d)",val:data?.followerGrowth!=null?fN(data.followerGrowth):"N/D",rawVal:data?.followerGrowth||0,prev:data?.prevFollowerGrowth,icon:"📈",color:"#34d399"},
          {label:"Tasa de crecimiento",val:data?.followerGrowth!=null&&followers>0?(data.followerGrowth/followers*100).toFixed(2)+"%":"N/D",icon:"🚀",color:"#a78bfa"},
        ].map(m=>{const t=m.prev!=null?pct(m.rawVal||0,m.prev):null;return(
          <div key={m.label} className="card" style={{padding:"16px 18px"}}>
            <div style={{fontSize:12,color:"var(--tx3)",marginBottom:6}}>{m.icon} {m.label}</div>
            <div className="num" style={{fontSize:26,fontWeight:700,color:m.color}}>{m.val}</div>
            {t!==null&&<div style={{fontSize:12,marginTop:4,fontWeight:600,color:Number(t)>=0?"var(--success)":"var(--danger)"}}>{Number(t)>=0?"↑":"↓"}{Math.abs(t)}% vs anterior</div>}
          </div>);})}
      </div>
      {followerChartVals.length>2&&<div className="card" style={{padding:20,marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>Evolución de seguidores</div>
        <div style={{fontSize:12,color:"var(--tx3)",marginBottom:12}}>Últimos {periodLabel}{periodDays>30?" · por semana":""}</div>
        <MiniLineChart values={followerChartVals} color="#a78bfa"/>
      </div>}
      {(data?.monthly||[]).length>1&&<div className="card" style={{padding:20,marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>Alcance mes a mes</div>
        <div style={{fontSize:12,color:"var(--tx3)",marginBottom:12}}>Comparativa por período</div>

function GInput({value,onChange,placeholder}){
  const[local,sLocal]=useState(value);const ref=useRef(null);
  useEffect(()=>{sLocal(value);},[value]);
  useEffect(()=>{if(ref.current){ref.current.style.height="0";ref.current.style.height=Math.max(22,ref.current.scrollHeight)+"px";}});
  return<textarea ref={ref} value={local} onChange={e=>sLocal(e.target.value)} onBlur={()=>{if(local!==value)onChange({target:{value:local}});}} placeholder={placeholder} style={{width:"100%",background:"transparent",border:"none",color:"var(--tx)",fontSize:12,lineHeight:1.5,resize:"none",outline:"none",fontFamily:"inherit",padding:0,minHeight:22,overflow:"hidden"}}/>;
}
// ═══ GUIONADO — modelo y tokens del diseño ══════════════════════
const MOV_PRESETS=["Plano Fijo","Orbital","Zoom In","Zoom Out","Seguimiento","Paneo Der","Paneo Izq","Speed Ramp","Dron"];
const G_EST={"Borrador":{col:"#8E93A6",bor:"#262D40"},"En revisión":{col:"#EFD9A0",bor:"rgba(239,217,160,.4)"},"Aprobado":{col:"#8FF2C2",bor:"rgba(143,242,194,.45)"}};
const BLOQUE_TINT={Setup:"#C9CFDC",Escena:"#6FE7F2",Break:"#EFD9A0",Traslado:"#F2A8C4",Otro:"#C9BFFF"};
const BLOQUE_TIPOS=["Escena","Setup","Break","Traslado","Otro"];
const G_EST_OLD={borrador:"Borrador",en_revision:"En revisión",revision:"En revisión",aprobado:"Aprobado",grabado:"Aprobado"};
const G_TIPO_OLD={scene:"Escena",setup:"Setup",break_:"Break",travel:"Traslado",custom:"Otro"};
const gid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

// Normaliza guiones del modelo antiguo (lines/schedule) al nuevo (subs/crono) sin perder nada
function normG(g,cos){
  const co=(cos||[]).find(c=>String(c.id)===String(g.companyId));
  const mkL=l=>({id:l.id||gid(),header:l.header||"",voz:l.voz||"",escena:l.escena||"",
    movs:l.movs?l.movs.slice():(l.movements||[]).map(m=>{const c=CAM_MOVES.find(x=>x.id===m);return c?c.name:m;}).filter(Boolean)});
  let subs=(g.subs&&g.subs.length)
    ?g.subs.map((s,i)=>({id:s.id||gid(),nombre:s.nombre||("Guión "+(i+1)),lineas:(s.lineas||[]).map(mkL)}))
    :[{id:gid(),nombre:"Guión 1",lineas:(g.lines||[]).map(mkL)}];
  if(!subs.length)subs=[{id:gid(),nombre:"Guión 1",lineas:[]}];
  if(!subs[0].lineas.length)subs[0].lineas=[{id:gid(),header:"",voz:"",escena:"",movs:[]}];
  const crono=g.crono
    ?{inicio:g.crono.inicio||"10:00",fecha:g.crono.fecha||"",bloques:(g.crono.bloques||[]).map(b=>({id:b.id||gid(),tipo:b.tipo||"Otro",min:+b.min||0,nota:b.nota||"",src:b.src||""}))}
    :{inicio:g.scheduleStart||"10:00",fecha:g.scheduleDate||"",bloques:(g.schedule||[]).map(b=>({id:b.id||gid(),tipo:G_TIPO_OLD[b.type]||"Otro",min:parseInt(b.dur)||30,nota:b.note||"",src:""}))};
  return{id:g.id||gid(),title:g.title||"",companyId:g.companyId!==undefined?g.companyId:null,company:g.company||(co?co.name:""),
    type:g.type||"reel",status:G_EST[g.status]?g.status:(G_EST_OLD[g.status]||"Borrador"),
    taskId:g.taskId||null,createdAt:g.createdAt||td(),subs,crono};
}

function GuionadoPg({cos,users,addN,tasks,sT,planners}){
  const[guiones,sGuiones]=useState([]);const[loaded,sLoaded]=useState(false);
  const[sel,sSel]=useState(0);            // índice del guión seleccionado
  const[tab,sTab]=useState(0);            // número = sub-guión · "crono" = cronograma
  const[gMsg,sGMsg]=useState("");
  const[movOpen,sMovOpen]=useState(null); // id de línea con el desplegable abierto
  const[showAttach,sShowAttach]=useState(false);const[attachFilter,sAttachFilter]=useState("all");
  const tRef=useRef(null);const msgRef=useRef(null);

  // ── Carga: Supabase primero, localStorage de respaldo ──
  useEffect(()=>{
    DB.loadAll().then(d=>{
      const raw=d.guiones?.length?d.guiones:JSON.parse(localStorage.getItem("inm_guiones")||"[]");
      sGuiones(raw.map(g=>normG(g,cos)));sLoaded(true);
    }).catch(()=>{
      let loc=[];try{loc=JSON.parse(localStorage.getItem("inm_guiones")||"[]");}catch{loc=[];}
      sGuiones(loc.map(g=>normG(g,cos)));sLoaded(true);
    });
  },[]);

  const persist=useCallback(arr=>{
    localStorage.setItem("inm_guiones",JSON.stringify(arr));
    clearTimeout(tRef.current);tRef.current=setTimeout(()=>DB.save("guiones",arr),700);
  },[]);
  // Muta el guión seleccionado y persiste
  const mut=fn=>sGuiones(prev=>{const nw=[...prev];if(!nw[sel])return prev;const g={...nw[sel]};nw[sel]=g;fn(g);persist(nw);return nw;});
  const saveAll=arr=>{sGuiones(arr);persist(arr);};
  const flash=t=>{sGMsg(t);clearTimeout(msgRef.current);msgRef.current=setTimeout(()=>sGMsg(""),2500);};

  const g=guiones[sel];
  const subs=g?g.subs:[];
  let subIdx=typeof tab==="number"?tab:0;if(subIdx>=subs.length)subIdx=0;
  const sub=subs[subIdx];
  const est=g?(G_EST[g.status]||G_EST["Borrador"]):G_EST["Borrador"];
  const verGuion=typeof tab==="number",verCrono=tab==="crono";

  const mover=(arr,i,dir)=>{const j=i+dir;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;};

  // ── Cronograma: horas acumuladas + referencia de escena ──
  const iniMin=(()=>{const p=((g&&g.crono.inicio)||"10:00").split(":");return(+p[0])*60+(+p[1]||0);})();
  const fmtT=m=>{const mm=((m%1440)+1440)%1440;return String(Math.floor(mm/60)).padStart(2,"0")+":"+String(mm%60).padStart(2,"0");};
  let acc=0,escN=0;const srcCounts={};
  const bloques=(g?g.crono.bloques:[]).map(b=>{
    const ini=iniMin+acc;acc+=(+b.min||0);const fin=iniMin+acc;
    let etiqueta=b.tipo,ref="",srcNombre="";
    if(b.tipo==="Escena"){
      escN+=1;etiqueta="Escena #"+escN;
      const srcS=subs.find(x=>x.nombre===b.src)||subs[0];
      if(srcS){const key=srcS.nombre||"Guión 1";srcCounts[key]=(srcCounts[key]||0)+1;
        const ln=srcS.lineas[srcCounts[key]-1];if(ln)ref=ln.header||(ln.escena||"").slice(0,60);
        srcNombre=key;}
    }
    return{...b,etiqueta,ref,srcNombre,multiSrc:b.tipo==="Escena"&&subs.length>1,
      col:BLOQUE_TINT[b.tipo]||"#C9CFDC",hIni:fmtT(ini),hFin:fmtT(fin)};
  });
  const durMin=(g?g.crono.bloques:[]).reduce((a,b)=>a+(+b.min||0),0);

  // ── Vincular a tarea ──
  const attachableTasks=tasks.filter(t=>{
    if(g&&String(t.companyId)!==String(g.companyId))return false;
    if(attachFilter!=="all"&&attachFilter!==t.state)return false;
    return true;});
  const linkedTask=g&&g.taskId?tasks.find(t=>t.id===g.taskId):null;
  const attachTo=taskId=>{if(!g)return;const gi=g;mut(x=>{x.taskId=taskId;});
    if(taskId&&sT)sT(prev=>prev.map(t=>t.id===taskId?{...t,guionId:gi.id,guionTitle:gi.title}:t));
    sShowAttach(false);addN("📎 Guión vinculado");};
  const detach=()=>{if(!g)return;const old=g.taskId;mut(x=>{x.taskId=null;});
    if(old&&sT)sT(prev=>prev.map(t=>t.id===old?{...t,guionId:null,guionTitle:null}:t));
    addN("Guión desvinculado");};

  const nuevo=()=>{
    const co=cos[0];
    const ng={id:gid(),title:"",companyId:co?co.id:null,company:co?co.name:"",type:"reel",status:"Borrador",taskId:null,createdAt:td(),
      subs:[{id:gid(),nombre:"Guión 1",lineas:[{id:gid(),header:"",voz:"",escena:"",movs:[]}]}],
      crono:{inicio:"10:00",fecha:"",bloques:[{id:gid(),tipo:"Setup",min:30,nota:"",src:""}]}};
    saveAll([ng,...guiones]);sSel(0);sTab(0);
  };
  const eliminar=()=>{const nw=guiones.filter((_,i)=>i!==sel);saveAll(nw);sSel(0);sTab(0);};

  const inp={padding:"8px 11px",borderRadius:9,border:"1px solid "+D.line3,fontFamily:"inherit",outline:"none",flex:"1 1 auto",minWidth:0};
  const lbl={fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".12em",textTransform:"uppercase",width:52,flexShrink:0};
  const miniBtn={width:24,height:24,borderRadius:7,background:"transparent",border:"1px solid "+D.line2,color:D.tx3,cursor:"pointer",fontFamily:"inherit"};
  const bBtn={width:22,height:22,borderRadius:6,background:"transparent",border:"1px solid "+D.line2,color:D.tx3,cursor:"pointer",fontFamily:"inherit",fontSize:8};

      </div>
      <button onClick={nuevo} style={{padding:"10px 20px",borderRadius:999,background:D.cian,border:"1px solid "+D.cian,color:D.bg,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nuevo guión</button>
    </div>

    {!loaded?<div style={{textAlign:"center",padding:40,color:D.tx3}}>Cargando guiones…</div>:
    <div id="guionGrid" style={{display:"grid",gridTemplateColumns:"250px 1fr",gap:18,alignItems:"start"}}>
      {/* LISTA */}
      <div style={{display:"flex",flexDirection:"column",gap:8,minWidth:0}}>
        {guiones.length===0&&<span style={{fontSize:12.5,color:D.tx4,lineHeight:1.6,padding:"6px 2px"}}>Todavía no hay guiones. Crea el primero con “+ Nuevo guión”.</span>}
        {guiones.map((x,i)=>{
          const on=i===sel;const et=G_EST[x.status]||G_EST["Borrador"];
          const co=cos.find(c=>String(c.id)===String(x.companyId));
          const nSubs=x.subs.length,nL=x.subs.reduce((a,sb)=>a+sb.lineas.length,0);
          return(<button key={x.id} onClick={()=>{sSel(i);sTab(0);}} style={{display:"flex",flexDirection:"column",gap:6,padding:"13px 14px",borderRadius:14,background:on?"linear-gradient(170deg, rgba(13,17,27,.97), rgba(6,8,14,.99))":"rgba(200,210,228,.02)",border:"1px solid "+(on?"rgba(111,231,242,.5)":D.line3),cursor:"pointer",fontFamily:"inherit",textAlign:"left",transition:"border-color .25s, background .25s"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{padding:"2px 9px",borderRadius:999,background:"rgba(111,231,242,.1)",border:"1px solid rgba(111,231,242,.35)",color:D.cian,fontSize:10,fontWeight:700}}>{TT[x.type]?TT[x.type].l:x.type}</span>
              <span style={{fontSize:10.5,fontWeight:600,color:et.col}}>{x.status.toLowerCase()}</span>
              {x.taskId&&<Ic n="paperclip" s={11} c={D.lav}/>}
            </div>
            <span style={{fontSize:13,fontWeight:600,color:on?D.tx:D.tx2,lineHeight:1.35}}>{x.title||"Sin título…"}</span>
            <span style={{fontFamily:"var(--font-mono)",fontSize:10.5,color:D.tx4}}>{(co?co.name:x.company||"sin empresa").toLowerCase()} · {nSubs} {nSubs===1?"guión":"guiones"} · {nL}L</span>
          </button>);
        })}
      </div>

      {/* EDITOR */}
      <div style={{...D_MARCO,minWidth:0}}>
      <div style={{...D_CARD,padding:"18px 20px 22px"}}>
        {!g?<div style={{textAlign:"center",padding:"46px 20px",color:D.tx4,fontSize:13}}>Selecciona un guión de la izquierda o crea uno nuevo.</div>:<>
        {/* Fila 1 — título, empresa, estado, guardar, eliminar */}
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:14}}>
          <input value={g.title} onChange={e=>mut(x=>{x.title=e.target.value;})} placeholder="Título del guión…" style={{flex:"1 1 220px",minWidth:160,padding:"10px 13px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontFamily:"inherit",fontSize:15,fontWeight:700,outline:"none"}}/>
          <select value={g.status} onChange={e=>mut(x=>{x.status=e.target.value;})} style={{padding:"9px 10px",borderRadius:10,background:D.panel,border:"1px solid "+est.bor,color:est.col,fontFamily:"inherit",fontSize:12,fontWeight:600,outline:"none",colorScheme:"dark",cursor:"pointer",width:"auto"}}>
            <option value="Borrador">Borrador</option>
            <option value="En revisión">En revisión</option>
            <option value="Aprobado">Aprobado</option>
          </select>
          <button onClick={()=>{DB.save("guiones",guiones);flash("Guión guardado ✓");}} style={{padding:"9px 18px",borderRadius:999,background:D.cian,border:"1px solid "+D.cian,color:D.bg,fontFamily:"inherit",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>Guardar</button>
          <button onClick={()=>sShowAttach(true)} title="Vincular a una tarea" style={{width:34,height:34,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:linkedTask?"rgba(201,191,255,.12)":"transparent",border:"1px solid "+(linkedTask?"rgba(201,191,255,.4)":D.line2),color:linkedTask?D.lav:D.tx3,cursor:"pointer",fontFamily:"inherit"}}><Ic n="paperclip" s={13} c={linkedTask?D.lav:D.tx3}/></button>
          <button onClick={eliminar} style={{width:34,height:34,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,107,107,.07)",border:"1px solid rgba(255,107,107,.3)",color:D.rojo,cursor:"pointer",fontFamily:"inherit"}}>
            <svg viewBox="0 0 24 24" style={{width:13,height:13}}><path d="M5 7 H 19 M 10 7 V 5 H 14 V 7 M 7 7 L 8 20 H 16 L 17 7 M 10 11 V 16 M 14 11 V 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          {gMsg&&<span style={{fontSize:12,color:D.cian}}>{gMsg}</span>}
        </div>

        {/* Empresa y tipo */}
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:14}}>
          <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4}}>Empresa</span>
          <select value={g.companyId==null?"":String(g.companyId)} onChange={e=>{const co=cos.find(c=>String(c.id)===e.target.value);mut(x=>{x.companyId=co?co.id:null;x.company=co?co.name:"";});}} style={{padding:"8px 12px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,outline:"none",colorScheme:"dark",cursor:"pointer",width:"auto"}}>
            <option value="">Sin empresa</option>
            {cos.map(c=><option key={c.id} value={String(c.id)}>{c.name}</option>)}
          </select>
          <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4,marginLeft:6}}>Tipo</span>
          <select value={g.type} onChange={e=>mut(x=>{x.type=e.target.value;})} style={{padding:"8px 12px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx2,fontFamily:"inherit",fontSize:12.5,fontWeight:600,outline:"none",colorScheme:"dark",cursor:"pointer",width:"auto"}}>
            {Object.entries(TT).map(([k,v])=><option key={k} value={k}>{v.l}</option>)}
          </select>
        </div>

        {/* Tarea vinculada */}
        {linkedTask&&<div style={{display:"flex",alignItems:"center",gap:9,padding:"8px 12px",borderRadius:12,background:"rgba(201,191,255,.06)",border:"1px solid rgba(201,191,255,.28)",marginBottom:14}}>
          <Ic n="paperclip" s={13} c={D.lav}/>
          <span style={{fontSize:12,fontWeight:600,color:D.lav}}>Vinculado a</span>
          <span style={{fontSize:12.5,color:D.tx,flex:"1 1 auto",minWidth:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{linkedTask.title}</span>
          <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.tx4}}>{linkedTask.date||"sin fecha"}</span>
          <button onClick={detach} style={{background:"transparent",border:"none",color:D.tx4,cursor:"pointer",fontFamily:"inherit",fontSize:11,padding:0}}>✕</button>
        </div>}

        {/* Fila 2 — pestañas de sub-guiones + cronograma + leyenda */}
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:3,padding:3,borderRadius:999,background:D.panel,border:"1px solid "+D.line3,flexWrap:"wrap"}}>
            {subs.map((sb,i)=>{const on=verGuion&&subIdx===i;return(
              <button key={sb.id} onClick={()=>sTab(i)} style={{padding:"7px 15px",borderRadius:999,border:"none",background:on?"#1A2032":"transparent",color:on?D.tx:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer",maxWidth:200,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{(sb.nombre||("Guión "+(i+1)))+" · "+sb.lineas.length+"L"}</button>);})}
            <button onClick={()=>{mut(x=>{x.subs=[...x.subs,{id:gid(),nombre:"Guión "+(x.subs.length+1),lineas:[{id:gid(),header:"",voz:"",escena:"",movs:[]}]}];});sTab(subs.length);}} title="Agregar otro guión a este proyecto" style={{padding:"7px 12px",borderRadius:999,border:"none",background:"transparent",color:D.cian,fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer"}}>+</button>
            <button onClick={()=>sTab("crono")} style={{padding:"7px 15px",borderRadius:999,border:"none",background:verCrono?"#1A2032":"transparent",color:verCrono?D.tx:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>Cronograma · {g.crono.bloques.length}</button>
          </div>
          {verGuion&&<div style={{display:"flex",gap:12,marginLeft:"auto"}}>
            {[["Header",D.lav],["Voz off",D.peri],["Escena",D.cian]].map(([l,c])=>(
              <span key={l} style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:10.5,color:D.tx3}}><span style={{width:7,height:7,borderRadius:2,background:c}}/>{l}</span>))}
          </div>}
        </div>

        {/* ── VISTA GUIÓN ── */}
        {verGuion&&sub&&<>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4}}>Nombre del guión</span>
            <input value={sub.nombre} onChange={e=>mut(x=>{x.subs[subIdx].nombre=e.target.value;})} placeholder="Ej: Reel principal, Feria, Historia…" style={{flex:"1 1 180px",maxWidth:320,padding:"8px 12px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontFamily:"inherit",fontSize:13,fontWeight:600,outline:"none"}}/>
            {subs.length>1&&<button onClick={()=>{mut(x=>{x.subs=x.subs.filter((_,i)=>i!==subIdx);});sTab(0);}} style={{padding:"8px 14px",borderRadius:999,background:"transparent",border:"1px solid rgba(255,107,107,.3)",color:D.rojo,fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>Eliminar este guión</button>}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {sub.lineas.map((ln,i)=>{
              const disp=MOV_PRESETS.filter(p=>!(ln.movs||[]).includes(p));
              return(<div key={ln.id} style={{borderRadius:14,background:D.panel,border:"1px solid "+D.line3,padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{width:24,height:24,borderRadius:8,display:"inline-flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(140deg, "+D.cian+", "+D.peri+")",color:D.bg,fontFamily:"var(--font-mono)",fontSize:11,fontWeight:700}}>{i+1}</span>
                  <span style={{flex:"1 1 auto"}}/>
                  <button onClick={()=>mut(x=>mover(x.subs[subIdx].lineas,i,-1))} style={{...miniBtn,fontSize:9}}>▲</button>
                  <button onClick={()=>mut(x=>mover(x.subs[subIdx].lineas,i,1))} style={{...miniBtn,fontSize:9}}>▼</button>
                  <button onClick={()=>mut(x=>{x.subs[subIdx].lineas=x.subs[subIdx].lineas.filter((_,j)=>j!==i);})} style={{...miniBtn,fontSize:10}}>✕</button>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{...lbl,color:D.lav}}>Header</span>
                  <input value={ln.header} onChange={e=>mut(x=>{x.subs[subIdx].lineas[i].header=e.target.value;})} placeholder="Texto en pantalla…" style={{...inp,background:"rgba(201,191,255,.04)",borderLeft:"3px solid "+D.lav,color:D.tx,fontSize:13,fontWeight:600}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{...lbl,color:D.peri}}>Voz off</span>
                  <input value={ln.voz} onChange={e=>mut(x=>{x.subs[subIdx].lineas[i].voz=e.target.value;})} placeholder="Locución…" style={{...inp,background:"rgba(155,180,255,.04)",borderLeft:"3px solid "+D.peri,color:D.tx2,fontSize:13}}/>
                </div>
                <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                  <span style={{...lbl,color:D.cian,paddingTop:10}}>Escena</span>
                  <textarea rows={2} value={ln.escena} onChange={e=>mut(x=>{x.subs[subIdx].lineas[i].escena=e.target.value;})} placeholder="Qué se graba…" style={{...inp,background:"rgba(111,231,242,.03)",borderLeft:"3px solid "+D.cian,color:D.tx2,fontSize:12.5,lineHeight:1.5,resize:"vertical",boxSizing:"border-box"}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",paddingLeft:62}}>
                  {(ln.movs||[]).map((mv,mi)=>(
                    <span key={mi} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 9px",borderRadius:6,background:"rgba(255,139,139,.09)",border:"1px solid rgba(255,139,139,.3)",color:D.rojo,fontSize:10.5,fontWeight:600}}>
                      {mv}
                      <button onClick={()=>mut(x=>{x.subs[subIdx].lineas[i].movs=ln.movs.filter((_,j)=>j!==mi);})} style={{background:"transparent",border:"none",color:D.rojo,cursor:"pointer",fontFamily:"inherit",fontSize:9,padding:0,opacity:.7}}>✕</button>
                    </span>))}
                  <div style={{position:"relative"}}>
                    <button onClick={()=>sMovOpen(movOpen===ln.id?null:ln.id)} style={{padding:"4px 10px",borderRadius:6,background:"transparent",border:"1px dashed rgba(255,139,139,.35)",color:D.rojo,fontFamily:"inherit",fontSize:10.5,fontWeight:600,cursor:"pointer"}}>+ Mov. cámara</button>
                    {movOpen===ln.id&&<div style={{position:"absolute",top:"calc(100% + 5px)",left:0,zIndex:30,maxWidth:"calc(100vw - 32px)",minWidth:140,borderRadius:10,background:D.panel2,border:"1px solid "+D.line2,boxShadow:"0 18px 44px rgba(2,3,8,.7)",padding:5,display:"flex",flexDirection:"column",gap:1}}>
                      {disp.length===0&&<span style={{fontSize:11,color:D.tx4,padding:"6px 10px"}}>Sin más movimientos</span>}
                      {disp.map(mo=>(
                        <button key={mo} onClick={()=>{mut(x=>{const l=x.subs[subIdx].lineas[i];l.movs=[...(l.movs||[]),mo];});sMovOpen(null);}} style={{padding:"6px 10px",borderRadius:7,background:"transparent",border:"none",color:D.tx2,fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer",textAlign:"left"}}>{mo}</button>))}
                    </div>}
                  </div>
                </div>
              </div>);
            })}
            <button onClick={()=>mut(x=>{x.subs[subIdx].lineas=[...x.subs[subIdx].lineas,{id:gid(),header:"",voz:"",escena:"",movs:[]}];})} style={{padding:12,borderRadius:12,background:"transparent",border:"1px dashed "+D.line2,color:D.tx4,fontFamily:"inherit",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>+ Agregar línea</button>
          </div>
        </>}

        {/* ── VISTA CRONOGRAMA ── */}
        {verCrono&&<>
          <div style={{display:"flex",alignItems:"flex-end",gap:16,flexWrap:"wrap",marginBottom:16}}>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4}}>Inicio jornada</span>
              <input type="time" value={g.crono.inicio} onChange={e=>mut(x=>{x.crono={...x.crono,inicio:e.target.value};})} style={{padding:"8px 11px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontFamily:"var(--font-mono)",fontSize:13,outline:"none",colorScheme:"dark",width:"auto"}}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              <span style={{fontFamily:"var(--font-mono)",fontSize:9.5,letterSpacing:".16em",textTransform:"uppercase",color:D.tx4}}>Fecha</span>
              <input type="date" value={g.crono.fecha} onChange={e=>mut(x=>{x.crono={...x.crono,fecha:e.target.value};})} style={{padding:"8px 11px",borderRadius:10,background:D.panel,border:"1px solid "+D.line2,color:D.tx,fontFamily:"var(--font-mono)",fontSize:13,outline:"none",colorScheme:"dark",width:"auto"}}/>
            </div>
            <span style={{marginLeft:"auto",fontSize:12,color:D.tx3}}>Duración total <span style={{fontFamily:"var(--font-mono)",fontSize:15,fontWeight:700,color:D.cian}}>{Math.floor(durMin/60)}h {durMin%60}m</span></span>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {bloques.map((b,i)=>(
              <div key={b.id} style={{display:"flex",gap:12,alignItems:"stretch"}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",justifyContent:"center",gap:2,width:52,flexShrink:0}}>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:12,fontWeight:700,color:b.col}}>{b.hIni}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:10,color:D.tx5}}>{b.hFin}</span>
                </div>
                <div style={{flex:"1 1 auto",minWidth:0,borderRadius:12,background:D.panel,border:"1px solid "+D.line3,borderLeft:"3px solid "+b.col,padding:"10px 13px",display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:9,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:700,color:b.col}}>{b.etiqueta}</span>
                    {b.multiSrc&&<button onClick={()=>mut(x=>{const cur=subs.findIndex(s2=>s2.nombre===b.src);x.crono.bloques[i].src=subs[(Math.max(cur,0)+1)%subs.length].nombre;})} title="Toca para cambiar de guión" style={{padding:"3px 9px",borderRadius:999,background:"rgba(155,180,255,.08)",border:"1px solid rgba(155,180,255,.3)",color:D.peri,fontFamily:"inherit",fontSize:10,fontWeight:600,cursor:"pointer",maxWidth:150,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{b.srcNombre}</button>}
                    <input type="number" value={b.min} min="5" step="5" onChange={e=>mut(x=>{x.crono.bloques[i].min=+e.target.value||0;})} style={{width:54,padding:"5px 7px",borderRadius:7,background:D.bg,border:"1px solid "+D.line2,color:D.tx,fontFamily:"var(--font-mono)",fontSize:12,outline:"none",colorScheme:"dark"}}/>
                    <span style={{fontSize:10.5,color:D.tx4}}>min</span>
                    {b.ref&&<span style={{fontSize:11,color:D.tx4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flex:"1 1 100px",minWidth:0}}>— {b.ref}</span>}
                    <span style={{marginLeft:"auto",display:"flex",gap:5}}>
                      <button onClick={()=>mut(x=>mover(x.crono.bloques,i,-1))} style={bBtn}>▲</button>
                      <button onClick={()=>mut(x=>mover(x.crono.bloques,i,1))} style={bBtn}>▼</button>
                      <button onClick={()=>mut(x=>{x.crono.bloques=x.crono.bloques.filter((_,j)=>j!==i);})} style={{...bBtn,fontSize:9}}>✕</button>
                    </span>
                  </div>
                  <input value={b.nota} onChange={e=>mut(x=>{x.crono.bloques[i].nota=e.target.value;})} placeholder="Notas del bloque…" className="cronoNota" style={{padding:"7px 10px",borderRadius:8,background:"transparent",border:"1px solid transparent",color:D.tx2,fontFamily:"inherit",fontSize:12.5,outline:"none"}}/>
                </div>
              </div>))}
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:14,paddingLeft:64}}>
            {BLOQUE_TIPOS.map(t=>{const c=BLOQUE_TINT[t];return(
              <button key={t} onClick={()=>mut(x=>{x.crono.bloques=[...x.crono.bloques,{id:gid(),tipo:t,min:t==="Break"?15:30,nota:"",src:t==="Escena"?(subs[0]?subs[0].nombre:""):""}];})} style={{padding:"8px 14px",borderRadius:999,background:"transparent",border:"1px dashed "+c+"55",color:c,fontFamily:"inherit",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>+ {t}</button>);})}
          </div>
        </>}
        </>}
      </div>
      </div>
    </div>}

    {/* VINCULAR A TAREA */}
    <Md open={showAttach} onClose={()=>sShowAttach(false)} title="Vincular guión a tarea" width={520}>
      <div style={{fontSize:13,color:D.tx2,marginBottom:12}}>Selecciona la tarea de Org Semanal a la que pertenece <b>“{g?g.title||"este guión":""}”</b></div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {[["all","Todas"],["no_realizado","Por hacer"],["en_proceso","En proceso"],["en_aprobacion","Aprobación"]].map(([k,l])=>(
          <button key={k} onClick={()=>sAttachFilter(k)} style={{padding:"6px 13px",borderRadius:999,fontSize:11.5,fontWeight:600,background:attachFilter===k?"#1A2032":"transparent",color:attachFilter===k?D.tx:D.tx4,border:"1px solid "+(attachFilter===k?D.line2:D.line3),cursor:"pointer",fontFamily:"inherit"}}>{l}</button>))}
      </div>
      <div style={{maxHeight:360,overflow:"auto",display:"flex",flexDirection:"column",gap:6}}>
        <div onClick={()=>attachTo(null)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,cursor:"pointer",background:g&&!g.taskId?"rgba(111,231,242,.07)":D.panel,border:"1px solid "+(g&&!g.taskId?"rgba(111,231,242,.4)":D.line3)}}>
          <div style={{width:28,height:28,borderRadius:8,background:D.line15,display:"flex",alignItems:"center",justifyContent:"center",color:D.tx4,fontSize:12}}>✕</div>
          <div><div style={{fontSize:13,fontWeight:600}}>Ninguna — sin vincular</div><div style={{fontSize:11,color:D.tx4}}>El guión queda independiente</div></div>
        </div>
        {attachableTasks.map(t=>{const co=cos.find(c=>String(c.id)===String(t.companyId));const on=g&&g.taskId===t.id;
          return(<div key={t.id} onClick={()=>attachTo(t.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,cursor:"pointer",background:on?"rgba(201,191,255,.08)":D.panel,border:"1px solid "+(on?"rgba(201,191,255,.4)":D.line3)}}>
            <div style={{width:28,height:28,borderRadius:8,background:(co&&co.color)||D.line2,display:"flex",alignItems:"center",justifyContent:"center",color:D.bg,fontWeight:700,fontSize:11}}>{co?co.name[0]:"?"}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}><Bg color={TT[t.type]?.c} style={{fontSize:9,padding:"2px 5px"}}>{TT[t.type]?.l}</Bg><span style={{fontSize:13,fontWeight:600}}>{t.title}</span></div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:D.tx4,marginTop:2}}>{t.date||"sin fecha"} · {SS[t.state]?.l}</div>
            </div>
            {on&&<Ic n="check" s={16} c={D.lav}/>}
          </div>);})}
        {attachableTasks.length===0&&<div style={{textAlign:"center",padding:20,color:D.tx4,fontSize:13}}>No hay tareas para {g?g.company:"esta empresa"}</div>}
      </div>
    </Md>
  </div>);
}


// ═══ DÍAS DE GRABACIÓN ══════════════════════════════════════════
// ═══ FINANZAS (Payments + Billing + IVA) ════════════════════════
function PayBillPg({users,teamPay,sTP,addN,cos,plans,billing,month,year,remEx,billRcpts,sBR,cM,cY,avisar,correosDe,cu}){
  const[tab,sTab]=useState("team");const[showReg,sShowReg]=useState(false);
  const[f,sF]=useState({userId:users[0]?.id,amount:"",concept:"",date:td()});const[pImg,sPImg]=useState(null);
  const[ivaRate]=useState(19);
  // IVA reminder
  const[showIvaReminder,sShowIvaReminder]=useState(()=>{const today=new Date();const key="iva_dismissed_"+today.getFullYear()+"_"+today.getMonth();return today.getDate()>=20&&!localStorage.getItem(key);});
  const dismissIva=()=>{const today=new Date();localStorage.setItem("iva_dismissed_"+today.getFullYear()+"_"+today.getMonth(),"1");sShowIvaReminder(false);};
  // Invoice config per company
  const[invoiceCfg,sInvCfg]=useState(()=>{try{return JSON.parse(localStorage.getItem("inm_invoice_cfg")||"{}")}catch{return{}}});
  const[invoiceFiles,sInvFiles]=useState(()=>{try{return JSON.parse(localStorage.getItem("inm_invoices")||"{}")}catch{return{}}});
  const setReqFactura=(coId,v)=>{const nw={...invoiceCfg,[coId]:{...(invoiceCfg[coId]||{}),requiere:v}};sInvCfg(nw);localStorage.setItem("inm_invoice_cfg",JSON.stringify(nw));};
  const uploadFactura=(coId,e)=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{const nw={...invoiceFiles,[coId+"_"+cM+"_"+cY]:{name:fl.name,data:ev.target.result,date:td()}};sInvFiles(nw);localStorage.setItem("inm_invoices",JSON.stringify(nw));addN("📄 Factura subida para "+cos.find(c=>c.id===parseInt(coId))?.name);};r.readAsDataURL(fl);};
  // Billing overrides (editable prices, extras)
  const META_DEFAULT=150000;const FIDEL_DEFAULT=80000;
  const[billOvr,sBillOvr]=useState(()=>{try{return JSON.parse(localStorage.getItem("inm_bill_overrides")||"{}")}catch{return{}}});
  const saveBillOvr=(nw)=>{sBillOvr(nw);localStorage.setItem("inm_bill_overrides",JSON.stringify(nw));};
  const getOvr=(coId)=>billOvr[coId]||{};
  const setOvr=(coId,field,val)=>{saveBillOvr({...billOvr,[coId]:{...getOvr(coId),[field]:val}});};
  const getPrice=(c)=>{const ovr=getOvr(c.id);if(ovr.price!==undefined&&ovr.price!=="")return parseInt(ovr.price);return c.price||c.customPrice||plans[c.plan]?.price||0;};
  const getMetaVal=(c)=>{const ovr=getOvr(c.id);return ovr.metaVal!==undefined?parseInt(ovr.metaVal):META_DEFAULT;};
  const getFidelVal=(c)=>{const ovr=getOvr(c.id);return ovr.fidelVal!==undefined?parseInt(ovr.fidelVal):FIDEL_DEFAULT;};

  const add=()=>{if(!f.amount)return;const u=users.find(u2=>u2.id===parseInt(f.userId));
    sTP(p=>({...p,[f.userId]:[...(p[f.userId]||[]),{id:ni(),amount:parseInt(f.amount),concept:f.concept,date:f.date,img:pImg,status:"pagado"}]}));
    addN("Pago: "+fP(parseInt(f.amount))+" para "+u?.name,parseInt(f.userId));
    // El aviso del pago es privado: va solo a quien lo recibe, no al resto del equipo.
    if(avisar&&u&&u.id!==cu?.id)avisar({type:"pago",title:"💰 Te registraron un pago",
      body:fP(parseInt(f.amount))+(f.concept?" · "+f.concept:"")+" · "+f.date,
      to:correosDe([u]),url:"/",important:true});
    sF({...f,amount:"",concept:""});sPImg(null);sShowReg(false);};
  const hImg=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>sPImg(ev.target.result);r.readAsDataURL(fl);};
  const hUp=(coId,type,e)=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{sBR(p=>({...p,[coId]:[...(p[coId]||[]),{id:ni(),date:td(),img:ev.target.result,type,month:cM,year:cY}]}));};r.readAsDataURL(fl);};

  // Calculations
  const allPays=Object.entries(teamPay).flatMap(([uid,arr])=>arr.map(p=>({...p,userId:parseInt(uid)})));
  const egresos=allPays.reduce((s,p)=>s+p.amount,0);
  const ingresos=cos.reduce((s,c)=>{const ovr=getOvr(c.id);const base=getPrice(c);const meta=(ovr.meta?getMetaVal(c):0);const fidel=(ovr.fidel?getFidelVal(c):0);return s+base+meta+fidel;},0);
  const margen=ingresos-egresos;
  const mrr=ingresos;
  const pagado=allPays.filter(p=>!p.status||p.status==="pagado").reduce((s,p)=>s+p.amount,0);
  const pendiente=allPays.filter(p=>p.status==="pendiente").reduce((s,p)=>s+p.amount,0);

  // IVA
  const ivaMes=Math.round(ingresos*ivaRate/100);
  const totalConIva=ingresos+ivaMes;

  // Cuotas
  const cuotas=cos.map(c=>{const pl={name:c.planName||plans[c.plan]?.name||c.plan,price:c.price||c.customPrice||plans[c.plan]?.price||0};const basePrice=getPrice(c);const ovr=getOvr(c.id);
    const hasMeta=ovr.meta||false;const hasFidel=ovr.fidel||false;
    const metaVal=hasMeta?getMetaVal(c):0;const fidelVal=hasFidel?getFidelVal(c):0;
    const price=basePrice+metaVal+fidelVal;
    const cuota1=ovr.cuota1!==undefined&&ovr.cuota1!==""?parseInt(ovr.cuota1):Math.round(price/2);
    const cuota2=price-cuota1;
    const rc=(billRcpts[c.id]||[]).filter(r=>r.month===cM&&r.year===cY);
    const h1=rc.some(r=>r.type==="50_1");const h2=rc.some(r=>r.type==="50_2");
    const paid=(h1?cuota1:0)+(h2?cuota2:0);const pct=price?Math.round(paid/price*100):0;
    const coIva=Math.round(price*ivaRate/100);
    const invKey=c.id+"_"+cM+"_"+cY;const hasInvoice=!!invoiceFiles[invKey];
    const reqFactura=invoiceCfg[c.id]?.requiere||false;
    return{co:c,pl,price,basePrice,cuota1,cuota2,h1,h2,paid,pending:price-paid,pct,iva:coIva,totalIva:price+coIva,
      hasMeta,hasFidel,metaVal,fidelVal,
      inv1:"F-"+year+"-"+String(cM+1).padStart(2,"0")+"-"+c.id+"A",
      inv2:"F-"+year+"-"+String(cM+1).padStart(2,"0")+"-"+c.id+"B",
      due1:year+"-"+String(cM+1).padStart(2,"0")+"-05",
      due2:year+"-"+String(cM+1).padStart(2,"0")+"-25",
      fullyPaid:h1&&h2,hasInvoice,reqFactura,invKey};
  });
  const cobrado=cuotas.reduce((s,q)=>s+q.paid,0);
  const porCobrar=cuotas.reduce((s,q)=>s+q.pending,0);
  const totalCuotas=cuotas.length*2;
  const history=Object.entries(billRcpts).flatMap(([coId,arr])=>{const c=cos.find(x=>String(x.id)===coId);return arr.map(r=>({...r,co:c,coId}));}).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const stColor={pagado:"var(--success)",pendiente:"var(--gold)",vencido:"var(--danger)"};

  return(<div>
    {/* IVA REMINDER POPUP */}
    {showIvaReminder&&(<Portal><div style={{position:"fixed",inset:0,background:"rgba(5,7,10,.6)",zIndex:1001,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}}>
      <div className="su" style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:14,padding:28,maxWidth:380,textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}>
        <div style={{display:"inline-flex",padding:14,borderRadius:12,background:"rgba(255,155,61,.1)",marginBottom:14}}><Ic n="alert" s={32} c="var(--gold)"/></div>
        <div style={{fontSize:18,fontWeight:600,marginBottom:6}}>Recordatorio de IVA</div>
        <div style={{fontSize:14,color:"var(--tx2)",marginBottom:6}}>Recuerda pagar el IVA de este mes</div>
        <div className="num" style={{fontSize:28,fontWeight:600,color:"var(--gold)",marginBottom:16}}>{fP(ivaMes)}</div>
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          <Bt v="s" onClick={dismissIva}>Entendido</Bt>
          <Bt v="p" onClick={()=>{dismissIva();sTab("billing");}} icon="payments">Ver facturación</Bt>
        </div>
      </div>
    </div></Portal>)}

    {/* HEADER */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,flexWrap:"wrap",gap:12}}>
      <div><h1 style={{fontSize:28,fontWeight:600,letterSpacing:"-0.025em"}}>Finanzas</h1><div style={{fontSize:13,color:"var(--tx3)",marginTop:2}}>Flujo de pagos entrantes y salientes del estudio</div></div>
      <Bt v="p" onClick={()=>sShowReg(true)} icon="plus">{tab==="team"?"Registrar pago":"Registrar cobro"}</Bt>
    </div>

    {/* 4 KPIs */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:24}}>
      {[["Ingresos (mes)",fP(ingresos),"var(--success)","trend_up"],["Egresos (equipo)",fP(egresos),"var(--gold)","logout"],["Margen neto",fP(margen),margen>=0?"var(--tx)":"var(--danger)","money"],["MRR estimado",fP(mrr),"var(--tx)","trend_up"]].map(([l,v,c,ic],i)=>(<div key={i} className="card" style={{padding:20}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}><Ic n={ic} s={16} c="var(--tx3)"/><span style={{fontSize:12,color:"var(--tx3)"}}>{l}</span></div>
        <div className="num" style={{fontSize:28,fontWeight:600,letterSpacing:"-0.02em",color:c}}>{v}</div>
      </div>))}
    </div>

    {/* IVA CARD */}
    <div className="card" style={{padding:16,marginBottom:16,borderLeft:"3px solid var(--gold)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Ic n="alert" s={18} c="var(--gold)"/><span style={{fontSize:14,fontWeight:600}}>IVA del mes ({ivaRate}%)</span></div>
        <div style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
          <div><div style={{fontSize:10,color:"var(--tx3)"}}>Neto</div><div className="num" style={{fontSize:16,fontWeight:600}}>{fP(ingresos)}</div></div>
          <div style={{fontSize:16,color:"var(--tx3)"}}>+</div>
          <div><div style={{fontSize:10,color:"var(--gold)"}}>IVA {ivaRate}%</div><div className="num" style={{fontSize:16,fontWeight:600,color:"var(--gold)"}}>{fP(ivaMes)}</div></div>
          <div style={{fontSize:16,color:"var(--tx3)"}}>=</div>
          <div><div style={{fontSize:10,color:"var(--success)"}}>Total c/IVA</div><div className="num" style={{fontSize:16,fontWeight:600,color:"var(--success)"}}>{fP(totalConIva)}</div></div>
        </div>
      </div>
    </div>

    {/* TABS */}
    <div style={{display:"flex",gap:24,marginBottom:20,borderBottom:"2px solid var(--border)"}}>
      {[["team","Pagos al equipo","Inmersia → Colaboradores","team"],["billing","Cobros a clientes","Empresas → Inmersia","companies"]].map(([k,l,sub,ic])=>(<button key={k} onClick={()=>sTab(k)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 4px 14px",background:"transparent",border:"none",borderBottom:tab===k?"2px solid var(--accent)":"2px solid transparent",marginBottom:-2,cursor:"pointer",fontFamily:"inherit"}}>
        <Ic n={ic} s={18} c={tab===k?"var(--tx)":"var(--tx3)"}/>
        <div style={{textAlign:"left"}}><div style={{fontSize:14,fontWeight:tab===k?600:500,color:tab===k?"var(--tx)":"var(--tx3)"}}>{l}</div><div style={{fontSize:11,color:"var(--tx3)"}}>{sub}</div></div>
      </button>))}
    </div>

    {/* TEAM TAB */}
    {tab==="team"&&(<div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        <div className="card" style={{padding:20}}><div style={{fontSize:12,color:"var(--tx3)",marginBottom:8}}>Pagado este mes</div><div className="num" style={{fontSize:28,fontWeight:600,color:"var(--success)"}}>{fP(pagado)}</div></div>
        <div className="card" style={{padding:20}}><div style={{fontSize:12,color:"var(--tx3)",marginBottom:8}}>Pendiente de pago</div><div className="num" style={{fontSize:28,fontWeight:600,color:"var(--gold)"}}>{fP(pendiente)}</div></div>
      </div>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}><div style={{display:"grid",gridTemplateColumns:"1.5fr 2fr 1fr 1fr 1fr",padding:"12px 20px",borderBottom:"1px solid var(--border)",background:"var(--bg3)",minWidth:600}}>
          {["COLABORADOR","CONCEPTO","FECHA","MONTO","ESTADO"].map(h=><div key={h} className="eyebrow" style={{fontSize:10}}>{h}</div>)}
        </div>
        {allPays.length===0?<div style={{padding:24,textAlign:"center",color:"var(--tx3)",fontSize:13}}>No hay pagos registrados</div>:
        allPays.sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(p=>{const u=users.find(u2=>u2.id===p.userId);const st=p.status||"pagado";
          return(<div key={p.id} style={{display:"grid",gridTemplateColumns:"1.5fr 2fr 1fr 1fr 1fr",padding:"14px 20px",borderBottom:"1px solid var(--border)",alignItems:"center",minWidth:600}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><Av u={u} sz={32}/><div><div style={{fontSize:14,fontWeight:600}}>{u?.name}</div><div style={{fontSize:11,color:"var(--tx3)"}}>{u?.role}</div></div></div>
            <div style={{fontSize:13,color:"var(--tx2)"}}>{p.concept||"Pago"}</div>
            <div className="num" style={{fontSize:12,color:"var(--tx2)"}}>{p.date}</div>
            <div className="num" style={{fontSize:14,fontWeight:600}}>{fP(p.amount)}</div>
            <Bg color={stColor[st]}>{st}</Bg>
          </div>);
        })}</div>
      </div>
      <Bt v="p" onClick={()=>{DB.save("teamPay",teamPay);addN("✅ Pagos guardados");}} icon="save" style={{width:"100%",marginTop:12,justifyContent:"center"}}>Guardar pagos</Bt>
    </div>)}

    {/* BILLING TAB */}
    {tab==="billing"&&(<div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
        <div className="card" style={{padding:20}}><div style={{fontSize:12,color:"var(--tx3)",marginBottom:8}}>Cobrado</div><div className="num" style={{fontSize:28,fontWeight:600,color:"var(--success)"}}>{fP(cobrado)}</div></div>
        <div className="card" style={{padding:20}}><div style={{fontSize:12,color:"var(--tx3)",marginBottom:8}}>Por cobrar</div><div className="num" style={{fontSize:28,fontWeight:600,color:"var(--gold)"}}>{fP(porCobrar)}</div></div>
        <div className="card" style={{padding:20}}><div style={{display:"flex",alignItems:"center",gap:4,marginBottom:8}}><Ic n="alert" s={14} c="var(--danger)"/><span style={{fontSize:12,color:"var(--tx3)"}}>Vencido</span></div><div className="num" style={{fontSize:28,fontWeight:600,color:"var(--danger)"}}>{fP(0)}</div></div>
      </div>

      {/* Cuotas */}
      <div className="card" style={{padding:0,overflow:"hidden",marginBottom:16}}>
        <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border)",background:"var(--bg3)",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div><div style={{fontSize:14,fontWeight:600}}>{month} {year} · Cuotas por empresa</div><div style={{fontSize:12,color:"var(--tx3)",marginTop:2}}>50% inicio + 50% cierre · IVA {ivaRate}%</div></div>
          <Bg color="var(--accent)">{totalCuotas} cuotas</Bg>
        </div>

        {cuotas.map(q=>{const c=q.co;
          return(<div key={c.id} style={{borderBottom:"1px solid var(--border)"}}>
            <div style={{padding:"14px 20px"}}>
              {/* Row 1: Company + price editor */}
              <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"center",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10,minWidth:160}}>
                  <div style={{width:34,height:34,borderRadius:9,background:c.color,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--bg)",fontWeight:700,fontSize:14}}>{c.name[0]}</div>
                  <div><div style={{fontSize:14,fontWeight:600}}>{c.name}</div><div style={{fontSize:11,color:"var(--tx3)"}}>{q.pl?.name||"Custom"}</div></div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:10,color:"var(--tx3)"}}>Plan $</span><input type="number" value={getOvr(c.id).price!==undefined?getOvr(c.id).price:q.basePrice} onChange={e=>setOvr(c.id,"price",e.target.value)} style={{width:90,fontSize:12,padding:"4px 6px",textAlign:"right"}}/></div>
                {/* Meta switch */}
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <div onClick={()=>setOvr(c.id,"meta",!q.hasMeta)} style={{width:28,height:16,borderRadius:8,background:q.hasMeta?"var(--info)":"var(--bg4)",cursor:"pointer",position:"relative",transition:"background .2s"}}><div style={{width:12,height:12,borderRadius:6,background:"var(--tx)",position:"absolute",top:2,left:q.hasMeta?14:2,transition:"left .2s"}}/></div>
                  <span style={{fontSize:10,color:q.hasMeta?"var(--info)":"var(--tx3)"}}>Meta</span>
                  {q.hasMeta&&<input type="number" value={getOvr(c.id).metaVal!==undefined?getOvr(c.id).metaVal:META_DEFAULT} onChange={e=>setOvr(c.id,"metaVal",e.target.value)} style={{width:70,fontSize:11,padding:"3px 5px",textAlign:"right"}}/>}
                </div>
                {/* Fidel switch */}
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <div onClick={()=>setOvr(c.id,"fidel",!q.hasFidel)} style={{width:28,height:16,borderRadius:8,background:q.hasFidel?"var(--success)":"var(--bg4)",cursor:"pointer",position:"relative",transition:"background .2s"}}><div style={{width:12,height:12,borderRadius:6,background:"var(--tx)",position:"absolute",top:2,left:q.hasFidel?14:2,transition:"left .2s"}}/></div>
                  <span style={{fontSize:10,color:q.hasFidel?"var(--success)":"var(--tx3)"}}>Fidel</span>
                  {q.hasFidel&&<input type="number" value={getOvr(c.id).fidelVal!==undefined?getOvr(c.id).fidelVal:FIDEL_DEFAULT} onChange={e=>setOvr(c.id,"fidelVal",e.target.value)} style={{width:70,fontSize:11,padding:"3px 5px",textAlign:"right"}}/>}
                </div>
                {/* Toggle factura */}
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <div onClick={()=>setReqFactura(c.id,!q.reqFactura)} style={{width:28,height:16,borderRadius:8,background:q.reqFactura?"var(--gold)":"var(--bg4)",cursor:"pointer",position:"relative",transition:"background .2s"}}><div style={{width:12,height:12,borderRadius:6,background:"var(--tx)",position:"absolute",top:2,left:q.reqFactura?14:2,transition:"left .2s"}}/></div>
                  <span style={{fontSize:10,color:q.reqFactura?"var(--gold)":"var(--tx3)"}}>Factura</span>
                </div>
              </div>
              {/* Row 2: Totals */}
              <div style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
                <div><div style={{fontSize:10,color:"var(--tx3)"}}>Neto</div><div className="num" style={{fontSize:14,fontWeight:600}}>{fP(q.price)}</div></div>
                {q.hasMeta&&<div style={{fontSize:10,color:"var(--info)"}}>(+{fP(q.metaVal)} Meta)</div>}
                {q.hasFidel&&<div style={{fontSize:10,color:"var(--success)"}}>(+{fP(q.fidelVal)} Fidel)</div>}
                <div><div style={{fontSize:10,color:"var(--gold)"}}>IVA</div><div className="num" style={{fontSize:14,fontWeight:600,color:"var(--gold)"}}>{fP(q.iva)}</div></div>
                <div><div style={{fontSize:10,color:"var(--success)"}}>Total</div><div className="num" style={{fontSize:14,fontWeight:600,color:"var(--success)"}}>{fP(q.totalIva)}</div></div>
                <div style={{flex:1,minWidth:80}}>
                  <div style={{height:5,background:"var(--bg4)",borderRadius:3,overflow:"hidden",marginBottom:3}}><div style={{width:q.pct+"%",height:"100%",background:c.color,transition:"width .4s"}}/></div>
                  <div className="num" style={{fontSize:10,color:"var(--tx3)"}}>{q.pct}%</div>
                </div>
              </div>
            </div>
            {/* Cuota rows */}
            <div style={{background:"var(--bg3)",padding:"0 20px"}}>
              {[[1,"50_1","1ra quincena",q.inv1,q.due1,q.h1,q.cuota1],[2,"50_2","2da quincena",q.inv2,q.due2,q.h2,q.cuota2]].map(([n,tp,desc,inv,due,paid,amt])=>(<div key={tp} style={{display:"flex",flexWrap:"wrap",padding:"12px 0",borderTop:"1px solid var(--border)",alignItems:"center",gap:10}}>
                <Bg color={n===1?"var(--info)":"var(--accent)"} style={{fontSize:11,minWidth:70}}>Cuota {n}/2</Bg>
                <div style={{minWidth:140}}><div style={{fontSize:12,fontWeight:500}}>{desc} · {month} {year}</div><div className="num" style={{fontSize:11,color:"var(--tx3)"}}>{inv}</div></div>
                <div style={{minWidth:80}}><div style={{fontSize:10,color:"var(--tx3)"}}>Vence</div><div className="num" style={{fontSize:12,color:"var(--tx2)"}}>{due}</div></div>
                <div style={{minWidth:100}}>{n===1?(<div style={{display:"flex",alignItems:"center",gap:2}}><span style={{fontSize:10,color:"var(--tx3)"}}>$</span><input type="number" value={getOvr(c.id).cuota1!==undefined?getOvr(c.id).cuota1:q.cuota1} onChange={e=>setOvr(c.id,"cuota1",e.target.value)} style={{width:80,fontSize:13,fontWeight:600,padding:"3px 5px",textAlign:"right"}}/></div>):(<div className="num" style={{fontSize:13,fontWeight:600,color:q.cuota2<0?"var(--danger)":"var(--tx)"}}>{fP(amt)}</div>)}</div>
                <div style={{flex:1}}>{paid?(<span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 8px",background:"color-mix(in oklch,var(--success) 12%,var(--bg2))",border:"1px solid color-mix(in oklch,var(--success) 30%,transparent)",borderRadius:6,color:"var(--success)",fontSize:11}}><Ic n="paperclip" s={12}/>comprobante</span>):(<label style={{display:"inline-flex",alignItems:"center",gap:5,padding:"4px 8px",background:"var(--bg2)",border:"1px dashed var(--border2)",borderRadius:6,color:"var(--tx3)",fontSize:11,cursor:"pointer"}}><Ic n="paperclip" s={12}/>Subir<input type="file" accept="image/*" onChange={e=>hUp(c.id,tp,e)} style={{display:"none"}}/></label>)}</div>
                <Bg color={paid?"var(--success)":"var(--gold)"} style={{fontSize:11}}>{paid?"pagado":"pendiente"}</Bg>
              </div>))}
            </div>
            {/* Invoice upload - only when fully paid */}
            {q.reqFactura&&(<div style={{padding:"10px 20px",background:"var(--bg3)",borderTop:"1px solid var(--border)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <Ic n="paperclip" s={14} c={q.hasInvoice?"var(--success)":q.fullyPaid?"var(--info)":"var(--tx3)"}/>
              {q.fullyPaid?(q.hasInvoice?(<div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
                <Bg color="var(--success)" style={{fontSize:11}}>📄 Factura subida</Bg>
                <span style={{fontSize:11,color:"var(--tx3)"}}>{invoiceFiles[q.invKey]?.name} · {invoiceFiles[q.invKey]?.date}</span>
              </div>):(<label style={{display:"inline-flex",alignItems:"center",gap:6,padding:"6px 12px",background:"var(--bg2)",border:"1px dashed var(--info)",borderRadius:8,color:"var(--info)",fontSize:12,cursor:"pointer",fontWeight:500}}>
                <Ic n="paperclip" s={14}/>Subir factura (PDF/imagen)
                <input type="file" accept="image/*,.pdf" onChange={e=>uploadFactura(c.id,e)} style={{display:"none"}}/>
              </label>)):(<span style={{fontSize:11,color:"var(--tx3)",fontStyle:"italic"}}>Factura disponible cuando se completen ambos pagos</span>)}
            </div>)}
          </div>);
        })}
      </div>

      {/* IVA Summary */}
      <div className="card" style={{padding:20,marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:14,fontWeight:600,marginBottom:2}}>Resumen IVA — {month} {year}</div>
            <div style={{fontSize:12,color:"var(--tx3)"}}>Total a declarar al SII</div>
          </div>
          <div style={{display:"flex",gap:20,alignItems:"center"}}>
            <div style={{textAlign:"center"}}><div style={{fontSize:11,color:"var(--tx3)"}}>Neto total</div><div className="num" style={{fontSize:20,fontWeight:600}}>{fP(ingresos)}</div></div>
            <div style={{fontSize:18,color:"var(--tx3)"}}>→</div>
            <div style={{textAlign:"center"}}><div style={{fontSize:11,color:"var(--gold)"}}>IVA acumulado</div><div className="num" style={{fontSize:24,fontWeight:600,color:"var(--gold)"}}>{fP(ivaMes)}</div></div>
            <div style={{fontSize:18,color:"var(--tx3)"}}>→</div>
            <div style={{textAlign:"center"}}><div style={{fontSize:11,color:"var(--success)"}}>Total c/IVA</div><div className="num" style={{fontSize:20,fontWeight:600,color:"var(--success)"}}>{fP(totalConIva)}</div></div>
          </div>
        </div>
      </div>

      {/* History */}
      {history.length>0&&(<div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border)",background:"var(--bg3)",display:"flex",alignItems:"center",gap:8}}>
          <Ic n="clock" s={16} c="var(--tx2)"/><div style={{fontSize:14,fontWeight:600}}>Historial de pagos recibidos</div>
        </div>
        <div style={{overflowX:"auto"}}><div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1fr 1fr 1fr 1.2fr",padding:"10px 20px",borderBottom:"1px solid var(--border)",background:"var(--bg3)",minWidth:650}}>
          {["EMPRESA","PERÍODO","CUOTA","PAGADO EL","MONTO","COMPROBANTE"].map(h=><div key={h} className="eyebrow" style={{fontSize:10}}>{h}</div>)}
        </div>
        {history.map(r=>{const qn=r.type==="50_1"?"Cuota 1":"Cuota 2";const mLabel=MO[r.month]+" "+r.year;
          return(<div key={r.id} style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1fr 1fr 1fr 1.2fr",padding:"12px 20px",borderBottom:"1px solid var(--border)",alignItems:"center",gap:10,minWidth:650}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:26,height:26,borderRadius:6,background:r.co?.color,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--bg)",fontWeight:700,fontSize:11}}>{r.co?.name?.[0]}</div>
              <div style={{fontSize:13,fontWeight:500}}>{r.co?.name}</div>
            </div>
            <div style={{fontSize:12,color:"var(--tx2)"}}>{mLabel}</div>
            <Bg color={r.type==="50_1"?"var(--info)":"var(--accent)"} style={{fontSize:11}}>{qn}</Bg>
